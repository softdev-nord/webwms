chapter:
  getting_started:
    title: Getting started and workspace
    summary: Login, tenant, site, language, dashboard and a secure start to daily work.
    sections:
      section_1:
        title: Sign in and verify context
        paragraphs:
          paragraph_1: Open the WebWMS login page and sign in with email and password or the configured OpenID Connect provider. After login, verify the active tenant
            and site. Data, roles and transactions are always processed in that context.
        steps:
          step_1: Sign in.
          step_2: Verify user, tenant and site in the header.
          step_3: Open the dashboard and review open tasks and warnings.
          step_4: Change language or appearance through the user interface.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: 'Placeholder: login and dashboard'
      section_2:
        title: Dashboard and metrics
        paragraphs:
          paragraph_1: The dashboard combines stock, receipts, issues, transport orders and utilisation. Cards link to the relevant overview. Metrics are tenant-scoped;
            a missing value can be caused by filters, permissions or the absence of movements rather than a technical error.
      section_3:
        title: Finish securely
        paragraphs:
          paragraph_1: Close sensitive dialogs, deliberately save or discard changes and sign out through the user menu. Do not store credentials permanently on shared
            devices.
  navigation_and_lists:
    title: Navigation, overviews, search and editing
    summary: Sidebar, tables, filters, pagination, detail pages and recurring interaction patterns.
    sections:
      section_1:
        title: Sidebar and submenus
        paragraphs:
          paragraph_1: The sidebar is grouped into platform, warehouse, inbound, outbound, integration and administration. Users only see areas for which they have
            at least read permission. The active area remains expanded and the current page is highlighted.
      section_2:
        title: Work with overview pages
        paragraphs:
          paragraph_1: Overviews separate reading from creation. Use global search for document numbers, products, partners or status. Domain filters reduce the result
            set and page size controls pagination. Reset filters before reporting a missing record.
        steps:
          step_1: Enter a search term.
          step_2: Select status or domain filters.
          step_3: Choose page size and navigate through results.
          step_4: Open details or editing from the table row action.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: 'Placeholder: table filters and row actions'
      section_3:
        title: Create, edit and delete
        paragraphs:
          paragraph_1: New records are created on a dedicated form page. Required fields are marked. Editing starts from the row action and only takes effect after
            saving. Business documents already in use are usually cancelled, deactivated or completed by a status transition rather than physically deleted.
      section_4:
        title: Messages and validation
        paragraphs:
          paragraph_1: Success and error messages appear above the content after an action. Correct highlighted fields. For concurrent-edit conflicts, reload the
            current state and review the change again.
  users_roles_and_security:
    title: Users, roles, permissions and single sign-on
    summary: Configure user accounts, permissions, API clients and OpenID Connect securely.
    sections:
      section_1:
        title: Manage users
        paragraphs:
          paragraph_1: Under Administration → Users, authorised administrators see all tenant accounts. Email address, display name, state and roles are assigned
            during creation. Deactivate users who have left; existing audit evidence remains available.
      section_2:
        title: Roles and permissions
        paragraphs:
          paragraph_1: Roles bundle granular permissions such as read, write, execute, approve and configure. Apply least privilege. Role changes are audited. The
            documentation.handbook.read permission controls access to this handbook.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: 'Placeholder: roles and permissions'
      section_3:
        title: API clients
        paragraphs:
          paragraph_1: API clients have a name, active state and explicit permissions. Transfer generated secrets securely and manage them as environment secrets.
            Rotate or deactivate compromised credentials and review last use.
      section_4:
        title: OpenID Connect
        paragraphs:
          paragraph_1: Configure provider code, display name, HTTPS issuer, client ID and client-secret reference per tenant. Login uses discovery, state, nonce and
            PKCE. The provider must verify the email. On first login the external identity is mapped to an active user in the same tenant.
      section_5:
        title: Verification
        paragraphs:
          paragraph_1: Test new roles with a separate user. Verify allowed and deliberately forbidden actions and record who owns the role.
  system_configuration:
    title: Tenant, site and system configuration
    summary: Core data, number ranges, strategies, printing, states and operational thresholds.
    sections:
      section_1:
        title: Tenants and sites
        paragraphs:
          paragraph_1: Tenants isolate data and permissions. Sites represent organisational warehouse locations. Maintain unique codes, clear names, timezone, address
            and active state. Only deactivate a site after all open processes referencing it have been closed.
      section_2:
        title: Number ranges and master data
        paragraphs:
          paragraph_1: Number ranges define prefix, next value and document format. Change productive ranges in a controlled manner. Products, business partners,
            load carriers and special-stock types must be unique and complete.
      section_3:
        title: Warehouse strategies
        paragraphs:
          paragraph_1: Putaway, stock selection, FEFO/FIFO/LIFO and replenishment rules define priorities, conditions, source and target areas and thresholds. Specific
            rules are evaluated before general rules. Review the match set before activation.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: 'Placeholder: configuration form'
      section_4:
        title: Printers, devices and states
        paragraphs:
          paragraph_1: Printers and capture devices require a unique code, connection, format or device type and active state. Connection secrets are stored as environment
            references, never in plain text. Test a configuration before operational release.
      section_5:
        title: Control changes
        paragraphs:
          paragraph_1: Record reason and time for significant changes. Afterwards review the audit log, affected processes and at least one positive and one negative
            use case.
  warehouse_and_stock:
    title: Warehouse topology, stock and traceability
    summary: Warehouse structure, occupancy, stock dimensions, movements, blocks and strategies.
    sections:
      section_1:
        title: Configure warehouse topology
        paragraphs:
          paragraph_1: The hierarchy consists of site, warehouse, area and storage bin. Create elements through the dedicated submenu and edit existing elements from
            their table row. Codes must be unique in context. Capacity, priority, area type and state affect putaway and route optimisation.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: 'Placeholder: warehouse topology'
      section_2:
        title: Read and move stock
        paragraphs:
          paragraph_1: Real-time stock shows product, bin, quantity, state, batch, serial number, expiry and special stock. Open movement history for the auditable
            origin of a quantity. Transfers validate source stock, target dimension and permission atomically.
      section_3:
        title: Batches, serial numbers and expiry
        paragraphs:
          paragraph_1: Batches group equal quantities. Serial numbers identify individual items and cannot be active twice. FEFO prioritises the earliest usable expiry;
            blocked or expired stock is not allocated normally.
      section_4:
        title: Blocks and special stock
        paragraphs:
          paragraph_1: Select block reason, quantity and stock dimension. Review and release are logged separately. Special-stock indicators document ownership or
            purpose and remain attached during movements.
      section_5:
        title: Occupancy and traceability
        paragraphs:
          paragraph_1: The occupancy view visualises free, occupied, blocked and overloaded bins. Traceability links receipt, movement, allocation, pick, package
            and shipment. Filter by product, batch, serial number or period.
  inventory_counting:
    title: Inventory counting and stock control
    summary: Snapshot, perpetual and zero-crossing counts, entry and discrepancy approval.
    sections:
      section_1:
        title: Prepare a count
        paragraphs:
          paragraph_1: Select count type, site, warehouse area and effective date. The system prevents parallel open counts for the same area. The expected stock
            is an immutable snapshot; later movements remain separately traceable.
      section_2:
        title: Count and submit
        paragraphs:
          paragraph_1: Enter counted quantity and, where required, batch, serial number or note. Blind count hides the expected value. Submit only after every line
            has been processed. Zero-crossing counts are event-driven and perpetual counts use due plans.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: 'Placeholder: count document and entry'
      section_3:
        title: Approve discrepancies
        paragraphs:
          paragraph_1: Differences require an authorised second person. Review expected, actual, movements and reason. Approval posts the adjustment to the ledger;
            rejection or recount changes workflow state without deleting the original count.
      section_4:
        title: Complete
        paragraphs:
          paragraph_1: Complete the count only after all discrepancies have been handled. Verify final state, adjustment entries and audit log.
  inbound:
    title: Inbound and putaway
    summary: Orders, notices, planned and unplanned receipts, quality, discrepancies and putaway.
    sections:
      section_1:
        title: Process planned receipts
        paragraphs:
          paragraph_1: Find the order or notice and verify supplier, products, expected quantities and date. Capture received quantity plus batch, serial number,
            expiry and load carrier. Partial quantities remain open where the document permits this.
      section_2:
        title: Capture an unplanned receipt
        paragraphs:
          paragraph_1: Select tenant, site, supplier or origin, product and quantity. Provide a reason. External references and idempotency keys prevent duplicates.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: 'Placeholder: inbound inspection'
      section_3:
        title: Quality and discrepancies
        paragraphs:
          paragraph_1: Complete the configured checklist. Quantity, identity or quality deviations create a controlled case. Blocked goods remain unavailable until
            an authorised user approves or rejects them. Decisions require a reason and are audited.
      section_4:
        title: Putaway
        paragraphs:
          paragraph_1: Request a target bin from the active strategy or select an allowed bin with appropriate permission. Check capacity, hazardous-goods rules,
            product compatibility and state. Confirm source and target scans; stock is then transferred atomically.
  fulfillment_and_outbound:
    title: Order, allocation, picking, packing and shipping
    summary: The complete outbound process from customer order through loading and returns.
    sections:
      section_1:
        title: Create and release orders
        paragraphs:
          paragraph_1: Capture or import recipient, delivery date, lines, quantities and shipping requirements. Release validates master data and available stock.
            Allocations reserve specific stock dimensions according to the active selection strategy.
      section_2:
        title: Pick
        paragraphs:
          paragraph_1: Create or bundle pick lists, assign a user and optionally optimise the route. Scan bin, product, batch or serial number and confirm quantity.
            Shortages are recorded as exceptions rather than silently skipped.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: 'Placeholder: mobile picking'
      section_3:
        title: Pack and ship
        paragraphs:
          paragraph_1: Open the packing order, select packaging and assign lines to a package. Weight and dimensions can be entered or captured by a device. Generate
            the shipping label after a successful carrier request. Failed requests remain traceable and retryable.
      section_4:
        title: Load and deliver
        paragraphs:
          paragraph_1: Group shipments into a manifest, confirm loading by scan and complete the manifest. Delivery status and ERP feedback are processed through
            integrations. Cancellation is only possible in eligible states.
      section_5:
        title: Returns
        paragraphs:
          paragraph_1: Identify the original shipment and product, capture reason and condition, then choose restock, block, rework or scrap. Each decision creates
            the appropriate stock movement and audit evidence.
  integrations_and_devices:
    title: ERP, carriers, printers, scanners, measuring devices and WCS
    summary: Configure, test, monitor and securely operate external connections.
    sections:
      section_1:
        title: Configure connections
        paragraphs:
          paragraph_1: Define connection type, HTTPS endpoint, authentication reference, timeouts, retries and active state per tenant. Secrets are resolved only
            through environment references. Use the connection test before productive messages are sent.
      section_2:
        title: ERP and data exchange
        paragraphs:
          paragraph_1: Mappings assign source and target fields plus transformations. Import jobs show format, resource type, row count, state and errors. Correct
            mapping or source data and restart failed jobs in a controlled manner.
      section_3:
        title: Carriers and printing
        paragraphs:
          paragraph_1: Carrier connections generate labels and status queries. Printers define queue, format and connection. Review preview, target device and retry
            state before resending a job.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: 'Placeholder: integration connection and test'
      section_4:
        title: Scanners, scales and dimensioning
        paragraphs:
          paragraph_1: Register devices with unique code and type. Scans and measurements use a message ID for idempotent processing. Assign the correct site and
            verify unit, measuring range and timestamp.
      section_5:
        title: WCS and automation
        paragraphs:
          paragraph_1: Automation commands contain target, command type, payload and state. Monitor acceptance, execution and technical errors. Only retry when the
            command is idempotent or otherwise uniquely protected.
  platform_and_extensions:
    title: Platform functions and extended modules
    summary: Shopfloor, KPI, partner portal, events, VAS and rule-based extensions.
    sections:
      section_1:
        title: Shopfloor and KPI
        paragraphs:
          paragraph_1: Shopfloor tasks group work by priority, area and state. KPI definitions set metric, aggregation, target and period. Verify filters and data
            period before evaluating deviations.
      section_2:
        title: Partner portal and event centre
        paragraphs:
          paragraph_1: Partner accounts receive explicit permissions for released data. The event centre shows business events and processing state. Acknowledge only
            events whose cause is understood or resolved.
      section_3:
        title: Storage billing and services
        paragraphs:
          paragraph_1: Storage billing rules use period, stock, tariff and billing basis. VAS orders describe service, quantity, state and evidence. Check tariff
            validity and reference data before billing.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: 'Placeholder: platform control centre'
      section_4:
        title: Extended configurations
        paragraphs:
          paragraph_1: Extension modules cover resources such as compliance, quality, production, dock and yard configuration. Create rules in configuration views
            and perform work in separate process views. State transitions, approvals and external evidence are audited.
  api_and_automation:
    title: API, outbox, transport adapters and automation
    summary: OpenAPI, API keys, reliable messaging, protocols and operational monitoring.
    sections:
      section_1:
        title: Use the API
        paragraphs:
          paragraph_1: Open API documentation from its separate sidebar link. Choose resource and operation and verify permission, headers and schema. API keys are
            sent in headers and never published in URLs, logs or screenshots.
      section_2:
        title: Monitor the outbox
        paragraphs:
          paragraph_1: The outbox separates business transactions from external delivery. Filter by state, target and period. Review payload and last error. Retry
            only after resolving the cause; manual acknowledgement requires a business reason.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: 'Placeholder: outbox and transport state'
      section_3:
        title: Transport adapters
        paragraphs:
          paragraph_1: HTTP, file, TCP and serial adapters require endpoint, timeout, encoding or framing and secret reference. Test reachability and response format.
            Do not log credentials or unnecessary personal payload data.
      section_4:
        title: Workers and schedules
        paragraphs:
          paragraph_1: Asynchronous messages require running Messenger workers. Scheduled tasks start due jobs such as counting, replenishment or status reconciliation.
            Monitor queue depth, failed queue, duration and last successful run.
  troubleshooting:
    title: Troubleshooting and support
    summary: Narrow down common operator errors, retry safely and provide useful support data.
    sections:
      section_1:
        title: A record or menu is missing
        paragraphs:
          paragraph_1: Verify tenant, site, role, active filters and state. Reset search and pagination. A missing menu item usually indicates a missing read permission.
      section_2:
        title: An action is unavailable
        paragraphs:
          paragraph_1: Read validation feedback and verify required fields, document state, predecessor actions, stock availability and concurrent editing. Do not
            repeatedly submit a write action without understanding its result.
      section_3:
        title: An integration reports an error
        paragraphs:
          paragraph_1: Review connection test, secret reference, target system, outbox state and error message. Determine whether the external order was already processed
            before retrying.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: 'Placeholder: error message and audit log'
      section_4:
        title: Prepare a support case
        paragraphs:
          paragraph_1: Provide time with timezone, tenant, site, route, document reference, expected and actual behaviour and correlation or message ID. Remove passwords,
            API keys and unnecessary personal data from screenshots and logs.
      section_5:
        title: Audit and recovery
        paragraphs:
          paragraph_1: Use movement history, audit events and outbox to reconstruct the flow. Correct business data through supported reversal, approval or cancellation
            processes instead of direct database changes.
