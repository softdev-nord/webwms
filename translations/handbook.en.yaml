chapter:
  getting_started:
    title: Getting started and workspace
    summary: Login, tenant, site, language, dashboard and a secure start to daily work.
    sections:
      section_1:
        title: Sign in and verify context
        paragraphs:
          paragraph_1: Open the WebWMS login page and sign in with email and password or the configured OpenID Connect provider. After login, verify the active tenant and site. Data,
            roles and transactions are always processed in that context.
        steps:
          step_1: Sign in.
          step_2: Verify user, tenant and site in the header.
          step_3: Open the dashboard and review open tasks and warnings.
          step_4: Change language or appearance through the user interface.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: 'Placeholder: login and dashboard'
      section_2:
        title: Dashboard and metrics
        paragraphs:
          paragraph_1: The dashboard combines stock, receipts, issues, transport orders and utilisation. Cards link to the relevant overview. Metrics are tenant-scoped; a missing value
            can be caused by filters, permissions or the absence of movements rather than a technical error.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Dashboard and metrics – screenshot placeholder
      section_3:
        title: Finish securely
        paragraphs:
          paragraph_1: Close sensitive dialogs, deliberately save or discard changes and sign out through the user menu. Do not store credentials permanently on shared devices.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Finish securely – screenshot placeholder
    views:
      workspace_login:
        template: security/workspace_login.html.twig
        title: Sign in to the WebWMS workspace
        purpose: This page opens a session with a password or through an OpenID Connect provider configured for the tenant.
        navigation: Public start page → Sign in
        permissions:
        - No prior permission; the user account and tenant must be active.
        overview:
        - The password area derives the tenant from the user account and validates email address and password.
        - The SSO area derives the tenant from the unique provider code and redirects to the identity provider.
        fields:
          email:
            label: Email address
            required: true
            format: Full email address of the active user account
            example: warehouse.manager@example.org
            help: The address must belong to exactly one active user account; its tenant is selected automatically.
            effect: Determines the user, roles and audited identity of the session.
            errors: Unknown, unconfirmed or inactive accounts are rejected.
          password:
            label: Password
            required: true
            format: Personal password; case-sensitive
            example: '************'
            help: Enter the password privately and never share it with another person.
            effect: A successful check creates the authenticated session.
            errors: A wrong value blocks sign-in without exposing account details.
          provider:
            label: Provider code
            required: true
            format: Exact code of the configured OIDC provider
            example: corporate_sso
            help: Required only for single sign-on; the code is supplied by the administrator.
            effect: Selects discovery endpoint, client and sign-in policy for the redirect.
            errors: Unknown or disabled providers and unsafe discovery data are rejected.
        actions:
          password_login:
            label: Sign in
            description: Derives the tenant from the user account and validates email address, password and account status.
            result: On success the workspace opens; on error all inputs except the password remain available.
          sso_login:
            label: Sign in with SSO
            description: Starts the OIDC flow with state, nonce and PKCE.
            result: Successful provider authentication redirects securely back into the tenant.
        image:
          src: /assets/images/handbook/security/workspace-login.svg
          alt: WebWMS workspace sign-in with password and SSO areas
      documentation_overview:
        template: documentation/index.html.twig
        title: Handbook overview and search
        purpose: The start page provides access to every chapter and searches instructions, fields, actions and error guidance.
        navigation: Sidebar → User handbook
        permissions: ["documentation.handbook.read"]
        overview: ["Search returns chapters with the matching location; without a query all chapters are grouped by business area.", "A result opens the matching section directly. No results change no data; reset the query and try synonyms."]
        actions:
          search: {label: "Search handbook", description: "Searches all structured handbook content in the selected language.", result: "Shows matching chapters and locations or an empty state."}
          open: {label: "Open chapter", description: "Opens the complete chapter view.", result: "The table of contents and direct anchors are displayed."}
        image: {src: "/assets/images/handbook/documentation/handbook-overview.svg", alt: "Handbook overview with search and chapters"}
      documentation_chapter:
        template: documentation/show.html.twig
        title: Read handbook chapter
        purpose: The chapter view explains one area with sections, documented views, fields, actions and error guidance.
        navigation: User handbook → Select chapter
        permissions: ["documentation.handbook.read"]
        overview: ["The local contents links to sections and views; previous/next navigation follows the business order.", "Direct links retain chapter and view anchors. An unknown chapter returns a not-found page."]
        actions:
          navigate: {label: "Open section", description: "Jumps within the chapter to the selected guidance.", result: "The target section is focused without changing data."}
        image: {src: "/assets/images/handbook/documentation/handbook-chapter.svg", alt: "Handbook chapter with contents and view guidance"}
    guidance:
      prerequisites:
      - Active user account and supported browser; SSO also requires a uniquely named active OIDC provider with HTTPS issuer, client ID and secret reference.
      permissions:
      - Login routes are public; after authentication only menus covered by the user permissions are visible.
      fields:
      - 'Password login: email and password. SSO: provider code. The tenant is derived automatically in both cases. Context: tenant, site, language and appearance.'
      statuses:
      - Only active users and providers can open a session. Logout ends it; invalid state, nonce or PKCE is rejected.
      errors:
      - Unknown or ambiguous email, inactive account, wrong password, unknown or ambiguous provider code, or invalid OIDC signature prevents login.
  navigation_and_lists:
    title: Navigation, overviews, search and editing
    summary: Sidebar, tables, filters, pagination, detail pages and recurring interaction patterns.
    sections:
      section_1:
        title: Sidebar and submenus
        paragraphs:
          paragraph_1: The sidebar is grouped into platform, warehouse, inbound, outbound, integration and administration. Users only see areas for which they have at least read permission.
            The active area remains expanded and the current page is highlighted.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Sidebar and submenus – screenshot placeholder
      section_2:
        title: Work with overview pages
        paragraphs:
          paragraph_1: Overviews separate reading from creation. Use global search for document numbers, products, partners or status. Domain filters reduce the result set and page size
            controls pagination. Reset filters before reporting a missing record.
        steps:
          step_1: Enter a search term.
          step_2: Select status or domain filters.
          step_3: Choose page size and navigate through results.
          step_4: Open details or editing from the table row action.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: 'Placeholder: table filters and row actions'
      section_3:
        title: Create, edit and delete
        paragraphs:
          paragraph_1: New records are created on a dedicated form page. Required fields are marked. Editing starts from the row action and only takes effect after saving. Business documents
            already in use are usually cancelled, deactivated or completed by a status transition rather than physically deleted.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Create, edit and delete – screenshot placeholder
      section_4:
        title: Messages and validation
        paragraphs:
          paragraph_1: Success and error messages appear above the content after an action. Correct highlighted fields. For concurrent-edit conflicts, reload the current state and review
            the change again.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Messages and validation – screenshot placeholder
    guidance:
      prerequisites:
      - Authenticated session and read permission for the domain.
      permissions:
      - Read permissions show lists/details; write shows create/edit; execute, review and approve control business actions.
      fields:
      - Lists use q, state, domain filters, page and limit. Forms mark required fields; row actions open detail, edit, cancellation or state pages.
      statuses:
      - Search, filters and pagination do not alter data; saves and transitions apply only after validation.
      errors:
      - For empty results reset filters, tenant, site and page; reload after concurrent modification.
  users_roles_and_security:
    title: Users, roles, permissions and single sign-on
    summary: Configure user accounts, permissions, API clients and OpenID Connect securely.
    sections:
      section_1:
        title: Manage users
        paragraphs:
          paragraph_1: Under Administration → Users, authorised administrators see all tenant accounts. Email address, display name, state and roles are assigned during creation. Deactivate
            users who have left; existing audit evidence remains available.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Manage users – screenshot placeholder
      section_2:
        title: Roles and permissions
        paragraphs:
          paragraph_1: Roles bundle granular permissions such as read, write, execute, approve and configure. Apply least privilege. Role changes are audited. The documentation.handbook.read
            permission controls access to this handbook.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: 'Placeholder: roles and permissions'
      section_3:
        title: API clients
        paragraphs:
          paragraph_1: API clients have a name, active state and explicit permissions. Transfer generated secrets securely and manage them as environment secrets. Rotate or deactivate
            compromised credentials and review last use.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: API clients – screenshot placeholder
      section_4:
        title: OpenID Connect
        paragraphs:
          paragraph_1: Configure provider code, display name, HTTPS issuer, client ID and client-secret reference per tenant. Login uses discovery, state, nonce and PKCE. The provider
            must verify the email. On first login the external identity is mapped to an active user in the same tenant.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: OpenID Connect – screenshot placeholder
      section_5:
        title: Verification
        paragraphs:
          paragraph_1: Test new roles with a separate user. Verify allowed and deliberately forbidden actions and record who owns the role.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Verification – screenshot placeholder
    views:
      administration_overview:
        template: administration/index.html.twig
        title: Administration overview
        purpose: The landing page combines users, roles and technical API access for the active tenant.
        navigation: Administration
        permissions: ["At least one of administration.user.read, administration.role.read or administration.api_client.read."]
        overview:
        - Each visible card shows the number of records and opens its overview. Cards without read permission are completely hidden.
        actions:
          open_area: {label: "\"\\\"Open area\\\"\"", description: "\"\\\"Opens users, roles or API clients depending on the selected card.\\\"\"", result: "\"\\\"The functional overview loads without changing data.\\\"\""}
        image: {src: "/assets/images/handbook/administration/overview.svg", alt: "Administration overview with cards for users, roles and API clients"}
      users_overview:
        template: administration/users.html.twig
        title: User overview
        purpose: The table shows all tenant accounts with roles and current active state.
        navigation: Administration → Users
        permissions: ["administration.user.read; write permission is required to create and edit."]
        overview:
        - Columns show display name, email address, roles and status. A dash means that no role is assigned.
        - An explanatory empty state appears if no account exists. The row action opens the separate edit page.
        actions:
          create: {label: "\"\\\"Add user\\\"\"", description: "\"\\\"Opens the form for a new user account.\\\"\"", result: "\"\\\"Data changes only after the form is saved.\\\"\""}
          edit: {label: "\"\\\"Edit\\\"\"", description: "\"\\\"Opens roles and active state for the selected account.\\\"\"", result: "\"\\\"The user ID and audit attribution are retained.\\\"\""}
        image: {src: "/assets/images/handbook/administration/users-overview.svg", alt: "User overview with roles, status and edit action"}
      user_create:
        template: administration/user_new.html.twig
        title: Create user
        purpose: The form creates an account in the active tenant and assigns its initial roles.
        navigation: Administration → Users → Add user
        permissions: ["administration.user.write; assignable roles must exist in the tenant."]
        overview: ["Select multiple roles with Ctrl or Cmd. Grant only the permissions needed for the task."]
        fields:
          display_name: {label: "\"\\\"Display name\\\"\"", required: true, format: "\"\\\"Clear name or unique operational name\\\"\"", example: "\"\\\"Erica Example\\\"\"", help: "\"\\\"Appears in lists and audit logs.\\\"\"", effect: "\"\\\"Stored as the visible identity.\\\"\"", errors: "\"\\\"Empty names are invalid.\\\"\""}
          email: {label: "\"\\\"Email address\\\"\"", required: true, format: "\"\\\"Valid email address unique in the tenant\\\"\"", example: "\"\\\"erica.example@example.org\\\"\"", help: "\"\\\"Used as sign-in identifier and SSO assignment.\\\"\"", effect: "\"\\\"Identifies the account permanently.\\\"\"", errors: "\"\\\"Invalid or previously used addresses are rejected.\\\"\""}
          password: {label: "\"\\\"Initial password\\\"\"", required: true, format: "\"\\\"At least 12 characters\\\"\"", example: "\"\\\"'************'\\\"\"", help: "\"\\\"Transmit securely and separately; never use a standard password.\\\"\"", effect: "\"\\\"Stored only as a hash and permits the first sign-in.\\\"\"", errors: "\"\\\"Passwords that are too short prevent creation.\\\"\""}
          role_ids: {label: "\"\\\"Roles\\\"\"", required: false, format: "\"\\\"Multiple selection from tenant roles\\\"\"", example: "\"\\\"ROLE_WAREHOUSE_OPERATOR\\\"\"", help: "\"\\\"Select roles according to least privilege.\\\"\"", effect: "\"\\\"Combined role permissions apply at the next authorization check.\\\"\"", errors: "\"\\\"Unknown or cross-tenant roles are rejected.\\\"\""}
        actions:
          save: {label: "\"\\\"Add user\\\"\"", description: "\"\\\"Validates identity, password and roles and creates the account.\\\"\"", result: "\"\\\"On success the user overview opens with confirmation.\\\"\""}
        image: {src: "/assets/images/handbook/administration/user-create.svg", alt: "Form for creating a user"}
      user_edit:
        template: administration/user_edit.html.twig
        title: Edit user
        purpose: The page changes role assignments and active state for an existing account.
        navigation: Administration → Users → Edit
        permissions: ["administration.user.write; the user must belong to the active tenant."]
        overview: ["Name and email identify the selected account and cannot be changed here. Deactivation blocks further use without deleting audit data."]
        fields:
          role_ids: {label: "\"\\\"Roles\\\"\"", required: false, format: "\"\\\"Multiple selection from tenant roles\\\"\"", example: "\"\\\"ROLE_WAREHOUSE_MANAGER\\\"\"", help: "\"\\\"Do not remove a role required for operations or the last administration access.\\\"\"", effect: "\"\\\"Completely replaces previous role assignments.\\\"\"", errors: "\"\\\"Unknown roles and removal of the last administrative access are rejected.\\\"\""}
          active: {label: "\"\\\"User active\\\"\"", required: false, format: "\"\\\"Checkbox; enabled or disabled\\\"\"", example: "\"\\\"enabled\\\"\"", help: "\"\\\"Only active users can open new sessions.\\\"\"", effect: "\"\\\"Disabling blocks future sign-ins; history and audit remain.\\\"\"", errors: "\"\\\"The final usable administration account must not be disabled.\\\"\""}
        actions:
          save: {label: "\"\\\"Save changes\\\"\"", description: "\"\\\"Validates roles and state and saves them atomically.\\\"\"", result: "\"\\\"On success the updated overview opens.\\\"\""}
        image: {src: "/assets/images/handbook/administration/user-edit.svg", alt: "Edit user with roles and active state"}
      roles_overview:
        template: administration/roles.html.twig
        title: Role overview
        purpose: The table shows roles, assigned user count and number of permissions.
        navigation: Administration → Roles
        permissions: ["administration.role.read; administration.role.write for creating and editing."]
        overview: ["Columns show stable code, name, user count and permission count. The code remains the technical reference., The edit action opens name and permissions; an empty state appears if no role exists."]
        actions:
          create: {label: "\"\\\"Create role\\\"\"", description: "\"\\\"Opens a separate role form.\\\"\"", result: "\"\\\"The role is available only after successful saving.\\\"\""}
          edit: {label: "\"\\\"Edit\\\"\"", description: "\"\\\"Opens the selected role and every offered permission.\\\"\"", result: "\"\\\"Assigned users receive changed rights at the next check.\\\"\""}
        image: {src: "/assets/images/handbook/administration/roles-overview.svg", alt: "Role overview with user and permission counts"}
      role_create:
        template: administration/role_new.html.twig
        title: Create role
        purpose: The form creates a reusable role with a stable identifier and selected permissions.
        navigation: Administration → Roles → Create role
        permissions: ["administration.role.write"]
        overview: ["Permissions are offered as a multiple selection. Combine only rights belonging to a clear task profile."]
        fields:
          code: {label: "\"\\\"Code\\\"\"", required: true, format: "\"\\\"Uppercase letters and underscores with ROLE_ prefix\\\"\"", example: "\"\\\"ROLE_INBOUND_OPERATOR\\\"\"", help: "\"\\\"Stable technical key; never reuse it for another purpose.\\\"\"", effect: "\"\\\"References the role in assignments and checks.\\\"\"", errors: "\"\\\"Invalid or duplicate codes are rejected.\\\"\""}
          name: {label: "\"\\\"Name\\\"\"", required: true, format: "\"\\\"Understandable task description\\\"\"", example: "\"\\\"Inbound operations\\\"\"", help: "\"\\\"Explains the functional purpose to administrators.\\\"\"", effect: "\"\\\"Displayed in selection lists.\\\"\"", errors: "\"\\\"An empty name is invalid.\\\"\""}
          permissions: {label: "\"\\\"Permissions\\\"\"", required: false, format: "\"\\\"Multiple selection of known permission codes\\\"\"", example: "\"\\\"inbound.receipt.read\\\"\"", help: "\"\\\"Grant read, write, execute and approve deliberately.\\\"\"", effect: "\"\\\"Determines permitted actions for every assigned user.\\\"\"", errors: "\"\\\"Unknown permission codes are not stored.\\\"\""}
        actions:
          save: {label: "\"\\\"Create role\\\"\"", description: "\"\\\"Validates code, name and rights and creates the role.\\\"\"", result: "\"\\\"On success the role can be assigned to users.\\\"\""}
        image: {src: "/assets/images/handbook/administration/role-create.svg", alt: "Form for creating a role"}
      role_edit:
        template: administration/role_edit.html.twig
        title: Edit role
        purpose: The page changes display name and rights of an existing role while its code remains stable.
        navigation: Administration → Roles → Edit
        permissions: ["administration.role.write"]
        overview: ["Before removing a right check the number of affected users and test critical roles with a separate account."]
        fields:
          name: {label: "\"\\\"Name\\\"\"", required: true, format: "\"\\\"Understandable task description\\\"\"", example: "\"\\\"Inbound management\\\"\"", help: "\"\\\"Describes the current task profile.\\\"\"", effect: "\"\\\"Changes display in user and role lists.\\\"\"", errors: "\"\\\"An empty name prevents saving.\\\"\""}
          permissions: {label: "\"\\\"Permissions\\\"\"", required: false, format: "\"\\\"Multiple selection of all known rights\\\"\"", example: "\"\\\"inbound.receipt.approve\\\"\"", help: "\"\\\"Unchecked rights are removed from the role when saving.\\\"\"", effect: "\"\\\"Applies to all assigned users at the next authorization check.\\\"\"", errors: "\"\\\"Protection against losing the final administration access can reject the change.\\\"\""}
        actions:
          save: {label: "\"\\\"Save changes\\\"\"", description: "\"\\\"Atomically replaces name and permission set.\\\"\"", result: "\"\\\"The change is audited and immediately used for new checks.\\\"\""}
        image: {src: "/assets/images/handbook/administration/role-edit.svg", alt: "Edit role with full permission selection"}
      api_clients_overview:
        template: administration/api_clients.html.twig
        title: API client overview
        purpose: The table monitors technical access, acting users, usage and active state.
        navigation: Administration → API clients
        permissions: ["administration.api_client.read; write permission for creating and editing."]
        overview: ["Columns show name, client ID, acting user, last usage and state. Never means that no successful call has been registered., Disabled clients remain visible for traceability but can no longer authenticate."]
        actions:
          create: {label: "\"\\\"Create API client\\\"\"", description: "\"\\\"Opens secure creation of technical access.\\\"\"", result: "\"\\\"Client ID and secret are created only after saving.\\\"\""}
          edit: {label: "\"\\\"Edit\\\"\"", description: "\"\\\"Opens the active state of the selected client.\\\"\"", result: "\"\\\"Existing access can be blocked or enabled again.\\\"\""}
        image: {src: "/assets/images/handbook/administration/api-clients-overview.svg", alt: "API client overview with last usage and state"}
      api_client_create:
        template: administration/api_client_new.html.twig
        title: Create API client
        purpose: The form creates technical access with an acting user and explicit rights.
        navigation: Administration → API clients → Create API client
        permissions: ["administration.api_client.write; the acting user must be active."]
        overview: ["Only the intersection of client rights and acting user rights is effective. Use a dedicated service account."]
        fields:
          name: {label: "\"\\\"Name\\\"\"", required: true, format: "\"\\\"Unique system and purpose name\\\"\"", example: "\"\\\"Production ERP\\\"\"", help: "\"\\\"Enables unambiguous audit and usage assignment.\\\"\"", effect: "\"\\\"Displayed in overview and logs.\\\"\"", errors: "\"\\\"Empty names are invalid.\\\"\""}
          acting_user_id: {label: "\"\\\"Acting user\\\"\"", required: true, format: "\"\\\"Single selection of an active tenant account\\\"\"", example: "\"\\\"svc.erp@example.org\\\"\"", help: "\"\\\"Do not use a personal administrator account.\\\"\"", effect: "\"\\\"Operations are authorized and audited under this identity.\\\"\"", errors: "\"\\\"Inactive or cross-tenant users are rejected.\\\"\""}
          permissions: {label: "\"\\\"Permissions\\\"\"", required: false, format: "\"\\\"Multiple selection of offered API rights\\\"\"", example: "\"\\\"inventory.stock.read\\\"\"", help: "\"\\\"Enable only endpoints that are actually required.\\\"\"", effect: "\"\\\"Restricts access in addition to user rights.\\\"\"", errors: "\"\\\"Unknown rights are not stored; missing rights cause access denied.\\\"\""}
        actions:
          generate: {label: "\"\\\"Generate access\\\"\"", description: "\"\\\"Creates client ID and secret once.\\\"\"", result: "\"\\\"The credential page displays the secret exactly once and it must be stored securely immediately.\\\"\""}
        image: {src: "/assets/images/handbook/administration/api-client-create.svg", alt: "Create API client with user and permissions"}
      api_client_edit:
        template: administration/api_client_edit.html.twig
        title: Edit API client
        purpose: The page shows the immutable acting user and controls the active state of access.
        navigation: Administration → API clients → Edit
        permissions: ["administration.api_client.write"]
        overview: ["The acting user is read-only. Create a new client with a new secret to change the identity."]
        fields:
          active: {label: "\"\\\"API client active\\\"\"", required: false, format: "\"\\\"Checkbox; enabled or disabled\\\"\"", example: "\"\\\"disabled\\\"\"", help: "\"\\\"Disable immediately if compromise is suspected.\\\"\"", effect: "\"\\\"Disabling blocks further authentication without deleting audit and usage data.\\\"\"", errors: "\"\\\"Requests already in progress may finish; future authentication is rejected.\\\"\""}
        actions:
          save: {label: "\"\\\"Save changes\\\"\"", description: "\"\\\"Saves active state after CSRF and permission checks.\\\"\"", result: "\"\\\"The overview shows the new state.\\\"\""}
        image: {src: "/assets/images/handbook/administration/api-client-edit.svg", alt: "Edit API client and change active state"}
      api_client_credential:
        template: administration/api_client_credential.html.twig
        title: Secure API credentials
        purpose: The security page displays the newly generated credential exactly once for secure transfer.
        navigation: Administration → API clients → Create API client → Generate access
        permissions: ["administration.api_client.write; available only immediately after successful creation."]
        overview: ["The read-only field contains the complete credential. Store it directly in a secret store and never in source code, a ticket or chat., The secret cannot be recovered after leaving the page; create new access if it is lost."]
        actions:
          copy: {label: "\"\\\"Copy\\\"\"", description: "\"\\\"Copies the credential using the browser clipboard.\\\"\"", result: "\"\\\"The value remains locally in the clipboard and must be pasted securely and then cleared.\\\"\""}
          back: {label: "\"\\\"Back to administration\\\"\"", description: "\"\\\"Permanently leaves the one-time display.\\\"\"", result: "\"\\\"The credential cannot be displayed again afterwards.\\\"\""}
        image: {src: "/assets/images/handbook/administration/api-client-credential.svg", alt: "One-time display of a newly generated API credential"}
    guidance:
      prerequisites:
      - Administration access and an agreed least-privilege task profile.
      permissions:
      - administration.user.read/write, administration.role.read/write, administration.api_client.read/write and documentation.handbook.read.
      fields:
      - 'User: email, display_name, active, role_ids. Role: ROLE_NAME code, name, permissions. API client: name, permissions, active. OIDC: code, issuer_url, client_id, client_secret_env.'
      statuses:
      - Users, API clients and providers are active/inactive. Role changes are audited; the final own administration right cannot be removed.
      errors:
      - Duplicate email, invalid role code, unknown permission, HTTP issuer or plain-text secret is rejected; generated API secrets are shown once.
  system_configuration:
    title: Tenant, site and system configuration
    summary: Core data, number ranges, strategies, printing, states and operational thresholds.
    sections:
      section_1:
        title: Tenants and sites
        paragraphs:
          paragraph_1: Tenants isolate data and permissions. Sites represent organisational warehouse locations. Maintain unique codes, clear names, timezone, address and active state.
            Only deactivate a site after all open processes referencing it have been closed.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Tenants and sites – screenshot placeholder
      section_2:
        title: Number ranges and master data
        paragraphs:
          paragraph_1: Number ranges define prefix, next value and document format. Change productive ranges in a controlled manner. Products, business partners, load carriers and special-stock
            types must be unique and complete.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Number ranges and master data – screenshot placeholder
      section_3:
        title: Warehouse strategies
        paragraphs:
          paragraph_1: Putaway, stock selection, FEFO/FIFO/LIFO and replenishment rules define priorities, conditions, source and target areas and thresholds. Specific rules are evaluated
            before general rules. Review the match set before activation.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: 'Placeholder: configuration form'
      section_4:
        title: Printers, devices and states
        paragraphs:
          paragraph_1: Printers and capture devices require a unique code, connection, format or device type and active state. Connection secrets are stored as environment references,
            never in plain text. Test a configuration before operational release.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Printers, devices and states – screenshot placeholder
      section_5:
        title: Control changes
        paragraphs:
          paragraph_1: Record reason and time for significant changes. Afterwards review the audit log, affected processes and at least one positive and one negative use case.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Control changes – screenshot placeholder
    views:
      administration_workspace:
        template: administration/workspace.html.twig
        title: Tenant and system configuration
        purpose: The page manages business partners, data rooms, OIDC, number ranges, process switches, device profiles and the active tenant's technical operating profile.
        navigation: Administration → Configuration
        permissions:
        - administration.configuration.read displays configuration and change log; administration.configuration.write permits changes; administration.number_range.use permits test numbers.
        overview:
        - Each card has its own form. Saving affects only that area; existing records are shown directly below it.
        - Warehouses and sites are read-only here and maintained through the linked warehouse topology. The change log names time, area, event and user.
        fields:
          code:
            label: Code
            required: true
            format: Unique technical key without whitespace
            example: CUSTOMER_DE
            help: Do not reuse it for another purpose after productive use.
            effect: Identifies the record in processes, integrations and audit data.
            errors: Empty, invalid or duplicate codes within the respective area are rejected.
            usages: [Business partner, data room, identity provider, number range and device profile]
          name: {label: "\"Name or description\"", required: true, format: "\"Understandable functional name\"", example: "\"Main customer Germany\"", help: "\"Describes the record for users and administrators.\"", effect: "\"Appears in lists and selections.\"", errors: "\"An empty name prevents saving.\"", usages: ["\"Business partner, data room, identity provider, number range, process and device profile\""]}
          partner_type: {label: "\"Business partner type\"", required: true, format: "\"customer; supplier; carrier or owner\"", example: "\"customer\"", help: "\"Customer is a recipient; supplier is procurement; carrier is shipping; owner is special stock.\"", effect: "\"Controls the partner's permitted functional use.\"", errors: "\"Values not offered by the form are rejected.\""}
          active: {label: "\"Business partner active\"", required: true, format: "\"Hidden default value 1 on creation\"", example: "\"'1'\"", help: "\"New partners are always created active on this page.\"", effect: "\"The partner can immediately be used in new processes.\"", errors: "\"Later deactivation must not violate open dependencies.\""}
          business_partner_id: {label: "\"Assigned business partner\"", required: false, format: "\"Selection of an existing partner or empty\"", example: "\"CUSTOMER_DE\"", help: "\"Optionally links the data room to a partner.\"", effect: "\"Restricts or identifies the organizational data context.\"", errors: "\"Unknown or cross-tenant IDs are rejected.\""}
          protocol: {label: "\"Identity protocol\"", required: true, format: "\"Selection; currently oidc\"", example: "\"oidc\"", help: "\"Determines the supported single sign-on method.\"", effect: "\"Enables discovery, state, nonce and PKCE for the provider.\"", errors: "\"Unsupported protocols are not stored.\""}
          issuer_url: {label: "\"Issuer URL\"", required: true, format: "\"Absolute HTTPS URL of the OIDC issuer\"", example: "\"'https://login.example.org/realms/webwms'\"", help: "\"Must exactly match the issuer in discovery and token.\"", effect: "\"Supplies authorization, token and key endpoints.\"", errors: "\"HTTP, invalid URLs or differing discovery issuers are rejected.\""}
          client_id: {label: "\"OIDC client ID\"", required: true, format: "\"Public identifier registered with the provider\"", example: "\"webwms-production\"", help: "\"Do not enter secret values in this field.\"", effect: "\"Identifies WebWMS to the identity provider.\"", errors: "\"A wrong client ID causes provider sign-in failure.\""}
          client_secret_env: {label: "\"Environment variable for client secret\"", required: true, format: "\"Name of a server environment variable\"", example: "\"WEBWMS_OIDC_CLIENT_SECRET\"", help: "\"Store only the reference; never enter the secret in the form.\"", effect: "\"WebWMS reads the secret from the runtime environment.\"", errors: "\"Missing or unset variables prevent the SSO callback.\""}
          scopes: {label: "\"OIDC scopes\"", required: true, format: "\"Space-separated scope names\"", example: "\"openid profile email\"", help: "\"openid is mandatory; email is required for user assignment.\"", effect: "\"Determines claims requested from the provider.\"", errors: "\"Missing openid or email claims prevent secure assignment.\""}
          enabled: {label: "\"Enabled\"", required: true, format: "\"Checkbox or hidden default value 1\"", example: "\"'1'\"", help: "\"Enables the newly created provider, number range, process or device profile.\"", effect: "\"Only enabled configurations are evaluated operationally.\"", errors: "\"Disabled configurations are unavailable to new processes.\"", usages: ["\"Identity provider, number range, process switch and device profile\""]}
          object_type: {label: "\"Object type\"", required: true, format: "\"Stable functional document type\"", example: "\"outbound_order\"", help: "\"Defines which entity uses the number range.\"", effect: "\"Unambiguously links the next number to a document type.\"", errors: "\"Duplicate active assignments can cause ambiguity and are rejected.\""}
          prefix: {label: "\"Prefix\"", required: false, format: "\"Short static text before the running number\"", example: "\"OUT-\"", help: "\"Use only characters supported by target systems and labels.\"", effect: "\"Prepended to every generated number.\"", errors: "\"Excessive length or prohibited characters are rejected.\""}
          padding: {label: "\"Number of digits\"", required: true, format: "\"Integer from 1 to 18\"", example: "\"'8'\"", help: "\"Pads the running value with leading zeroes.\"", effect: "\"Value 42 with eight digits becomes 00000042.\"", errors: "\"Values outside 1 to 18 prevent saving.\""}
          next_value: {label: "\"Next value\"", required: true, format: "\"Positive integer\"", example: "\"'10001'\"", help: "\"Increase productive ranges only after agreement; never reset them.\"", effect: "\"The next allocation uses this value and increments it atomically.\"", errors: "\"Zero, negative values or backward changes with collision risk are rejected.\""}
          gs1_company_prefix: {label: GS1 company prefix, required: false, format: Digit sequence assigned by GS1, example: '426012345', help: Maintain only for GS1-compliant identifiers., effect: Used for supported SSCC or GS1 numbers., errors: Non-numeric or unsuitable values produce invalid identifiers.}
          suffix: {label: "\"Suffix\"", required: false, format: "\"Empty hidden value on this page\"", example: "\"''\"", help: "\"New ranges use no suffix.\"", effect: "\"No text is appended after the running number.\"", errors: "\"Suffixes cannot be configured through this simplified form.\""}
          maximum_value: {label: "\"Maximum value\"", required: false, format: "\"Empty hidden value on this page\"", example: "\"''\"", help: "\"Creation sets no additional upper limit.\"", effect: "\"Technical numeric capacity remains the limit.\"", errors: "\"Overflow or an exhausted range prevents further allocations.\""}
          process_key: {label: "\"Process key\"", required: true, format: "\"Stable key using lowercase letters and underscores\"", example: "\"inbound_quality\"", help: "\"Must match the process evaluated by the application.\"", effect: "\"Selects the configurable process and its configuration.\"", errors: "\"Unknown or duplicate keys are rejected.\""}
          configuration: {label: "\"Process configuration\"", required: false, format: "\"Valid JSON object\"", example: "\"'{\\\"require_photo\\\":true,\\\"max_deviation_percent\\\":5}'\"", help: "\"Supplies process-specific parameters; avoid unknown properties and never enter secrets.\"", effect: "\"Evaluated with versioning during process execution.\"", errors: "\"Invalid JSON, wrong data types or unsupported properties prevent saving.\""}
          device_type: {label: "\"Device type\"", required: true, format: "\"desktop; tablet or scanner\"", example: "\"scanner\"", help: "\"Select scanner for mobile devices producing hardware scan events.\"", effect: "\"Controls layout and device-specific input behavior.\"", errors: "\"Types not offered by the form are rejected.\""}
          start_route: {label: "\"Start route\"", required: true, format: "\"Internal absolute path starting with /\"", example: "\"/v3/inbound/receipts\"", help: "\"Must point to a WebWMS page permitted for the device profile.\"", effect: "\"Opens this view after sign-in or profile start.\"", errors: "\"External, unknown or unauthorized routes are rejected or lead to access denied.\""}
          scan_suffix: {label: "\"Scan terminator\"", required: false, format: "\"Key name used as scanner suffix\"", example: "\"Enter\"", help: "\"Must match device configuration; commonly Enter or Tab.\"", effect: "\"Triggers input processing after a hardware scan.\"", errors: "\"A mismatched suffix makes scans appear as incomplete keyboard input.\""}
          fullscreen: {label: "\"Full-screen mode\"", required: true, format: "\"Hidden default value 1\"", example: "\"'1'\"", help: "\"New device profiles start with the reduced full-screen layout.\"", effect: "\"Hides navigation elements not needed on operational devices.\"", errors: "\"The value cannot be changed on this page.\""}
          deployment_mode: {label: "\"Deployment mode\"", required: true, format: "\"saas; on_premises or hybrid\"", example: "\"on_premises\"", help: "\"Describes technical deployment rather than the functional tenant.\"", effect: "\"Controls operating guidance and available integration paths.\"", errors: "\"A wrong mode can cause unsuitable operating assumptions.\""}
          public_url: {label: "\"Public URL\"", required: true, format: "\"Absolute HTTPS base URL without an internal host name\"", example: "\"'https://wms.example.org'\"", help: "\"Must be reachable by browsers and connected systems.\"", effect: "\"Base for redirects, links and external callbacks.\"", errors: "\"Invalid or unreachable URLs break SSO and integration callbacks.\""}
          storage_driver: {label: "\"Storage driver\"", required: true, format: "\"local; s3 or azure\"", example: "\"s3\"", help: "\"Must match server configuration and available credentials.\"", effect: "\"Determines storage for documents and media.\"", errors: "\"Missing bucket, container or filesystem permissions cause storage failures.\""}
          queue_transport: {label: "\"Queue transport\"", required: true, format: "\"sync; doctrine or rabbitmq\"", example: "\"rabbitmq\"", help: "\"Use sync only for simple development; use a monitored asynchronous transport in production.\"", effect: "\"Determines whether background tasks run directly or through a queue.\"", errors: "\"Missing workers or connection settings leave messages unprocessed.\""}
          release_channel: {label: "\"Release channel\"", required: true, format: "\"stable or preview\"", example: "\"stable\"", help: "\"Use Stable for production and Preview only for controlled advance testing.\"", effect: "\"Defines the intended update channel.\"", errors: "\"Preview can contain changes that are not yet generally released.\""}
        actions:
          create_resource: {label: "\"Create configuration\"", description: "\"Validates and stores only the respective card area.\"", result: "\"The new entry appears in its list and is audited.\""}
          next_number: {label: "\"Test number\"", description: "\"Actually allocates the next number from the selected range.\"", result: "\"next_value is permanently and atomically incremented; the action is not merely a preview.\""}
          save_deployment: {label: "\"Save operating profile\"", description: "\"Stores mode, URL, storage, queue and release channel together.\"", result: "\"New background and integration processes use the updated configuration.\""}
          open_topology: {label: "\"Open warehouse topology\"", description: "\"Opens separate maintenance of site, warehouse, areas and bins.\"", result: "\"No topology data is changed on the workspace page.\""}
        image:
          src: /assets/images/handbook/administration/system-configuration.svg
          alt: System configuration with partners, OIDC, number ranges, processes, devices and operating profile
    guidance:
      prerequisites:
      - administration.configuration access and agreed tenant, site and operating requirements.
      permissions:
      - administration.configuration.read/write and administration.number_range.use.
      fields:
      - 'Workspace: code, name, address, timezone, active. Number range: prefix, suffix, next_value, padding, gs1_company_prefix. Process: process_key, configuration_json, version, enabled.
        Deployment: deployment_mode, release_channel, public_url, storage_driver, queue_transport.'
      statuses:
      - Disabled sites/processes receive no new work. Test numbers atomically and permanently advance next_value.
      errors:
      - Duplicate codes, invalid timezone/URL, malformed JSON or deactivation with open dependencies is rejected.
  warehouse_and_stock:
    title: Warehouse topology, stock and traceability
    summary: Warehouse structure, occupancy, stock dimensions, movements, blocks and strategies.
    sections:
      section_1:
        title: Configure warehouse topology
        paragraphs:
          paragraph_1: The hierarchy consists of site, warehouse, area and storage bin. Create elements through the dedicated submenu and edit existing elements from their table row.
            Codes must be unique in context. Capacity, priority, area type and state affect putaway and route optimisation.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: 'Placeholder: warehouse topology'
      section_2:
        title: Read and move stock
        paragraphs:
          paragraph_1: Real-time stock shows product, bin, quantity, state, batch, serial number, expiry and special stock. Open movement history for the auditable origin of a quantity.
            Transfers validate source stock, target dimension and permission atomically.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Read and move stock – screenshot placeholder
      section_3:
        title: Batches, serial numbers and expiry
        paragraphs:
          paragraph_1: Batches group equal quantities. Serial numbers identify individual items and cannot be active twice. FEFO prioritises the earliest usable expiry; blocked or expired
            stock is not allocated normally.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Batches, serial numbers and expiry – screenshot placeholder
      section_4:
        title: Blocks and special stock
        paragraphs:
          paragraph_1: Select block reason, quantity and stock dimension. Review and release are logged separately. Special-stock indicators document ownership or purpose and remain
            attached during movements.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Blocks and special stock – screenshot placeholder
      section_5:
        title: Occupancy and traceability
        paragraphs:
          paragraph_1: The occupancy view visualises free, occupied, blocked and overloaded bins. Traceability links receipt, movement, allocation, pick, package and shipment. Filter
            by product, batch, serial number or period.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Occupancy and traceability – screenshot placeholder
    views:
      warehouse_overview:
        template: warehouse/overview.html.twig
        title: Warehouse overview and capacity
        purpose: The warehouse dashboard aggregates stock, bins and capacity utilisation by warehouse and area.
        navigation: Warehouse & stock → Warehouse overview
        permissions: ["inventory.overview.read"]
        overview:
        - Warehouse cards show type, occupied and total bins, stock quantity, free capacity and percentage utilisation. Zero capacity is displayed as unlimited.
        - The area table breaks the same metrics down by warehouse area and reveals bottlenecks or structures not yet configured.
        actions: {}
        image: {src: "/assets/images/handbook/warehouse/overview.svg", alt: "Warehouse overview with capacity, stock and area utilisation"}
      stock_overview:
        template: warehouse/stock.html.twig
        title: Real-time stock
        purpose: The stock view shows the current tenant-safe projection of every stock dimension and available quantity.
        navigation: Warehouse & stock → Stock
        permissions: ["inventory.stock.read"]
        overview:
        - Each row contains SKU, bin and topology, stock state, special stock and owner, batch, serial number, expiry date, total and available quantity and last update.
        - Available quantity may be below physical total due to reservations, blocks or quality state. A maximum of 200 rows is loaded.
        fields:
          warehouse: {label: "Warehouse filter", required: false, format: "Selection of an active warehouse or all warehouses", example: "WH-HAMBURG", help: "Choose a warehouse to limit the stock projection spatially.", effect: "Loads only stock from the selected warehouse; empty shows all tenant warehouses.", errors: "An unknown or cross-tenant ID produces no useful selection."}
        actions:
          filter: {label: "Filter", description: "Reloads the stock projection for the selected warehouse.", result: "The selection remains in the filter; no stock is changed."}
        image: {src: "/assets/images/handbook/warehouse/stock.svg", alt: "Real-time stock with topology, state, stock dimensions and availability"}
      warehouse_occupancy:
        template: warehouse/occupancy.html.twig
        title: Graphical bin occupancy
        purpose: Graphical occupancy visualises bins by area, utilisation and critical stock state.
        navigation: Warehouse & stock → Occupancy
        permissions: ["inventory.overview.read"]
        overview:
        - Colours distinguish empty, occupied, quality stock and blocked or full. Every card shows bin type, aisle, level, bin, quantity, capacity and product count.
        - The progress bar calculates quantity utilisation. Clicking opens real-time stock for the associated warehouse.
        fields:
          warehouse: {label: "Warehouse", required: true, format: "Selection of an existing warehouse", example: "WH-HAMBURG", help: "Choose the warehouse whose complete bin structure is to be visualised.", effect: "Groups all warehouse bins by area and calculates state and utilisation.", errors: "Without an existing warehouse or bins, the view remains empty."}
        actions:
          display: {label: "Display", description: "Loads all bins and stock metrics for the selected warehouse.", result: "Colour-coded occupancy is rebuilt without changing stock."}
          open_stock: {label: "Open bin", description: "Moves from a bin card to real-time stock for the warehouse.", result: "Stock is read only."}
        image: {src: "/assets/images/handbook/warehouse/occupancy.svg", alt: "Graphical bin occupancy with state colours and capacity bars"}
      stock_movements:
        template: warehouse/movements.html.twig
        title: Movement history
        purpose: The immutable stock ledger shows every quantity change with product, bin, dimension, reason, user and resulting stock.
        navigation: Warehouse & stock → Movements
        permissions: ["inventory.stock.movement.read"]
        overview:
        - Positive and negative deltas are shown with the resulting stock. Batch, serial number and state remain part of the posted dimension.
        - The view returns at most 500 hits; combine product, bin and movement type for a focused audit review.
        fields:
          product: {label: "Product", required: false, format: "Selection of an SKU or all products", example: "SKU-4711", help: "Select for the complete history of a product regardless of bin.", effect: "Limits the ledger to the selected product.", errors: "Unknown IDs return no hits."}
          location: {label: "Bin", required: false, format: "Selection of an existing bin", example: "WH1-PICK-01", help: "Use the filter to inspect all receipts and issues of a bin.", effect: "Limits movements to the selected bin.", errors: "A cross-tenant bin returns no data."}
          movement_type: {label: "Movement type", required: false, format: "Exact technical movement code", example: "inbound_receipt", help: "Enter the code used in the ledger, such as inbound_receipt, transfer_out or pick.", effect: "Shows only postings of this movement type.", errors: "Free text without an exact match produces an empty result."}
        actions:
          filter: {label: "Filter", description: "Applies the combined criteria to the immutable ledger.", result: "Only matching movements are read; no posting is changed."}
        image: {src: "/assets/images/handbook/warehouse/movements.svg", alt: "Movement history with stock delta, reason, user and resulting quantity"}
      stock_traceability:
        template: warehouse/traceability.html.twig
        title: Batch, serial-number and expiry traceability
        purpose: Traceability identifies critical expiry stock and follows batches or serial numbers through all ledger movements.
        navigation: Warehouse & stock → Traceability
        permissions: ["inventory.traceability.read"]
        overview:
        - The expiry table marks expired and time-critical batches by remaining days; serial numbers show current bin, state and update.
        - Clicking a batch or serial number sets dimension and value in the URL and opens the chronological history with quantity change and resulting stock.
        actions:
          trace_batch: {label: "Trace batch", description: "Opens every ledger event for the selected batch number.", result: "Receipts, movements and issues are shown chronologically."}
          trace_serial: {label: "Trace serial number", description: "Opens the unit-specific history of the selected serial number.", result: "Current and historical location, state and posting reason become visible."}
        image: {src: "/assets/images/handbook/warehouse/traceability.svg", alt: "Traceability with expiry risks, batches, serial numbers and movement history"}
      special_stock_overview:
        template: warehouse/special_stock.html.twig
        title: Special stock and classifications
        purpose: The overview manages special-stock classifications and shows their assignment to concrete stock dimensions and owners.
        navigation: Warehouse & stock → Special stock
        permissions: ["inventory.special_stock.read; inventory.special_stock.write for classifications and assignment."]
        overview:
        - Classifications have code, name, classification kind, allocatability and active state. Only active types should be used for new assignments.
        - The stock table shows dimension, quantity, classification and owner. Classify opens a separate form for exactly the selected stock key.
        actions:
          create_type: {label: "Create classification", description: "Opens the shared configuration form for a new special-stock type.", result: "Creation occurs only after saving."}
          edit_type: {label: "Edit classification", description: "Opens code, name, kind, allocatability and active state.", result: "Existing classifications remain referenced."}
          classify: {label: "Classify stock", description: "Opens the selected product, bin and stock key for assignment.", result: "The concrete dimension can be reclassified."}
        image: {src: "/assets/images/handbook/warehouse/special-stock.svg", alt: "Special-stock classifications and classified stock dimensions"}
      special_stock_classify:
        template: warehouse/special_stock_classify.html.twig
        title: Classify stock
        purpose: The form assigns a special-stock classification, optional owner and audit reason to a uniquely identified stock dimension.
        navigation: Warehouse & stock → Special stock → Classify
        permissions: ["inventory.special_stock.write"]
        overview:
        - Product, bin and stock key are taken from the selected table row and cannot be freely changed.
        fields:
          product_id: {label: "Product ID", required: true, format: "Hidden UUID of the selected product", example: "018f2f5a-73ad-7c42-9d84-2dcb65bcb410", help: "Automatically taken from the stock row.", effect: "Binds classification to the product.", errors: "Manipulated or unknown IDs are rejected."}
          location_id: {label: "Bin ID", required: true, format: "Hidden UUID of the selected bin", example: "018f2f5a-73ad-7c42-9d84-2dcb65bcb411", help: "Automatically taken from the stock row.", effect: "Binds classification to the bin.", errors: "An unknown or cross-tenant bin is rejected."}
          stock_key: {label: "Stock key", required: true, format: "Hidden key of the complete stock dimension", example: "available|LOT-42||2027-12-31", help: "Do not change manually; it contains state and optional batch, serial number and expiry.", effect: "Ensures exactly the displayed dimension is classified.", errors: "A key no longer present causes a conflict."}
          special_stock_type_id: {label: "Special-stock classification", required: true, format: "Selection of a configured type", example: "CUSTOMER_OWNED", help: "Verify classification kind and allocatability before selection.", effect: "Determines classification and availability for downstream processes.", errors: "Unknown or inactive types must not be newly assigned."}
          owner_reference: {label: "Owner", required: false, format: "Customer, supplier or partner reference", example: "CUSTOMER-DE-1000", help: "For ownership classifications, identify the actual third-party owner unambiguously.", effect: "Is retained on the stock dimension and downstream movements.", errors: "A missing owner makes ownership stock functionally incomplete."}
          reason: {label: "Reason", required: true, format: "Traceable audit text", example: "Customer-supplied stock for order SO-0815", help: "Record trigger and document reference concretely.", effect: "Is logged auditably with reclassification.", errors: "An empty reason prevents saving."}
        actions:
          save: {label: "Save classification", description: "Validates dimension, classification, owner and reason and classifies atomically.", result: "The special-stock overview shows the new assignment."}
          cancel: {label: "Cancel", description: "Discards the unsaved change.", result: "Stock classification remains unchanged."}
        image: {src: "/assets/images/handbook/warehouse/special-stock-classify.svg", alt: "Special-stock classification form with type, owner and reason"}
      selection_rules:
        template: warehouse/selection_rules.html.twig
        title: Stock-selection rules and execution log
        purpose: The overview prioritises FIFO, LIFO and FEFO rules and records every automatic stock selection.
        navigation: Warehouse & stock → Selection rules
        permissions: ["inventory.selection_rule.read; inventory.selection_rule.write for creation and editing."]
        overview:
        - Rules show priority, strategy, optional warehouse and product and active state. Specific rules can override global rules through priority.
        - The execution log shows rule, strategy, product, reservation, requested and allocated quantity, candidate count and executing user.
        actions:
          create: {label: "Create rule", description: "Opens the configuration form for strategy, priority and scope.", result: "The rule becomes active only after successful saving."}
          edit: {label: "Edit", description: "Opens the selected rule with its current scope.", result: "Changes apply to subsequent automatic selections."}
        image: {src: "/assets/images/handbook/warehouse/selection-rules.svg", alt: "Selection rules with priority, strategy, scope and execution log"}
      inventory_configuration:
        template: warehouse/configuration_form.html.twig
        title: Configure warehouse rules and classifications
        purpose: The shared form creates and edits selection rules, special-stock classifications and block reasons depending on the calling area.
        navigation: Warehouse & stock → Selection rules, special stock or stock blocks → Create/Edit
        permissions: ["inventory.selection_rule.write, inventory.special_stock.write or inventory.stock_block.write depending on configuration type."]
        overview:
        - Only fields belonging to the selected type are displayed. Code and name are shared by all three configurations.
        fields:
          code: {label: "Code", required: true, format: "Code unique within its configuration area", example: "FEFO-WH1", help: "Use stable, descriptive codes and avoid changing their business meaning after creation.", effect: "Identifies rule, special-stock type or block reason.", errors: "Empty or duplicate codes are rejected.", usages: ["Selection rule, special-stock classification and block reason"]}
          name: {label: "Name", required: true, format: "Understandable name", example: "FEFO central warehouse", help: "Name purpose and scope clearly for operators.", effect: "Appears in overviews and selection lists.", errors: "An empty name prevents saving.", usages: ["Selection rule, special-stock classification and block reason"]}
          strategy: {label: "Strategy", required: true, format: "fifo, lifo or fefo", example: "fefo", help: "FIFO takes oldest receipt, LIFO newest and FEFO earliest usable expiry.", effect: "Determines ordering of suitable stock candidates.", errors: "FEFO requires maintained expiry data for relevant products."}
          priority: {label: "Priority", required: true, format: "Positive integer", example: "100", help: "Use an agreed scheme to order specific before general rules.", effect: "Determines the order of matching active selection rules.", errors: "Zero, negative or contradictory priorities are rejected or cause unexpected selection."}
          warehouse_id: {label: "Warehouse", required: false, format: "Selection of a warehouse or all warehouses", example: "WH1", help: "Leave empty when the rule should apply tenant-wide.", effect: "Limits the selection rule spatially.", errors: "Unknown or cross-tenant warehouses are rejected."}
          product_id: {label: "Product", required: false, format: "Selection of a product or all products", example: "SKU-4711", help: "Set only when strategy differs for this product.", effect: "Limits the selection rule to this product.", errors: "Unknown or cross-tenant products are rejected."}
          enabled: {label: "Rule active", required: false, format: "Checkbox", example: "enabled", help: "Disable when the rule should temporarily not be evaluated.", effect: "Only active rules participate in automatic selection.", errors: "Without a matching active rule, rule-based allocation is unavailable."}
          classification_kind: {label: "Classification kind", required: true, format: "owner, status or special", example: "owner", help: "Choose owner for third-party stock, status for business quality and special for other purposes.", effect: "Describes the meaning of the special-stock classification.", errors: "Unsupported values are rejected."}
          allocatable: {label: "Allocatable", required: false, format: "Checkbox", example: "disabled", help: "Enable only when this special stock may be regularly assigned to customer orders.", effect: "Controls inclusion in reservation and allocation.", errors: "Incorrect enabling can release third-party or inspection stock for picking."}
          active: {label: "Active", required: false, format: "Checkbox", example: "enabled", help: "When editing, disable if the classification or block reason must no longer be used for new operations.", effect: "Disabled entries remain historical but are unavailable for new operations.", errors: "Existing references are not deleted.", usages: ["Special-stock classification while editing and block reason"]}
          description: {label: "Description", required: false, format: "Multiline free text", example: "Damage pending quality decision", help: "Explain use case and required follow-up action for the block reason.", effect: "Helps users select the correct reason.", errors: "An unclear description can lead to incorrect block reasons."}
        actions:
          save: {label: "Save", description: "Validates only fields of the current configuration type and creates or updates the entry.", result: "The associated overview opens with the saved entry."}
          cancel: {label: "Cancel", description: "Returns to the functional overview without saving.", result: "Previous values remain unchanged."}
        image: {src: "/assets/images/handbook/warehouse/configuration-form.svg", alt: "Shared configuration form for selection rule, special stock and block reason"}
      topology_overview:
        template: warehouse/topology.html.twig
        title: Warehouse topology
        purpose: This overview presents sites, warehouses, areas, aisles and bins as separate, hierarchically linked tables.
        navigation: Warehouse & stock → Warehouse topology
        permissions: ["inventory.topology.read; inventory.topology.write for creation and editing."]
        overview:
        - The five tabs show the count and core data of each hierarchy level. Bins resolve their parents as site, warehouse, area and aisle.
        - A capacity of zero is displayed as unlimited. With write permission, every row links to a separate edit page and new elements are created by resource type.
        actions:
          create: {label: "Create topology element", description: "Opens the type-specific form for a site, warehouse, area, aisle or bin.", result: "The overview remains unchanged until the form is saved."}
          edit: {label: "Edit", description: "Opens the selected element with its type-specific fields.", result: "Identity and hierarchy assignment remain controlled."}
        image: {src: "/assets/images/handbook/warehouse/topology-overview.svg", alt: "Warehouse topology with sites, warehouses, areas, aisles and bins"}
      topology_form:
        template: warehouse/topology_form.html.twig
        title: Create or edit a topology element
        purpose: The shared form maintains every warehouse hierarchy level with the required parents, types and capacity properties.
        navigation: Warehouse & stock → Warehouse topology → Create/Edit
        permissions: ["inventory.topology.write"]
        overview:
        - Only fields for the selected resource type are displayed. Editing also permits changing a site's state and a bin's putaway priority and eligibility.
        fields:
          site_id: {label: "Site", required: true, format: "Selection of an existing site", example: "SITE-HH", help: "Assign every warehouse to its physical site.", effect: "Anchors the warehouse as the second hierarchy level.", errors: "Unknown or cross-tenant sites are rejected."}
          warehouse_id: {label: "Warehouse", required: true, format: "Selection of an existing warehouse", example: "WH-HH-01", help: "Select the responsible warehouse for an area or bin.", effect: "Limits the area or bin to this warehouse.", errors: "Inconsistent parent assignments prevent saving.", usages: ["Warehouse area and bin"]}
          area_id: {label: "Warehouse area", required: true, format: "Selection of an existing area", example: "PICK-A", help: "Select the correct functional area for an aisle or bin.", effect: "Assigns the aisle or bin to the area.", errors: "An area outside the selected warehouse is invalid.", usages: ["Warehouse aisle and bin"]}
          aisle_id: {label: "Warehouse aisle", required: true, format: "Selection of an existing aisle", example: "A-01", help: "The aisle must belong to the selected area and warehouse.", effect: "Completes the bin's parent chain.", errors: "An inconsistent aisle is rejected."}
          code: {label: "Code", required: true, format: "Code unique within its parent context", example: "BIN-A-01-02-03", help: "Use short, scannable and permanently stable codes.", effect: "Identifies the element in selection, scanning and process control.", errors: "Empty or duplicate contextual codes are rejected.", usages: ["Site, warehouse, area, aisle and bin"]}
          name: {label: "Name", required: true, format: "Understandable name", example: "Northern picking area", help: "Describe the operational purpose for planners and operators.", effect: "Appears in overviews and selections.", errors: "An empty name prevents creation.", usages: ["Site, warehouse, area and aisle"]}
          timezone: {label: "Time zone", required: true, format: "Valid IANA time zone", example: "Europe/Berlin", help: "Enter the physical site's local time zone.", effect: "Controls local times and time-dependent processes.", errors: "Invalid time zones are rejected."}
          status: {label: "Site state", required: false, format: "active or inactive", example: "active", help: "Disable while editing only when the site must accept no new operations.", effect: "Controls whether the site is operationally usable.", errors: "Open dependencies can prevent deactivation."}
          warehouse_type: {label: "Warehouse type", required: true, format: "standard, high_bay, block or automated", example: "high_bay", help: "Select the physical and operational warehouse type.", effect: "Classifies the warehouse for planning and reporting.", errors: "Types not offered are rejected."}
          area_type: {label: "Area type", required: true, format: "storage, receiving, shipping, quality or blocked", example: "quality", help: "The type must reflect the actual process function.", effect: "Controls suitability for receipt, storage, shipping or blocking.", errors: "An incorrect type can prevent putaway and routing."}
          level_code: {label: "Level", required: true, format: "Short level code", example: "02", help: "Name the physical rack level consistently and scannably.", effect: "Is used with compartment and bin code for display and routing.", errors: "An empty level prevents bin creation."}
          bin_code: {label: "Compartment", required: true, format: "Short compartment code", example: "03", help: "Enter the physical compartment within aisle and level.", effect: "Completes the exact bin position.", errors: "An empty or duplicate combination is invalid."}
          location_type: {label: "Bin type", required: true, format: "storage, receiving, shipping, quality or blocked", example: "storage", help: "Choose only a type matching physical use.", effect: "Limits permitted storage and process operations.", errors: "An unsuitable type can block stock movements."}
          capacity_quantity: {label: "Capacity", required: false, format: "Integer from 0; 0 means unlimited", example: "100", help: "Maintain capacity in the operational quantity unit.", effect: "Controls utilisation display and capacity validation.", errors: "Negative values are invalid."}
          putaway_priority: {label: "Putaway priority", required: false, format: "Integer from 0", example: "100", help: "Available only when editing a bin; align it with the operational priority scheme.", effect: "Influences the order of suitable putaway destinations.", errors: "Contradictory priorities produce unexpected destination order."}
          putaway_enabled: {label: "Putaway enabled", required: false, format: "Checkbox", example: "enabled", help: "Disable when the bin must temporarily not be a putaway destination.", effect: "Removes the bin from automatic putaway selection.", errors: "Existing stock remains and must be handled separately."}
        actions:
          save: {label: "Save", description: "Validates resource type, parent chain and type-specific values and creates or updates the element.", result: "The element appears updated in its topology tab."}
          cancel: {label: "Cancel", description: "Returns to topology without saving.", result: "Existing values remain unchanged."}
        image: {src: "/assets/images/handbook/warehouse/topology-form.svg", alt: "Form for hierarchy, type, capacity and putaway control"}
      stock_blocks_overview:
        template: warehouse/stock_blocks.html.twig
        title: Stock blocks
        purpose: The overview starts blocks from available stock dimensions and tracks the separate review and release workflow.
        navigation: Warehouse & stock → Stock blocks
        permissions: ["inventory.stock_block.read; inventory.stock_block.write to block stock."]
        overview:
        - Positive stock not already blocked can be selected. No block action is offered without an active block reason.
        - The list shows open, reviewed or released state, product, bin, quantity, reason, note and original dimension.
        actions:
          block: {label: "Block", description: "Opens the selected stock with immutable dimension data.", result: "The block is created only after a reason and note are saved."}
          open: {label: "Edit", description: "Opens state, reason, audit log and the next permitted workflow action.", result: "Opening does not change the state."}
        image: {src: "/assets/images/handbook/warehouse/stock-blocks.svg", alt: "Stock blocks with available stock and review workflow"}
      stock_block_reasons:
        template: warehouse/stock_block_reasons.html.twig
        title: Block reasons
        purpose: The overview maintains codes, names, descriptions and active state of reasons used to justify new stock blocks.
        navigation: Warehouse & stock → Block reasons
        permissions: ["inventory.stock_block.read; inventory.stock_block.write for creation and editing."]
        overview:
        - Only active reasons are available when creating a block. Deactivation preserves historical references.
        actions:
          create: {label: "Create block reason", description: "Opens the shared warehouse configuration form.", result: "The reason is available only after saving."}
          edit: {label: "Edit", description: "Opens name, description and active state.", result: "Existing blocks remain linked to the reason."}
        image: {src: "/assets/images/handbook/warehouse/stock-block-reasons.svg", alt: "Block-reason overview with code, description and active state"}
      stock_block_create:
        template: warehouse/stock_block_new.html.twig
        title: Block stock
        purpose: The form blocks all or part of the exact selected stock dimension with an active reason and audit note.
        navigation: Warehouse & stock → Stock blocks → Block
        permissions: ["inventory.stock_block.write"]
        overview:
        - Product, bin, state, batch, serial number and expiry are taken from the stock row. Serialised stock is limited to quantity one.
        fields:
          product_id: {label: "Product ID", required: true, format: "Hidden UUID", example: "018f2f5a-73ad-7c42-9d84-2dcb65bcb410", help: "Taken automatically from the selected stock row.", effect: "Links the block to the product.", errors: "Manipulated or unknown IDs are rejected."}
          location_id: {label: "Bin ID", required: true, format: "Hidden UUID", example: "018f2f5a-73ad-7c42-9d84-2dcb65bcb411", help: "Do not change; it identifies the source stock.", effect: "Links the block to the bin.", errors: "Unknown or cross-tenant bins are rejected."}
          stock_status: {label: "Original stock state", required: true, format: "Hidden state code", example: "available", help: "Retained for subsequent controlled release.", effect: "Defines the blocked quantity's state dimension.", errors: "Already blocked or changed stock causes a conflict."}
          batch_number: {label: "Batch", required: false, format: "Hidden exact batch", example: "LOT-20261005", help: "Taken automatically for batch-managed stock.", effect: "Limits the block to this batch.", errors: "A batch no longer present cannot be blocked."}
          serial_number: {label: "Serial number", required: false, format: "Hidden unique serial number", example: "SN-0001842", help: "For serialised stock, exactly this unit is blocked.", effect: "Limits block quantity to one.", errors: "Moved or already blocked serial numbers are rejected."}
          expires_at: {label: "Expiry date", required: false, format: "Hidden ISO date", example: "2028-10-31", help: "Remains part of the unique stock dimension.", effect: "Ensures an expiry-specific block.", errors: "A dimension changed in the meantime causes a conflict."}
          reason_id: {label: "Block reason", required: true, format: "Selection of an active reason", example: "DAMAGE", help: "Select the applicable internally defined reason.", effect: "Controls audit and later review.", errors: "Inactive or unknown reasons are rejected."}
          quantity: {label: "Quantity to block", required: true, format: "Positive integer up to available stock; one for a serial number", example: "5", help: "Block only the quantity actually affected.", effect: "Removes this quantity from regular availability.", errors: "Zero, excess quantity or serial quantity above one is invalid."}
          note: {label: "Justification", required: true, format: "Traceable free text", example: "Outer packaging damaged during inspection", help: "State finding, source and document reference where applicable.", effect: "Starts the immutable block log.", errors: "An empty note prevents blocking."}
        actions:
          block: {label: "Block stock", description: "Validates dimension, available quantity, reason and note and starts the workflow.", result: "The block receives state open and the quantity is not regularly available."}
          cancel: {label: "Cancel", description: "Discards the entry.", result: "Stock remains available."}
        image: {src: "/assets/images/handbook/warehouse/stock-block-create.svg", alt: "Form for blocking a specific stock dimension"}
      stock_block_detail:
        template: warehouse/stock_block_show.html.twig
        title: Review and release a stock block
        purpose: The detail view separates independent review and release and displays every block event auditably.
        navigation: Warehouse & stock → Stock blocks → Edit
        permissions: ["inventory.stock_block.read; inventory.stock_block.review for review; inventory.stock_block.release for release."]
        overview:
        - In state open only review is possible; in reviewed only release is possible. No further action is available after released.
        fields:
          note: {label: "Review or release note", required: true, format: "Traceable finding or decision note", example: "Goods inspected, packaging replaced, release permitted", help: "Record outcome, decision and measures completely.", effect: "Is logged as a new event with user and timestamp.", errors: "Empty notes or actions in the wrong state are rejected.", usages: ["Review of an open block and release of a reviewed block"]}
        actions:
          review: {label: "Review block", description: "Records the review outcome for an open block.", result: "State changes from open to reviewed."}
          release: {label: "Release stock", description: "Confirms release of a reviewed block.", result: "State changes to released and quantity becomes available in its original dimension."}
        image: {src: "/assets/images/handbook/warehouse/stock-block-detail.svg", alt: "Stock block with review, release and event log"}
      inventory_control:
        template: warehouse/inventory_count/control.html.twig
        title: Inventory and material control centre
        purpose: The control centre combines hazardous materials and storage restrictions, bills of materials and requirements, load-carrier accounts, and snapshot and perpetual counts.
        navigation: Warehouse & stock → Inventory control
        permissions: ["inventory.control.read; inventory.hazard.write; inventory.bom.write/execute; inventory.load_carrier.write; inventory.count.write/execute/approve depending on the action."]
        overview:
        - Hazard classes are assigned to products by UN number and packing group; area rules permit or limit quantities by bin prefix.
        - Bills of materials contain components as JSON. Requirements multiply components by production quantity. Load-carrier postings change partner accounts traceably.
        - Counts follow open → counted → approved. Quantities are recorded per line, submitted and only then posted as differences through separate approval.
        fields:
          code: {label: "Code", required: true, format: "Code unique within the relevant area", example: "INV-2026-01", help: "Use a stable convention for hazard class, BOM, count or plan.", effect: "Identifies the created business object.", errors: "Empty or duplicate codes are rejected.", usages: ["Hazard class, bill of materials, snapshot count and perpetual-count plan"]}
          name: {label: "Name", required: true, format: "Understandable name", example: "Flammable liquids", help: "Describe the hazard class unambiguously for operators.", effect: "Appears in classification selections.", errors: "An empty name prevents creation."}
          un_class: {label: "UN class", required: true, format: "Valid dangerous-goods class", example: "3", help: "Enter the class from dangerous-goods documentation.", effect: "Classifies the regulatory hazard.", errors: "An empty or incorrect class makes rules ineffective."}
          product_id: {label: "Product", required: true, format: "Selection of an existing product", example: "SKU-CHEM-01", help: "Select the correct product for hazardous material or BOM.", effect: "Links classification or BOM to the product.", errors: "Unknown products are rejected.", usages: ["Hazard classification and BOM header"]}
          hazard_class_id: {label: "Hazard class", required: true, format: "Selection of a configured class", example: "HAZ-3", help: "It must match the product safety documentation or area rule.", effect: "Links product or storage restriction to the class.", errors: "Unknown classes are rejected.", usages: ["Product classification and storage-area rule"]}
          un_number: {label: "UN number", required: true, format: "Four-digit UN number", example: "UN 1993", help: "Copy exactly from the safety data sheet.", effect: "Identifies the hazardous material for transport and storage.", errors: "Missing or incorrect numbers endanger compliance."}
          packing_group: {label: "Packing group", required: false, format: "I, II or III", example: "II", help: "Copy from the safety data sheet where required.", effect: "Completes hazard classification.", errors: "An unsuitable group can trigger incorrect packaging rules."}
          description: {label: "Description", required: true, format: "Functional plain text", example: "Flammable liquid; keep away from ignition sources", help: "Document hazard and essential handling clearly.", effect: "Appears in the hazardous-material overview.", errors: "Empty text prevents classification."}
          location_prefix: {label: "Bin prefix", required: false, format: "Beginning of a bin code", example: "HAZ-A-", help: "Required for an area rule; optional to restrict a count spatially.", effect: "Limits restriction, count or plan to matching bins.", errors: "A non-matching prefix selects no bins.", usages: ["Hazard storage rule, snapshot count and perpetual-count plan"]}
          max_quantity: {label: "Maximum quantity", required: false, format: "Integer from 0", example: "500", help: "Leave empty when only permission or prohibition matters.", effect: "Limits hazardous-material quantity in the matching bin area.", errors: "Negative values are invalid."}
          allowed: {label: "Storage permitted", required: false, format: "Checkbox", example: "enabled", help: "Disable to prohibit the class entirely in the bin area.", effect: "Controls hazardous-material putaway validation.", errors: "Incorrect permission can violate safety requirements."}
          version: {label: "BOM version", required: true, format: "Version identifier", example: "1", help: "Use a traceable new version for a business change.", effect: "Identifies the component revision.", errors: "Empty or duplicate versions are rejected."}
          items: {label: "Components", required: true, format: "JSON array with productId and integer quantity", example: "[{'productId':'UUID','quantity':2}]", help: "Provide each component with a valid product UUID and positive input quantity.", effect: "Defines material requirement per production unit.", errors: "Invalid JSON, missing fields or non-integer quantities are rejected."}
          bom_id: {label: "Bill of materials", required: true, format: "Selection of an existing version", example: "BOM-4711 / 1", help: "Select the version valid for the production order.", effect: "Forms the basis of requirement planning.", errors: "Unknown BOMs are rejected."}
          reference: {label: "Reference", required: true, format: "Unique production or posting reference", example: "PROD-2026-0815", help: "Reference the external order or internal document traceably.", effect: "Links material requirement or carrier posting to its trigger.", errors: "An empty reference prevents posting.", usages: ["Material requirement and load-carrier posting"]}
          production_quantity: {label: "Production quantity", required: true, format: "Positive integer", example: "25", help: "Enter the planned number of units to produce.", effect: "Multiplies every BOM component into total requirement.", errors: "Zero or negative quantities are invalid."}
          partner_code: {label: "Partner", required: true, format: "Unique customer, supplier or carrier code", example: "SUPPLIER-1000", help: "Enter the owner of the load-carrier account movement.", effect: "Posts quantity to that partner's balance.", errors: "An empty partner code prevents posting."}
          carrier_type: {label: "Load-carrier type", required: true, format: "Operational type code", example: "EURO_PALLET", help: "Distinguish pallet, small-load carrier or mesh box unambiguously.", effect: "Maintains a separate balance per partner and type.", errors: "Inconsistent codes fragment accounts."}
          quantity: {label: "Quantity", required: true, format: "Signed integer according to posting direction", example: "10", help: "Record receipt positively and return according to operational convention; for a count enter physical quantity.", effect: "Changes carrier balance or count line.", errors: "Non-numeric values are rejected.", usages: ["Load-carrier posting and inventory count"]}
          note: {label: "Note", required: false, format: "Free text", example: "Exchange on receipt PO-4711", help: "Add differences or posting context.", effect: "Supports later account reconciliation.", errors: "The note does not replace a unique reference."}
          warehouse_id: {label: "Warehouse", required: true, format: "Selection of an existing warehouse", example: "WH1", help: "Select the warehouse to count physically.", effect: "Limits count or plan to this warehouse.", errors: "Unknown warehouses are rejected.", usages: ["Snapshot count and perpetual-count plan"]}
          interval_days: {label: "Interval in days", required: true, format: "Positive integer", example: "30", help: "Choose frequency to match ABC class and operational policy.", effect: "Calculates recurring plan due dates.", errors: "Zero or negative intervals are invalid."}
          next_due_at: {label: "Next due", required: true, format: "Local date and time", example: "2026-11-01 06:00", help: "Set the first planned count time.", effect: "Determines when the next cycle count can start.", errors: "Invalid time values are rejected."}
        actions:
          create_hazard_class: {label: "Create hazard class", description: "Saves code, name and UN class.", result: "The class is available for products and area rules."}
          classify_material: {label: "Classify product", description: "Assigns hazard class, UN number, packing group and description.", result: "The product appears in the hazardous-material list."}
          save_restriction: {label: "Save area rule", description: "Defines permission and optional maximum quantity per class and bin prefix.", result: "Putaway is checked against the rule."}
          create_bom: {label: "Save bill of materials", description: "Validates header and component JSON and creates the version.", result: "The BOM is available for requirement planning."}
          plan_requirement: {label: "Create requirement", description: "Multiplies components by production quantity.", result: "A traceable material requirement is created."}
          book_carrier: {label: "Post load carrier", description: "Posts quantity and reference to partner and type.", result: "The account balance is updated."}
          create_count: {label: "Open snapshot count", description: "Creates count lines for warehouse and optional bin prefix.", result: "The count starts in state open."}
          create_cycle_plan: {label: "Save perpetual plan", description: "Saves scope, interval and next due date.", result: "The plan can create a cycle count when due."}
          record_count: {label: "Save counted quantity", description: "Saves the physically determined quantity for an open line.", result: "Differences become visible but are not yet posted."}
          submit_count: {label: "Submit count", description: "Closes entry of all lines for review.", result: "State changes from open to counted."}
          approve_count: {label: "Approve and post", description: "Approves determined differences separately from counting.", result: "Difference movements are posted atomically and the count is completed."}
        image: {src: "/assets/images/handbook/warehouse/inventory-control.svg", alt: "Inventory control centre with hazardous materials, bills of materials, load carriers and count workflow"}
    guidance:
      prerequisites:
      - Active tenant-owned site, warehouse, area, aisle, bin and product.
      permissions:
      - inventory.topology.*, inventory.overview.read, inventory.stock.*, inventory.traceability.read and permissions for special stock, rules and blocks.
      fields:
      - 'Topology: parent IDs, code, type, capacity_quantity, priority, active. Stock: product_id, location_id, quantity, status, batch_number, serial_number, expires_at, owner_reference.
        Block/rule: reason_id, selection_type/value, sequence_number.'
      statuses:
      - Stock is available, blocked or classified. Blocks move open → reviewed → released; every movement remains in the ledger.
      errors:
      - Negative stock, duplicate serial, invalid transition, full target or incompatible storage rule is rejected.
  inventory_counting:
    title: Inventory counting and stock control
    summary: Snapshot, perpetual and zero-crossing counts, entry and discrepancy approval.
    sections:
      section_1:
        title: Prepare a count
        paragraphs:
          paragraph_1: Select count type, site, warehouse area and effective date. The system prevents parallel open counts for the same area. The expected stock is an immutable snapshot;
            later movements remain separately traceable.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Prepare a count – screenshot placeholder
      section_2:
        title: Count and submit
        paragraphs:
          paragraph_1: Enter counted quantity and, where required, batch, serial number or note. Blind count hides the expected value. Submit only after every line has been processed.
            Zero-crossing counts are event-driven and perpetual counts use due plans.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: 'Placeholder: count document and entry'
      section_3:
        title: Approve discrepancies
        paragraphs:
          paragraph_1: Differences require an authorised second person. Review expected, actual, movements and reason. Approval posts the adjustment to the ledger; rejection or recount
            changes workflow state without deleting the original count.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Approve discrepancies – screenshot placeholder
      section_4:
        title: Complete
        paragraphs:
          paragraph_1: Complete the count only after all discrepancies have been handled. Verify final state, adjustment entries and audit log.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Complete – screenshot placeholder
    guidance:
      prerequisites:
      - A defined warehouse scope; parallel open counts for the same scope are forbidden.
      permissions:
      - inventory.control.read, inventory.count.write/execute/approve, inventory.hazard.write, inventory.bom.* and inventory.load_carrier.write.
      fields:
      - 'Plan: scope, schedule_type, interval_days, next_due_at. Count: location_id, product_id, batch, serial, actual_quantity, note. Approval: decision, reason.'
      statuses:
      - Count moves open → counted → completed. Differences post only after independent approval.
      errors:
      - Duplicate open count, missing line, negative quantity, self-approval or completion with open differences is rejected.
  inbound:
    title: Inbound and putaway
    summary: Orders, notices, planned and unplanned receipts, quality, discrepancies and putaway.
    sections:
      section_1:
        title: Process planned receipts
        paragraphs:
          paragraph_1: Find the order or notice and verify supplier, products, expected quantities and date. Capture received quantity plus batch, serial number, expiry and load carrier.
            Partial quantities remain open where the document permits this.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Process planned receipts – screenshot placeholder
      section_2:
        title: Capture an unplanned receipt
        paragraphs:
          paragraph_1: Select tenant, site, supplier or origin, product and quantity. Provide a reason. External references and idempotency keys prevent duplicates.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: 'Placeholder: inbound inspection'
      section_3:
        title: Quality and discrepancies
        paragraphs:
          paragraph_1: Complete the configured checklist. Quantity, identity or quality deviations create a controlled case. Blocked goods remain unavailable until an authorised user
            approves or rejects them. Decisions require a reason and are audited.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Quality and discrepancies – screenshot placeholder
      section_4:
        title: Putaway
        paragraphs:
          paragraph_1: Request a target bin from the active strategy or select an allowed bin with appropriate permission. Check capacity, hazardous-goods rules, product compatibility
            and state. Confirm source and target scans; stock is then transferred atomically.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Putaway – screenshot placeholder
    views:
      unplanned_receipts_overview:
        template: inbound/index.html.twig
        title: Unplanned receipts
        purpose: The overview shows recorded unplanned receipts and links to creation, details or planned receipt processing.
        navigation: Inbound → Unplanned receipts
        permissions: ["inbound.receipt.read; inbound.receipt.write for creation; inbound.planned.read to open planned receipts."]
        overview:
        - Columns show receipt number, supplier, delivery note, line count, total quantity and state. Open leads to the immutable detail and posting view.
        - The empty state means that no unplanned receipt exists in the active tenant; this table has no filters or pagination.
        actions:
          create: {label: "Record unplanned receipt", description: "Opens the separate receipt form.", result: "The overview changes only after successful saving."}
          open: {label: "Open", description: "Shows header, lines, stock dimensions and posting state.", result: "Navigation does not change data."}
          planned: {label: "Planned receipts", description: "Opens ASN and purchase-order receipt processing.", result: "Open planned lines are displayed."}
        image: {src: "/assets/images/handbook/inbound/unplanned-overview.svg", alt: "Unplanned receipt overview with state and open action"}
      unplanned_receipt_create:
        template: inbound/new.html.twig
        title: Record unplanned receipt
        purpose: The form receives goods without a preceding purchase order or ASN at a receiving bin.
        navigation: Inbound → Unplanned receipts → Record unplanned receipt
        permissions: ["inbound.receipt.write; product and receiving bin must exist in the active tenant."]
        overview: ["Verify supplier, product, quantity, stock state and any batch or serial number. Saving creates a controlled receipt but not the final stock posting."]
        fields:
          code: {label: "Receipt number", required: true, format: "Document code unique in the tenant", example: "UR-2026-0042", help: "Use a traceable external or internal reference.", effect: "Identifies the receipt and prevents accidental duplicates.", errors: "Empty or previously used codes are rejected."}
          supplier_code: {label: "Supplier code", required: true, format: "Stable uppercase letter/digit code", example: "SUP-1000", help: "Identifies the sender without a purchase-order reference.", effect: "Stored on the receipt and in reports.", errors: "Empty codes prevent receipt."}
          supplier_name: {label: "Supplier name", required: true, format: "Full understandable name", example: "Example Supply Ltd", help: "Complements the code for users and evidence.", effect: "Appears in overview and details.", errors: "An empty name is invalid."}
          delivery_note: {label: "Delivery note", required: false, format: "Exact supplier reference", example: "DN-84711", help: "Supports enquiries and duplicate checks.", effect: "Stored as an additional external reference.", errors: "Ambiguous or reused references must be checked before posting."}
          product_id: {label: "Product", required: true, format: "Selection of an existing product", example: "SKU-4711", help: "Verify SKU and description against delivered goods.", effect: "Determines the stock created later.", errors: "Unknown or cross-tenant products are rejected."}
          location_id: {label: "Receiving bin", required: true, format: "Selection of a permitted bin", example: "WH1-RECEIVING", help: "Use an approved receiving or inspection bin.", effect: "Later posting initially creates stock at this bin.", errors: "Unknown, blocked or unsuitable bins prevent receipt."}
          quantity: {label: "Quantity", required: true, format: "Positive integer in the product base unit", example: "'20'", help: "Count or measure the quantity actually received.", effect: "Used as receipt quantity for later stock posting.", errors: "Zero, negative or non-numeric quantities are invalid."}
          stock_status: {label: "Stock status", required: true, format: "available; quality_inspection or blocked", example: "quality_inspection", help: "Available can be used; quality inspection stays controlled; blocked prevents operational use.", effect: "Determines availability of posted stock.", errors: "Values not offered by the form are rejected."}
          batch_number: {label: "Batch", required: false, format: "Exact manufacturer batch identifier", example: "LOT-20261002", help: "Mandatory for batch-managed products and copied from the label.", effect: "Creates the batch stock dimension and traceability.", errors: "A missing or invalid batch prevents posting for batch-required products."}
          serial_number: {label: "Serial number", required: false, format: "Globally unique serial number", example: "SN-0001842", help: "Reference exactly one unit for serial-managed products.", effect: "Permanently identifies the concrete stock unit.", errors: "Duplicate or existing serial numbers are rejected."}
        actions:
          accept: {label: "Accept", description: "Validates references, product, bin, quantity and stock dimensions and creates the receipt.", result: "The detail view can then perform controlled stock posting."}
          cancel: {label: "Cancel", description: "Discards unsaved input and returns to the overview.", result: "No receipt is created."}
        image: {src: "/assets/images/handbook/inbound/unplanned-create.svg", alt: "Form for recording an unplanned receipt"}
      unplanned_receipt_detail:
        template: inbound/show.html.twig
        title: Review and post unplanned receipt
        purpose: The detail view verifies supplier, delivery note, lines, bins, quantities and stock dimensions before posting.
        navigation: Inbound → Unplanned receipts → Open
        permissions: ["inbound.receipt.read; inbound.receipt.book for stock posting."]
        overview:
        - Header data shows supplier, delivery note, state and acceptance time. Lines show product, receiving bin, quantity, state, batch and serial number.
        - Posting is available only in accepted state. After success it disappears and the state prevents duplicate posting.
        actions:
          book: {label: "Post to stock", description: "Checks permission and current document state and atomically creates stock receipts.", result: "On success document and lines become posted; an error creates no partial posting."}
          back: {label: "Inbound", description: "Returns to the overview without a change.", result: "Current document state is retained."}
        image: {src: "/assets/images/handbook/inbound/unplanned-detail.svg", alt: "Unplanned receipt details with stock posting"}
      planned_receipts:
        template: inbound/planned.html.twig
        title: Receive and put away planned receipts
        purpose: The worklist takes advised lines through receipt, quality inspection, discrepancy resolution and putaway.
        navigation: Inbound → Planned receipts
        permissions: ["inbound.planned.read plus receive, inspect, resolve and putaway for their respective state actions."]
        overview:
        - Columns show ASN and order, sender address, product, advised or received quantity, process state, destination and the currently permitted action. The address stored with the ASN remains available as a document snapshot.
        - States distinguish advised, QA open, QA completed, open discrepancy, rejected, open putaway and put away. Each row offers only the next valid step.
        fields:
          actual_quantity: {label: "Actual quantity", required: true, format: "Positive integer", example: "'18'", help: "Enter the counted quantity rather than blindly accepting the ASN value.", effect: "A difference from expected quantity opens a discrepancy.", errors: "Zero or negative values are rejected; excess quantities need an explanation."}
          discrepancy_reason: {label: "Discrepancy reason", required: false, format: "Short functional explanation", example: "Two cartons missing", help: "Complete specifically whenever quantity differs.", effect: "Stored on the discrepancy and in audit.", errors: "A discrepancy without sufficient reason cannot be resolved safely."}
          location_id: {label: "Receiving or inspection bin", required: true, format: "Selection of a permitted bin", example: "WH1-QA-01", help: "Bin holding inspected goods until putaway.", effect: "Becomes source bin for stock and the later putaway order.", errors: "Unknown or blocked bins prevent QA completion."}
          decision: {label: "QA decision", required: true, format: "accept or block", example: "accept", help: "Acceptance is unavailable while a discrepancy is open; block keeps goods unavailable.", effect: "Sets quality and stock state and controls the next step.", errors: "Acceptance with an open discrepancy is rejected."}
          packaging_passed: {label: "Packaging undamaged", required: false, format: "Checkbox", example: "enabled", help: "Enable only after checking packaging and tamper protection.", effect: "Stored as a QA result.", errors: "Failed inspection should include a QA note and block decision."}
          quantity_passed: {label: "Quantity complete", required: false, format: "Checkbox", example: "disabled", help: "Compare count with advised quantity.", effect: "Documents completeness independently from actual quantity.", errors: "Conflicts between checkbox and actual quantity must be resolved."}
          packaging_note: {label: "QA note", required: false, format: "Factual inspection description", example: "Outer carton dented; inner packaging intact", help: "Describe damage, evidence and decision traceably.", effect: "Stored in quality evidence.", errors: "Vague notes make later resolution difficult."}
          batch_number: {label: "Batch", required: false, format: "Exact manufacturer batch", example: "LOT-20261002", help: "Copy from the product label for batch-managed products.", effect: "Stored as stock dimension on release.", errors: "Missing or invalid batch prevents completion for batch-required products."}
          serial_number: {label: "Serial number", required: false, format: "Unique serial number", example: "SN-0001842", help: "Scan or enter exactly for serial-required products.", effect: "Assigns later stock to the concrete unit.", errors: "Duplicate or unknown serial numbers are rejected."}
          expires_at: {label: "Best-before date", required: false, format: "Date in YYYY-MM-DD format", example: "'2028-10-31'", help: "Copy from the product and always maintain for FEFO-relevant goods.", effect: "Controls shelf-life validation and FEFO picking.", errors: "Expired or implausible dates can block release and putaway."}
          action: {label: "Discrepancy decision", required: true, format: "release or reject", example: "release", help: "Release permits putaway; reject retains or sets blocked stock.", effect: "Closes the open discrepancy with audit evidence.", errors: "A resolved case cannot be closed again."}
          resolution_note: {label: "Decision reason", required: true, format: "Concrete and verifiable explanation", example: "Shortage confirmed with supplier; partial quantity released", help: "Record basis, agreement and follow-up action.", effect: "Audited immutably with the decision.", errors: "An empty explanation prevents saving."}
        actions:
          receive: {label: "Receive", description: "Records actual quantity and opens a controlled discrepancy when needed.", result: "The line advances to quality inspection."}
          inspect: {label: "Complete QA", description: "Stores bin, decision, checks and stock dimensions.", result: "Goods are released or blocked; open discrepancies still require resolution."}
          resolve: {label: "Save decision", description: "Releases or rejects the discrepancy with a reason.", result: "Released goods can be put away; rejected goods remain blocked."}
          plan_putaway: {label: "Plan putaway", description: "Uses the active strategy to find a permitted target and creates an order.", result: "State changes to open putaway."}
          confirm_putaway: {label: "Confirm putaway", description: "Confirms the order and atomically moves stock to its target.", result: "State changes to put away and repetition is excluded."}
        image: {src: "/assets/images/handbook/inbound/planned-receipts.svg", alt: "Planned receipt worklist with QA, discrepancy and putaway"}
      inbound_control:
        template: inbound/control.html.twig
        title: Inbound control center
        purpose: Tabs combine purchase orders and ASNs, quality evidence, labels, cross-docking, production receipts and returns.
        navigation: Inbound → Control center
        permissions:
        - Displayed forms require their matching inbound control, planned, production, return, attachment, label or cross-dock permissions; operational receipt opens the separate worklist.
        overview:
        - Purchase orders show supplier, lines, received and ordered quantities and state. An ASN line can be created only against an open purchase-order line.
        - Quality tabs show active checklists and downloadable process evidence. Logistics shows cross-dock staging and production receipts; returns show reference, product, quantity, reason, state and next action.
        fields:
          code: {label: "Document or configuration code", required: true, format: "Key unique within its area", example: "PO-2026-10042", help: "Used as purchase order, ASN, checklist or return number depending on the form.", effect: "Permanently identifies the record and audit evidence.", errors: "Empty or duplicate codes are rejected.", usages: ["Purchase order, ASN, QA checklist and return"]}
          supplier_reference: {label: "Supplier reference", required: true, format: "Unique supplier code or external reference", example: "SUP-1000", help: "Assigns the purchase order to the agreed supplier.", effect: "Appears in order overview and follow-up documents.", errors: "An empty reference prevents order creation."}
          product_id: {label: "Product", required: true, format: "Selection of an existing product", example: "SKU-4711", help: "Verify SKU and description for purchase order, production and return.", effect: "Determines the affected order line or stock movement.", errors: "Unknown or cross-tenant products are rejected.", usages: ["Purchase order, production receipt and return"]}
          quantity: {label: "Quantity", required: true, format: "Positive integer in the product base unit", example: "'20'", help: "Enter ordered, advised, staged, produced or returned quantity for the respective process.", effect: "Controls order progress and later stock movement.", errors: "Zero, negative values or quantities above open demand are rejected.", usages: ["Purchase order, ASN, cross-docking, production receipt and return"]}
          delivery_note: {label: "Delivery note", required: true, format: "Exact external delivery reference", example: "DN-84711", help: "Copy from the delivery document and check for duplicates.", effect: "Links the ASN with the physical delivery.", errors: "An empty or prohibited duplicate reference prevents acceptance."}
          purchase_order_item_id: {label: "Open purchase-order line", required: true, format: "Selection of a line not fully advised", example: "PO-2026-10042 / SKU-4711", help: "The selection shows order, product and remaining quantity.", effect: "Binds the ASN to product and quantity progress.", errors: "Closed, unknown or fully advised lines are rejected."}
          purchase_order_id: {label: "Purchase-order ID", required: true, format: "Automatically populated hidden UUID of the selected line", example: "018f2f5a-73ad-7c42-9d84-2dcb65bcb410", help: "Updated when the line changes and never maintained manually.", effect: "Secures consistent assignment of ASN and order header.", errors: "A missing or mismatched value prevents acceptance."}
          expected_at: {label: "Expected time", required: true, format: "Local date and time", example: "'2026-10-05T08:30'", help: "Use the planned time from ASN or supplier confirmation.", effect: "Controls worklist and operational planning.", errors: "Invalid dates are rejected."}
          sender_name: {label: "Sender/company", required: true, format: "Full supplier or sender name", example: "Sample Supplier Ltd", help: "Enter the actual shipping company so goods receiving can identify the delivery.", effect: "Stored as an immutable address snapshot on the ASN and shown in the worklist.", errors: "An empty name or one longer than 160 characters is rejected."}
          sender_street: {label: "Street and number", required: true, format: "Complete sender street address", example: "Supply Road 12", help: "Copy the address from the ASN, delivery note or supplier confirmation.", effect: "Identifies the origin of the announced goods.", errors: "An empty street or one longer than 255 characters is rejected."}
          sender_postal_code: {label: "Postal code", required: true, format: "Postal code in the country's customary format", example: "20095", help: "Enter the postal code without the city.", effect: "Forms part of the documented origin address.", errors: "An empty postal code or one longer than 32 characters is rejected."}
          sender_city: {label: "City", required: true, format: "Full city name", example: "Hamburg", help: "Use the city of the shipping address.", effect: "Forms part of the documented origin address.", errors: "An empty city or one longer than 120 characters is rejected."}
          sender_country_code: {label: "Country code", required: true, format: "ISO 3166-1 alpha-2, exactly two letters", example: "DE", help: "Use the two-letter country code of the shipping address.", effect: "Normalized and stored in uppercase.", errors: "Values other than exactly two letters are rejected."}
          name: {label: "Checklist name", required: true, format: "Understandable inspection purpose", example: "Standard packaging inspection", help: "Must explain scope clearly to inspectors.", effect: "Appears in active checklist overview.", errors: "An empty name prevents activation."}
          questions: {label: "Inspection questions", required: true, format: "One concrete question per line", example: "'Is packaging undamaged?\\nDoes quantity match?'", help: "Phrase questions so they can be answered and evidenced unambiguously.", effect: "Each line becomes one QA checkpoint.", errors: "Empty checklists or only blank lines are rejected."}
          aggregate_type: {label: "Process type", required: true, format: "inbound_receipt; unplanned_receipt; return_receipt or production_receipt", example: "inbound_receipt", help: "Selects the referenced process type for an attachment or label.", effect: "Controls resolution, permission and storage or print data.", errors: "Values not offered by the form are rejected.", usages: ["Attachment and label"]}
          aggregate_id: {label: "Process ID", required: true, format: "UUID of the concrete receipt, return or production process", example: "018f2f5a-73ad-7c42-9d84-2dcb65bcb410", help: "Copy exactly from details or the technical reference.", effect: "Immutably links attachment or label to the process.", errors: "Unknown IDs or IDs of another type are rejected.", usages: ["Attachment and label"]}
          category: {label: "Attachment category", required: true, format: "photo; delivery_note; quality or other", example: "quality", help: "Select actual content so evidence remains discoverable.", effect: "Groups the file and controls later display.", errors: "Categories not offered are rejected."}
          file: {label: "File", required: true, format: "Image, PDF, TXT or CSV within server size limits", example: "qa-report-10042.pdf", help: "Upload only required, malware-checked and privacy-compliant evidence.", effect: "Stored securely with name, size, category and process reference.", errors: "Empty, oversized or prohibited file types are rejected."}
          label_type: {label: "Label type", required: true, format: "receipt; product or handling_unit", example: "handling_unit", help: "Choose receipt for documents, product for goods and handling unit for pallet or container.", effect: "Determines print template and data content.", errors: "Unsupported types prevent job creation."}
          copies: {label: "Copies", required: true, format: "Integer from 1 to 100", example: "'2'", help: "Create only the operationally required number.", effect: "The print job requests this many identical labels.", errors: "Values outside 1 to 100 are rejected."}
          receipt_id: {label: "Inspected receipt", required: true, format: "Selection of a receipt in inspected state", example: "ASN-2026-0042 / SKU-4711", help: "Only quality-inspected goods can be staged directly.", effect: "Supplies product and available quantity for cross-docking.", errors: "Uninspected, blocked or consumed quantities are rejected."}
          outbound_item_id: {label: "Outbound demand", required: true, format: "Selection of an open outbound line for the same product", example: "SO-2026-0815 / SKU-4711", help: "Match product and remaining demand with the receipt.", effect: "Reserves cross-dock quantity immediately for this outbound line.", errors: "Product conflicts, closed lines or excess quantity prevent staging."}
          production_order: {label: "Production order", required: true, format: "Unique external or internal order reference", example: "PROD-2026-771", help: "Copy exactly from production confirmation.", effect: "Justifies and references the production receipt.", errors: "Empty or prohibited duplicate references are rejected."}
          location_id: {label: "Bin", required: true, format: "Selection of a permitted bin", example: "WH1-PRODUCTION-IN", help: "Select production receipt bin or return inspection/restock bin.", effect: "Determines the bin for stock posting or return decision.", errors: "Unknown, blocked or wrong-warehouse bins are rejected.", usages: ["Production receipt and return inspection"]}
          batch_number: {label: "Batch", required: false, format: "Exact manufacturer or production batch", example: "LOT-20261002", help: "Mandatory for batch-managed production products.", effect: "Creates the batch dimension of produced stock.", errors: "Missing or duplicate batch can prevent posting."}
          order_reference: {label: "Order reference", required: true, format: "Original customer order or shipment number", example: "SO-2026-0815", help: "Enables traceability to original delivery.", effect: "Functionally links the return to outbound.", errors: "An empty reference prevents return creation."}
          reason: {label: "Return reason", required: true, format: "Concrete short description", example: "Transport damage to outer carton", help: "Record the actual reason instead of a broad generic term.", effect: "Stored in return overview, decision and reporting.", errors: "An empty reason prevents creation."}
          decision: {label: "Return decision", required: true, format: "restock or quarantine", example: "quarantine", help: "Restock only inspected saleable goods; otherwise quarantine.", effect: "Sets stock state and operational availability.", errors: "Uninspected or contradictory decisions are rejected."}
          note: {label: "Inspection note", required: true, format: "Traceable description of condition and decision", example: "Packaging damaged; product intact; quarantined for clarification", help: "Record condition, evidence and follow-up action.", effect: "Audited with the return inspection.", errors: "An empty note prevents completion."}
        actions:
          purchase_order: {label: "Create purchase order", description: "Creates an order header and first product line.", result: "The open line is available for ASN quantities."}
          delivery: {label: "Accept ASN", description: "Links delivery note, sender address, quantity and expected time to the selected order line.", result: "The line appears with documented origin in planned operational receipt."}
          checklist: {label: "Activate checklist", description: "Creates one active checkpoint from each text line.", result: "New QA inspections can use the checklist."}
          attachment: {label: "Store securely", description: "Validates file, category and process reference and stores evidence.", result: "The file appears in process evidence and can be downloaded with permission."}
          label: {label: "Create print job", description: "Creates the requested number of labels for process and type.", result: "The job is passed to the configured print route."}
          cross_dock: {label: "Stage directly", description: "Assigns inspected receipt quantity to open outbound demand.", result: "Cross-dock staging is created without regular putaway."}
          production: {label: "Post production completion", description: "Creates production receipt for order, product, bin, quantity and batch.", result: "Stock and production evidence are created atomically."}
          return_create: {label: "Announce return", description: "Records reference, product, quantity and return reason.", result: "The return appears for physical receipt."}
          return_receive: {label: "Process receipt", description: "Confirms physical arrival of the announced line.", result: "A return receipt requiring inspection is created; repetition is excluded."}
          return_inspect: {label: "Inspect return", description: "Stores bin, restock or quarantine decision and explanatory note.", result: "Stock is created according to the decision and the process completes."}
        image: {src: "/assets/images/handbook/inbound/control-center.svg", alt: "Inbound control center with documents, quality, logistics and returns"}
    guidance:
      prerequisites:
      - Active supplier, product, site, receiving area and, for planned receipt, order or notice.
      permissions:
      - inbound.planned.read/receive/inspect/resolve/putaway and inbound.receipt.read/write/book.
      fields:
      - 'Order/notice: order_number, supplier_reference, expected_at, product_id, quantity. Receipt: delivery_note, actual_quantity, batch, serial_number, expires_at, load_unit. Quality/putaway:
        questions, accepted, discrepancy_reason, source/target location.'
      statuses:
      - planned → partially_received/received → inspected → released/blocked → putaway → completed.
      errors:
      - Over-notice, over-receipt, duplicate external reference, failed quality, blocked goods or invalid target blocks the next step.
  fulfillment_and_outbound:
    title: Order, allocation, picking, packing and shipping
    summary: The complete outbound process from customer order through loading and returns.
    sections:
      section_1:
        title: Create and release orders
        paragraphs:
          paragraph_1: Capture or import recipient, delivery date, lines, quantities and shipping requirements. Release validates master data and available stock. Allocations reserve
            specific stock dimensions according to the active selection strategy.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Create and release orders – screenshot placeholder
      section_2:
        title: Pick
        paragraphs:
          paragraph_1: Create or bundle pick lists, assign a user and optionally optimise the route. Scan bin, product, batch or serial number and confirm quantity. Shortages are recorded
            as exceptions rather than silently skipped.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: 'Placeholder: mobile picking'
      section_3:
        title: Pack and ship
        paragraphs:
          paragraph_1: Open the packing order, select packaging and assign lines to a package. Weight and dimensions can be entered or captured by a device. Generate the shipping label
            after a successful carrier request. Failed requests remain traceable and retryable.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Pack and ship – screenshot placeholder
      section_4:
        title: Load and deliver
        paragraphs:
          paragraph_1: Group shipments into a manifest, confirm loading by scan and complete the manifest. Delivery status and ERP feedback are processed through integrations. Cancellation
            is only possible in eligible states.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Load and deliver – screenshot placeholder
      section_5:
        title: Returns
        paragraphs:
          paragraph_1: Identify the original shipment and product, capture reason and condition, then choose restock, block, rework or scrap. Each decision creates the appropriate stock
            movement and audit evidence.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Returns – screenshot placeholder
    views:
      internal_transport:
        template: fulfillment/transport/index.html.twig
        title: Internal transport and replenishment
        purpose: The control center creates, assigns and confirms transport and replenishment orders and maintains resources, rules, stations and milk runs.
        navigation: Fulfilment → Internal transport
        permissions:
        - fulfillment.transport.read for the control center; write for orders and milk-run dispatch; assign and execute for state actions; configure for master data; fulfillment.replenishment.write/execute for replenishment.
        overview:
        - The transport table shows order code and priority, type, source and target, product or load carrier, quantity, resource and state.
        - State actions follow open → assigned → started → completed. Only the currently permitted action is displayed; completion may post stock.
        - Replenishment orders show rule, product, route, quantity and state. Empty tables explicitly state that no orders exist.
        fields:
          code: {label: "Code", required: true, format: "Unique technical key", example: "TR-2026-0042", help: "Use traceable codes unique within each area.", effect: "Identifies order, resource, rule, station, milk run or replenishment policy.", errors: "Empty or duplicate codes are rejected.", usages: ["Transport order, resource, transport rule, station, milk run and replenishment policy"]}
          transport_type: {label: "Transport type", required: true, format: "relocation; replenishment; prepositioning; material_flow or milk_run", example: "replenishment", help: "Relocation moves stock; replenishment fills a target; prepositioning stages stock; material flow follows a rule; milk run combines stops.", effect: "Determines functional processing and reporting.", errors: "Unsupported values are rejected.", usages: ["Transport order and transport rule"]}
          source_location_id: {label: "Source bin", required: true, format: "Selection of a tenant bin", example: "WH1-RESERVE-01", help: "Bin from which stock or a load carrier is collected.", effect: "Used as the issue location on completion.", errors: "Source and target must exist and stock and state must permit posting."}
          target_location_id: {label: "Target bin", required: true, format: "Selection of a tenant bin", example: "WH1-PICK-01", help: "Destination of transport or replenishment.", effect: "Used as receipt location on completion.", errors: "Unknown, blocked or identical source and target bins are rejected.", usages: ["Transport order and replenishment policy"]}
          priority: {label: "Priority", required: true, format: "Positive integer; transport order from 1 to 999", example: "'50'", help: "Use an agreed scale matching the implemented control-center ordering.", effect: "Influences ordering of open orders and rules.", errors: "Non-numeric or prohibited values prevent saving.", usages: ["Transport order, transport rule and replenishment policy"]}
          product_id: {label: "Product", required: false, format: "Product selection or empty for a pure load-carrier move", example: "SKU-4711", help: "Required for stock-effective transports and replenishment.", effect: "Determines which product is posted or replenished.", errors: "Unknown products or a missing product for quantity posting are rejected.", usages: ["Transport order and replenishment policy"]}
          quantity: {label: "Quantity", required: false, format: "Positive integer in the product base unit", example: "'20'", help: "Enter only together with a product.", effect: "This quantity is moved on successful completion.", errors: "Zero, negative values or insufficient source stock prevent posting."}
          stock_status: {label: "Stock status", required: false, format: "Known status code", example: "available", help: "Selects stock quality to move; defaults to available.", effect: "Restricts source stock used for posting.", errors: "Unknown states or non-matching stock prevent completion."}
          batch_number: {label: "Batch", required: false, format: "Exact batch identifier", example: "LOT-20261002", help: "Use for unambiguous selection of batch-managed stock.", effect: "Restricts posting to this batch.", errors: "Missing or unavailable batches prevent posting."}
          serial_number: {label: "Serial number", required: false, format: "Exact unique serial number", example: "SN-0001842", help: "Reference exactly one existing unit for serial-managed products.", effect: "Moves the specifically identified unit.", errors: "Unknown, duplicate or absent serial numbers are rejected."}
          forklift_id: {label: "Assign resource", required: true, format: "Selection of an available resource", example: "FL-01", help: "Only currently available forklifts, AGVs or tugger trains are offered.", effect: "Changes the open order to assigned and binds the resource.", errors: "Busy, inactive or cross-tenant resources cannot be assigned."}
          name: {label: "Name", required: true, format: "Understandable description", example: "Assembly North milk run", help: "Explains the purpose to dispatchers and drivers.", effect: "Appears in configuration and selections.", errors: "An empty name prevents creation.", usages: ["Resource, transport rule, station and milk run"]}
          warehouse_id: {label: "Warehouse", required: true, format: "Selection of an existing warehouse", example: "WH1", help: "Assigns configuration and execution to a warehouse.", effect: "Restricts resources, stations, tours and replenishment to this warehouse.", errors: "Unknown or cross-tenant warehouses are rejected.", usages: ["Resource, station, milk run and replenishment policy"]}
          resource_type: {label: "Resource type", required: true, format: "forklift; tugger_train or agv", example: "agv", help: "Forklifts are manual, milk runs are stop-oriented and AGVs are automated.", effect: "Filters suitable resources for orders and rules.", errors: "Types not offered by the form are rejected.", usages: ["Resource and transport rule"]}
          trigger_type: {label: "Trigger", required: true, format: "manual; replenishment; prepositioning or material_flow", example: "material_flow", help: "Determines which event uses the rule.", effect: "Controls automatic or manual order creation.", errors: "Unsupported triggers are rejected."}
          source_prefix: {label: "Source prefix", required: true, format: "Beginning of a bin code", example: "RES-", help: "Restricts rule-based sources by code.", effect: "The rule considers only matching source bins.", errors: "Overly broad prefixes can match unintended bins."}
          target_prefix: {label: "Target prefix", required: true, format: "Beginning of a bin code", example: "PICK-", help: "Restricts rule-based destinations by code.", effect: "The rule creates transports only for matching targets.", errors: "No order can be created without a matching target."}
          location_id: {label: "Station bin", required: true, format: "Selection of a bin", example: "STATION-01", help: "Physical handover or buffer bin of the station.", effect: "Links material flow and milk-run stop to the bin.", errors: "Unknown bins or bins from another warehouse are rejected."}
          sequence_number: {label: "Sequence", required: true, format: "Positive integer", example: "'10'", help: "Lower values occur earlier in station or tour order.", effect: "Sorts stations and stops deterministically.", errors: "Invalid or conflicting sequences must be corrected before dispatch.", usages: ["Station and milk-run stop"]}
          station_type: {label: "Station type", required: true, format: "Hidden default value buffer", example: "buffer", help: "New stations are created as buffer stations on this page.", effect: "Marks the station as a temporary handover point.", errors: "Other station types cannot be configured here."}
          schedule_type: {label: "Tour schedule", required: true, format: "fixed or dynamic", example: "fixed", help: "Fixed uses recurring intervals; dynamic permits demand-based dispatch.", effect: "Determines milk-run planning logic.", errors: "Values not offered by the form are rejected."}
          interval_minutes: {label: "Interval in minutes", required: true, format: "Positive integer of at least 1", example: "'60'", help: "Time between planned milk runs with fixed scheduling.", effect: "Defines intended recurrence.", errors: "Zero or negative intervals are rejected."}
          station_id: {label: "Station", required: true, format: "Selection of an existing station", example: "ST-01", help: "Adds the station as a new milk-run stop.", effect: "The station is visited in the specified order.", errors: "Unknown stations or stations in another warehouse are rejected."}
          dwell_minutes: {label: "Dwell time in minutes", required: true, format: "Integer of at least 0", example: "'5'", help: "Planned time for handover, loading or unloading at the stop.", effect: "Contributes to tour timing.", errors: "Negative values are invalid."}
          source_location_prefix: {label: "Replenishment source prefix", required: true, format: "Beginning of a bin code", example: "RESERVE-", help: "Defines the source area permitted for replenishment.", effect: "Replenishment searches only matching bins for stock.", errors: "No order can be created without matching available stock."}
          minimum_quantity: {label: "Minimum quantity", required: true, format: "Integer of at least 0", example: "'10'", help: "Replenishment is needed below this target-bin stock.", effect: "Acts as the policy trigger threshold.", errors: "Negative values are invalid; a value above target quantity is contradictory."}
          target_quantity: {label: "Target quantity", required: true, format: "Positive integer", example: "'50'", help: "Stock level to which the target bin should be replenished.", effect: "Target minus current stock determines replenishment quantity.", errors: "Must be greater than minimum quantity and zero."}
        actions:
          create_order: {label: "Create transport order", description: "Validates route, stock dimensions and priority and creates an open order.", result: "The order appears in the control center and can be assigned."}
          assign: {label: "Assign", description: "Binds an available resource to an open order.", result: "State changes idempotently from open to assigned."}
          start: {label: "Start", description: "Confirms acceptance of an assigned order.", result: "State changes to started; starting again is not permitted."}
          complete: {label: "Confirm", description: "Completes the started order and performs stock posting when applicable.", result: "State changes to completed; posting errors leave the order incomplete."}
          create_configuration: {label: "Create resource or rule", description: "Stores a resource, transport rule, station or milk run after area validation.", result: "The configuration is available for new orders after successful creation."}
          add_stop: {label: "Add stop", description: "Adds station, sequence and dwell time to a milk run.", result: "The tour can be dispatched once at least two stops exist."}
          dispatch_milk_run: {label: "Dispatch tour", description: "Creates transport orders for the configured stop sequence.", result: "The number of orders is confirmed; dispatching again creates a new run."}
          create_replenishment_policy: {label: "Create replenishment policy", description: "Stores product, target, source prefix and quantity thresholds.", result: "The policy appears as manually triggerable replenishment configuration."}
          trigger_replenishment: {label: "Trigger replenishment", description: "Determines demand and available source stock from the policy.", result: "An open order is created when needed; missing stock produces an error."}
          complete_replenishment: {label: "Confirm replenishment", description: "Confirms the open replenishment and posts its quantity.", result: "The order completes and target stock is updated; repetition is excluded."}
        image:
          src: /assets/images/handbook/fulfillment/internal-transport.svg
          alt: Internal transport control center with orders, resources, milk runs and replenishment
      outbound_orders:
        template: outbound/order/orders.html.twig
        title: Outbound orders
        purpose: The overview shows customer orders with reference, recipient address and state and links to creation or process details.
        navigation: Outbound → Orders
        permissions: ["outbound.order.read; outbound.order.write for creation."]
        overview:
        - The table shows order number, customer reference, recipient address and current state. Open leads to release, reservation, allocation and handover to picking.
        - The empty state means that no order exists in the active tenant; this view currently has no search, filters or pagination.
        actions:
          create: {label: "Create order", description: "Opens a separate form for references, delivery address, product and quantity.", result: "After saving the order appears in created or imported state."}
          open: {label: "Open", description: "Opens lines, reservations and the next permitted process actions.", result: "Navigation itself does not change data."}
        image: {src: "/assets/images/handbook/outbound/orders-overview.svg", alt: "Outbound order overview with state and open action"}
      outbound_order_create:
        template: outbound/order/order_new.html.twig
        title: Create outbound order
        purpose: The form creates a customer order with its first product line as the basis for reservation and picking.
        navigation: Outbound → Orders → Create order
        permissions: ["outbound.order.write; the product must exist in the active tenant."]
        overview: ["Verify external references, the complete recipient address and quantity before saving. The address is retained as a document snapshot even if master data changes later. Further processing starts only after separate order release."]
        fields:
          order_number: {label: "Order number", required: true, format: "Document code unique in the tenant", example: "SO-2026-0815", help: "Use the external ERP number or a controlled internal number.", effect: "Identifies the order in every downstream process.", errors: "Empty or previously used numbers are rejected."}
          customer_reference: {label: "Customer reference", required: true, format: "Unique customer or recipient reference", example: "CUSTOMER-DE-1000", help: "Must permit functional assignment for shipping and enquiries.", effect: "Appears in overview and order details.", errors: "An empty reference prevents creation."}
          recipient_name: {label: "Recipient/company", required: true, format: "Full goods-recipient name", example: "Example Trading Ltd", help: "Enter the company or person to whom the warehouse must ship.", effect: "Stored as an immutable delivery-address snapshot on the order.", errors: "An empty name or one longer than 160 characters is rejected."}
          recipient_street: {label: "Street and number", required: true, format: "Complete delivery street address", example: "Customer Street 24", help: "Use the actual delivery address rather than automatically using a billing address.", effect: "Defines the order-specific shipping address.", errors: "An empty street or one longer than 255 characters is rejected."}
          recipient_postal_code: {label: "Postal code", required: true, format: "Postal code in the country's customary format", example: "50667", help: "Enter the postal code without the city.", effect: "Forms part of the documented delivery address.", errors: "An empty postal code or one longer than 32 characters is rejected."}
          recipient_city: {label: "City", required: true, format: "Full city name", example: "Cologne", help: "Use the city of the actual delivery address.", effect: "Forms part of the documented delivery address.", errors: "An empty city or one longer than 120 characters is rejected."}
          recipient_country_code: {label: "Country code", required: true, format: "ISO 3166-1 alpha-2, exactly two letters", example: "DE", help: "Use the two-letter country code of the delivery destination.", effect: "Normalized and stored in uppercase.", errors: "Values other than exactly two letters are rejected."}
          product_id: {label: "Product", required: true, format: "Selection of an existing product", example: "SKU-4711", help: "Verify SKU and description against customer demand.", effect: "Creates the first order line and later stock reservation.", errors: "Unknown or cross-tenant products are rejected."}
          quantity: {label: "Quantity", required: true, format: "Positive integer in the product base unit", example: "'10'", help: "Enter the quantity actually requested.", effect: "Determines reservation, allocation and pick demand.", errors: "Zero, negative or non-numeric values are invalid."}
        actions:
          save: {label: "Create order", description: "Validates references, recipient address, product and quantity and atomically creates order and line.", result: "Order details open with the stored delivery address for review and release."}
          cancel: {label: "Cancel", description: "Discards unsaved input.", result: "No order is created."}
        image: {src: "/assets/images/handbook/outbound/order-create.svg", alt: "Form for creating an outbound order"}
      outbound_order_detail:
        template: outbound/order/order.html.twig
        title: Release, reserve and allocate order
        purpose: The detail view takes an order from release through automatic or manual stock allocation to its pick list.
        navigation: Outbound → Orders → Open
        permissions: ["outbound.order.read/release; inventory.allocation.write; inventory.selection.execute; fulfillment.pick.write depending on action."]
        overview:
        - The order header shows the recipient and delivery address stored at creation time. Each line shows requested, reserved, allocated and fulfilled quantities plus available stock dimensions. Order state limits offered actions.
        - Release reserves demand. Fully allocated released orders can create exactly one pick list; an existing pick list is linked directly.
        fields:
          rule_id: {label: "Selection rule", required: true, format: "Active rule matching product and warehouse", example: "FIFO-WH1", help: "Verify strategy, warehouse and priority before execution.", effect: "Automatically allocates all remaining quantity using this rule.", errors: "No matching rule or insufficient stock prevents full allocation."}
          location_id: {label: "Bin ID", required: true, format: "Hidden UUID of the displayed stock row", example: "018f2f5a-73ad-7c42-9d84-2dcb65bcb410", help: "Taken from the selected stock row and must not be manipulated.", effect: "Binds manual allocation to the concrete bin.", errors: "Unknown or cross-tenant bins are rejected."}
          stock_status: {label: "Stock status", required: true, format: "Hidden state of the stock row", example: "available", help: "Must match actually available stock.", effect: "Reserves only stock of this quality.", errors: "Blocked or differing state prevents allocation."}
          batch_number: {label: "Batch", required: false, format: "Hidden exact batch of the stock row", example: "LOT-20261002", help: "Keeps manual selection batch-specific.", effect: "Allocates stock only from this batch.", errors: "A batch no longer available causes a conflict."}
          serial_number: {label: "Serial number", required: false, format: "Hidden unique serial number", example: "SN-0001842", help: "Serial stock is allocated by unit with quantity one.", effect: "Reserves the concrete unit.", errors: "Already reserved or moved serial numbers are rejected."}
          expires_at: {label: "Expiry date", required: false, format: "Hidden date of the stock dimension", example: "'2028-10-31'", help: "Secures the displayed FEFO-relevant stock choice.", effect: "Belongs to the unique allocation dimension.", errors: "Stock changed in parallel causes a conflict."}
          quantity: {label: "Allocation quantity", required: true, format: "Integer from 1 to the lower of remaining or available quantity", example: "'5'", help: "Only quantity one is allowed for serial numbers.", effect: "Atomically increases allocated reservation quantity.", errors: "Excess, short stock or concurrent allocation prevents posting."}
          code: {label: "Pick-list code", required: true, format: "Unique code prefilled with PICK plus order number", example: "PICK-SO-2026-0815", help: "Verify uniqueness and numbering convention before creation.", effect: "Identifies the new pick list throughout fulfilment.", errors: "Empty or duplicate codes are rejected."}
        actions:
          release: {label: "Release and reserve order", description: "Validates master data and creates demand reservations for every line.", result: "Order changes to released; errors create no partial reservations."}
          auto_allocate: {label: "Automatically allocate remainder", description: "Applies the selected rule to open quantity.", result: "Suitable stock dimensions are bound atomically and shortages remain visible."}
          allocate: {label: "Allocate", description: "Manually binds entered quantity of the displayed stock dimension.", result: "Reserved, allocated and available values are recalculated immediately."}
          create_pick_list: {label: "Create pick list", description: "Hands a fully allocated released order to picking.", result: "Exactly one open pick list is created and linked."}
        image: {src: "/assets/images/handbook/outbound/order-detail.svg", alt: "Order details with release and automatic and manual allocation"}
      picking_overview:
        template: outbound/picking/index.html.twig
        title: Pick-list overview
        purpose: The overview brings together all pick lists with order reference, processing state, progress and current assignment.
        navigation: Outbound → Picking
        permissions: ["fulfillment.pick.read"]
        overview:
        - Each card shows pick-list code, state, order number, completed and total tasks and the assigned employee.
        - Unassigned lists remain visibly open. The view currently has no search, filters or pagination.
        actions:
          open: {label: "Open", description: "Opens the operational pick list with route, scan fields and shortage action.", result: "Navigation changes neither state nor assignment."}
        image: {src: "/assets/images/handbook/outbound/picking-overview.svg", alt: "Pick-list overview with state, progress and employee assignment"}
      picking_control:
        template: outbound/picking/control.html.twig
        title: Picking control centre and wave planning
        purpose: The control centre plans pick waves, bundles pick lists by strategy and monitors progress, shortages and two-stage consolidation.
        navigation: Outbound → Picking control centre
        permissions: ["fulfillment.pick.control for reading; fulfillment.pick.wave.write for planning, release and consolidation."]
        overview:
        - Wave cards show strategy, order and pick-list counts, state and achieved progress. The live control centre adds employee, container and shortage information.
        - A planned wave must be released before operational processing. Two-stage waves additionally require consolidation after picking is complete.
        fields:
          code: {label: "Wave code", required: true, format: "Code unique in the tenant", example: "WAVE-2026-0042", help: "Use a traceable code that follows the operational numbering convention.", effect: "Identifies the wave in the control centre and subsequent actions.", errors: "Empty or previously used codes are rejected."}
          name: {label: "Wave name", required: true, format: "Understandable short name", example: "Late collection carrier north", help: "Describe the purpose, shift or collection window of the bundle.", effect: "Makes dispatching and operational assignment easier.", errors: "An empty name prevents creation."}
          strategy: {label: "Strategy", required: true, format: "single_order, multi_order or two_stage", example: "multi_order", help: "Single order keeps orders separate; multi-order bundles orders; two-stage separates batch picking and consolidation.", effect: "Determines workflow, container use and required follow-up actions.", errors: "An unsuitable strategy cannot be changed operationally without replanning."}
          selection_type: {label: "Selection type", required: true, format: "manual, time, tour, carrier or priority", example: "carrier", help: "Choose the criterion by which pick lists are functionally bundled.", effect: "Defines the meaning of the optional filter value.", errors: "An unsupported criterion is rejected."}
          selection_value: {label: "Filter value", required: false, format: "Value matching the selection type", example: "DHL", help: "Leave empty for manual selection; otherwise enter a time window, tour, carrier or priority, for example.", effect: "Documents and limits the functional selection of the wave.", errors: "A value that does not match the selection type produces no meaningful bundle."}
          priority: {label: "Priority", required: true, format: "Integer from 1 to 999", example: "50", help: "Use the agreed priority scheme of the control centre.", effect: "Influences the processing sequence of the wave.", errors: "Values outside the range or non-numeric input are invalid."}
          planned_start_at: {label: "Planned start", required: false, format: "Local date and time", example: "2026-10-03 14:30", help: "Set only when the wave is bound to a concrete processing window.", effect: "Makes planned operational release traceable in time.", errors: "Invalid date values cannot be processed."}
          pick_list_ids: {label: "Pick lists", required: true, format: "Multiple selection of available pick lists", example: "PICK-SO-0815 and PICK-SO-0816", help: "Select all functionally related lists; use Ctrl or Cmd to select multiple entries.", effect: "Assigns the selected lists to exactly this wave.", errors: "No selection or lists bound in the meantime prevent wave creation."}
        actions:
          create_wave: {label: "Plan wave", description: "Validates header data and pick-list selection and creates a planned wave.", result: "The wave appears with its lists in the control centre and progress indicator."}
          release_wave: {label: "Release wave", description: "Releases a planned wave for operational processing.", result: "State changes to released; repetition is not required."}
          open_pick_list: {label: "Open pick list", description: "Moves from the live control centre to the operational scanning view.", result: "Navigation does not change process state."}
          consolidate: {label: "Consolidate", description: "Confirms merging a fully picked list in a two-stage wave.", result: "Consolidation state advances and the list is prepared for the next process."}
        image: {src: "/assets/images/handbook/outbound/picking-control.svg", alt: "Picking control centre with wave planning, progress and consolidation"}
      picking_detail:
        template: outbound/picking/show.html.twig
        title: Scan and complete pick list
        purpose: The operational view guides the picker in optimised order through bin, product, batch, serial-number and quantity scans up to handover to packing.
        navigation: Outbound → Picking → Open pick list
        permissions: ["fulfillment.pick.read; fulfillment.pick.assign for self-assignment; fulfillment.pick.optimize for route sorting; fulfillment.pick.execute for scans and shortages; fulfillment.pack.write for packing handover."]
        overview:
        - Each task shows sequence, bin, SKU, target quantity and state. Scan fields appear only to the assigned employee for an open task.
        - Bin and product are always validated; batch and serial number only for correspondingly managed stock. Exactly one packing order can be created after complete picking.
        fields:
          location: {label: "Bin scan", required: true, format: "Exact code of the displayed bin", example: "WH1-PICK-01-02", help: "Scan the physical bin first and compare the display with its label.", effect: "Confirms that withdrawal takes place at the intended source.", errors: "A differing bin blocks confirmation."}
          product: {label: "Product scan", required: true, format: "Exact SKU or permitted product barcode", example: "SKU-4711", help: "Scan the withdrawn product, not the shelf label.", effect: "Prevents picking the wrong product.", errors: "An SKU that does not match the task is rejected."}
          batch: {label: "Batch scan", required: false, format: "Exact expected batch", example: "LOT-20261002", help: "The field appears for a batch-managed task and must be scanned from the product.", effect: "Binds withdrawal to the allocated batch.", errors: "Missing or differing batches prevent posting."}
          serial: {label: "Serial-number scan", required: false, format: "Exact unique serial number", example: "SN-0001842", help: "The field appears for serial-managed stock; scan each unit uniquely.", effect: "Confirms the specifically allocated unit.", errors: "Wrong, previously used or duplicate serial numbers are rejected."}
          quantity: {label: "Pick quantity", required: true, format: "Positive integer up to the open target quantity", example: "5", help: "Accept the target quantity only if it is physically complete; serial numbers are posted by unit.", effect: "Posts the confirmed quantity from the task and updates progress.", errors: "Zero, excess or a quantity incompatible with serial management is invalid."}
          note: {label: "Shortage note", required: true, format: "Automatically set note", example: "Short stock via mobile device", help: "The view sets a fixed origin note when a shortage is reported.", effect: "Documents the source path of the exceptional confirmation.", errors: "The note must not be used as a regular pick confirmation."}
          code: {label: "Packing-order code", required: true, format: "Unique code prefilled with PACK plus pick-list code", example: "PACK-PICK-SO-2026-0815", help: "Verify the proposed code against the operational numbering convention.", effect: "Creates and identifies the packing order for this pick list.", errors: "Empty or duplicate codes prevent handover."}
        actions:
          assign: {label: "Assign to me and start", description: "Binds the open pick list to the signed-in employee and starts processing.", result: "Scan fields become available for the employee's own open tasks."}
          optimize: {label: "Optimise route", description: "Reorders open tasks using the warehouse structure.", result: "Sequence numbers represent the optimised walking order."}
          scan: {label: "Scan and pick", description: "Validates bin, product, optional stock characteristics and quantity and posts withdrawal.", result: "The task advances or completes and progress updates."}
          shortage: {label: "Report shortage", description: "Confirms an open task through the exception path with a fixed mobile-device note.", result: "The shortage becomes visible to the control centre and further dispatching."}
          create_packing: {label: "Create packing order", description: "Hands a fully completed pick list to packing with a unique code.", result: "The packing order is created and linked directly afterwards."}
        image: {src: "/assets/images/handbook/outbound/picking-detail.svg", alt: "Operational pick list with scan validation, shortage and packing handover"}
      packing_overview:
        template: outbound/packing/index.html.twig
        title: Packing-order overview
        purpose: The packing station shows all packing orders created from completed pick lists with state, order reference, package count and total weight.
        navigation: Outbound → Packing
        permissions: ["fulfillment.pack.read"]
        overview:
        - Each card shows packing-order code, state, customer order, number of sealed packages and their combined weight.
        - An empty state means that no released and fully picked list has yet been handed to packing. Search, filters and pagination are currently unavailable.
        actions:
          open: {label: "Open packing order", description: "Opens packages, unpacked pick tasks, measurement and shipping handover.", result: "Opening changes neither state nor package contents."}
        image: {src: "/assets/images/handbook/outbound/packing-overview.svg", alt: "Packing-order overview with state, package count and total weight"}
      packing_detail:
        template: outbound/packing/show.html.twig
        title: Build packages and complete packing order
        purpose: The packing view assigns picked tasks to uniquely identified packages, captures actual weight, supports subsequent measurement and hands the completed order to shipping.
        navigation: Outbound → Packing → Open packing order
        permissions: ["fulfillment.pack.read; fulfillment.pack.write for sealing; fulfillment.pack.execute for completion; integration.measurement.capture for measurement; fulfillment.ship.write for shipping handover."]
        overview:
        - The package table shows number, weight, optional dimensions, state and contained pick-task count. Measurement adds or corrects weight and dimensions through the measurement workflow.
        - While tasks remain open, they are assigned to a new package. The packing order can be completed only after every task is packed and at least one package exists.
        - After completion, shipment number, carrier and service create exactly one prepared shipment; an existing shipment is linked directly.
        fields:
          package_number: {label: "Package number", required: true, format: "Code unique within the packing order", example: "PKG-PACK-PICK-SO-0815-1", help: "Verify the prefilled code against the physical package label and numbering convention.", effect: "Identifies the sealed package in measurement, printing and shipping.", errors: "Empty or duplicate package numbers are rejected."}
          weight_grams: {label: "Weight in grams", required: true, format: "Positive integer within the configured package limit", example: "3150", help: "Weigh the fully packed package including packaging material and enter grams without decimals.", effect: "Contributes to total weight, carrier validation and weight restrictions.", errors: "Zero, negative, non-numeric values or values above the active package limit prevent sealing."}
          pick_task_id: {label: "Pick tasks", required: true, format: "Multiple selection of unpacked pick tasks", example: "SKU-4711 quantity 2 and SKU-815 quantity 1", help: "Clear the checkbox for tasks not physically contained in this package. At least one task must remain selected.", effect: "Assigns each selected pick task to exactly this package and removes it from the unpacked quantity.", errors: "No selection, unknown or already packed tasks prevent sealing."}
          shipment_number: {label: "Shipment number", required: true, format: "Shipment code unique in the tenant", example: "SHIP-PACK-PICK-SO-0815", help: "Use the prefilled number or the agreed internal or ERP number.", effect: "Identifies the prepared shipment in shipping, tracking and loading.", errors: "Empty or previously used numbers prevent creation."}
          carrier: {label: "Carrier", required: true, format: "Carrier code matching an active connection", example: "DHL", help: "Enter the exact code of the configured carrier connection; DEMO is intended only for test workflows.", effect: "Determines which connection later creates the label and tracking data.", errors: "An unknown code may permit only manual label registration."}
          service: {label: "Shipping service", required: true, format: "Service code available from the carrier", example: "STANDARD", help: "Choose the service agreed for order and carrier, such as STANDARD or EXPRESS.", effect: "Is passed to label generation and shipment processing.", errors: "Empty services or services unsupported by the carrier fail no later than label request."}
        actions:
          measure: {label: "Measure", description: "Opens measurement capture for the existing package.", result: "Weight and dimensions are displayed on the package after successful capture."}
          seal_package: {label: "Seal package", description: "Validates number, weight and selected pick tasks and forms a uniquely identified package.", result: "The package appears in the table; contained tasks are no longer open."}
          complete: {label: "Complete packing order", description: "Completes the order once all pick tasks are packed and packages exist.", result: "The packing order changes to completed and becomes available for shipment preparation."}
          create_shipment: {label: "Create shipment", description: "Creates a prepared shipment from completed packing order, shipment number, carrier and service.", result: "Shipment details open for label, printing and handover."}
          open_shipment: {label: "Open shipment", description: "Opens the shipment already linked to the packing order.", result: "Navigation creates no additional shipment."}
        image: {src: "/assets/images/handbook/outbound/packing-detail.svg", alt: "Packing order with package creation, weight, measurement and shipping handover"}
      shipping_overview:
        template: outbound/shipping/index.html.twig
        title: Shipment overview
        purpose: The overview tracks prepared, labelled and dispatched shipments with carrier, service and tracking number.
        navigation: Outbound → Shipping
        permissions: ["fulfillment.ship.read"]
        overview:
        - Each row shows shipment number, carrier, service, state and available tracking number. Open leads to label generation, printing and carrier handover.
        - The empty state means no completed packing order has yet been handed to shipping; search, filters and pagination are currently unavailable.
        actions:
          open: {label: "Open", description: "Opens the selected shipment with the currently permitted shipping actions.", result: "Navigation does not change shipment state."}
        image: {src: "/assets/images/handbook/outbound/shipping-overview.svg", alt: "Shipment overview with carrier, service, state and tracking number"}
      shipping_detail:
        template: outbound/shipping/show.html.twig
        title: Shipping label, printing and carrier handover
        purpose: Shipment details generate or register a label, print it through an active printer and then confirm physical handover.
        navigation: Outbound → Shipping → Open shipment
        permissions: ["fulfillment.ship.read; integration.carrier.execute for carrier labels; fulfillment.ship.label for manual labels; integration.print_job.write for printing; fulfillment.ship.dispatch for handover."]
        overview:
        - In prepared state, an active carrier connection can request a label automatically, or tracking and label reference can be registered manually.
        - In labelled state, label printing and carrier handover become available. Existing print jobs, tracking number and label reference remain visible.
        fields:
          tracking_number: {label: "Tracking number", required: true, format: "Unique shipment tracking number assigned by the carrier", example: "00340434161094000000", help: "For manual registration, copy it exactly from the carrier portal.", effect: "Enables tracking and, together with the label reference, changes the shipment to labelled.", errors: "Empty or contradictory numbers prevent registration."}
          label_reference: {label: "Label reference", required: true, format: "Securely accessible document reference or internal path", example: "carrier-labels/SHIP-0815.zpl", help: "Reference the label that actually belongs to the tracking number.", effect: "Serves as the source for the later print job.", errors: "A missing reference prevents label registration and printing."}
          printer_id: {label: "Printer", required: true, format: "Selection of an active configured printer", example: "ZEBRA-PACK-01", help: "Choose the printer at the physical shipping or packing station.", effect: "Queues one ZPL carrier-label copy for printing.", errors: "Inactive, unknown or unreachable printers cause a failed print job."}
          handover_reference: {label: "Handover reference", required: true, format: "Carrier receipt, scan or collection reference", example: "DHL-PICKUP-20261003-42", help: "Enter only after physical handover or confirmed collection scan.", effect: "Marks the shipment as dispatched and records proof of handover.", errors: "An empty reference or an unlabelled shipment cannot be dispatched."}
        actions:
          request_carrier_label: {label: "Request label from carrier", description: "Retrieves label and tracking number idempotently through the active carrier connection.", result: "The data is registered and the shipment changes to labelled."}
          register_label: {label: "Register label", description: "Manually registers an externally generated tracking number and label reference.", result: "The shipment is labelled for printing and handover."}
          print_label: {label: "Create print job", description: "Sends the registered label in ZPL format to the selected printer.", result: "A traceable print job appears for the shipment."}
          dispatch: {label: "Mark as dispatched", description: "Confirms physical carrier handover with a reference.", result: "The shipment changes to dispatched state."}
        image: {src: "/assets/images/handbook/outbound/shipping-detail.svg", alt: "Shipment details with label registration, printer selection and handover confirmation"}
      loading_overview:
        template: outbound/loading/index.html.twig
        title: Loading overview
        purpose: The overview groups loading manifests by route and vehicle and shows current loading progress.
        navigation: Outbound → Loading
        permissions: ["fulfillment.loading.read; fulfillment.loading.write for creation."]
        overview:
        - Each row shows manifest code, tour, vehicle, state and the ratio of loaded to planned shipments.
        - Open leads to scan confirmation of individual shipments; new manifests require write permission.
        actions:
          create: {label: "Create loading manifest", description: "Opens selection of labelled shipments not yet assigned.", result: "Data changes only after saving the subsequent form."}
          open: {label: "Open", description: "Opens the loading list and its progress.", result: "Opening does not change loading state."}
        image: {src: "/assets/images/handbook/outbound/loading-overview.svg", alt: "Loading overview with route, vehicle, state and progress"}
      loading_create:
        template: outbound/loading/new.html.twig
        title: Create loading manifest
        purpose: The form assigns one or more labelled and unplanned shipments to a route and vehicle.
        navigation: Outbound → Loading → Create loading manifest
        permissions: ["fulfillment.loading.write"]
        overview:
        - Only shipments available for loading are offered. Creation remains blocked without at least one selection.
        fields:
          code: {label: "Manifest number", required: true, format: "Manifest code unique in the tenant", example: "LOAD-2026-0042", help: "Use the agreed numbering convention for the tour or collection.", effect: "Identifies the manifest and loading list.", errors: "Empty or duplicate codes prevent creation."}
          tour_reference: {label: "Route", required: true, format: "Unique tour or route reference", example: "TOUR-NORTH-03", help: "Must match the planned delivery sequence or collection.", effect: "Groups shipments under the intended route.", errors: "An empty route prevents saving."}
          vehicle_reference: {label: "Vehicle", required: true, format: "Registration or operational vehicle identifier", example: "HH-WMS-42", help: "Verify vehicle, capacity and actual availability before assignment.", effect: "Records the vehicle onto which shipments are loaded.", errors: "An empty vehicle reference prevents creation."}
          shipment_id: {label: "Shipments", required: true, format: "Multiple selection of labelled, unplanned shipments", example: "SHIP-0815 and SHIP-0816", help: "Select only shipments physically staged for this route.", effect: "Binds every selection to the new manifest and removes it from free loading selection.", errors: "No selection or a shipment assigned in the meantime prevents creation."}
        actions:
          save: {label: "Create manifest", description: "Validates header data and shipment selection and creates the open loading list.", result: "Manifest details open for scan-based loading."}
          cancel: {label: "Cancel", description: "Discards the unsaved grouping.", result: "Shipments remain freely available."}
        image: {src: "/assets/images/handbook/outbound/loading-create.svg", alt: "Form for manifest number, route, vehicle and shipment selection"}
      loading_detail:
        template: outbound/loading/show.html.twig
        title: Load shipments and complete manifest
        purpose: The loading list confirms every planned shipment individually and permits completion only after full loading.
        navigation: Outbound → Loading → Open manifest
        permissions: ["fulfillment.loading.read; fulfillment.loading.execute for loading confirmation and completion."]
        overview:
        - The table shows shipment number, carrier, service, tracking number, state and loading time where available. The counter compares loaded and planned shipments.
        - Only pending shipments of an open or loading manifest can be confirmed. Completion appears only when every shipment is loaded.
        actions:
          confirm_loading: {label: "Confirm loading", description: "Confirms the physical shipment on the intended vehicle.", result: "The shipment changes to loaded and receives a loading timestamp."}
          complete: {label: "Complete loading", description: "Closes the fully loaded manifest against further changes.", result: "The manifest changes to completed state."}
        image: {src: "/assets/images/handbook/outbound/loading-detail.svg", alt: "Loading manifest with shipment states, loading progress and completion action"}
      outbound_control:
        template: outbound/order/control.html.twig
        title: Outbound control centre
        purpose: The control centre combines demand and shortage visibility, order cancellation, outbound quality, shipping rules, tracking, tours, weight constraints and immutable shipping documents.
        navigation: Outbound → Control centre
        permissions: ["outbound.order.read; outbound.order.write for cancellation; fulfillment.pack.execute for quality; fulfillment.ship.write for rules, tracking and documents; fulfillment.loading.write for tours and weight constraints."]
        overview:
        - Demand forecast and order review show demand, stock, shortage and open orders. Cancellation is possible only in imported state with a reason.
        - Outbound quality decides release or hold from completeness, condition and customer requirements.
        - Shipping and tracking configure weight ranges per carrier service and record events with location and time. Tours group stops under vehicle and weight constraints.
        - Shipping documents are assigned to an existing aggregate, generated with safe HTML, archived with a checksum and then provided read-only.
        fields:
          reason: {label: "Cancellation reason", required: true, format: "Traceable functional text", example: "Customer cancellation before release", help: "Describe the trigger so audit and customer service can understand it.", effect: "Is audited with the cancelled imported order.", errors: "Empty text or an order already processed further cannot be cancelled."}
          pick_list_id: {label: "Inspected pick list", required: true, format: "Selection of a completed quality candidate", example: "PICK-SO-0815", help: "Compare physical goods with order and pick list before deciding.", effect: "Binds all inspection results to exactly this pick list.", errors: "Unknown, incomplete or already decided pick lists are rejected."}
          completeness_passed: {label: "Completeness confirmed", required: false, format: "Checkbox", example: "enabled", help: "Enable only when every target line and quantity is present.", effect: "Contributes to release or hold decision.", errors: "Unconfirmed completeness causes a hold."}
          condition_passed: {label: "Condition flawless", required: false, format: "Checkbox", example: "enabled", help: "Check goods and packaging for damage and quality deviations.", effect: "Records the condition check.", errors: "A negative check prevents packing release."}
          customer_check_passed: {label: "Customer requirements met", required: false, format: "Checkbox", example: "enabled", help: "Check labelling, documents and customer-specific packing instructions.", effect: "Records fulfilment of customer-specific requirements.", errors: "Unmet requirements cause a hold."}
          note: {label: "Inspection or hold note", required: false, format: "Free text", example: "Outer carton damaged, goods intact", help: "Record deviations and required follow-up work concretely.", effect: "Appears in quality history and explains the decision.", errors: "Vague notes make rework difficult."}
          code: {label: "Rule or tour code", required: true, format: "Code unique in its area", example: "DHL-STD-31500", help: "Use a stable numbering convention for shipping rule or tour.", effect: "Identifies the new shipping rule or tour.", errors: "Empty or duplicate codes are rejected.", usages: ["Shipping rule and tour"]}
          name: {label: "Rule name", required: true, format: "Understandable name", example: "DHL Standard up to 31.5 kg", help: "Summarise carrier, service and weight range clearly.", effect: "Appears in the active shipping-method list.", errors: "An empty name prevents rule creation."}
          carrier: {label: "Carrier", required: true, format: "Exact carrier code", example: "DHL", help: "Must match shipping rule or tour and an available connection.", effect: "Assigns the rule or tour to the carrier.", errors: "Empty or unknown codes prevent later automation.", usages: ["Shipping rule and tour"]}
          service: {label: "Service", required: true, format: "Carrier service code", example: "STANDARD", help: "Enter the service valid at the carrier.", effect: "The shipping rule selects this service in its weight range.", errors: "Unsupported services fail on label request."}
          min_weight_grams: {label: "Minimum weight", required: true, format: "Integer from 0 in grams", example: "0", help: "Set the inclusive lower boundary of the shipping rule.", effect: "Limits the rule from below.", errors: "Negative values or overlaps are functionally invalid."}
          max_weight_grams: {label: "Maximum weight", required: true, format: "Positive integer in grams", example: "31500", help: "Must exceed minimum weight and match carrier, vehicle or tour limits.", effect: "Limits shipping rule, tour or weight constraint.", errors: "Zero, negative or contradictory limits are rejected.", usages: ["Shipping rule, tour and weight constraint"]}
          priority: {label: "Priority", required: true, format: "Integer", example: "100", help: "Use a consistent scheme for ordering matching shipping rules.", effect: "Decides rule selection when several rules match.", errors: "Unsuitable priorities may prefer the wrong rule."}
          shipment_id: {label: "Shipment", required: false, format: "Selection of an existing shipment", example: "SHIP-0815", help: "Required for tracking; optional for a tour stop without shipment.", effect: "Binds event or tour stop to the shipment.", errors: "Unknown or cross-tenant shipments are rejected.", usages: ["Tracking event and optional tour stop"]}
          status: {label: "Tracking state", required: true, format: "External or internal state code", example: "in_transit", help: "Enter the carrier state unchanged and unambiguously.", effect: "Adds to chronological tracking history.", errors: "An empty state prevents capture."}
          location: {label: "Tracking location", required: false, format: "Location or hub", example: "Hamburg parcel centre", help: "Enter only when the event has a reliable location.", effect: "Adds spatial context to the state.", errors: "Free text is not validated as a master-data location."}
          occurred_at: {label: "Event time", required: true, format: "Local date and time", example: "2026-10-03 18:45", help: "Use the actual carrier time, not capture time.", effect: "Sorts tracking history chronologically.", errors: "Empty or invalid date values are rejected."}
          description: {label: "Event description", required: true, format: "Short understandable text", example: "Processed at origin parcel centre", help: "Explain the state clearly for service and recipient.", effect: "Adds context to the technical tracking state.", errors: "An empty description prevents saving."}
          vehicle_reference: {label: "Vehicle", required: true, format: "Registration or vehicle identifier", example: "HH-WMS-42", help: "Plan only an available vehicle with sufficient capacity.", effect: "Assigns the tour to the vehicle.", errors: "An empty reference prevents tour creation."}
          departure_at: {label: "Planned departure", required: true, format: "Local date and time", example: "2026-10-04 06:00", help: "Coordinate with cut-off, driver and dock plan.", effect: "Defines the planned tour start.", errors: "Invalid time values are rejected."}
          destination_name: {label: "Recipient or stop name", required: true, format: "Understandable name", example: "Customer North Ltd", help: "Name the first tour stop unambiguously.", effect: "Creates the initial tour stop.", errors: "An empty name prevents tour creation."}
          destination_address: {label: "Destination address", required: true, format: "Complete deliverable address", example: "1 Sample Street, Hamburg 20095", help: "Enter street, number, postal code and city completely.", effect: "Defines the physical destination of the tour stop.", errors: "Empty or incomplete addresses jeopardise delivery."}
          scope: {label: "Scope", required: true, format: "package, carrier, vehicle or tour", example: "vehicle", help: "Choose the level at which the weight limit is checked.", effect: "Controls which objects use the active limit.", errors: "Other values are rejected."}
          reference_code: {label: "Optional reference", required: false, format: "Carrier, vehicle or tour code", example: "HH-WMS-42", help: "Leave empty for a global scope limit; set it for one concrete object.", effect: "Restricts the weight limit to the reference.", errors: "A mismatching reference leaves the rule ineffective."}
          document_type: {label: "Document type", required: true, format: "delivery_note, packing_list, loading_list or cmr", example: "cmr", help: "Choose the document type appropriate to process and recipient.", effect: "Classifies the immutable shipping document.", errors: "Types not offered are rejected."}
          aggregate_type: {label: "Reference type", required: true, format: "shipment, loading_manifest or tour", example: "shipment", help: "Determines the process object to which the document belongs.", effect: "Controls validation and archive assignment.", errors: "Unsupported reference types are rejected."}
          aggregate_id: {label: "Reference ID", required: true, format: "UUID of the existing process object", example: "018f2f5a-73ad-7c42-9d84-2dcb65bcb410", help: "Copy an ID matching the selected reference type from the system.", effect: "Immutably links the document to shipment, manifest or tour.", errors: "Unknown or cross-tenant IDs are rejected."}
          document_number: {label: "Document number", required: true, format: "Unique functional number", example: "CMR-2026-0042", help: "Follow operational or legal numbering rules.", effect: "Identifies the document in the archive.", errors: "Empty or duplicate numbers prevent generation."}
          title: {label: "Document title", required: true, format: "Short plain text", example: "CMR consignment note North tour", help: "Name purpose and reference clearly; HTML is safely escaped.", effect: "Is rendered as document title and heading.", errors: "An empty title prevents generation."}
          body: {label: "Document content", required: true, format: "Multiline plain text", example: "Sender, recipient, packages and instructions", help: "Enter all required shipping details completely; line breaks are retained.", effect: "Is safely converted to immutable HTML and protected by a checksum.", errors: "Empty content prevents generation; later changes require a new document."}
        actions:
          cancel_order: {label: "Cancel order", description: "Cancels an imported order with an audited reason.", result: "The order is removed from further processing."}
          quality_check: {label: "Complete quality check", description: "Stores three criteria and a note and decides release or hold.", result: "Only released pick lists may subsequently be packed."}
          create_shipping_rule: {label: "Activate shipping rule", description: "Stores carrier, service, weight range and priority.", result: "The rule is available for future shipping decisions."}
          record_tracking: {label: "Save tracking event", description: "Manually records state, location, time and description.", result: "The event appears chronologically and is available for feedback."}
          create_tour: {label: "Create tour", description: "Plans vehicle, departure, weight limit and first stop.", result: "The tour appears with planned load in the control centre."}
          create_weight_constraint: {label: "Activate weight constraint", description: "Stores a global or reference-specific active upper limit.", result: "Subsequent package, carrier, vehicle or tour checks use it."}
          generate_document: {label: "Generate document", description: "Validates reference and content and archives a safe immutable HTML version.", result: "The document appears with checksum in the archive and can be opened."}
        image: {src: "/assets/images/handbook/outbound/outbound-control.svg", alt: "Outbound control centre with demand, quality, shipping rules, tracking, tours and documents"}
    guidance:
      prerequisites:
      - Released order, available stock, packaging, carrier connection, print route and load plan.
      permissions:
      - outbound.order.*, fulfillment.pick.*, fulfillment.pack.*, fulfillment.ship.*, fulfillment.loading.* and fulfillment.transport.*.
      fields:
      - 'Order: customer_reference, destination, planned_for, product_id, quantity. Pick: list, assigned_to, scan, actual_quantity. Pack: note, weight and dimensions. Shipping: carrier,
        service, label, tracking. Loading: shipment_ids, vehicle, departure.'
      statuses:
      - Order draft/released/allocated; pick open/assigned/in_progress/completed; pack open/completed; shipment prepared/dispatched; manifest open/completed.
      errors:
      - Short stock, wrong scan, excess pick, incomplete package, carrier error, missing label or completed manifest blocks processing.
  integrations_and_devices:
    title: ERP, carriers, printers, scanners, measuring devices and WCS
    summary: Configure, test, monitor and securely operate external connections.
    sections:
      section_1:
        title: Configure connections
        paragraphs:
          paragraph_1: Define connection type, HTTPS endpoint, authentication reference, timeouts, retries and active state per tenant. Secrets are resolved only through environment
            references. Use the connection test before productive messages are sent.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Configure connections – screenshot placeholder
      section_2:
        title: ERP and data exchange
        paragraphs:
          paragraph_1: Mappings assign source and target fields plus transformations. Import jobs show format, resource type, row count, state and errors. Correct mapping or source data
            and restart failed jobs in a controlled manner.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: ERP and data exchange – screenshot placeholder
      section_3:
        title: Carriers and printing
        paragraphs:
          paragraph_1: Carrier connections generate labels and status queries. Printers define queue, format and connection. Review preview, target device and retry state before resending
            a job.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: 'Placeholder: integration connection and test'
      section_4:
        title: Scanners, scales and dimensioning
        paragraphs:
          paragraph_1: Register devices with unique code and type. Scans and measurements use a message ID for idempotent processing. Assign the correct site and verify unit, measuring
            range and timestamp.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Scanners, scales and dimensioning – screenshot placeholder
      section_5:
        title: WCS and automation
        paragraphs:
          paragraph_1: Automation commands contain target, command type, payload and state. Monitor acceptance, execution and technical errors. Only retry when the command is idempotent
            or otherwise uniquely protected.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: WCS and automation – screenshot placeholder
    views:
      erp_connections:
        template: integration/erp/index.html.twig
        title: ERP connections
        purpose: The overview lists all tenant-specific ERP endpoints used for outbound status messages.
        navigation: Integration → ERP connections
        permissions: ["integration.erp_connection.read; integration.erp_connection.write for creation."]
        overview:
        - Name, HTTPS endpoint, secret reference, active state and last change make configuration and operating state comparable. The table currently has no search or pagination.
        - An empty state means no ERP is connected. Open leads to detail and status control.
        actions:
          create: {label: "Create ERP connection", description: "Opens the separate connection form.", result: "No connection is registered until saving."}
          open: {label: "Open", description: "Shows endpoints, secret reference, state and audit data.", result: "State remains unchanged."}
        image: {src: "/assets/images/handbook/integration/erp-connections.svg", alt: "ERP connection overview with endpoint and active state"}
      erp_connection_create:
        template: integration/erp/new.html.twig
        title: Create ERP connection
        purpose: The form registers a signed HTTPS endpoint for status events of the active tenant.
        navigation: Integration → ERP connections → Create ERP connection
        permissions: ["integration.erp_connection.write"]
        overview: ["The secret itself remains in the runtime environment. WebWMS stores only the environment-variable name."]
        fields:
          name: {label: "Name", required: true, format: "Up to 100 characters", example: "ACME ERP production", help: "Name environment and target system unambiguously.", effect: "Appears in overview and audit context.", errors: "An empty name is rejected."}
          credential_env: {label: "Credential environment variable", required: true, format: "3–101 characters; uppercase letter followed by A–Z, 0–9 or underscore", example: "ERP_ACME_SIGNING_KEY", help: "Enter only the variable name, never a key or password.", effect: "The signing key is read from it at runtime.", errors: "A missing variable or invalid pattern prevents secure delivery."}
          endpoint_url: {label: "HTTPS base URL", required: true, format: "Complete HTTPS URL, up to 500 characters", example: "https://erp.example.com/integrations/webwms", help: "Provide a reachable base endpoint without secret or query token.", effect: "Status events are sent to the appended /status-events path.", errors: "HTTP, invalid URL, DNS, certificate or timeout errors prevent delivery."}
          active: {label: "Activate immediately", required: false, format: "Checkbox; enabled by default", example: "enabled", help: "Enable only when endpoint and secret are production-ready.", effect: "Active connections may receive messages immediately.", errors: "An active misconfiguration creates failed outbox deliveries."}
        actions:
          save: {label: "Create ERP connection", description: "Validates name, HTTPS endpoint and secret reference.", result: "The new connection detail opens."}
          cancel: {label: "Cancel", description: "Returns to the overview.", result: "No connection is created."}
        image: {src: "/assets/images/handbook/integration/erp-connection-create.svg", alt: "Form for ERP endpoint and secret reference"}
      erp_connection_detail:
        template: integration/erp/show.html.twig
        title: Monitor ERP connection
        purpose: The detail shows base and status endpoint, credential reference, operating state and audit data.
        navigation: Integration → ERP connections → Open
        permissions: ["integration.erp_connection.read; integration.erp_connection.write to activate or pause."]
        overview:
        - Creator, creation time and last state change with user are displayed. Delivery errors can be traced through the linked integration outbox.
        actions:
          toggle: {label: "Activate or pause connection", description: "Changes operating state after CSRF validation.", result: "Paused prevents new use; activation permits it again. The change is audited."}
          outbox: {label: "Integration outbox", description: "Opens outbound status messages and errors.", result: "The connection remains unchanged."}
        image: {src: "/assets/images/handbook/integration/erp-connection-detail.svg", alt: "ERP connection detail with status endpoint and audit data"}
      carrier_connections:
        template: integration/carrier/index.html.twig
        title: Carrier connections
        purpose: The overview manages integrations for shipping products, labels, tracking and manifest handover.
        navigation: Integration → Carrier connections
        permissions: ["integration.carrier_connection.read; integration.carrier_connection.write for creation."]
        overview:
        - Carrier code, name, endpoint, active state and change are shown in a table. It currently has no search or pagination.
        - Without entries no shipping provider is connected. Open leads to the detail.
        actions:
          create: {label: "Create carrier connection", description: "Opens the separate configuration form.", result: "No external communication occurs yet."}
          open: {label: "Open", description: "Shows connection, audit, state control and product retrieval.", result: "Opening changes no data."}
        image: {src: "/assets/images/handbook/integration/carrier-connections.svg", alt: "Carrier connections with code, endpoint and state"}
      carrier_connection_create:
        template: integration/carrier/new.html.twig
        title: Create carrier connection
        purpose: The form registers a shipping provider's HTTPS access without storing secrets in the database.
        navigation: Integration → Carrier connections → Create carrier connection
        permissions: ["integration.carrier_connection.write"]
        overview: ["Carrier code and credential reference must match gateway configuration and runtime environment."]
        fields:
          name: {label: "Name", required: true, format: "Up to 100 characters", example: "DHL production", help: "Name carrier and environment unambiguously.", effect: "Appears in selection and audit.", errors: "An empty name prevents creation."}
          carrier_code: {label: "Carrier code", required: true, format: "2–40 characters; A–Z, 0–9, underscore or hyphen", example: "DHL", help: "Use exactly the code supported by the carrier gateway.", effect: "Selects the technical carrier adapter.", errors: "Unknown or misspelled codes prevent product and label calls."}
          endpoint_url: {label: "HTTPS base URL", required: true, format: "HTTPS URL, up to 500 characters", example: "https://carrier.example.com/api", help: "Deliberately distinguish production and test URL.", effect: "Target for carrier calls.", errors: "HTTP, certificate, DNS or timeout errors are rejected or logged."}
          credential_env: {label: "Credential environment variable", required: true, format: "3–101 characters; A–Z, 0–9 and underscore", example: "DHL_API_TOKEN", help: "Store only the secret-variable name.", effect: "The adapter reads credentials at runtime.", errors: "Plain-text secrets, invalid names or missing runtime values are prohibited."}
          active: {label: "Activate immediately", required: false, format: "Checkbox; enabled by default", example: "enabled", help: "Enable only after URL and credential are available.", effect: "Permits shipping and product calls.", errors: "Misconfigurations fail on the first external call."}
        actions:
          save: {label: "Create carrier connection", description: "Validates all connection data and registers the adapter.", result: "The new detail opens."}
          cancel: {label: "Cancel", description: "Discards entries.", result: "No connection is created."}
        image: {src: "/assets/images/handbook/integration/carrier-connection-create.svg", alt: "Carrier configuration with code, HTTPS endpoint and credential"}
      carrier_connection_detail:
        template: integration/carrier/show.html.twig
        title: Monitor carrier connection
        purpose: The detail shows configuration, state and audit and offers live retrieval of shipping products.
        navigation: Integration → Carrier connections → Open
        permissions: ["integration.carrier_connection.read; integration.carrier_connection.write for state change; integration.carrier.read for products."]
        overview: ["Product retrieval is visible only for an active connection. Credential content is never displayed."]
        actions:
          products: {label: "Retrieve shipping products", description: "Requests the current product list live from the configured carrier.", result: "The product view shows the response; an error does not modify the connection."}
          toggle: {label: "Activate or pause", description: "Switches operational use in a controlled way.", result: "State, user and timestamp are saved."}
        image: {src: "/assets/images/handbook/integration/carrier-connection-detail.svg", alt: "Carrier detail with state, credential reference and product retrieval"}
      carrier_products:
        template: integration/carrier/products.html.twig
        title: Carrier shipping products
        purpose: The view shows product codes and names supplied live by the active carrier.
        navigation: Integration → Carrier connections → Open → Retrieve shipping products
        permissions: ["integration.carrier.read; the carrier connection must be active."]
        overview:
        - Product codes are used for shipping service and label generation. The table is a live response and has no local editing, search or pagination.
        - An empty list may mean the carrier provides no products; network, authentication and gateway failures are treated as retrieval errors.
        image: {src: "/assets/images/handbook/integration/carrier-products.svg", alt: "Live list of carrier shipping products"}
      data_exchange_overview:
        template: integration/exchange/index.html.twig
        title: Data exchange
        purpose: The central overview combines import and export jobs, field mappings, commerce connections and imported channel orders.
        navigation: Integration → Data exchange
        permissions: ["integration.exchange.read; integration.exchange.write for import, export, mapping and commerce connection."]
        overview:
        - Jobs show direction, format, resource, row count, state and time; mappings show system, message and field assignment; commerce channels show type and state; orders show external ID, connection, state and import time.
        - Every table has its own empty state but currently no search, sorting or pagination.
        actions:
          mapping: {label: "Create mapping", description: "Defines a field transformation for a system and message type.", result: "The mapping appears after saving."}
          commerce: {label: "Create commerce connection", description: "Registers a shop or marketplace channel.", result: "The channel appears in the connection list."}
          export: {label: "Export", description: "Opens format, resource and data selection.", result: "No file is created yet."}
          import: {label: "Import", description: "Opens file import.", result: "No data is processed yet."}
        image: {src: "/assets/images/handbook/integration/data-exchange-overview.svg", alt: "Data exchange with jobs, mappings, channels and orders"}
      data_exchange_import:
        template: integration/exchange/import.html.twig
        title: Import data
        purpose: The form imports structured business objects or processes SAP IDocs in a controlled manner.
        navigation: Integration → Data exchange → Import
        permissions: ["integration.exchange.write"]
        overview: ["Verify source file, resource type and optional mapping in a test environment. IDoc uses a separate processing path."]
        fields:
          format: {label: "Format", required: true, format: "json, xml, csv, xlsx or idoc", example: "csv", help: "Choose the actual file format; use IDoc only for SAP messages.", effect: "Determines parser and validation.", errors: "Unsupported or incorrectly declared content fails."}
          resource_type: {label: "Resource type", required: true, format: "Type code supported by the import service", example: "product", help: "Must match content and mapping; technically ignored for IDoc.", effect: "Determines the business object to create.", errors: "Unknown types are rejected."}
          mapping_system: {label: "Mapping system", required: false, format: "No mapping, erp or commerce", example: "erp", help: "Select only when matching field rules exist for the source.", effect: "Transforms source fields before business validation.", errors: "Missing or unsuitable mappings cause required-field or type errors."}
          file: {label: "Import file", required: true, format: "File in the selected format", example: "products-2026-10-05.csv", help: "Upload only trusted, complete files and avoid sensitive data.", effect: "Content is read, validated and logged as an import job.", errors: "Missing, unreadable or syntactically invalid files are not processed."}
        actions:
          import: {label: "Import", description: "Reads the file, applies mapping and processes records or the IDoc.", result: "Job, row count and state are recorded in the overview."}
        image: {src: "/assets/images/handbook/integration/data-exchange-import.svg", alt: "Import form with format, resource, mapping and file"}
      data_exchange_export:
        template: integration/exchange/export.html.twig
        title: Export data
        purpose: The form converts a JSON list into a downloadable JSON, XML, CSV or XLSX file.
        navigation: Integration → Data exchange → Export
        permissions: ["integration.exchange.write"]
        overview: ["Input must be a JSON list of objects. Export personal data and secrets only when functionally and legally necessary."]
        fields:
          format: {label: "Target format", required: true, format: "json, xml, csv or xlsx", example: "xlsx", help: "Choose a format suitable for the target system.", effect: "Determines serialisation, MIME type and extension.", errors: "Unsupported formats do not produce a usable file."}
          resource_type: {label: "Resource type", required: true, format: "Business type code", example: "product", help: "Name the row content unambiguously.", effect: "Is logged on the export job.", errors: "An empty type prevents export."}
          rows: {label: "Export data", required: true, format: "Valid JSON array of objects", example: "[{'sku':'A-1','name':'Product'}]", help: "Enter a complete list without comments, secrets or trailing commas.", effect: "Each list element becomes an export row.", errors: "Invalid JSON or an object instead of a list is rejected."}
        actions:
          export: {label: "Export", description: "Validates the JSON list, serialises it and logs the job.", result: "The browser downloads webwms-export with the selected extension."}
        image: {src: "/assets/images/handbook/integration/data-exchange-export.svg", alt: "Export form with target format and JSON data list"}
      integration_mapping_create:
        template: integration/exchange/mapping-new.html.twig
        title: Create integration mapping
        purpose: The form assigns a source field to a target field and applies one defined transformation.
        navigation: Integration → Data exchange → Create mapping
        permissions: ["integration.exchange.write"]
        overview: ["Mappings apply to the combination of system and message type. Naming conventions must match the sending system."]
        fields:
          system_type: {label: "System type", required: true, format: "erp, sap_idoc or commerce", example: "erp", help: "Select the message origin.", effect: "Limits the mapping to this system.", errors: "A wrong type prevents the expected assignment."}
          message_type: {label: "Message type", required: true, format: "Agreed stable type code", example: "product.master", help: "Use exactly the same type as the import.", effect: "Groups rules for a message.", errors: "Empty or differing types do not match during import."}
          source_field: {label: "Source field", required: true, format: "Source path or field name", example: "materialNumber", help: "Copy case and nesting exactly.", effect: "Provides the value to transform.", errors: "A missing source field produces no target value."}
          target_field: {label: "Target field", required: true, format: "Supported WebWMS field name", example: "sku", help: "Use only valid business target fields.", effect: "Writes the transformed value to the target object.", errors: "Unknown targets fail business validation."}
          transformation: {label: "Transformation", required: true, format: "copy, trim, uppercase, lowercase, integer or decimal", example: "trim", help: "copy preserves; trim removes outer spaces; upper/lower changes case; integer/decimal converts numbers.", effect: "Changes or types the source value.", errors: "Non-convertible numbers or unsuitable transformations cause import errors."}
        actions:
          save: {label: "Save mapping", description: "Saves system, message, field pair and transformation.", result: "The rule appears in mapping overview and applies to following imports."}
        image: {src: "/assets/images/handbook/integration/mapping-create.svg", alt: "Mapping form for system, message, source and target field"}
      commerce_connection_create:
        template: integration/exchange/commerce-new.html.twig
        title: Create commerce connection
        purpose: The form registers Shopware, Amazon, eBay or a generic commerce channel for order imports.
        navigation: Integration → Data exchange → Commerce connection
        permissions: ["integration.exchange.write"]
        overview: ["The secret remains in the runtime environment. Verify endpoint, permissions and external duplicate detection before activation."]
        fields:
          name: {label: "Name", required: true, format: "Understandable channel name", example: "Shopware DE production", help: "Distinguish platform, country and environment.", effect: "Identifies the connection and imported orders.", errors: "An empty name prevents creation."}
          channel_type: {label: "Channel type", required: true, format: "shopware, amazon, ebay or generic", example: "shopware", help: "Choose the adapter matching the external API contract.", effect: "Determines channel behaviour and data interpretation.", errors: "A wrong adapter cannot process data correctly."}
          endpoint_url: {label: "HTTPS base URL", required: true, format: "Complete HTTPS URL", example: "https://shop.example.com/api", help: "Separate production and test systems; never put tokens in the URL.", effect: "Target for commerce communication.", errors: "HTTP or invalid URLs are rejected; network errors prevent imports."}
          credential_env: {label: "Credential environment variable", required: true, format: "3–101 characters; A–Z, 0–9 and underscore", example: "SHOPWARE_DE_API_TOKEN", help: "Enter only the reference to a securely provided secret.", effect: "Authenticates order and status communication.", errors: "A missing runtime variable causes authentication errors."}
          active: {label: "Activate immediately", required: false, format: "Checkbox; enabled by default", example: "disabled until connection test", help: "Enable only after successful technical and business validation.", effect: "Controls whether the channel can be used operationally.", errors: "Active misconfiguration creates failed retrieval or delivery."}
        actions:
          save: {label: "Save", description: "Validates channel, endpoint and credential reference and creates the connection.", result: "The channel appears in the data-exchange overview."}
        image: {src: "/assets/images/handbook/integration/commerce-connection-create.svg", alt: "Commerce connection form with channel, endpoint and credential"}
      device_overview:
        template: integration/device/index.html.twig
        title: Scanners and mobile terminals
        purpose: The overview manages capture devices and shows the latest 50 process-related scan events.
        navigation: Integration → Scanners and mobile terminals
        permissions: ["integration.device.read; integration.device.write for devices; integration.device.scan for capture."]
        overview:
        - Devices show code, name, type and active state. Scan events show device, process, reference, scan type, value, accepted/rejected and time.
        - Both tables have empty states but currently no search or pagination. Open leads to device or event details.
        actions:
          create: {label: "Create device", description: "Opens master data for a scanner or terminal.", result: "No device is registered yet."}
          scan: {label: "Capture scan", description: "Opens the generic test and capture dialog.", result: "An event is created only after saving."}
          open: {label: "Open", description: "Opens a device or scan event.", result: "No data change."}
        image: {src: "/assets/images/handbook/integration/device-overview.svg", alt: "Device overview with scanners and scan events"}
      device_create:
        template: integration/device/new.html.twig
        title: Create capture device
        purpose: The form registers a barcode scanner, mobile terminal or mobile browser for the active tenant.
        navigation: Integration → Scanners and mobile terminals → Create device
        permissions: ["integration.device.write"]
        overview: ["Keep code and type permanently stable because scan events identify the device through them."]
        fields:
          code: {label: "Device code", required: true, format: "2–40 characters; A–Z, 0–9, underscore or hyphen", example: "MDE_01", help: "Use a unique, scannable, site-related code.", effect: "Identifies the device in events and selections.", errors: "Empty, duplicate or invalid codes are rejected."}
          name: {label: "Name", required: true, format: "Up to 100 characters", example: "Outbound terminal 1", help: "Name location and purpose.", effect: "Makes operator selection understandable.", errors: "An empty name prevents creation."}
          device_type: {label: "Device type", required: true, format: "barcode_scanner, mde or mobile_browser", example: "mde", help: "Use scanner for capture, MDE for process dialogs and browser for mobile web UI.", effect: "Classifies the device for operation and reporting.", errors: "Unsupported types are rejected."}
          active: {label: "Activate immediately", required: false, format: "Checkbox; enabled by default", example: "enabled", help: "Activate only operational devices.", effect: "Only active devices are available in the scan dialog.", errors: "Paused devices cannot capture new scans."}
        actions:
          save: {label: "Create device", description: "Validates master data and registers the device.", result: "The device detail opens."}
          cancel: {label: "Cancel", description: "Discards the entry.", result: "No device is created."}
        image: {src: "/assets/images/handbook/integration/device-create.svg", alt: "Form for creating a capture device"}
      device_detail:
        template: integration/device/show.html.twig
        title: Capture device and scan history
        purpose: The detail shows type, state, audit data and every event for the selected device.
        navigation: Integration → Scanners and mobile terminals → Open device
        permissions: ["integration.device.read; integration.device.write for state changes."]
        overview: ["History shows process, context reference, scan type, value, state and time; individual events can be opened separately."]
        actions:
          toggle: {label: "Activate or pause device", description: "Changes availability for new scans.", result: "The change is audited with user and time; existing events remain."}
          open_scan: {label: "Open scan", description: "Shows the complete event record.", result: "No data change."}
        image: {src: "/assets/images/handbook/integration/device-detail.svg", alt: "Device detail with state and scan history"}
      scan_capture:
        template: integration/device/scan.html.twig
        title: Capture scan
        purpose: The generic dialog tests device and process integration with an idempotent request ID.
        navigation: Integration → Scanners and mobile terminals → Capture scan
        permissions: ["integration.device.scan; at least one active capture device."]
        overview: ["accepted records a successful business check; rejected records a controlled negative result. The request ID prevents duplicate processing."]
        fields:
          request_id: {label: "Request ID", required: true, format: "Automatically generated UUID", example: "0199a1c0-7ab1-7f20-8f20-123456789abc", help: "Do not change or reuse this hidden value.", effect: "Makes capture idempotent.", errors: "An already processed ID creates no duplicate event."}
          device_id: {label: "Device", required: true, format: "Selection of an active device", example: "MDE_01", help: "Choose the terminal actually used.", effect: "Assigns scan and audit to the device.", errors: "Unknown or paused devices are rejected."}
          process_type: {label: "Process", required: true, format: "inbound, picking, packing, shipping, loading or inventory", example: "picking", help: "Choose the process performing the business check.", effect: "Determines meaning of the reference.", errors: "A wrong process creates unusable context."}
          scan_type: {label: "Scan type", required: true, format: "location, product, batch, serial, shipment or order", example: "location", help: "Choose the type matching the barcode.", effect: "Describes what scan_value represents.", errors: "A mismatched type causes process rejection."}
          context_reference: {label: "Process reference", required: true, format: "Up to 100 characters", example: "PICK-2026-0042", help: "Reference order, pick, count or shipment unambiguously.", effect: "Links the event to the business process.", errors: "Empty or unknown references cannot be assigned usefully."}
          scan_value: {label: "Scan value", required: true, format: "Up to 255 characters", example: "BIN-A-01-02", help: "Use the exact barcode value without manual normalisation.", effect: "Is the identifier checked by the process.", errors: "Empty or mismatching values are recorded as errors."}
          accepted: {label: "Scan accepted", required: false, format: "Checkbox; enabled by default", example: "enabled", help: "Leave enabled only after a successful process check.", effect: "Sets event state accepted, otherwise rejected.", errors: "Incorrect acceptance distorts process evidence."}
          message: {label: "Verification note", required: false, format: "Up to 500 characters", example: "Bin is outside the pick route", help: "For rejection, state cause and expected correction.", effect: "Appears in event detail.", errors: "A rejected scan without a note is hard to investigate."}
        actions:
          save: {label: "Capture scan", description: "Stores the event idempotently with device, process and result.", result: "The scan-event detail opens."}
          cancel: {label: "Cancel", description: "Returns to the overview.", result: "No event is stored."}
        image: {src: "/assets/images/handbook/integration/scan-capture.svg", alt: "Scan dialog with device, process, type and result"}
      scan_detail:
        template: integration/device/scan-show.html.twig
        title: Scan event
        purpose: The view provides the immutable record of an accepted or rejected scan.
        navigation: Integration → Scanners and mobile terminals → Open scan
        permissions: ["integration.device.read"]
        overview: ["It shows device, process and context, type, value, request ID, capturing user, time and optional verification note."]
        image: {src: "/assets/images/handbook/integration/scan-detail.svg", alt: "Scan event with request ID and verification state"}
      measurement_overview:
        template: integration/measurement/index.html.twig
        title: Scales and dimensioning
        purpose: The overview manages measuring devices and shows the latest 50 weight and dimension measurements.
        navigation: Integration → Scales and dimensioning
        permissions: ["integration.measurement.read; integration.measurement.write for devices; integration.measurement.capture for measurements."]
        overview:
        - Devices show code, name, type and state. Measurements show target, grams, dimensions in millimetres, accepted/rejected and time.
        - State can be changed per device. Tables have empty states but currently no search or pagination.
        actions:
          create: {label: "Add measuring device", description: "Opens device creation.", result: "No device is registered yet."}
          capture: {label: "Capture measurement", description: "Opens assignment to a package or product.", result: "No values are applied yet."}
          toggle: {label: "Activate or pause", description: "Controls availability in the measurement dialog.", result: "Existing measurements remain unchanged."}
          open: {label: "Open measurement", description: "Shows the complete measurement record.", result: "No data change."}
        image: {src: "/assets/images/handbook/integration/measurement-overview.svg", alt: "Measuring devices and recent weight and dimension measurements"}
      measurement_device_create:
        template: integration/measurement/device-new.html.twig
        title: Add measuring device
        purpose: The form registers a scale, dimensioner or combined device.
        navigation: Integration → Scales and dimensioning → Add measuring device
        permissions: ["integration.measurement.write"]
        overview: ["Choose the device type to match the values actually supplied."]
        fields:
          code: {label: "Device code", required: true, format: "2–40 characters; A–Z, 0–9, underscore or hyphen", example: "SCALE_01", help: "Use a unique code based on workstation or station.", effect: "Identifies the device in measurements.", errors: "Duplicate or invalid codes are rejected."}
          name: {label: "Name", required: true, format: "Up to 100 characters", example: "Packing-station scale 1", help: "Name location and device function.", effect: "Appears in measuring-device selection.", errors: "An empty name prevents creation."}
          device_type: {label: "Device type", required: true, format: "scale, dimensioner or combined", example: "combined", help: "scale supplies weight, dimensioner dimensions, combined both.", effect: "Documents expected measurement values.", errors: "A mismatched type leads to incomplete measurements."}
          active: {label: "Activate immediately", required: false, format: "Checkbox; enabled by default", example: "enabled", help: "Activate only calibrated operational devices.", effect: "Only active devices can be selected for new measurements.", errors: "Paused devices cannot be used."}
        actions:
          save: {label: "Add measuring device", description: "Validates code, name, type and state.", result: "The device appears in the overview."}
          cancel: {label: "Cancel", description: "Discards entries.", result: "No device is created."}
        image: {src: "/assets/images/handbook/integration/measurement-device-create.svg", alt: "Form for adding a scale or dimensioner"}
      measurement_capture:
        template: integration/measurement/capture.html.twig
        title: Capture measurement
        purpose: The dialog applies weight and dimensions idempotently to a package or product.
        navigation: Integration → Scales and dimensioning → Capture measurement
        permissions: ["integration.measurement.capture; at least one active measuring device."]
        overview: ["Enter at least one measurement. accepted applies values to the target; rejected records the check without business update."]
        fields:
          request_id: {label: "Request ID", required: true, format: "Automatically generated UUID", example: "0199a1c0-7ab1-7f20-8f20-123456789abc", help: "Do not change or reuse for another measurement.", effect: "Prevents duplicate processing.", errors: "Repeated IDs are handled idempotently."}
          device_id: {label: "Measuring device", required: true, format: "Selection of an active device", example: "SCALE_01", help: "Choose the device actually supplying the values.", effect: "Assigns measurement and audit to the device.", errors: "Unknown or paused devices are rejected."}
          target_type: {label: "Target type", required: true, format: "package or product", example: "package", help: "Use package for shipping dimensions and product for master-data measurement.", effect: "Determines which business object is updated.", errors: "Type and target ID must match."}
          target_id: {label: "Target ID", required: true, format: "UUID of a package or product", example: "018f2f5a-73ad-7c42-9d84-2dcb65bcb410", help: "Select a suggestion and verify its name.", effect: "Links or updates exactly this object.", errors: "Unknown or cross-tenant targets are rejected."}
          weight_grams: {label: "Weight", required: false, format: "Positive integer in grams", example: "1250", help: "Enter gross weight without a decimal separator.", effect: "Updates target weight when accepted.", errors: "Zero, negative or non-integer values are invalid."}
          length_mm: {label: "Length", required: false, format: "Positive integer in millimetres", example: "400", help: "Measure the longest side consistently.", effect: "Forms volume dimensions with width and height.", errors: "Partial or non-positive dimensions are functionally incomplete."}
          width_mm: {label: "Width", required: false, format: "Positive integer in millimetres", example: "300", help: "Measure the side perpendicular to length.", effect: "Updates target width.", errors: "Zero, negative or non-integer values are invalid."}
          height_mm: {label: "Height", required: false, format: "Positive integer in millimetres", example: "250", help: "Measure vertical extent including packaging.", effect: "Updates target height.", errors: "Zero, negative or non-integer values are invalid."}
          accepted: {label: "Measurement accepted", required: false, format: "Checkbox; enabled by default", example: "enabled", help: "Leave enabled only for plausible approved values.", effect: "Applies values to the target; otherwise state rejected.", errors: "Incorrectly accepted values affect shipping and master data."}
          message: {label: "Verification note", required: false, format: "Up to 500 characters", example: "Scale not tared; measurement rejected", help: "Explain rejection or exceptional values.", effect: "Is stored in measurement detail.", errors: "A missing note hampers investigation."}
        actions:
          save: {label: "Capture measurement", description: "Validates device, target, positive values and request ID.", result: "When accepted, the target is updated and detail opens."}
          cancel: {label: "Cancel", description: "Discards entries.", result: "No measurement or target update."}
        image: {src: "/assets/images/handbook/integration/measurement-capture.svg", alt: "Measurement dialog for weight and dimensions"}
      measurement_detail:
        template: integration/measurement/show.html.twig
        title: Measurement detail
        purpose: The view shows the immutable measurement record with target, grams, dimensions, state and request ID.
        navigation: Integration → Scales and dimensioning → Open measurement
        permissions: ["integration.measurement.read"]
        overview: ["Values not captured appear as a dash. The verification note explains rejected or unusual measurements."]
        image: {src: "/assets/images/handbook/integration/measurement-detail.svg", alt: "Measurement detail with weight, dimensions and request ID"}
      printing_overview:
        template: integration/printing/index.html.twig
        title: Print queue
        purpose: The overview manages printers and monitors label and document jobs.
        navigation: Integration → Print queue
        permissions: ["integration.print_job.read; integration.printer.read/write for printers; integration.print_job.write for jobs."]
        overview:
        - Printers show name, HTTPS endpoint and state. Jobs show document type and reference, printer, ZPL/PDF, copies, state, attempts and time.
        - Empty states are separate; search and pagination are currently unavailable. Printers and jobs have their own details.
        actions:
          create_printer: {label: "Create printer", description: "Opens endpoint and credential configuration.", result: "No printer is registered yet."}
          create_job: {label: "Create print job", description: "Opens document and printer selection.", result: "No job is queued yet."}
          open: {label: "Open", description: "Shows printer or job details.", result: "No data change."}
        image: {src: "/assets/images/handbook/integration/printing-overview.svg", alt: "Print queue with printers and jobs"}
      printer_create:
        template: integration/printing/printer-new.html.twig
        title: Create printer
        purpose: The form registers an HTTPS print endpoint and stores only the reference to its access token.
        navigation: Integration → Print queue → Create printer
        permissions: ["integration.printer.write"]
        overview: ["The access token remains in the runtime environment and must not be included in name or URL."]
        fields:
          name: {label: "Name", required: true, format: "Up to 100 characters", example: "Packing station 1 ZPL", help: "Indicate location, workstation and format.", effect: "Appears in printer selection and jobs.", errors: "An empty name prevents creation."}
          credential_env: {label: "Credential environment variable", required: true, format: "3–101 characters; A–Z, 0–9 and underscore", example: "PRINTER_PACK_1_TOKEN", help: "Enter only the securely provided secret-variable name.", effect: "Authenticates calls to the print service.", errors: "A missing variable causes authentication failures."}
          endpoint_url: {label: "HTTPS endpoint", required: true, format: "HTTPS URL, up to 500 characters", example: "https://print.example.com/printers/pack-1", help: "Use a concrete printer or queue endpoint.", effect: "Print data is sent there.", errors: "HTTP, certificate, DNS or timeout errors prevent printing."}
          active: {label: "Activate immediately", required: false, format: "Checkbox; enabled by default", example: "enabled", help: "Activate only reachable tested printers.", effect: "Only active printers can be selected for new jobs.", errors: "Paused printers accept no new jobs."}
        actions:
          save: {label: "Create printer", description: "Validates name, HTTPS endpoint and credential reference.", result: "The printer detail opens."}
          cancel: {label: "Cancel", description: "Discards entries.", result: "No printer is created."}
        image: {src: "/assets/images/handbook/integration/printer-create.svg", alt: "Printer form with HTTPS endpoint and credential reference"}
      printer_detail:
        template: integration/printing/printer-show.html.twig
        title: Printer and job history
        purpose: The detail shows endpoint, credential reference, audit, state and related print jobs.
        navigation: Integration → Print queue → Open printer
        permissions: ["integration.printer.read; integration.printer.write for state changes."]
        overview: ["The secret itself is never displayed. Job history shows reference, state and attempt count and links to job detail."]
        actions:
          toggle: {label: "Activate or pause printer", description: "Controls selection for new print jobs.", result: "The state change is audited; existing jobs remain."}
          open_job: {label: "Open print job", description: "Shows state, errors and execution option.", result: "No immediate retry."}
        image: {src: "/assets/images/handbook/integration/printer-detail.svg", alt: "Printer detail with connection and job history"}
      print_job_create:
        template: integration/printing/job-new.html.twig
        title: Create print job
        purpose: The form queues a label, document or loading manifest idempotently on an active printer.
        navigation: Integration → Print queue → Create print job
        permissions: ["integration.print_job.write; at least one active printer."]
        overview: ["Choose ZPL for compatible label printers and PDF for documents. The request ID prevents duplicate queueing."]
        fields:
          request_id: {label: "Request ID", required: true, format: "Automatically generated UUID", example: "0199a1c0-7ab1-7f20-8f20-123456789abc", help: "Do not change or reuse the hidden ID for another document.", effect: "Makes job creation idempotent.", errors: "Repeated IDs create no second job."}
          printer_id: {label: "Printer", required: true, format: "Selection of an active printer", example: "Packing station 1 ZPL", help: "Choose a printer matching workstation and format.", effect: "Determines the target endpoint.", errors: "Unknown or paused printers are rejected."}
          document_type: {label: "Document type", required: true, format: "carrier_label, document or loading_manifest", example: "carrier_label", help: "Use carrier label for shipping labels, document for general documents and loading manifest for load lists.", effect: "Classifies content and evidence.", errors: "A wrong type may not resolve the reference."}
          format: {label: "Format", required: true, format: "ZPL or PDF", example: "ZPL", help: "The target printer must support the format.", effect: "Determines data sent to the print service.", errors: "An incompatible format causes a failed job."}
          document_reference: {label: "Document reference", required: true, format: "Up to 500 characters; unique business reference", example: "SHIP-2026-0042/LABEL", help: "Reference an existing label or document exactly; include no secrets.", effect: "The print service resolves the content through it.", errors: "Empty or unknown references cannot be printed."}
          copies: {label: "Copies", required: true, format: "Integer 1 to 99; default 1", example: "2", help: "Choose only the operationally required count to avoid duplicates.", effect: "Determines output quantity.", errors: "Zero, negative, non-integer or more than 99 copies are invalid."}
        actions:
          save: {label: "Create print job", description: "Validates printer, document, format, copies and request ID.", result: "The job is created as queued and its detail opens."}
          cancel: {label: "Cancel", description: "Discards entries.", result: "No print job is created."}
        image: {src: "/assets/images/handbook/integration/print-job-create.svg", alt: "Print job with printer, document, format and copies"}
      print_job_detail:
        template: integration/printing/job-show.html.twig
        title: Execute and inspect print job
        purpose: The detail shows target, document, format, copies, attempts, external reference, completion and last error.
        navigation: Integration → Print queue → Open print job
        permissions: ["integration.print_job.read; integration.print_job.execute to execute or retry."]
        overview: ["Only queued or failed jobs can execute. Reprint increments attempts and may create a physical duplicate; inspect printer and previous output first."]
        actions:
          execute: {label: "Execute print job", description: "Sends a queued job to the print endpoint.", result: "Success stores external reference and completion; failure stores reason and state failed."}
          retry: {label: "Reprint", description: "Retries only a failed job.", result: "Another physical output is possible; state and attempt count are updated."}
        image: {src: "/assets/images/handbook/integration/print-job-detail.svg", alt: "Print job with state, attempts and error display"}
      wcs_overview:
        template: integration/wcs/index.html.twig
        title: WCS, material-flow controller and conveyor
        purpose: The control centre monitors connections, transport commands and machine feedback.
        navigation: Integration → WCS/MFC/conveyor
        permissions: ["integration.wcs.read; integration.wcs.write for connections; integration.wcs.execute for commands and state."]
        overview:
        - Connections show code, system type, endpoint and active state; commands show load unit, route, type and state; machine feedback shows machine, state, text and time.
        - Every table has an empty state but no search or pagination. Only active connections are available for new commands and feedback.
        actions:
          create_connection: {label: "Create connection", description: "Configures a WCS, material-flow controller or conveyor.", result: "The connection appears after saving."}
          create_command: {label: "Create command", description: "Queues transport, route or cancellation.", result: "A new queued command is created."}
          capture_status: {label: "Capture state", description: "Records machine feedback idempotently.", result: "The feedback appears in the control centre."}
          toggle: {label: "Activate or pause", description: "Controls operational use of the connection.", result: "Existing commands and feedback remain."}
        image: {src: "/assets/images/handbook/integration/wcs-overview.svg", alt: "WCS control centre with connections, commands and machine state"}
      wcs_connection_create:
        template: integration/wcs/connection-new.html.twig
        title: Create WCS connection
        purpose: The form registers a secure endpoint for WCS, material-flow controller or conveyor.
        navigation: Integration → WCS/MFC/conveyor → Create connection
        permissions: ["integration.wcs.write"]
        overview: ["Store credentials only as environment references and test the endpoint before activation."]
        fields:
          code: {label: "Code", required: true, format: "Up to 40 characters; stable uppercase code", example: "WCS_01", help: "Use a unique plant or system code.", effect: "Identifies the connection in commands and feedback.", errors: "Empty or duplicate codes are rejected."}
          name: {label: "Name", required: true, format: "Up to 100 characters", example: "High-bay WCS", help: "Name plant and environment clearly.", effect: "Appears in selection and overview.", errors: "An empty name prevents creation."}
          system_type: {label: "System type", required: true, format: "wcs, mfr or conveyor", example: "mfr", help: "Choose WCS for warehouse control, MFC for material flow and conveyor for conveyor equipment.", effect: "Classifies the integration partner.", errors: "A wrong type impairs routing and reporting."}
          endpoint_url: {label: "HTTPS endpoint", required: true, format: "Complete HTTPS URL", example: "https://wcs.internal.example/commands", help: "Provide the productive command endpoint without a secret.", effect: "Target for machine commands.", errors: "Invalid or unreachable URLs prevent delivery."}
          credential_env: {label: "Credential environment variable", required: true, format: "Name of a securely provided variable", example: "WCS_01_TOKEN", help: "Never enter the credential itself.", effect: "Authenticates technical communication.", errors: "A missing runtime variable causes authentication failure."}
          active: {label: "Activate immediately", required: false, format: "Checkbox; enabled by default", example: "disabled until connection test", help: "Enable only after a successful test.", effect: "Only active connections accept commands.", errors: "Active misconfigurations create delivery failures."}
        actions:
          save: {label: "Create connection", description: "Validates identity, system type, endpoint and credential reference.", result: "The connection appears in the control centre."}
          cancel: {label: "Cancel", description: "Discards entries.", result: "No connection is created."}
        image: {src: "/assets/images/handbook/integration/wcs-connection-create.svg", alt: "WCS connection form with system type and endpoint"}
      wcs_command_create:
        template: integration/wcs/command-new.html.twig
        title: Create machine command
        purpose: The form idempotently queues transport, routing or cancellation on an active connection.
        navigation: Integration → WCS/MFC/conveyor → Create command
        permissions: ["integration.wcs.execute; at least one active connection."]
        overview: ["Verify source, destination and load unit against plant identifiers. The request ID prevents duplicate commands."]
        fields:
          request_id: {label: "Request ID", required: true, format: "Automatically generated UUID", example: "0199a1c0-7ab1-7f20-8f20-123456789abc", help: "Do not change or reuse for another command.", effect: "Ensures idempotent queueing.", errors: "Repeated IDs create no duplicate order."}
          connection_id: {label: "Connection", required: true, format: "Selection of an active WCS connection", example: "WCS_01", help: "Choose the responsible plant.", effect: "Determines target system and credential.", errors: "Paused or unknown connections are rejected."}
          command_type: {label: "Command", required: true, format: "transport, route or cancel", example: "transport", help: "transport moves, route sets a route, cancel cancels the plant order.", effect: "Determines the machine operation.", errors: "Cancellation must functionally refer to an existing order."}
          source: {label: "Source", required: true, format: "Plant location, up to 100 characters", example: "INFEED-01", help: "Use the exact WCS location code.", effect: "Defines the starting point.", errors: "Unknown sources are rejected by the target."}
          destination: {label: "Destination", required: true, format: "Plant location, up to 100 characters", example: "AISLE-04", help: "Use the exact destination code.", effect: "Defines the route destination.", errors: "Unknown or blocked destinations lead to failed."}
          load_unit: {label: "Load unit", required: true, format: "Unique identifier, up to 100 characters", example: "HU-0004711", help: "Use the barcode of the actual unit.", effect: "Links command and feedback to the load unit.", errors: "Empty or already bound identifiers cause conflicts."}
        actions:
          save: {label: "Queue command", description: "Validates connection, route, load unit and request ID.", result: "The command starts in state queued."}
          cancel: {label: "Cancel", description: "Discards the draft.", result: "No machine command is created."}
        image: {src: "/assets/images/handbook/integration/wcs-command-create.svg", alt: "WCS command with route and load unit"}
      wcs_command_detail:
        template: integration/wcs/command-show.html.twig
        title: Machine command and state sequence
        purpose: The detail shows route, load unit and request ID and controls state transitions.
        navigation: Integration → WCS/MFC/conveyor → Open command
        permissions: ["integration.wcs.read; integration.wcs.execute for state changes."]
        overview: ["Valid sequence: queued → dispatched → accepted → completed. failed or cancelled terminates the command; final states cannot change."]
        fields:
          status: {label: "New state", required: true, format: "Depending on current state: dispatched, accepted, completed, failed or cancelled", example: "accepted", help: "Choose only the plant stage actually confirmed.", effect: "Advances the command lifecycle.", errors: "Skipped or retrospective transitions are rejected."}
          message: {label: "Message", required: false, format: "Up to 500 characters", example: "Load unit confirmed at destination", help: "For failure or cancellation, record cause and plant message.", effect: "Completes the audit record.", errors: "Failures without a message are difficult to investigate."}
        actions:
          status: {label: "Process state", description: "Validates and logs the next transition.", result: "State and message are updated; final states close processing."}
        image: {src: "/assets/images/handbook/integration/wcs-command-detail.svg", alt: "WCS command detail with state processing"}
      wcs_status_capture:
        template: integration/wcs/status-new.html.twig
        title: Capture machine state
        purpose: The form records a machine-state message idempotently and optionally links it to a command.
        navigation: Integration → WCS/MFC/conveyor → Capture state
        permissions: ["integration.wcs.execute; at least one active connection."]
        overview: ["The external event ID is generated automatically. Set a command reference only when feedback clearly belongs to it."]
        fields:
          external_event_id: {label: "External event ID", required: true, format: "Automatically generated UUID", example: "0199a1c0-7ab1-7f20-8f20-123456789abc", help: "Do not change the hidden idempotency key.", effect: "Prevents duplicate machine feedback.", errors: "An existing ID is not processed twice."}
          connection_id: {label: "Connection", required: true, format: "Active WCS connection", example: "WCS_01", help: "Select the reporting system.", effect: "Assigns machine and credential context.", errors: "Unknown or paused connections are invalid."}
          command_id: {label: "Transport command", required: false, format: "No reference or existing command", example: "HU-0004711: INFEED-01 → AISLE-04", help: "Select only for direct command feedback.", effect: "Links plant state and order.", errors: "Cross-tenant or connection-external commands are prohibited."}
          machine_code: {label: "Machine code", required: true, format: "Up to 100 characters", example: "CONVEYOR_04", help: "Use the exact plant identifier.", effect: "Identifies the reporting component.", errors: "An empty code prevents capture."}
          status: {label: "State", required: true, format: "ready, busy, blocked, fault or offline", example: "fault", help: "ready free, busy occupied, blocked functionally blocked, fault malfunction, offline unreachable.", effect: "Updates visible machine state.", errors: "A wrong state can distort routing decisions."}
          message: {label: "Message", required: false, format: "Up to 500 characters", example: "Light barrier LS-4 blocked", help: "For blocked, fault or offline, provide the technical cause.", effect: "Supports diagnosis and recovery.", errors: "Unclear messages lengthen investigation."}
        actions:
          save: {label: "Capture state", description: "Stores feedback idempotently and optionally command-linked.", result: "The machine state appears in the control centre."}
          cancel: {label: "Cancel", description: "Discards the message.", result: "No state change."}
        image: {src: "/assets/images/handbook/integration/wcs-status-capture.svg", alt: "Machine state with connection, command and fault text"}
    guidance:
      prerequisites:
      - Reachable endpoint, agreed protocol, tenant assignment and secret stored as environment variable.
      permissions:
      - Matching integration.erp_connection, carrier_connection, device, measurement, printer/print_job and wcs read/write/execute permissions.
      fields:
      - 'Connection: name, endpoint_url, credential_env, active, timeouts. Device: code, type, protocol, framing, suffix, site. Mapping: system/message type, source/target field, transformation.
        Message: ID, payload, reference.'
      statuses:
      - Connections/devices active/inactive. Jobs and commands pending → processing/sent → acknowledged/completed or failed.
      errors:
      - DNS/timeout, 401/403, certificate, mapping, unknown device or duplicate message ID is recorded as failure.
  platform_and_extensions:
    title: Platform functions and extended modules
    summary: Shopfloor, KPI, partner portal, events, VAS and rule-based extensions.
    sections:
      section_1:
        title: Shopfloor and KPI
        paragraphs:
          paragraph_1: Shopfloor tasks group work by priority, area and state. KPI definitions set metric, aggregation, target and period. Verify filters and data period before evaluating
            deviations.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Shopfloor and KPI – screenshot placeholder
      section_2:
        title: Partner portal and event centre
        paragraphs:
          paragraph_1: Partner accounts receive explicit permissions for released data. The event centre shows business events and processing state. Acknowledge only events whose cause
            is understood or resolved.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Partner portal and event centre – screenshot placeholder
      section_3:
        title: Storage billing and services
        paragraphs:
          paragraph_1: Storage billing rules use period, stock, tariff and billing basis. VAS orders describe service, quantity, state and evidence. Check tariff validity and reference
            data before billing.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: 'Placeholder: platform control centre'
      section_4:
        title: Extended configurations
        paragraphs:
          paragraph_1: Extension modules cover resources such as compliance, quality, production, dock and yard configuration. Create rules in configuration views and perform work in
            separate process views. State transitions, approvals and external evidence are audited.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Extended configurations – screenshot placeholder
    views:
      platform_dashboard:
        template: platform/dashboard/index.html.twig
        title: Platform dashboard
        purpose: The dashboard summarises products, warehouse structure, stock and open outbound, picking, packing and shipping work.
        navigation: Platform → Dashboard
        permissions: ["platform.read"]
        overview: ["Metrics use the current tenant and site context; cards link to the relevant work lists.", "Empty values mean no matching records. Check site, filters and permissions before escalation."]
        actions: {open_area: {label: "Open area", description: "Opens the overview behind a metric.", result: "The business list appears without changing data."}}
        image: {src: "/assets/images/handbook/platform/dashboard.svg", alt: "Platform dashboard with stock and process metrics"}
      platform_control_center:
        template: platform/index.html.twig
        title: Platform control centre
        purpose: The control centre manages shopfloor tasks, KPIs, dashboards, partner access, automation rules, storage fees, services, media and print routes.
        navigation: Platform → Control centre
        permissions: ["platform.read; platform.write for configuration; platform.execute for transitions, tests and billing."]
        overview: ["Search filters across areas. Fourteen separate forms each execute only their labelled action.", "Tasks follow planned → released → in_progress → completed. Rules and master data can be disabled without deleting history."]
        fields:
          q: {label: "Search", required: false, format: "Free text", example: "TASK-4711", help: "Search by code, name or reference.", effect: "Restricts displayed platform data.", errors: "No match changes no data."}
          code: {label: "Code", required: true, format: "Unique stable identifier", example: "KPI_OPEN_TASKS", help: "Do not repurpose after creation.", effect: "Identifies a task, KPI, dashboard, rule, tariff, service or print route.", errors: "Empty or duplicate codes are rejected.", usages: ["Task code", "KPI code", "Dashboard code", "Rule code", "Storage-fee code", "Service code", "Print-route code"]}
          title: {label: "Title", required: true, format: "Up to 180 characters", example: "Move pallet to zone A", help: "Describe the work unambiguously.", effect: "Appears in the shopfloor list.", errors: "An empty title prevents creation."}
          task_type: {label: "Task type", required: true, format: "putaway, retrieval, transport or inventory", example: "transport", help: "Choose the actual workflow.", effect: "Classifies the task.", errors: "Unknown types are rejected."}
          priority: {label: "Priority", required: true, format: "Integer 1–999; default 50", example: "20", help: "Lower values are handled first.", effect: "Controls operational order.", errors: "Values outside the range are invalid."}
          reference_type: {label: "Reference type", required: false, format: "Business aggregate type", example: "shipment", help: "Set only with a reference ID.", effect: "Links the task to a process.", errors: "Unknown types cannot be resolved."}
          reference_id: {label: "Reference ID", required: false, format: "Existing ID", example: "SHP-2026-00471", help: "Use the referenced process ID.", effect: "Enables navigation to the origin.", errors: "Missing references remain unresolved."}
          planned_for: {label: "Planned for", required: false, format: "Date and time", example: "2026-10-05 14:30", help: "Observe local site time.", effect: "Schedules the task.", errors: "Invalid dates are rejected."}
          assigned_to: {label: "Assigned to", required: false, format: "User identifier", example: "warehouse.team1", help: "Assign only active authorised users.", effect: "Assigns responsibility.", errors: "Unknown users cannot be selected."}
          status: {label: "Next state", required: true, format: "released, in_progress or completed according to current state", example: "released", help: "Execute only the offered next state.", effect: "Advances the task state.", errors: "Skipped or repeated transitions are rejected."}
          active: {label: "Active", required: true, format: "Yes/No; active on creation", example: "Yes", help: "Enable only ready configurations.", effect: "Controls KPI, partner account, rule, tariff, service or print route.", errors: "Disabled records are not used operationally.", usages: ["KPI", "Partner account", "Automation rule", "Storage-fee rule", "Service", "Print route"]}
          name: {label: "Name", required: true, format: "Descriptive name", example: "Open shopfloor tasks", help: "Name purpose and scope clearly.", effect: "Appears in selections and lists.", errors: "An empty name prevents saving.", usages: ["KPI", "Dashboard", "Automation rule", "Storage-fee rule", "Service", "Print route"]}
          metric: {label: "Metric", required: true, format: "open_shopfloor_tasks, stock_quantity, open_outbound_orders, open_inbound_deliveries or queued_print_jobs", example: "stock_quantity", help: "Choose the matching data source.", effect: "Defines the measured value.", errors: "Unsupported metrics are rejected."}
          aggregation: {label: "Aggregation", required: true, format: "count, sum or average", example: "sum", help: "count counts, sum totals and average calculates the mean.", effect: "Defines calculation.", errors: "An unsuitable aggregation can mislead."}
          target_value: {label: "Target value", required: false, format: "Decimal number", example: "5000", help: "Enter in the metric unit.", effect: "Enables target comparison.", errors: "Non-numeric values are invalid."}
          layout_json: {label: "Dashboard layout", required: true, format: "Valid JSON object", example: '{"columns":4,"kpis":["stock_quantity"]}', help: "Provide columns and KPI codes structurally.", effect: "Defines arrangement and content.", errors: "Invalid JSON or unknown KPI codes prevent saving."}
          business_partner_id: {label: "Business partner", required: true, format: "Existing partner", example: "BP-0042", help: "Choose account owner or billing partner.", effect: "Assigns access or billing to the partner.", errors: "Cross-tenant partners are rejected.", usages: ["Partner account", "Storage-fee billing", "Service billing"]}
          user_id: {label: "User", required: true, format: "Active user", example: "partner.smith", help: "Choose an account assigned to the partner.", effect: "Grants portal access.", errors: "Inactive or foreign users are invalid."}
          permissions: {label: "Portal permissions", required: true, format: "Comma-separated allowed scopes", example: "stock.read,orders.read", help: "Grant only minimum permissions.", effect: "Limits visible partner data.", errors: "Unknown scopes have no effect."}
          event_name: {label: "Event name", required: true, format: "Registered event name", example: "shipment.dispatched", help: "Use the exact technical name.", effect: "Triggers matching rules or simulates an event.", errors: "Unknown events trigger no actions.", usages: ["Automation rule", "Test event"]}
          conditions_json: {label: "Conditions", required: true, format: "Valid JSON object", example: '{"carrier":"DHL","country":"DE"}', help: "Compare business properties only; no secrets.", effect: "Restricts rule execution.", errors: "Invalid JSON prevents saving."}
          action_type: {label: "Action type", required: true, format: "print, notification or follow_up_task", example: "notification", help: "Choose the desired follow-up.", effect: "Selects the executing handler.", errors: "Unknown action types are rejected."}
          action_config: {label: "Action configuration", required: true, format: "Valid JSON object matching the action type", example: '{"channel":"warehouse-alerts","template":"shipment-delay"}', help: "Store identifiers, never secrets.", effect: "Configures the follow-up action.", errors: "Missing required properties prevent execution."}
          payload: {label: "Test payload", required: true, format: "Valid JSON object", example: '{"shipment_id":"SHP-2026-00471","carrier":"DHL"}', help: "Use realistic secret-free test data.", effect: "Is evaluated once by rules.", errors: "Invalid JSON prevents testing."}
          price_per_unit_day: {label: "Price per unit/day", required: true, format: "Positive decimal", example: "0.35", help: "Enter net tariff in selected currency.", effect: "Calculates storage fees.", errors: "Negative or non-numeric values are invalid."}
          free_days: {label: "Free days", required: true, format: "Integer from 0", example: "3", help: "Set free storage duration.", effect: "Reduces billable days.", errors: "Negative values are invalid."}
          currency: {label: "Currency", required: true, format: "ISO 4217 code", example: "EUR", help: "Use three uppercase letters.", effect: "Labels tariff and amount.", errors: "Invalid codes prevent billing.", usages: ["Storage-fee rule", "Service"]}
          unit: {label: "Unit", required: true, format: "Business billing unit", example: "PAL", help: "Align with contract and quantity source.", effect: "Defines the pricing basis.", errors: "Unknown units distort billing."}
          unit_price: {label: "Unit price", required: true, format: "Positive decimal", example: "4.90", help: "Enter net price per unit.", effect: "Calculates service amount.", errors: "Negative or non-numeric values are invalid."}
          rule_id: {label: "Storage-fee rule", required: true, format: "Active rule", example: "STORAGE_STD", help: "Choose the partner-contract rule.", effect: "Uses price, free days and currency.", errors: "Inactive rules cannot be billed."}
          quantity: {label: "Quantity", required: true, format: "Positive decimal", example: "12", help: "Enter in tariff or service unit.", effect: "Contributes to invoice amount.", errors: "Zero, negative or non-numeric values are rejected.", usages: ["Storage-fee billing", "Service billing"]}
          days: {label: "Days", required: true, format: "Integer from 0", example: "10", help: "Enter total storage duration including free days.", effect: "Defines billable duration.", errors: "Negative values are invalid."}
          reference: {label: "Billing reference", required: false, format: "External or internal document number", example: "INV-BATCH-2026-10", help: "Use a traceable reference.", effect: "Appears in billing evidence.", errors: "Unclear references hinder reconciliation.", usages: ["Storage-fee billing", "Service billing"]}
          service_id: {label: "Service", required: true, format: "Active service", example: "REPACK", help: "Choose the delivered service.", effect: "Uses unit and price.", errors: "Inactive services cannot be billed."}
          aggregate_type: {label: "Object type", required: true, format: "Supported aggregate type", example: "shipment", help: "Choose the media target type.", effect: "Assigns the file functionally.", errors: "Unknown types are rejected."}
          aggregate_id: {label: "Object ID", required: true, format: "Existing ID", example: "SHP-2026-00471", help: "Enter an ID matching the type.", effect: "Links file and process.", errors: "Missing IDs prevent assignment."}
          file: {label: "File", required: true, format: "Allowed file type and size limit", example: "proof-of-delivery.pdf", help: "Upload no secrets or unnecessary personal data.", effect: "Stores media on the process.", errors: "Invalid type, size or upload failure prevents saving."}
          document_type: {label: "Document type", required: true, format: "Supported print-document type", example: "shipping_label", help: "Assign the document to its route.", effect: "Selects a print route.", errors: "Unknown types are not routed."}
          printer_id: {label: "Printer", required: true, format: "Active printer", example: "PRINTER_PACK_01", help: "Choose a reachable printer.", effect: "Defines output destination.", errors: "Inactive printers prevent output."}
          site_id: {label: "Site", required: false, format: "Existing site", example: "BERLIN", help: "Leave empty for cross-site routing.", effect: "Limits route scope.", errors: "Foreign sites are rejected."}
          workstation: {label: "Workstation", required: false, format: "Stable workstation identifier", example: "PACK-03", help: "Set only for workstation-specific routing.", effect: "Refines route selection.", errors: "Different spelling prevents a match."}
          process_key: {label: "Process key", required: false, format: "Technical process name", example: "outbound.pack", help: "Align with the triggering process.", effect: "Refines route selection.", errors: "Unknown keys fall back to default routing."}
        actions:
          create: {label: "Create", description: "Validates and saves the selected platform object.", result: "The record appears in its overview."}
          transition: {label: "Advance task", description: "Executes only the allowed next state.", result: "State and audit trail are updated."}
          test_event: {label: "Test event", description: "Evaluates active rules once with the payload.", result: "Triggered actions and failures are shown."}
          bill: {label: "Bill service", description: "Calculates the amount from tariff, quantity and duration.", result: "A traceable billing record is created."}
          upload: {label: "Upload media", description: "Validates and assigns a file to a business object.", result: "The media is available on the process."}
        image: {src: "/assets/images/handbook/platform/control-center.svg", alt: "Platform control centre with configuration and process forms"}
      partner_portal:
        template: platform/portal.html.twig
        title: Partner portal
        purpose: The portal shows a partner only released stock, processes and media.
        navigation: Platform → Partner portal
        permissions: ["Active partner account and explicit portal scopes."]
        overview: ["All content is restricted to the assigned business partner; missing scopes hide areas.", "Links open only released details. If data is missing, check partner assignment, active state and permissions."]
        actions: {open: {label: "Open released process", description: "Opens stock, document or media in partner context.", result: "No foreign tenant or partner data is displayed."}}
        image: {src: "/assets/images/handbook/platform/partner-portal.svg", alt: "Partner portal with released stock and processes"}
      extensions_overview:
        template: platform/extensions/index.html.twig
        title: Extension modules
        purpose: The overview groups available business modules and links to configurations and workflows.
        navigation: Platform → Extensions
        permissions: ["platform.extension.read"]
        overview: ["Module cards explain purpose and available resources. Modules without configuration have no operational data."]
        actions: {open: {label: "Open module", description: "Opens module configurations or workflows.", result: "The selected resource overview appears."}}
        image: {src: "/assets/images/handbook/platform/extensions-overview.svg", alt: "Extension module overview"}
      extension_configurations:
        template: platform/extensions/configuration_index.html.twig
        title: Extension configurations
        purpose: The list shows versioned module configurations with code, name and active state.
        navigation: Platform → Extensions → Module → Configurations
        permissions: ["platform.extension.read; platform.extension.write for creation and editing."]
        overview: ["The table shows all configurations of the selected resource type. An empty state indicates that setup is still required."]
        actions: {create: {label: "Create configuration", description: "Opens an empty configuration form.", result: "No data has changed yet."}, edit: {label: "Edit", description: "Opens the selected version for maintenance.", result: "Changes take effect only after saving."}}
        image: {src: "/assets/images/handbook/platform/extension-configurations.svg", alt: "Extension configuration list"}
      extension_configuration_form:
        template: platform/extensions/configuration_form.html.twig
        title: Edit extension configuration
        purpose: The form creates or changes a versioned business JSON configuration.
        navigation: Platform → Extensions → Module → Configurations → Create/Edit
        permissions: ["platform.extension.write"]
        overview: ["The schema depends on the module. Verify required properties and referenced master data before activation."]
        fields:
          code: {label: "Code", required: true, format: "Up to 80 characters; unique per resource type", example: "DEFAULT_RULE", help: "Assign a stable identifier.", effect: "Identifies configuration and versions.", errors: "Duplicate or empty codes are rejected."}
          name: {label: "Name", required: true, format: "Up to 160 characters", example: "Default rule Germany", help: "Name scope clearly.", effect: "Appears in lists and selections.", errors: "An empty name is invalid."}
          configuration_json: {label: "Configuration", required: true, format: "Valid JSON object matching the module schema", example: '{"country":"DE","threshold":10,"approvalRequired":true}', help: "Use documented properties and IDs only, never clear-text secrets.", effect: "Controls module behaviour with versioning.", errors: "Invalid JSON, wrong types or missing properties prevent saving."}
          active: {label: "Active", required: false, format: "Yes/No", example: "Yes", help: "Enable only after business review.", effect: "Only active configurations are evaluated operationally.", errors: "Disabling does not end existing work items."}
        actions: {save: {label: "Save", description: "Validates master data and JSON and creates a new version.", result: "The configuration is available according to its active state."}, cancel: {label: "Back to overview", description: "Discards unsaved changes.", result: "The list remains unchanged."}}
        image: {src: "/assets/images/handbook/platform/extension-configuration-form.svg", alt: "Extension configuration form with JSON and active state"}
      extension_workflows:
        template: platform/extensions/workflow_index.html.twig
        title: Extension workflows
        purpose: The list shows module work items with reference, state and last change.
        navigation: Platform → Extensions → Module → Workflows
        permissions: ["platform.extension.read; platform.extension.execute for new work items."]
        overview: ["State and reference explain operational progress. An empty list means that no work item exists for the module."]
        actions: {create: {label: "Create work item", description: "Opens the capture form.", result: "No data has changed yet."}, open: {label: "Open work item", description: "Shows payload, audit trail and allowed transitions.", result: "The detail page appears."}}
        image: {src: "/assets/images/handbook/platform/extension-workflows.svg", alt: "Extension workflow list and states"}
      extension_work_item_form:
        template: platform/extensions/work_item_form.html.twig
        title: Create extension work item
        purpose: The form starts a business workflow with a reference and module-specific payload.
        navigation: Platform → Extensions → Module → Workflows → Create
        permissions: ["platform.extension.execute"]
        overview: ["Reference and payload must describe a traceable process; IDs must exist in the current tenant."]
        fields:
          reference: {label: "Reference", required: true, format: "Unique business reference up to 160 characters", example: "QC-INB-2026-00471", help: "Use a document or process number.", effect: "Links workflow and origin.", errors: "Empty or reused references can be rejected."}
          payload_json: {label: "Payload", required: true, format: "Valid JSON object matching the workflow schema", example: '{"receiptId":"REC-00471","inspectionLevel":"full","evidenceRequired":true}', help: "Use complete, secret-free data and valid IDs.", effect: "Initialises steps, rules and decisions.", errors: "Invalid JSON or missing schema fields prevent starting."}
        actions: {save: {label: "Create work item", description: "Validates reference and payload and starts the initial state.", result: "The work item appears in the workflow list."}, cancel: {label: "Cancel", description: "Discards input.", result: "No workflow is started."}}
        image: {src: "/assets/images/handbook/platform/extension-work-item-form.svg", alt: "Form for starting an extension workflow"}
      extension_work_item_detail:
        template: platform/extensions/work_item_show.html.twig
        title: Process extension work item
        purpose: The detail page shows payload and history and offers only allowed state transitions.
        navigation: Platform → Extensions → Module → Workflows → Work item
        permissions: ["platform.extension.read; platform.extension.execute for transitions."]
        overview: ["State, reference, payload and audit trail explain progress. Transitions depend on module and current state."]
        fields:
          status: {label: "Next state", required: true, format: "One of the displayed allowed transitions", example: "approved", help: "Check evidence and consequences first.", effect: "Advances state and audit trail and may trigger follow-ups.", errors: "Stale, repeated or forbidden transitions are rejected."}
        actions: {transition: {label: "Execute state", description: "Validates and records the selected transition once.", result: "Work item and possible follow-ups are updated."}, back: {label: "Back to list", description: "Opens the workflow overview.", result: "No data change."}}
        image: {src: "/assets/images/handbook/platform/extension-work-item-detail.svg", alt: "Extension work-item detail with state transitions"}
    guidance:
      prerequisites:
      - Enabled feature and valid partner, tariff, rule or workflow configuration.
      permissions:
      - platform.read/write/execute and platform.extension.read/write/execute; partner accounts additionally use released scopes.
      fields:
      - 'Task/KPI: title, type, priority, metric, aggregation, target. Partner: business_partner_id, user_id, permissions. Billing/VAS: service, quantity, price, free_days. Extension:
        resource type, configuration, workflow, decision, evidence.'
      statuses:
      - Tasks and work items follow defined transitions; billing, compliance and quality decisions are audited.
      errors:
      - Missing rule, invalid transition, expired tariff, unknown partner or incomplete evidence prevents execution or approval.
  api_and_automation:
    title: API, outbox, transport adapters and automation
    summary: OpenAPI, API keys, reliable messaging, protocols and operational monitoring.
    sections:
      section_1:
        title: Use the API
        paragraphs:
          paragraph_1: Open API documentation from its separate sidebar link. Choose resource and operation and verify permission, headers and schema. API keys are sent in headers and
            never published in URLs, logs or screenshots.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Use the API – screenshot placeholder
      section_2:
        title: Monitor the outbox
        paragraphs:
          paragraph_1: The outbox separates business transactions from external delivery. Filter by state, target and period. Review payload and last error. Retry only after resolving
            the cause; manual acknowledgement requires a business reason.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: 'Placeholder: outbox and transport state'
      section_3:
        title: Transport adapters
        paragraphs:
          paragraph_1: HTTP, file, TCP and serial adapters require endpoint, timeout, encoding or framing and secret reference. Test reachability and response format. Do not log credentials
            or unnecessary personal payload data.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Transport adapters – screenshot placeholder
      section_4:
        title: Workers and schedules
        paragraphs:
          paragraph_1: Asynchronous messages require running Messenger workers. Scheduled tasks start due jobs such as counting, replenishment or status reconciliation. Monitor queue
            depth, failed queue, duration and last successful run.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Workers and schedules – screenshot placeholder
    views:
      outbox_overview:
        template: integration/outbox/index.html.twig
        title: Monitor outbox
        purpose: The overview shows integration messages awaiting reliable delivery and their technical processing state.
        navigation: Integration → Outbox
        permissions: ["integration.outbox.read"]
        overview: ["The table shows event type, aggregate, target, state, attempts, next attempt and last error. The state filter works with cursor pagination of 50 records.", "pending waits, processing is in progress, published is delivered, dead_letter needs investigation and acknowledged was accepted manually. An empty state means no matching messages."]
        fields:
          status: {label: "State filter", required: false, format: "pending, processing, published, dead_letter or acknowledged", example: "dead_letter", help: "Use dead_letter for incident work; empty shows all states.", effect: "Restricts the list without changing messages.", errors: "Unknown values are not accepted as a valid filter."}
        actions: {filter: {label: "Filter", description: "Applies the state filter and returns to the start.", result: "Only matching messages are shown."}, open: {label: "Open message", description: "Opens payload, metadata and error details.", result: "No state change."}, paginate: {label: "Next/Previous", description: "Navigates stable result pages using cursors.", result: "Up to 50 messages appear per page."}}
        image: {src: "/assets/images/handbook/integration/outbox-overview.svg", alt: "Outbox overview with state filter and delivery failures"}
      outbox_detail:
        template: integration/outbox/show.html.twig
        title: Inspect outbox message
        purpose: The detail page shows unchanged payload, target, attempts, timestamps and the last delivery error.
        navigation: Integration → Outbox → Message
        permissions: ["integration.outbox.read; integration.outbox.execute for retry or acknowledgement."]
        overview: ["Payload and metadata support investigation and must not contain clear-text secrets. Check target system, reachability and root cause first.", "Retry is available only for dead_letter and returns the message to pending. Acknowledge is allowed only for pending and ends automatic delivery."]
        actions:
          retry: {label: "Retry", description: "Returns a dead-letter message to pending after its cause is fixed, idempotently.", result: "A worker can deliver it again and the attempt is audited."}
          acknowledge: {label: "Acknowledge", description: "Deliberately marks a pending message as functionally complete.", result: "State becomes acknowledged and automatic delivery stops."}
          back: {label: "Back to overview", description: "Returns to the outbox list.", result: "No data change."}
        image: {src: "/assets/images/handbook/integration/outbox-detail.svg", alt: "Outbox detail with payload, error, retry and acknowledgement"}
      swagger_ui:
        template: documentation/swagger.html.twig
        title: OpenAPI documentation
        purpose: Swagger UI presents the current HTTP contract interactively and permits authorised test calls.
        navigation: Sidebar → API documentation
        permissions: ["Permission to read API documentation; test calls additionally require API and business permissions."]
        overview: ["Operations are grouped by resource. Schemas explain path, query and body parameters, responses and errors; the raw contract is available separately.", "Authorize stores credentials for the UI session only. Use Try it out for writes only with test data after checking tenant, method and payload."]
        actions: {authorize: {label: "Authorize", description: "Stores the intended API key or token for test calls.", result: "Permitted operations send authentication in the header."}, try: {label: "Try it out", description: "Sends the completed request to the documented endpoint.", result: "Status, headers and response are displayed; write operations can change data."}, raw: {label: "Raw OpenAPI contract", description: "Opens the machine-readable specification.", result: "The current contract can be reviewed or imported into tools."}}
        image: {src: "/assets/images/handbook/documentation/swagger-ui.svg", alt: "Swagger UI with OpenAPI operations and authorisation"}
      automation_overview:
        template: integration/automation/index.html.twig
        title: Storage lifts and paternosters
        purpose: The overview manages automation devices and tracks their commands.
        navigation: Integration → Storage lifts and paternosters
        permissions: ["integration.automation.read; integration.automation.write for devices; integration.automation.execute for commands."]
        overview:
        - Devices show code, type, HTTPS endpoint and state. Commands show device, operation, bin, business reference, state and time.
        - Paused devices cannot receive new commands. Tables have empty states but no search or pagination.
        actions:
          create_device: {label: "Create device", description: "Configures a storage lift, paternoster or Logimat.", result: "The device appears after saving."}
          create_command: {label: "Create command", description: "Creates an idempotent device order.", result: "The order starts queued."}
          toggle: {label: "Activate or pause", description: "Controls operational command selection.", result: "Existing commands remain."}
          open: {label: "Open command", description: "Shows details and permitted feedback.", result: "No state change."}
        image: {src: "/assets/images/handbook/integration/automation-overview.svg", alt: "Automation devices and device commands"}
      automation_device_create:
        template: integration/automation/device-new.html.twig
        title: Create automation device
        purpose: The form registers a storage lift, paternoster or Logimat with secure HTTPS access.
        navigation: Integration → Storage lifts and paternosters → Create device
        permissions: ["integration.automation.write"]
        overview: ["Reference the secret only through an environment variable and test the endpoint before activation."]
        fields:
          code: {label: "Device code", required: true, format: "2–40 characters; A–Z, 0–9, underscore or hyphen", example: "LIFT_01", help: "Use a stable plant identifier.", effect: "Identifies the device in commands.", errors: "Duplicate or invalid codes are rejected."}
          name: {label: "Name", required: true, format: "Up to 100 characters", example: "Storage lift hall 1", help: "Name plant and location clearly.", effect: "Appears in command selection.", errors: "An empty name prevents creation."}
          device_type: {label: "Device type", required: true, format: "storage_lift, paternoster or logimat", example: "storage_lift", help: "Select the matching technical device type.", effect: "Classifies the automation.", errors: "A wrong type can prevent command interpretation."}
          endpoint_url: {label: "HTTPS endpoint", required: true, format: "Complete HTTPS URL", example: "https://lift.internal.example/commands", help: "Provide the command endpoint without a secret.", effect: "Target for device commands.", errors: "Invalid or unreachable URLs cause failed."}
          credential_env: {label: "Credential environment variable", required: true, format: "Runtime-variable name", example: "LIFT_01_TOKEN", help: "Never store the token or password itself.", effect: "Authenticates device communication.", errors: "A missing variable causes 401/403."}
          active: {label: "Activate immediately", required: false, format: "Checkbox; enabled by default", example: "disabled until tested", help: "Activate only operational devices.", effect: "Only active devices receive new commands.", errors: "Active misconfigurations create delivery failures."}
        actions:
          save: {label: "Create device", description: "Validates identity, type, endpoint and credential reference.", result: "The device appears in the overview."}
          cancel: {label: "Cancel", description: "Discards entries.", result: "No device is created."}
        image: {src: "/assets/images/handbook/integration/automation-device-create.svg", alt: "Automation device with type, endpoint and credential"}
      automation_command_create:
        template: integration/automation/command-new.html.twig
        title: Create device command
        purpose: The form idempotently assigns a bin and business process to an active automation device.
        navigation: Integration → Storage lifts and paternosters → Create command
        permissions: ["integration.automation.execute; active device and valid bin."]
        overview: ["Device, bin and reference must belong to the same process. The request ID prevents duplicates."]
        fields:
          request_id: {label: "Request ID", required: true, format: "Automatically generated UUID", example: "0199a1c0-7ab1-7f20-8f20-123456789abc", help: "Do not change or reuse.", effect: "Ensures idempotent creation.", errors: "A repeat creates no second command."}
          device_id: {label: "Device", required: true, format: "Active automation device", example: "LIFT_01", help: "Select the physically responsible device.", effect: "Determines the command endpoint.", errors: "Paused or unknown devices are rejected."}
          command_type: {label: "Command", required: true, format: "present, store or retrieve", example: "present", help: "present supplies a tray, store puts away, retrieve takes out.", effect: "Determines the device operation.", errors: "A mismatched command conflicts with the business process."}
          location_id: {label: "Bin", required: true, format: "Selection of an existing bin", example: "WH1-LIFT-01-042", help: "Choose a bin reachable by the device.", effect: "Defines compartment or tray.", errors: "Unknown or unreachable bins are rejected."}
          reference_type: {label: "Reference type", required: true, format: "pick_task, putaway_order, replenishment_order or manual", example: "pick_task", help: "Classify the business trigger correctly.", effect: "Links the order to its process.", errors: "A wrong type impairs feedback and audit."}
          reference_id: {label: "Reference", required: true, format: "Unique business reference up to 100 characters", example: "PICK-2026-0042/10", help: "Provide the concrete operation or a traceable manual ID.", effect: "Enables traceability.", errors: "Empty or unknown references are rejected."}
        actions:
          save: {label: "Queue command", description: "Validates device, operation, bin, reference and idempotency.", result: "The command starts queued."}
          cancel: {label: "Cancel", description: "Discards the draft.", result: "No command is created."}
        image: {src: "/assets/images/handbook/integration/automation-command-create.svg", alt: "Device command with bin and business reference"}
      automation_command_detail:
        template: integration/automation/command-show.html.twig
        title: Device command and feedback
        purpose: The detail shows bin, reference, request ID and feedback and controls state.
        navigation: Integration → Storage lifts and paternosters → Open command
        permissions: ["integration.automation.read; integration.automation.execute for feedback."]
        overview: ["Valid sequence is queued → dispatched → completed; failed terminates the order. Only queued or dispatched can change."]
        fields:
          status: {label: "Feedback state", required: true, format: "dispatched, completed or failed depending on current state", example: "completed", help: "Choose only the stage confirmed by the device.", effect: "Advances or terminates the order.", errors: "Invalid transitions are prevented."}
          message: {label: "Device message", required: false, format: "Up to 500 characters", example: "Tray 42 presented", help: "For failure, record the complete technical message.", effect: "Completes the audit record.", errors: "A missing error text hampers recovery."}
        actions:
          status: {label: "Process feedback", description: "Validates the next state and stores the device message.", result: "State and change time are updated."}
        image: {src: "/assets/images/handbook/integration/automation-command-detail.svg", alt: "Automation command with state and device message"}
      transport_overview:
        template: integration/transport/index.html.twig
        title: TCP/IP and web services
        purpose: The overview manages transport adapters, protocols, framing, timeouts and delivery access.
        navigation: Integration → TCP/IP and web services
        permissions: ["integration.transport.read; integration.transport.write for creation, state and delivery."]
        overview:
        - Endpoints show code, adapter, protocol, framing, address, connect/read timeout and active state. Only active endpoints offer delivery.
        - The table has an empty state but no search or pagination.
        actions:
          create: {label: "Create endpoint", description: "Configures a TCP client or HTTP web service.", result: "The endpoint appears after saving."}
          deliver: {label: "Deliver", description: "Opens an idempotent test or business message.", result: "No transmission yet."}
          toggle: {label: "Activate or pause", description: "Controls new deliveries.", result: "Historical deliveries remain."}
        image: {src: "/assets/images/handbook/integration/transport-overview.svg", alt: "Transport adapters with protocol, address and timeouts"}
      transport_endpoint_create:
        template: integration/transport/new.html.twig
        title: Create transport endpoint
        purpose: The form configures TCP or HTTP communication including protocol, framing and time limits.
        navigation: Integration → TCP/IP and web services → Create endpoint
        permissions: ["integration.transport.write"]
        overview: ["Adapter, protocol and framing must technically match; store a secret only as environment reference."]
        fields:
          code: {label: "Code", required: true, format: "Up to 40 characters", example: "PLC_PACK_01", help: "Use a stable target identifier.", effect: "Identifies endpoint and deliveries.", errors: "Empty or duplicate codes are invalid."}
          name: {label: "Name", required: true, format: "Up to 100 characters", example: "Packing-line PLC 1", help: "Name target and environment.", effect: "Appears in overview and delivery dialog.", errors: "An empty name prevents creation."}
          adapter_type: {label: "Adapter", required: true, format: "tcp_client or http_webservice", example: "tcp_client", help: "Choose TCP for socket targets and HTTP for web APIs.", effect: "Determines transport implementation.", errors: "Adapter must match address and protocol."}
          address: {label: "Address", required: true, format: "host:port or HTTPS URL", example: "plc.internal:9100", help: "For TCP use host and port; for HTTP use complete URL.", effect: "Defines network target.", errors: "DNS, port, URL or certificate failures prevent connection."}
          credential_env: {label: "Credential environment variable", required: true, format: "Runtime-variable name", example: "PLC_PACK_01_TOKEN", help: "Store only the reference, never a plain-text secret.", effect: "Authenticates where required.", errors: "A missing variable causes authentication failure."}
          protocol: {label: "Protocol", required: true, format: "raw_tcp, rest_json or soap_xml", example: "raw_tcp", help: "Use raw TCP for bytes, REST for JSON and SOAP for an XML contract.", effect: "Determines encoding and response handling.", errors: "A protocol mismatching the target causes negative responses."}
          framing: {label: "Framing", required: true, format: "stx_etx, newline, none or http", example: "stx_etx", help: "Use STX/ETX or newline only per interface contract; HTTP for web services.", effect: "Separates individual messages.", errors: "Wrong framing causes incomplete or merged messages."}
          connect_timeout_ms: {label: "Connect timeout", required: true, format: "100–60000 milliseconds; default 3000", example: "3000", help: "Balance rapid fault detection against connection setup.", effect: "Limits connection establishment.", errors: "Values outside the range are invalid."}
          read_timeout_ms: {label: "Read timeout", required: true, format: "100–300000 milliseconds; default 10000", example: "10000", help: "Adapt to the target's maximum response time.", effect: "Limits waiting for response or acknowledgement.", errors: "Too short creates failures; too long blocks workers."}
          active: {label: "Activate immediately", required: false, format: "Checkbox; enabled by default", example: "disabled until tested", help: "Enable after an agreed connection test.", effect: "Only active endpoints allow delivery.", errors: "Active misconfigurations create failed deliveries."}
        actions:
          save: {label: "Create endpoint", description: "Validates adapter, address, protocol, framing, timeouts and credential.", result: "The endpoint appears in the overview."}
          cancel: {label: "Cancel", description: "Discards configuration.", result: "No endpoint is created."}
        image: {src: "/assets/images/handbook/integration/transport-endpoint-create.svg", alt: "Transport endpoint with adapter, protocol and timeouts"}
      transport_delivery:
        template: integration/transport/deliver.html.twig
        title: Deliver message
        purpose: The dialog idempotently sends a JSON message through the selected active endpoint.
        navigation: Integration → TCP/IP and web services → Deliver
        permissions: ["integration.transport.write; endpoint must be active."]
        overview: ["Before production delivery, verify payload schema, target effect and repeatability. Send no secrets or unnecessary personal data."]
        fields:
          message_id: {label: "Message ID", required: true, format: "Unique UUID or external message identifier", example: "0199a1c0-7ab1-7f20-8f20-123456789abc", help: "For a retry use the same ID; for a new message use a new ID.", effect: "Enables receiver idempotency.", errors: "A new ID on retry can cause duplicate processing."}
          payload: {label: "Payload", required: true, format: "Valid JSON object following the target contract", example: "{'type':'connectivity-test'}", help: "Follow required fields and types; include no plain-text secrets.", effect: "Is sent according to adapter, protocol and framing.", errors: "Invalid JSON, schema error, timeout or negative acknowledgement leads to failed."}
        actions:
          deliver: {label: "Deliver", description: "Validates JSON and sends it through the configured adapter.", result: "State and external response are stored as delivery evidence."}
          cancel: {label: "Cancel", description: "Returns without transmission.", result: "No message is sent."}
        image: {src: "/assets/images/handbook/integration/transport-delivery.svg", alt: "Message delivery with message ID and JSON payload"}
    guidance:
      prerequisites:
      - Active API client or adapter, running workers, valid secrets and reachable target.
      permissions:
      - Explicit API scopes plus integration.outbox.read/retry/acknowledge, integration.automation.* and integration.transport.*.
      fields:
      - 'API: X-API-Key, Content-Type, Idempotency-Key, Request-ID, JSON body. Outbox: aggregate, message type, destination, payload, state. Transport: adapter, destination, protocol,
        framing, credential, timeouts.'
      statuses:
      - Outbox pending → processing → published or failed. Delivery queued → sent/acknowledged or failed; retries increase attempts.
      errors:
      - 401/403 authentication, 409 conflict, 422 validation, timeout or negative acknowledgement; retry only after duplicate-processing check.
  troubleshooting:
    title: Troubleshooting and support
    summary: Narrow down common operator errors, retry safely and provide useful support data.
    sections:
      section_1:
        title: A record or menu is missing
        paragraphs:
          paragraph_1: Verify tenant, site, role, active filters and state. Reset search and pagination. A missing menu item usually indicates a missing read permission.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: A record or menu is missing – screenshot placeholder
      section_2:
        title: An action is unavailable
        paragraphs:
          paragraph_1: Read validation feedback and verify required fields, document state, predecessor actions, stock availability and concurrent editing. Do not repeatedly submit a
            write action without understanding its result.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: An action is unavailable – screenshot placeholder
      section_3:
        title: An integration reports an error
        paragraphs:
          paragraph_1: Review connection test, secret reference, target system, outbox state and error message. Determine whether the external order was already processed before retrying.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: 'Placeholder: error message and audit log'
      section_4:
        title: Prepare a support case
        paragraphs:
          paragraph_1: Provide time with timezone, tenant, site, route, document reference, expected and actual behaviour and correlation or message ID. Remove passwords, API keys and
            unnecessary personal data from screenshots and logs.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Prepare a support case – screenshot placeholder
      section_5:
        title: Audit and recovery
        paragraphs:
          paragraph_1: Use movement history, audit events and outbox to reconstruct the flow. Correct business data through supported reversal, approval or cancellation processes instead
            of direct database changes.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Audit and recovery – screenshot placeholder
    guidance:
      prerequisites:
      - Timestamp with timezone, tenant, site, user action, route, document and correlation reference.
      permissions:
      - Domain read permission and integration.outbox.read for delivery errors; retry and acknowledgement need separate permissions.
      fields:
      - 'Support case: expected/actual behaviour, route, aggregate_id, message_id, external_event_id, state, error. Never include passwords or API keys.'
      statuses:
      - An error remains open until data state and external processing are understood. Retry, acknowledgement, cancellation and reversal are distinct.
      errors:
      - Check filters/permission/state, then audit and ledger, then outbox/workers and finally the external target; never patch the database directly.
