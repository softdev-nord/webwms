chapter:
  getting_started:
    title: Einstieg und Arbeitsumgebung
    summary: Anmeldung, Mandant, Standort, Sprache, Dashboard und sicherer Arbeitsbeginn.
    sections:
      section_1:
        title: Anmelden und Kontext prüfen
        paragraphs:
          paragraph_1: Öffnen Sie die WebWMS-Anmeldeseite und melden Sie sich mit E-Mail-Adresse und Passwort oder über den eingerichteten OpenID-Connect-Anbieter an. Prüfen Sie nach
            der Anmeldung den aktiven Mandanten und Standort. Daten, Rollen und Vorgänge werden immer in diesem Kontext verarbeitet.
        steps:
          step_1: Melden Sie sich an.
          step_2: Prüfen Sie Benutzer, Mandant und Standort in der Kopfleiste.
          step_3: Öffnen Sie das Dashboard und kontrollieren Sie offene Aufgaben und Warnungen.
          step_4: Wechseln Sie Sprache oder Darstellung über die Benutzeroberfläche.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: 'Platzhalter: Anmeldung und Dashboard'
      section_2:
        title: Dashboard und Kennzahlen
        paragraphs:
          paragraph_1: Das Dashboard bündelt Bestände, Wareneingänge, Ausgänge, Transportaufträge und Auslastung. Karten führen in die zugehörige Übersicht. Kennzahlen sind mandantenbezogen;
            fehlende Werte bedeuten nicht automatisch einen technischen Fehler, sondern können auf Filter, Berechtigungen oder noch nicht vorhandene Bewegungen zurückgehen.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Dashboard und Kennzahlen – Screenshot-Platzhalter
      section_3:
        title: Sicher beenden
        paragraphs:
          paragraph_1: Schließen Sie sensible Dialoge, speichern oder verwerfen Sie Änderungen bewusst und melden Sie sich über das Benutzermenü ab. Verwenden Sie bei gemeinsam genutzten
            Geräten keine dauerhaft gespeicherten Zugangsdaten.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Sicher beenden – Screenshot-Platzhalter
    views:
      workspace_login:
        template: security/workspace_login.html.twig
        title: Anmeldung am WebWMS-Arbeitsbereich
        purpose: Die Seite eröffnet eine Sitzung per Passwort oder über einen für den Mandanten konfigurierten OpenID-Connect-Anbieter.
        navigation: Öffentliche Startseite → Anmelden
        permissions:
        - Keine Vorab-Berechtigung; Benutzerkonto und Mandant müssen aktiv sein.
        overview:
        - Der Passwortbereich prüft Mandant, E-Mail-Adresse und Passwort gemeinsam.
        - Der SSO-Bereich leitet nach Prüfung von Mandant und Provider-Code zum Identitätsanbieter weiter.
        fields:
          tenant_id:
            label: Mandanten-ID
            required: true
            format: UUID des Mandanten ohne Leerzeichen
            example: 018f2f5a-73ad-7c42-9d84-2dcb65bcb410
            help: Identifiziert den Daten- und Berechtigungskontext. Verwenden Sie die von der Administration mitgeteilte ID.
            effect: Alle Anmeldeprüfungen und die spätere Sitzung werden diesem Mandanten zugeordnet.
            errors: Eine unbekannte, inaktive oder syntaktisch ungültige ID verhindert die Anmeldung.
          email:
            label: E-Mail-Adresse
            required: true
            format: Vollständige E-Mail-Adresse des aktiven Benutzerkontos
            example: lagerleitung@example.org
            help: Die Adresse muss innerhalb des angegebenen Mandanten eindeutig sein.
            effect: Bestimmt Benutzer, Rollen und protokollierte Identität der Sitzung.
            errors: Unbekannte, unbestätigte oder inaktive Konten werden abgewiesen.
          password:
            label: Passwort
            required: true
            format: Persönliches Kennwort; Groß- und Kleinschreibung beachten
            example: '************'
            help: Geben Sie das Kennwort verdeckt ein und teilen Sie es niemals mit anderen Personen.
            effect: Bei erfolgreicher Prüfung wird die authentifizierte Sitzung erzeugt.
            errors: Bei falscher Eingabe bleibt die Anmeldung ohne Offenlegung von Kontodetails gesperrt.
          provider:
            label: Provider-Code
            required: true
            format: Exakter Code des eingerichteten OIDC-Providers
            example: corporate_sso
            help: Nur für Single Sign-on erforderlich; der Code wird von der Administration vorgegeben.
            effect: Wählt Discovery-Endpunkt, Client und Anmelderichtlinie für die Weiterleitung aus.
            errors: Unbekannte oder deaktivierte Provider sowie unsichere Discovery-Daten werden abgewiesen.
        actions:
          password_login:
            label: Anmelden
            description: Prüft Mandant, E-Mail-Adresse, Passwort und Kontostatus.
            result: Bei Erfolg öffnet sich der Arbeitsbereich; bei Fehlern bleiben Eingaben außer dem Passwort erhalten.
          sso_login:
            label: Mit SSO anmelden
            description: Startet den OIDC-Ablauf mit State, Nonce und PKCE.
            result: Nach erfolgreicher Anmeldung beim Provider erfolgt die sichere Rückleitung in den Mandanten.
        image:
          src: /assets/images/handbook/security/workspace-login.svg
          alt: Anmeldung am WebWMS-Arbeitsbereich mit Passwort- und SSO-Bereich
    guidance:
      prerequisites:
      - Aktives Benutzerkonto, korrekter Mandant und unterstützter Browser. Für SSO muss ein aktiver OIDC-Provider mit HTTPS-Issuer, Client-ID und Secret-Referenz konfiguriert sein.
      permissions:
      - Die Login-Routen sind öffentlich. Nach erfolgreicher Anmeldung werden ausschließlich Menüs angezeigt, für deren Fachberechtigung der Benutzer freigeschaltet ist.
      fields:
      - 'Passwortlogin: E-Mail und Passwort. SSO: Mandanten-ID und Provider-Code. Arbeitskontext: Mandant, Standort, Sprache und Darstellung.'
      statuses:
      - Nur aktive Benutzer und Provider dürfen eine Sitzung eröffnen. Logout beendet die Sitzung; ein abgelaufenes State-, Nonce- oder PKCE-Prüfergebnis wird abgewiesen.
      errors:
      - Unbekannter Mandant, inaktives Konto, unbestätigte E-Mail, falsches Passwort oder abweichende OIDC-Signatur verhindert die Anmeldung. Systemzeit und Provider-Discovery mitprüfen.
  navigation_and_lists:
    title: Navigation, Übersichten, Suche und Bearbeitung
    summary: Sidebar, Tabellen, Filter, Pagination, Detailseiten und wiederkehrende Bedienmuster.
    sections:
      section_1:
        title: Sidebar und Untermenüs
        paragraphs:
          paragraph_1: Die Sidebar ist nach Plattform, Lager, Wareneingang, Warenausgang, Integration und Administration gegliedert. Sichtbar sind nur Bereiche, für die der Benutzer
            mindestens eine Leseberechtigung besitzt. Der aktive Bereich bleibt aufgeklappt und die aktuelle Seite wird hervorgehoben.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Sidebar und Untermenüs – Screenshot-Platzhalter
      section_2:
        title: Übersichtsseiten bedienen
        paragraphs:
          paragraph_1: Übersichten trennen Lesen und Anlegen. Verwenden Sie die globale Suche für Belegnummern, Artikel, Partner oder Status. Fachliche Filter begrenzen die Treffer;
            die Seitengröße steuert die Pagination. Setzen Sie Filter zurück, bevor Sie einen vermeintlich fehlenden Datensatz melden.
        steps:
          step_1: Suchbegriff eingeben.
          step_2: Status- oder Fachfilter wählen.
          step_3: Seitengröße festlegen und durch Ergebnisse navigieren.
          step_4: Über die Aktion in der Tabellenzeile Details oder Bearbeitung öffnen.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: 'Platzhalter: Tabellenfilter und Zeilenaktionen'
      section_3:
        title: Anlegen, Bearbeiten und Löschen
        paragraphs:
          paragraph_1: Neue Datensätze werden auf einer eigenen Formularseite angelegt. Pflichtfelder sind gekennzeichnet. Bearbeitungen erfolgen über die Zeilenaktion und werden erst
            mit Speichern wirksam. Fachlich verwendete Belege werden in der Regel storniert, deaktiviert oder durch einen Statuswechsel abgeschlossen statt physisch gelöscht.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Anlegen, Bearbeiten und Löschen – Screenshot-Platzhalter
      section_4:
        title: Meldungen und Validierung
        paragraphs:
          paragraph_1: Erfolgs- und Fehlermeldungen erscheinen nach einer Aktion oberhalb des Inhalts. Korrigieren Sie markierte Felder. Bei Konflikten durch parallele Bearbeitung laden
            Sie den aktuellen Stand neu und prüfen die Änderung erneut.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Meldungen und Validierung – Screenshot-Platzhalter
    guidance:
      prerequisites:
      - Angemeldete Sitzung und Leserecht des jeweiligen Fachbereichs.
      permissions:
      - Leserechte zeigen Übersicht und Details; Schreibrechte zeigen Anlegen/Bearbeiten; Execute-, Review- und Approve-Rechte steuern fachliche Aktionen.
      fields:
      - Listen verwenden q, Status, Fachfilter, page und limit. Formulare markieren Pflichtfelder; Zeilenaktionen öffnen Detail-, Bearbeitungs-, Storno- oder Statusseiten.
      statuses:
      - Suche, Filter und Pagination verändern keine Daten. Speichern und Statusaktionen werden erst nach erfolgreicher Validierung wirksam.
      errors:
      - Bei leeren Ergebnissen Filter, Mandant, Standort und Seite zurücksetzen. Bei konkurrierender Änderung aktuellen Datensatz neu laden.
  users_roles_and_security:
    title: Benutzer, Rollen, Rechte und Single Sign-on
    summary: Benutzerkonten, Berechtigungen, API-Clients und OpenID Connect sicher konfigurieren.
    sections:
      section_1:
        title: Benutzer verwalten
        paragraphs:
          paragraph_1: Unter Administration → Benutzer sehen berechtigte Administratoren alle Konten des Mandanten. Beim Anlegen werden E-Mail-Adresse, Anzeigename, Status und Rollen
            vergeben. Deaktivieren Sie ausgeschiedene Benutzer; bestehende Auditnachweise bleiben erhalten.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Benutzer verwalten – Screenshot-Platzhalter
      section_2:
        title: Rollen und Berechtigungen
        paragraphs:
          paragraph_1: 'Rollen bündeln fein granulare Rechte wie Lesen, Schreiben, Ausführen, Freigeben oder Konfigurieren. Vergeben Sie das Minimalprinzip: operative Benutzer erhalten
            nur die für ihre Aufgabe benötigten Rechte. Änderungen an Rollen werden auditiert. Das Recht documentation.handbook.read steuert den Zugriff auf dieses Handbuch.'
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: 'Platzhalter: Rollen- und Rechteverwaltung'
      section_3:
        title: API-Clients
        paragraphs:
          paragraph_1: API-Clients besitzen einen Namen, einen aktiven Status und explizite Berechtigungen. Das erzeugte Secret wird nur sicher übergeben und als Umgebungsgeheimnis verwaltet.
            Rotieren oder deaktivieren Sie kompromittierte Zugangsdaten und prüfen Sie die letzte Nutzung.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: API-Clients – Screenshot-Platzhalter
      section_4:
        title: OpenID Connect
        paragraphs:
          paragraph_1: Konfigurieren Sie je Mandant Provider-Code, Anzeigename, HTTPS-Issuer, Client-ID und Referenz auf das Client-Secret. Der Login verwendet Discovery, State, Nonce
            und PKCE. Die E-Mail muss vom Provider bestätigt sein. Beim ersten Login wird die externe Identität einem aktiven Benutzer desselben Mandanten zugeordnet.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: OpenID Connect – Screenshot-Platzhalter
      section_5:
        title: Prüfung
        paragraphs:
          paragraph_1: Testen Sie neue Rollen mit einem separaten Benutzer. Prüfen Sie sowohl erlaubte als auch bewusst nicht erlaubte Aktionen und dokumentieren Sie den zuständigen
            Rolleninhaber.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Prüfung – Screenshot-Platzhalter
    views:
      administration_overview:
        template: administration/index.html.twig
        title: Administrationsübersicht
        purpose: Die Startseite bündelt Benutzer, Rollen und technische API-Zugänge des aktiven Mandanten.
        navigation: Administration
        permissions: ["Mindestens eines der Leserechte administration.user.read, administration.role.read oder administration.api_client.read."]
        overview:
        - Jede sichtbare Kachel zeigt die Anzahl der Datensätze und öffnet die zugehörige Übersicht. Kacheln ohne Leserecht werden vollständig ausgeblendet.
        actions:
          open_area: {label: "\"Bereich öffnen\"", description: "\"Öffnet Benutzer, Rollen oder API-Clients abhängig von der gewählten Kachel.\"", result: "\"Die fachliche Übersicht wird ohne Datenänderung geladen.\""}
        image: {src: "\"/assets/images/handbook/administration/overview.svg\"", alt: "\"Administrationsübersicht mit Kacheln für Benutzer, Rollen und API-Clients\""}
      users_overview:
        template: administration/users.html.twig
        title: Benutzerübersicht
        purpose: Die Tabelle zeigt alle Konten des Mandanten mit Rollen und aktuellem Aktivstatus.
        navigation: Administration → Benutzer
        permissions: ["administration.user.read; Schreibrecht ist für Anlegen und Bearbeiten erforderlich."]
        overview:
        - Spalten zeigen Anzeigename, E-Mail-Adresse, Rollen und Status. Ein Gedankenstrich bedeutet, dass keine Rolle zugeordnet ist.
        - Bei leerem Bestand erscheint ein erklärender Leerzustand. Die Zeilenaktion öffnet die separate Bearbeitungsseite.
        actions:
          create: {label: "\"Benutzer hinzufügen\"", description: "\"Öffnet das Formular für ein neues Benutzerkonto.\"", result: "\"Daten werden erst beim Speichern des Formulars verändert.\""}
          edit: {label: "\"Bearbeiten\"", description: "\"Öffnet Rollen und Aktivstatus des gewählten Kontos.\"", result: "\"Die Benutzer-ID und Auditzuordnung bleiben erhalten.\""}
        image: {src: "\"/assets/images/handbook/administration/users-overview.svg\"", alt: "\"Benutzerübersicht mit Rollen, Status und Bearbeiten-Aktion\""}
      user_create:
        template: administration/user_new.html.twig
        title: Benutzer anlegen
        purpose: Das Formular erstellt ein Konto im aktiven Mandanten und weist die anfänglichen Rollen zu.
        navigation: Administration → Benutzer → Benutzer hinzufügen
        permissions: ["administration.user.write; zuweisbare Rollen müssen im Mandanten vorhanden sein."]
        overview: ["Mehrere Rollen werden mit Strg beziehungsweise Cmd ausgewählt. Vergeben Sie ausschließlich die für die Aufgabe benötigten Rechte."]
        fields:
          display_name: {label: "\"Anzeigename\"", required: true, format: "\"Klarname oder eindeutiger betrieblicher Name\"", example: "\"Erika Muster\"", help: "\"Erscheint in Listen und Auditprotokollen.\"", effect: "\"Wird als sichtbare Identität gespeichert.\"", errors: "\"Leere Namen sind ungültig.\""}
          email: {label: "\"E-Mail-Adresse\"", required: true, format: "\"Gültige und im Mandanten eindeutige E-Mail-Adresse\"", example: "\"erika.muster@example.org\"", help: "\"Dient als Anmeldekennung und SSO-Zuordnung.\"", effect: "\"Identifiziert das Konto dauerhaft.\"", errors: "\"Ungültige oder bereits verwendete Adressen werden abgewiesen.\""}
          password: {label: "\"Initiales Passwort\"", required: true, format: "\"Mindestens 12 Zeichen\"", example: "\"'************'\"", help: "\"Sicher und getrennt übermitteln; niemals ein Standardpasswort verwenden.\"", effect: "\"Wird nur gehasht gespeichert und ermöglicht die erste Anmeldung.\"", errors: "\"Zu kurze Kennwörter verhindern das Anlegen.\""}
          role_ids: {label: "\"Rollen\"", required: false, format: "\"Mehrfachauswahl aus Mandantenrollen\"", example: "\"ROLE_WAREHOUSE_OPERATOR\"", help: "\"Rollen nach dem Minimalprinzip auswählen.\"", effect: "\"Die vereinigten Rollenrechte gelten bei der nächsten Berechtigungsprüfung.\"", errors: "\"Unbekannte oder mandantenfremde Rollen werden abgewiesen.\""}
        actions:
          save: {label: "\"Benutzer hinzufügen\"", description: "\"Prüft Identität, Passwort und Rollen und legt das Konto an.\"", result: "\"Bei Erfolg öffnet sich die Benutzerübersicht mit Bestätigung.\""}
        image: {src: "\"/assets/images/handbook/administration/user-create.svg\"", alt: "\"Formular zum Anlegen eines Benutzers\""}
      user_edit:
        template: administration/user_edit.html.twig
        title: Benutzer bearbeiten
        purpose: Die Seite ändert Rollenzuordnungen und Aktivstatus eines bestehenden Kontos.
        navigation: Administration → Benutzer → Bearbeiten
        permissions: ["administration.user.write; der Benutzer muss zum aktiven Mandanten gehören."]
        overview: ["Name und E-Mail identifizieren das gewählte Konto und sind hier nicht änderbar. Deaktivieren beendet die weitere Nutzung, ohne Auditdaten zu löschen."]
        fields:
          role_ids: {label: "\"Rollen\"", required: false, format: "\"Mehrfachauswahl aus Mandantenrollen\"", example: "\"ROLE_WAREHOUSE_MANAGER\"", help: "\"Entfernen Sie keine für den Betrieb oder die letzte Administration erforderliche Rolle.\"", effect: "\"Ersetzt die bisherigen Rollenzuordnungen vollständig.\"", errors: "\"Unbekannte Rollen und unzulässiger Entzug des letzten Verwaltungsrechts werden abgewiesen.\""}
          active: {label: "\"Benutzer aktiv\"", required: false, format: "\"Checkbox; aktiviert oder deaktiviert\"", example: "\"aktiviert\"", help: "\"Nur aktive Benutzer können neue Sitzungen eröffnen.\"", effect: "\"Deaktivieren sperrt künftige Anmeldungen; Historie und Audit bleiben erhalten.\"", errors: "\"Das eigene letzte Administrationskonto darf nicht unbrauchbar gemacht werden.\""}
        actions:
          save: {label: "\"Änderungen speichern\"", description: "\"Validiert Rollen und Status und speichert sie atomar.\"", result: "\"Bei Erfolg öffnet sich die aktualisierte Übersicht.\""}
        image: {src: "\"/assets/images/handbook/administration/user-edit.svg\"", alt: "\"Benutzer bearbeiten mit Rollen und Aktivstatus\""}
      roles_overview:
        template: administration/roles.html.twig
        title: Rollenübersicht
        purpose: Die Tabelle zeigt Rollen, Anzahl zugeordneter Benutzer und Umfang der Berechtigungen.
        navigation: Administration → Rollen
        permissions: ["administration.role.read; administration.role.write für Anlegen und Bearbeiten."]
        overview: ["Spalten zeigen stabilen Code, Namen, Benutzeranzahl und Anzahl der Rechte. Der Code bleibt die technische Referenz., Die Bearbeiten-Aktion öffnet Name und Berechtigungen; bei leerem Bestand erscheint ein Leerzustand."]
        actions:
          create: {label: "\"Rolle erstellen\"", description: "\"Öffnet ein separates Rollenformular.\"", result: "\"Die Rolle ist erst nach erfolgreichem Speichern verfügbar.\""}
          edit: {label: "\"Bearbeiten\"", description: "\"Öffnet die gewählte Rolle und alle angebotenen Rechte.\"", result: "\"Bestehende Benutzer erhalten die geänderten Rechte bei der nächsten Prüfung.\""}
        image: {src: "\"/assets/images/handbook/administration/roles-overview.svg\"", alt: "\"Rollenübersicht mit Benutzer- und Berechtigungsanzahl\""}
      role_create:
        template: administration/role_new.html.twig
        title: Rolle anlegen
        purpose: Das Formular erstellt eine wiederverwendbare Rolle mit stabiler Kennung und ausgewählten Berechtigungen.
        navigation: Administration → Rollen → Rolle erstellen
        permissions: ["administration.role.write"]
        overview: ["Rechte werden als Mehrfachauswahl angeboten. Fassen Sie nur Berechtigungen zusammen, die zu einem klaren Aufgabenprofil gehören."]
        fields:
          code: {label: "\"Code\"", required: true, format: "\"Großbuchstaben und Unterstriche mit Präfix ROLE_\"", example: "\"ROLE_INBOUND_OPERATOR\"", help: "\"Stabiler technischer Schlüssel; nach Vergabe nicht für einen anderen Zweck wiederverwenden.\"", effect: "\"Referenziert die Rolle in Zuordnungen und Prüfungen.\"", errors: "\"Ungültige oder doppelte Codes werden abgewiesen.\""}
          name: {label: "\"Name\"", required: true, format: "\"Verständliche Aufgabenbezeichnung\"", example: "\"Wareneingang operativ\"", help: "\"Erklärt Administratoren den fachlichen Zweck.\"", effect: "\"Wird in Auswahllisten angezeigt.\"", errors: "\"Ein leerer Name ist ungültig.\""}
          permissions: {label: "\"Berechtigungen\"", required: false, format: "\"Mehrfachauswahl bekannter Berechtigungscodes\"", example: "\"inbound.receipt.read\"", help: "\"Lesen, Schreiben, Ausführen und Freigeben bewusst getrennt vergeben.\"", effect: "\"Bestimmt die erlaubten Aktionen aller zugeordneten Benutzer.\"", errors: "\"Unbekannte Berechtigungscodes werden nicht gespeichert.\""}
        actions:
          save: {label: "\"Rolle erstellen\"", description: "\"Prüft Code, Namen und Rechte und legt die Rolle an.\"", result: "\"Bei Erfolg kann die Rolle Benutzern zugewiesen werden.\""}
        image: {src: "\"/assets/images/handbook/administration/role-create.svg\"", alt: "\"Formular zum Erstellen einer Rolle\""}
      role_edit:
        template: administration/role_edit.html.twig
        title: Rolle bearbeiten
        purpose: Die Seite ändert Anzeigename und Rechte einer bestehenden Rolle; der Code bleibt stabil.
        navigation: Administration → Rollen → Bearbeiten
        permissions: ["administration.role.write"]
        overview: ["Prüfen Sie vor dem Entzug eines Rechts die Anzahl betroffener Benutzer und testen Sie kritische Rollen mit einem separaten Konto."]
        fields:
          name: {label: "\"Name\"", required: true, format: "\"Verständliche Aufgabenbezeichnung\"", example: "\"Wareneingang Leitung\"", help: "\"Beschreibt das aktuelle Aufgabenprofil der Rolle.\"", effect: "\"Ändert die Anzeige in Benutzer- und Rollenlisten.\"", errors: "\"Ein leerer Name verhindert das Speichern.\""}
          permissions: {label: "\"Berechtigungen\"", required: false, format: "\"Mehrfachauswahl aller bekannten Rechte\"", example: "\"inbound.receipt.approve\"", help: "\"Nicht markierte Rechte werden beim Speichern aus der Rolle entfernt.\"", effect: "\"Wirkt auf alle zugeordneten Benutzer bei der nächsten Berechtigungsprüfung.\"", errors: "\"Der Schutz vor Verlust des letzten Verwaltungszugangs kann die Änderung ablehnen.\""}
        actions:
          save: {label: "\"Änderungen speichern\"", description: "\"Ersetzt Namen und Berechtigungsmenge atomar.\"", result: "\"Die Änderung wird auditiert und sofort für neue Prüfungen verwendet.\""}
        image: {src: "\"/assets/images/handbook/administration/role-edit.svg\"", alt: "\"Rolle bearbeiten mit vollständiger Berechtigungsauswahl\""}
      api_clients_overview:
        template: administration/api_clients.html.twig
        title: API-Client-Übersicht
        purpose: Die Tabelle überwacht technische Zugänge, ausführende Benutzer, Nutzung und Aktivstatus.
        navigation: Administration → API-Clients
        permissions: ["administration.api_client.read; Schreibrecht für Erstellen und Bearbeiten."]
        overview: ["Spalten zeigen Name, Client-ID, ausführenden Benutzer, letzte Nutzung und Status. Niemals bedeutet, dass noch kein erfolgreicher Aufruf registriert wurde., Deaktivierte Clients bleiben zur Nachvollziehbarkeit sichtbar, können sich aber nicht mehr authentifizieren."]
        actions:
          create: {label: "\"API-Client erstellen\"", description: "\"Öffnet die sichere Erzeugung eines technischen Zugangs.\"", result: "\"Client-ID und Secret entstehen erst nach dem Speichern.\""}
          edit: {label: "\"Bearbeiten\"", description: "\"Öffnet den Aktivstatus des ausgewählten Clients.\"", result: "\"Der bestehende Zugang kann gesperrt oder wieder freigegeben werden.\""}
        image: {src: "\"/assets/images/handbook/administration/api-clients-overview.svg\"", alt: "\"API-Client-Übersicht mit letzter Nutzung und Status\""}
      api_client_create:
        template: administration/api_client_new.html.twig
        title: API-Client anlegen
        purpose: Das Formular erzeugt einen technischen Zugang mit ausführendem Benutzer und expliziten Rechten.
        navigation: Administration → API-Clients → API-Client erstellen
        permissions: ["administration.api_client.write; der ausführende Benutzer muss aktiv sein."]
        overview: ["Effektiv gilt nur die Schnittmenge aus Client-Rechten und Rechten des ausführenden Benutzers. Verwenden Sie ein dediziertes Dienstkonto."]
        fields:
          name: {label: "\"Name\"", required: true, format: "\"Eindeutiger System- und Zweckname\"", example: "\"ERP Produktion\"", help: "\"Ermöglicht die eindeutige Zuordnung in Audit und Nutzung.\"", effect: "\"Wird in Übersicht und Protokollen angezeigt.\"", errors: "\"Leere Namen sind ungültig.\""}
          acting_user_id: {label: "\"Ausführender Benutzer\"", required: true, format: "\"Einzelauswahl eines aktiven Mandantenkontos\"", example: "\"svc.erp@example.org\"", help: "\"Kein persönliches Administratorkonto verwenden.\"", effect: "\"Fachaktionen werden unter dieser Identität autorisiert und auditiert.\"", errors: "\"Inaktive oder mandantenfremde Benutzer werden abgewiesen.\""}
          permissions: {label: "\"Berechtigungen\"", required: false, format: "\"Mehrfachauswahl angebotener API-Rechte\"", example: "\"inventory.stock.read\"", help: "\"Nur tatsächlich benötigte Endpunkte freigeben.\"", effect: "\"Begrenzt den Zugang zusätzlich zu den Benutzerrechten.\"", errors: "\"Unbekannte Rechte werden nicht gespeichert; fehlende Rechte führen zu Zugriff verweigert.\""}
        actions:
          generate: {label: "\"Zugang erzeugen\"", description: "\"Erstellt Client-ID und Secret einmalig.\"", result: "\"Das Secret erscheint genau einmal auf der Credential-Seite und muss sofort sicher gespeichert werden.\""}
        image: {src: "\"/assets/images/handbook/administration/api-client-create.svg\"", alt: "\"API-Client anlegen mit Benutzer und Berechtigungen\""}
      api_client_edit:
        template: administration/api_client_edit.html.twig
        title: API-Client bearbeiten
        purpose: Die Seite zeigt den unveränderlichen ausführenden Benutzer und steuert den Aktivstatus des Zugangs.
        navigation: Administration → API-Clients → Bearbeiten
        permissions: ["administration.api_client.write"]
        overview: ["Der ausführende Benutzer wird nur lesbar angezeigt. Für einen Identitätswechsel ist ein neuer Client mit neuem Secret anzulegen."]
        fields:
          active: {label: "\"API-Client aktiv\"", required: false, format: "\"Checkbox; aktiviert oder deaktiviert\"", example: "\"deaktiviert\"", help: "\"Bei Verdacht auf Kompromittierung sofort deaktivieren.\"", effect: "\"Deaktivieren sperrt weitere Authentifizierungen, ohne Audit- und Nutzungsdaten zu löschen.\"", errors: "\"Bereits laufende Requests können beendet werden; künftige Anmeldungen werden abgewiesen.\""}
        actions:
          save: {label: "\"Änderungen speichern\"", description: "\"Speichert den Aktivstatus nach CSRF- und Berechtigungsprüfung.\"", result: "\"Die Übersicht zeigt den neuen Status.\""}
        image: {src: "\"/assets/images/handbook/administration/api-client-edit.svg\"", alt: "\"API-Client bearbeiten und Aktivstatus ändern\""}
      api_client_credential:
        template: administration/api_client_credential.html.twig
        title: API-Zugangsdaten sichern
        purpose: Die Sicherheitsseite zeigt das neu erzeugte Credential genau einmal zur sicheren Übernahme.
        navigation: Administration → API-Clients → API-Client erstellen → Zugang erzeugen
        permissions: ["administration.api_client.write; nur unmittelbar nach erfolgreicher Erzeugung erreichbar."]
        overview: ["Das schreibgeschützte Feld enthält das vollständige Credential. Speichern Sie es direkt in einem Secret-Store und niemals in Quellcode, Ticket oder Chat., Nach Verlassen der Seite kann das Secret nicht wiederhergestellt werden; erzeugen Sie bei Verlust einen neuen Zugang."]
        actions:
          copy: {label: "\"Kopieren\"", description: "\"Kopiert das Credential über die Browser-Zwischenablage.\"", result: "\"Der Inhalt bleibt nur lokal in der Zwischenablage und muss anschließend sicher eingefügt und aus der Zwischenablage entfernt werden.\""}
          back: {label: "\"Zur Administration\"", description: "\"Verlässt die Einmalanzeige endgültig.\"", result: "\"Das Credential kann danach nicht erneut angezeigt werden.\""}
        image: {src: "\"/assets/images/handbook/administration/api-client-credential.svg\"", alt: "\"Einmalige Anzeige eines neu erzeugten API-Credentials\""}
    guidance:
      prerequisites:
      - Administrationszugriff und abgestimmtes Aufgabenprofil nach Minimalprinzip.
      permissions:
      - administration.user.read/write, administration.role.read/write, administration.api_client.read/write sowie documentation.handbook.read.
      fields:
      - 'Benutzer: email, display_name, active, role_ids. Rolle: code im Format ROLE_NAME, name, permissions. API-Client: name, permissions, active. OIDC: code, issuer_url, client_id,
        client_secret_env.'
      statuses:
      - Benutzer, API-Clients und Provider sind aktiv oder inaktiv. Rollenänderungen werden auditiert; das eigene letzte Verwaltungsrecht darf nicht entfernt werden.
      errors:
      - Doppelte E-Mail, ungültiger Rollencode, unbekannte Berechtigung, HTTP-Issuer oder Klartext-Secret wird abgewiesen. Das erzeugte API-Secret wird nur einmal angezeigt.
  system_configuration:
    title: Mandanten-, Standort- und Systemkonfiguration
    summary: Grunddaten, Nummernkreise, Strategien, Druck, Status und betriebliche Schwellwerte.
    sections:
      section_1:
        title: Mandanten und Standorte
        paragraphs:
          paragraph_1: Mandanten trennen Daten und Berechtigungen. Standorte bilden organisatorische Lagerorte ab. Pflegen Sie eindeutige Codes, sprechende Namen, Zeitzone, Adresse und
            aktiven Status. Deaktivieren Sie einen Standort erst, wenn keine offenen Prozesse mehr darauf verweisen.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Mandanten und Standorte – Screenshot-Platzhalter
      section_2:
        title: Nummernkreise und Stammdaten
        paragraphs:
          paragraph_1: Nummernkreise definieren Präfix, nächsten Wert und Format für Belege. Ändern Sie produktiv verwendete Nummernkreise nur kontrolliert. Artikel, Geschäftspartner,
            Ladehilfsmittel und Sonderbestandsarten müssen eindeutig und vollständig gepflegt sein.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Nummernkreise und Stammdaten – Screenshot-Platzhalter
      section_3:
        title: Lagerstrategien
        paragraphs:
          paragraph_1: Einlagerungs-, Entnahme-, FEFO-/FIFO-/LIFO- und Nachschubregeln besitzen Prioritäten, Gültigkeitsbedingungen, Quell- und Zielbereiche sowie Schwellwerte. Spezifische
            Regeln werden vor allgemeinen Regeln ausgewertet. Simulieren oder prüfen Sie die Treffermenge vor der Aktivierung.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: 'Platzhalter: Konfigurationsformular'
      section_4:
        title: Drucker, Geräte und Statuswerte
        paragraphs:
          paragraph_1: Drucker und Erfassungsgeräte benötigen eindeutigen Code, Verbindung, Format beziehungsweise Gerätetyp und aktiven Status. Verbindungsgeheimnisse werden als Umgebungsreferenz,
            niemals als Klartext, gespeichert. Testen Sie eine Konfiguration vor der operativen Freigabe.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Drucker, Geräte und Statuswerte – Screenshot-Platzhalter
      section_5:
        title: Änderungen kontrollieren
        paragraphs:
          paragraph_1: Dokumentieren Sie Grund und Zeitpunkt größerer Änderungen. Prüfen Sie danach Auditprotokoll, betroffene Prozesse und mindestens einen positiven sowie einen negativen
            Anwendungsfall.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Änderungen kontrollieren – Screenshot-Platzhalter
    views:
      administration_workspace:
        template: administration/workspace.html.twig
        title: Mandanten- und Systemkonfiguration
        purpose: Die Seite verwaltet Geschäftspartner, Datenräume, OIDC, Nummernkreise, Prozessschalter, Geräteprofile und das technische Betriebsprofil des aktiven Mandanten.
        navigation: Administration → Konfiguration
        permissions:
        - administration.configuration.read zeigt Konfiguration und Änderungsprotokoll; administration.configuration.write erlaubt Änderungen; administration.number_range.use erlaubt Testnummern.
        overview:
        - Jeder Kartenbereich besitzt ein eigenes Formular. Speichern wirkt nur auf diesen Bereich; bereits vorhandene Einträge erscheinen direkt darunter.
        - Lager und Standorte werden nur angezeigt und über die verlinkte Lagertopologie gepflegt. Das Änderungsprotokoll nennt Zeitpunkt, Bereich, Ereignis und Benutzer.
        fields:
          code:
            label: Code
            required: true
            format: Eindeutiger technischer Schlüssel ohne Leerzeichen
            example: CUSTOMER_DE
            help: Nach produktiver Nutzung nicht für einen anderen Zweck wiederverwenden.
            effect: Identifiziert den Datensatz in Prozessen, Schnittstellen und Auditdaten.
            errors: Leere, ungültige oder im jeweiligen Bereich doppelte Codes werden abgewiesen.
            usages: [Geschäftspartner, Datenraum, Identitätsanbieter, Nummernkreis und Geräteprofil]
          name: {label: "Name oder Beschreibung", required: true, format: "Verständliche fachliche Bezeichnung", example: "Hauptkunde Deutschland", help: "Beschreibt den Datensatz für Benutzer und Administratoren.", effect: "Erscheint in Listen und Auswahlen.", errors: "Ein leerer Name verhindert das Speichern.", usages: ["Geschäftspartner, Datenraum, Identitätsanbieter, Nummernkreis, Prozess und Geräteprofil"]}
          partner_type: {label: "Geschäftspartnertyp", required: true, format: "customer; supplier; carrier oder owner", example: "customer", help: "Kunde steht für Empfänger; Lieferant für Beschaffung; Frachtführer für Versand; Eigentümer für Sonderbestand.", effect: "Steuert die fachlich zulässige Verwendung des Partners.", errors: "Nicht angebotene Werte werden abgewiesen."}
          active: {label: "Geschäftspartner aktiv", required: true, format: "Versteckter Standardwert 1 bei Neuanlage", example: "'1'", help: "Neue Partner werden in dieser Maske immer aktiv angelegt.", effect: "Der Partner kann sofort in neuen Vorgängen verwendet werden.", errors: "Eine spätere Deaktivierung darf offene Abhängigkeiten nicht verletzen."}
          business_partner_id: {label: "Zugeordneter Geschäftspartner", required: false, format: "Auswahl eines vorhandenen Partners oder leer", example: "CUSTOMER_DE", help: "Verknüpft den Datenraum optional mit einem Partner.", effect: "Begrenzt beziehungsweise kennzeichnet den organisatorischen Datenkontext.", errors: "Unbekannte oder mandantenfremde IDs werden abgewiesen."}
          protocol: {label: "Identitätsprotokoll", required: true, format: "Auswahl; aktuell oidc", example: "oidc", help: "Bestimmt das unterstützte Single-Sign-on-Verfahren.", effect: "Aktiviert Discovery, State, Nonce und PKCE für den Provider.", errors: "Nicht unterstützte Protokolle werden nicht gespeichert."}
          issuer_url: {label: "Issuer-URL", required: true, format: "Absolute HTTPS-URL des OIDC-Issuers", example: "'https://login.example.org/realms/webwms'", help: "Muss exakt dem Issuer in Discovery und Token entsprechen.", effect: "Liefert Autorisierungs-, Token- und Schlüsselendpunkte.", errors: "HTTP, ungültige URLs oder abweichende Discovery-Issuer werden abgewiesen."}
          client_id: {label: "OIDC Client-ID", required: true, format: "Beim Provider registrierte öffentliche Kennung", example: "webwms-production", help: "Keine Secret-Werte in dieses Feld eintragen.", effect: "Identifiziert WebWMS beim Identitätsanbieter.", errors: "Eine falsche Client-ID führt beim Provider zum Anmeldefehler."}
          client_secret_env: {label: "Umgebungsvariable für Client-Secret", required: true, format: "Name einer Server-Umgebungsvariable", example: "WEBWMS_OIDC_CLIENT_SECRET", help: "Nur die Referenz speichern; das Secret niemals im Formular eingeben.", effect: "WebWMS liest das Secret zur Laufzeit aus der Betriebsumgebung.", errors: "Fehlende oder nicht gesetzte Variablen verhindern den SSO-Callback."}
          scopes: {label: "OIDC Scopes", required: true, format: "Leerzeichengetrennte Scope-Namen", example: "openid profile email", help: "openid ist verpflichtend; email wird für die Benutzerzuordnung benötigt.", effect: "Bestimmt die vom Provider angeforderten Claims.", errors: "Fehlende openid- oder email-Claims verhindern eine sichere Zuordnung."}
          enabled: {label: "Aktiviert", required: true, format: "Checkbox beziehungsweise versteckter Standardwert 1", example: "'1'", help: "Aktiviert den jeweils neu angelegten Provider, Nummernkreis, Prozess oder das Geräteprofil.", effect: "Nur aktivierte Konfigurationen werden operativ ausgewertet.", errors: "Deaktivierte Konfigurationen stehen neuen Vorgängen nicht zur Verfügung.", usages: ["Identitätsanbieter, Nummernkreis, Prozessschalter und Geräteprofil"]}
          object_type: {label: "Objektart", required: true, format: "Stabiler fachlicher Belegtyp", example: "outbound_order", help: "Legt fest, für welche Entität der Nummernkreis verwendet wird.", effect: "Verknüpft die nächste Nummer eindeutig mit einem Belegtyp.", errors: "Doppelte aktive Zuordnungen können zu uneindeutigen Nummern führen und werden abgewiesen."}
          prefix: {label: "Präfix", required: false, format: "Kurzer statischer Text vor der laufenden Nummer", example: "OUT-", help: "Verwenden Sie nur Zeichen, die Zielsysteme und Etiketten unterstützen.", effect: "Wird jeder erzeugten Nummer vorangestellt.", errors: "Zu lange oder unzulässige Zeichenfolgen werden abgewiesen."}
          padding: {label: "Stellenzahl", required: true, format: "Ganzzahl von 1 bis 18", example: "'8'", help: "Füllt den laufenden Wert links mit Nullen auf.", effect: "Aus Wert 42 und Stellenzahl 8 wird 00000042.", errors: "Werte außerhalb 1 bis 18 verhindern das Speichern."}
          next_value: {label: "Nächster Wert", required: true, format: "Positive Ganzzahl", example: "'10001'", help: "Bei produktiven Nummernkreisen nur nach Abstimmung erhöhen; niemals zurücksetzen.", effect: "Die nächste Vergabe verwendet diesen Wert und erhöht ihn atomar.", errors: "Null, negative Werte oder Rücksprünge mit Kollisionsrisiko werden abgewiesen."}
          gs1_company_prefix: {label: GS1-Unternehmenspräfix, required: false, format: Von GS1 vergebene Ziffernfolge, example: '426012345', help: Nur für GS1-konforme Identifikatoren pflegen., effect: Wird bei unterstützten SSCC- oder GS1-Nummern berücksichtigt., errors: Nicht numerische oder fachlich unpassende Werte führen zu ungültigen Kennzeichen.}
          suffix: {label: "Suffix", required: false, format: "In dieser Maske leerer versteckter Wert", example: "''", help: "Die Neuanlage verwendet kein Suffix.", effect: "Hinter der laufenden Nummer wird kein Text ergänzt.", errors: "Suffixe sind über diese vereinfachte Maske nicht konfigurierbar."}
          maximum_value: {label: "Maximalwert", required: false, format: "In dieser Maske leerer versteckter Wert", example: "''", help: "Es wird bei der Neuanlage keine zusätzliche Obergrenze gesetzt.", effect: "Die technische Zahlenkapazität bleibt die Grenze.", errors: "Überlauf oder erschöpfter Zahlenraum verhindert weitere Vergaben."}
          process_key: {label: "Prozessschlüssel", required: true, format: "Stabiler Schlüssel in Kleinbuchstaben und Unterstrichen", example: "inbound_quality", help: "Muss dem von der Anwendung ausgewerteten Prozess entsprechen.", effect: "Wählt den aktivierbaren Prozess und seine Konfiguration.", errors: "Unbekannte oder doppelte Schlüssel werden abgewiesen."}
          configuration: {label: "Prozesskonfiguration", required: false, format: "Valides JSON-Objekt", example: "'{\"require_photo\":true,\"max_deviation_percent\":5}'", help: "Erlaubt prozessabhängige Parameter; unbekannte Eigenschaften vermeiden und keine Secrets eintragen.", effect: "Wird bei der Prozessausführung versioniert ausgewertet.", errors: "Ungültiges JSON, falsche Datentypen oder nicht unterstützte Eigenschaften verhindern das Speichern."}
          device_type: {label: "Gerätetyp", required: true, format: "desktop; tablet oder scanner", example: "scanner", help: "Wählen Sie scanner für MDE-Geräte mit Hardware-Scanereignissen.", effect: "Steuert Darstellung und gerätespezifische Eingabelogik.", errors: "Nicht angebotene Typen werden abgewiesen."}
          start_route: {label: "Startroute", required: true, format: "Interner absoluter Pfad beginnend mit /", example: "/v3/inbound/receipts", help: "Muss auf eine für das Geräteprofil berechtigte WebWMS-Seite zeigen.", effect: "Öffnet diese Ansicht nach Anmeldung beziehungsweise Profilstart.", errors: "Externe URLs, unbekannte oder nicht erlaubte Routen werden abgewiesen oder führen zu Zugriff verweigert."}
          scan_suffix: {label: "Scan-Abschlusszeichen", required: false, format: "Tastenname des Scanner-Suffixes", example: "Enter", help: "Muss zur Gerätekonfiguration passen; häufig Enter oder Tab.", effect: "Löst nach einem Hardware-Scan die Verarbeitung der Eingabe aus.", errors: "Ein abweichendes Suffix lässt Scans wie unvollständige Tastatureingaben erscheinen."}
          fullscreen: {label: "Vollbildmodus", required: true, format: "Versteckter Standardwert 1", example: "'1'", help: "Neue Geräteprofile starten in der reduzierten Vollbilddarstellung.", effect: "Blendet für operative Geräte nicht benötigte Navigationselemente aus.", errors: "Der Wert ist in dieser Maske nicht änderbar."}
          deployment_mode: {label: "Betriebsmodus", required: true, format: "saas; on_premises oder hybrid", example: "on_premises", help: "Beschreibt die technische Bereitstellungsform, nicht den fachlichen Mandanten.", effect: "Steuert betriebliche Hinweise und verfügbare Integrationswege.", errors: "Ein falscher Modus kann zu ungeeigneten Betriebsannahmen führen."}
          public_url: {label: "Öffentliche URL", required: true, format: "Absolute HTTPS-Basis-URL ohne internen Hostnamen", example: "'https://wms.example.org'", help: "Muss von Browsern und angebundenen Systemen erreichbar sein.", effect: "Basis für Rückleitungen, Links und externe Callbacks.", errors: "Ungültige oder nicht erreichbare URLs brechen SSO und Integrationscallbacks."}
          storage_driver: {label: "Speicher-Treiber", required: true, format: "local; s3 oder azure", example: "s3", help: "Muss mit der bereitgestellten Serverkonfiguration und den Credentials übereinstimmen.", effect: "Bestimmt den Ablageort für Dokumente und Medien.", errors: "Fehlende Bucket-, Container- oder Dateisystemrechte verursachen Speicherfehler."}
          queue_transport: {label: "Queue-Transport", required: true, format: "sync; doctrine oder rabbitmq", example: "rabbitmq", help: "sync nur für einfache Entwicklung; produktiv einen überwachten asynchronen Transport verwenden.", effect: "Bestimmt, ob Hintergrundaufgaben direkt oder über eine Warteschlange laufen.", errors: "Fehlende Worker oder Verbindungsdaten lassen Nachrichten unbearbeitet."}
          release_channel: {label: "Release-Kanal", required: true, format: "stable oder preview", example: "stable", help: "Stable für Produktivbetrieb; Preview nur für kontrollierte Vorabtests verwenden.", effect: "Legt den vorgesehenen Aktualisierungskanal fest.", errors: "Preview kann noch nicht freigegebene Änderungen enthalten."}
        actions:
          create_resource: {label: "Konfiguration anlegen", description: "Validiert und speichert ausschließlich den jeweiligen Kartenbereich.", result: "Der neue Eintrag erscheint in der zugehörigen Liste und wird auditiert."}
          next_number: {label: "Testnummer", description: "Vergibt tatsächlich die nächste Nummer des gewählten Nummernkreises.", result: "next_value wird dauerhaft und atomar erhöht; die Aktion ist nicht nur eine Vorschau."}
          save_deployment: {label: "Betriebsprofil speichern", description: "Speichert Modus, URL, Speicher, Queue und Release-Kanal gemeinsam.", result: "Neue Hintergrund- und Integrationsvorgänge verwenden die aktualisierte Konfiguration."}
          open_topology: {label: "Lagertopologie öffnen", description: "Wechselt zur separaten Pflege von Standort, Lager, Bereichen und Plätzen.", result: "Auf dieser Workspace-Seite werden keine Topologiedaten geändert."}
        image:
          src: /assets/images/handbook/administration/system-configuration.svg
          alt: Systemkonfiguration mit Partnern, OIDC, Nummernkreisen, Prozessen, Geräten und Betriebsprofil
    guidance:
      prerequisites:
      - administration.configuration.read/write und abgestimmte Mandanten-, Standort- und Betriebsvorgaben.
      permissions:
      - administration.configuration.read/write und administration.number_range.use.
      fields:
      - 'Workspace: code, name, address, timezone, active. Nummernkreis: prefix, suffix, next_value, padding, gs1_company_prefix. Prozess: process_key, configuration_json, version, enabled.
        Deployment: deployment_mode, release_channel, public_url, storage_driver, queue_transport.'
      statuses:
      - Deaktivierte Standorte und Prozesse nehmen keine neuen Vorgänge an. Testnummern erhöhen next_value dauerhaft und atomar.
      errors:
      - Nicht eindeutige Codes, ungültige Zeitzonen/URLs, fehlerhaftes JSON oder Deaktivierung mit offenen Abhängigkeiten verhindern die Änderung.
  warehouse_and_stock:
    title: Lagertopologie, Bestand und Rückverfolgung
    summary: Lagerstruktur, Belegung, Bestandsdimensionen, Bewegungen, Sperren und Strategien.
    sections:
      section_1:
        title: Lagertopologie konfigurieren
        paragraphs:
          paragraph_1: Die Hierarchie besteht aus Standort, Lager, Bereich und Lagerplatz. Legen Sie über den separaten Menüpunkt neue Elemente an und bearbeiten Sie bestehende Elemente
            aus der Tabellenzeile. Codes müssen innerhalb ihres Kontexts eindeutig sein. Kapazität, Priorität, Bereichstyp und Status beeinflussen Einlagerung und Wegeoptimierung.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: 'Platzhalter: Lagertopologie'
      section_2:
        title: Bestände lesen und bewegen
        paragraphs:
          paragraph_1: Echtzeitbestand zeigt Artikel, Lagerplatz, Menge, Status, Charge, Seriennummer, Mindesthaltbarkeitsdatum und Sonderbestand. Öffnen Sie die Bewegungshistorie für
            den revisionssicheren Ursprung einer Menge. Umlagerungen prüfen Quellbestand, Zieldimension und Berechtigung atomar.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Bestände lesen und bewegen – Screenshot-Platzhalter
      section_3:
        title: Chargen, Seriennummern und MHD
        paragraphs:
          paragraph_1: Chargen fassen gleichartige Mengen zusammen. Seriennummern identifizieren Einzelstücke und dürfen nicht mehrfach aktiv geführt werden. FEFO priorisiert das früheste
            verwendbare MHD; gesperrte oder abgelaufene Bestände werden nicht regulär allokiert.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Chargen, Seriennummern und MHD – Screenshot-Platzhalter
      section_4:
        title: Sperren und Sonderbestand
        paragraphs:
          paragraph_1: Wählen Sie Sperrgrund, Menge und betroffene Bestandsdimension. Prüf- und Freigabeschritte werden getrennt protokolliert. Sonderbestandskennzeichen dokumentieren
            Eigentum oder Verwendungszweck und bleiben bei Bewegungen erhalten.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Sperren und Sonderbestand – Screenshot-Platzhalter
      section_5:
        title: Grafische Belegung und Rückverfolgung
        paragraphs:
          paragraph_1: Die Lagebelegung visualisiert freie, belegte, gesperrte und überlastete Plätze. Die Rückverfolgung verbindet Zugang, Bewegung, Allokation, Pick, Packstück und
            Versand. Grenzen Sie über Artikel, Charge, Seriennummer oder Zeitraum ein.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Grafische Belegung und Rückverfolgung – Screenshot-Platzhalter
    guidance:
      prerequisites:
      - Standort, Lager, Bereich, Gang, Platz und Artikel sind aktiv und mandantenzugehörig.
      permissions:
      - inventory.topology.read/write, inventory.overview.read, inventory.stock.read/transfer, inventory.stock.movement.read, inventory.traceability.read, Rechte für special_stock, selection_rule
        und stock_block.
      fields:
      - 'Topologie: site_id, warehouse_id, area_id, aisle_id, code, type, capacity_quantity, priority, active. Bestand: product_id, location_id, quantity, status, batch_number, serial_number,
        expires_at, owner_reference. Sperre/Strategie: reason_id, selection_type, selection_value, sequence_number.'
      statuses:
      - Bestand kann available, blocked oder fachlich klassifiziert sein. Sperren wechseln open → reviewed → released; jede Bewegung bleibt im Ledger.
      errors:
      - Negative Bestände, doppelte Seriennummern, unzulässige Statuswechsel, volle Zielplätze oder nicht passende Gefahrstoff-/Lagerregeln werden abgewiesen.
  inventory_counting:
    title: Inventur und Bestandskontrolle
    summary: Stichtag, permanente Inventur, Nulldurchgang, Zählung und Differenzfreigabe.
    sections:
      section_1:
        title: Inventur vorbereiten
        paragraphs:
          paragraph_1: Wählen Sie Inventurart, Standort, Lagerbereich und Stichtag. Das System verhindert parallele offene Inventuren desselben Bereichs. Der erzeugte Sollbestand ist
            ein unveränderlicher Snapshot; Bewegungen nach dem Start werden separat nachvollzogen.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Inventur vorbereiten – Screenshot-Platzhalter
      section_2:
        title: Zählen und einreichen
        paragraphs:
          paragraph_1: Erfassen Sie Zählmenge und bei Bedarf Charge, Seriennummer oder Bemerkung. Blindzählung blendet den Sollwert aus. Reichen Sie erst ein, wenn alle Positionen bearbeitet
            sind. Nulldurchgangsinventuren entstehen ereignisbezogen, permanente Inventuren anhand fälliger Pläne.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: 'Platzhalter: Inventurbeleg und Zählung'
      section_3:
        title: Differenzen freigeben
        paragraphs:
          paragraph_1: Abweichungen benötigen eine berechtigte zweite Person. Prüfen Sie Soll, Ist, Bewegungen und Begründung. Freigabe bucht die Korrektur ins Ledger; Ablehnung oder
            Nachzählung verändert den Arbeitsstatus, ohne die ursprüngliche Zählung zu löschen.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Differenzen freigeben – Screenshot-Platzhalter
      section_4:
        title: Abschluss
        paragraphs:
          paragraph_1: Schließen Sie die Inventur erst nach Bearbeitung aller Differenzen. Kontrollieren Sie Abschlussstatus, Korrekturbuchungen und Auditprotokoll.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Abschluss – Screenshot-Platzhalter
    guidance:
      prerequisites:
      - Eindeutig abgegrenzter Lagerbereich; parallele offene Inventuren desselben Bereichs sind nicht zulässig.
      permissions:
      - inventory.control.read, inventory.count.write/execute/approve, inventory.hazard.write, inventory.bom.write/execute und inventory.load_carrier.write.
      fields:
      - 'Plan: scope, schedule_type, interval_days, next_due_at. Zählung: location_id, product_id, batch, serial, actual_quantity, note. Freigabe: decision, reason. Gefahrstoff/Stückliste/LHM:
        Codes, Mengen, Restriktionen und Komponenten.'
      statuses:
      - Inventur open → counted → completed. Differenzen benötigen eine zweite berechtigte Person; Freigabe erzeugt eine Ledgerkorrektur.
      errors:
      - Doppelter offener Beleg, fehlende Zählposition, negative Menge, Selbstfreigabe oder Abschluss mit offenen Differenzen wird verhindert.
  inbound:
    title: Wareneingang und Einlagerung
    summary: Bestellungen, Avis, geplante und ungeplante Zugänge, QS, Abweichungen und Putaway.
    sections:
      section_1:
        title: Geplanten Wareneingang bearbeiten
        paragraphs:
          paragraph_1: Suchen Sie Bestellung oder Avis, öffnen Sie den Beleg und prüfen Sie Lieferant, Artikel, erwartete Menge und Termin. Erfassen Sie die tatsächlich eingetroffene
            Menge sowie Charge, Seriennummer, MHD und Ladehilfsmittel. Teilmengen bleiben offen, sofern der Beleg dies zulässt.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Geplanten Wareneingang bearbeiten – Screenshot-Platzhalter
      section_2:
        title: Ungeplanten Zugang erfassen
        paragraphs:
          paragraph_1: Wählen Sie Mandant, Standort, Lieferant beziehungsweise Herkunft, Artikel und Menge. Begründen Sie den ungeplanten Zugang. Dubletten werden über externe Referenzen
            und Idempotenzschlüssel verhindert.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: 'Platzhalter: Wareneingangsprüfung'
      section_3:
        title: Qualitätsprüfung und Abweichungen
        paragraphs:
          paragraph_1: Arbeiten Sie die konfigurierte Checkliste ab. Mengen-, Identitäts- oder Qualitätsabweichungen erzeugen einen kontrollierten Fall. Gesperrte Ware bleibt unverfügbar,
            bis eine berechtigte Person freigibt oder ablehnt. Entscheidungen benötigen einen Grund und werden auditiert.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Qualitätsprüfung und Abweichungen – Screenshot-Platzhalter
      section_4:
        title: Einlagerung
        paragraphs:
          paragraph_1: Lassen Sie anhand der aktiven Strategie einen Zielplatz vorschlagen oder wählen Sie bei entsprechender Berechtigung einen zulässigen Platz. Prüfen Sie Kapazität,
            Gefahrstoffregeln, Artikelverträglichkeit und Status. Bestätigen Sie Quell- und Zielscan; danach wird der Bestand atomar umgebucht.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Einlagerung – Screenshot-Platzhalter
    guidance:
      prerequisites:
      - Aktiver Lieferant, Artikel, Standort, Empfangsbereich und bei geplantem Zugang Bestellung beziehungsweise Avis.
      permissions:
      - inbound.planned.read/receive/inspect/resolve/putaway sowie inbound.receipt.read/write/book.
      fields:
      - 'Bestellung/Avis: order_number, supplier_reference, expected_at, product_id, quantity. Empfang: delivery_note, actual_quantity, batch, serial_number, expires_at, load_unit. QS:
        questions, accepted, discrepancy_reason, resolution_note. Einlagerung: source_location_id, target_location_id.'
      statuses:
      - planned → partially_received/received → inspected → released/blocked → putaway → completed. Ungeplante Zugänge bleiben bis Buchung kontrolliert.
      errors:
      - Überavisierung, Übermenge, doppelte externe Referenz, fehlgeschlagene QS, gesperrte Ware oder ungültiger Zielplatz blockiert den Folgeschritt.
  fulfillment_and_outbound:
    title: Auftrag, Allokation, Kommissionierung, Packen und Versand
    summary: Der vollständige Ausgangsprozess vom Kundenauftrag bis zur Verladung und Retoure.
    sections:
      section_1:
        title: Auftrag anlegen und freigeben
        paragraphs:
          paragraph_1: Erfassen oder importieren Sie Empfänger, Liefertermin, Positionen, Mengen und Versandvorgaben. Die Freigabe prüft Stammdaten und verfügbaren Bestand. Allokationen
            reservieren konkrete Bestandsdimensionen nach der aktiven Entnahmestrategie.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Auftrag anlegen und freigeben – Screenshot-Platzhalter
      section_2:
        title: Kommissionieren
        paragraphs:
          paragraph_1: Erstellen oder bündeln Sie Picklisten, weisen Sie sie einem Benutzer zu und optimieren Sie bei Bedarf die Route. Scannen Sie Lagerplatz, Artikel, Charge oder Seriennummer
            und bestätigen Sie die Menge. Fehlmengen werden als Ausnahme erfasst und nicht stillschweigend übersprungen.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: 'Platzhalter: Mobile Kommissionierung'
      section_3:
        title: Packen und Versand
        paragraphs:
          paragraph_1: Öffnen Sie den Packauftrag, wählen Sie Packmittel und ordnen Sie Positionen einem Packstück zu. Gewicht und Abmessungen können manuell oder über ein Messgerät
            erfasst werden. Erzeugen Sie nach erfolgreicher Carrier-Anfrage das Versandlabel. Fehlerhafte Anfragen bleiben wiederholbar und nachvollziehbar.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Packen und Versand – Screenshot-Platzhalter
      section_4:
        title: Verladen und zustellen
        paragraphs:
          paragraph_1: Fassen Sie Sendungen in einem Manifest zusammen, bestätigen Sie Verladung per Scan und schließen Sie das Manifest ab. Zustellstatus und ERP-Rückmeldungen werden
            über die Integration verarbeitet. Storno ist nur in zulässigen Zuständen möglich.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Verladen und zustellen – Screenshot-Platzhalter
      section_5:
        title: Retouren
        paragraphs:
          paragraph_1: Identifizieren Sie ursprüngliche Sendung und Artikel, erfassen Sie Grund und Zustand und entscheiden Sie zwischen Wiedereinlagerung, Sperre, Nacharbeit oder Ausschuss.
            Jede Entscheidung erzeugt die passende Bestandsbewegung und einen Auditnachweis.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Retouren – Screenshot-Platzhalter
    guidance:
      prerequisites:
      - Freigegebener Auftrag, verfügbarer Bestand, Packmittel, Carrier-Verbindung, Druckroute und Verladeplanung.
      permissions:
      - outbound.order.read/write/release; fulfillment.pick.read/write/assign/execute/control/optimize/wave.write; fulfillment.pack.*, fulfillment.ship.*, fulfillment.loading.* und fulfillment.transport.*.
      fields:
      - 'Auftrag: customer_reference, destination_name/address, planned_for, product_id, quantity. Pick: pick_list_id, assigned_to, scan_value, actual_quantity. Pack: packaging_note,
        weight_grams, length/width/height_mm. Versand: carrier, service, label_type, tracking_number. Verladung: shipment_ids, vehicle_reference, departure_at.'
      statuses:
      - Auftrag draft/released/allocated; Pick open/assigned/in_progress/completed; Pack open/completed; Sendung prepared/dispatched; Manifest open/completed.
      errors:
      - Fehlbestand, falscher Scan, überhöhte Pickmenge, unvollständiges Packstück, Carrierfehler, fehlendes Label oder bereits abgeschlossenes Manifest verhindert die Aktion.
  integrations_and_devices:
    title: ERP, Carrier, Drucker, Scanner, Messgeräte und WCS
    summary: Externe Verbindungen konfigurieren, testen, überwachen und sicher betreiben.
    sections:
      section_1:
        title: Verbindungen konfigurieren
        paragraphs:
          paragraph_1: Legen Sie pro Mandant Verbindungstyp, HTTPS-Endpunkt, Authentifizierungsreferenz, Zeitlimits, Wiederholungsregeln und aktiven Status fest. Secrets werden ausschließlich
            über Umgebungsreferenzen aufgelöst. Nutzen Sie die Testfunktion, bevor die Verbindung produktive Nachrichten erhält.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Verbindungen konfigurieren – Screenshot-Platzhalter
      section_2:
        title: ERP und Datenaustausch
        paragraphs:
          paragraph_1: Mappings ordnen Quell- und Zielfelder sowie Transformationen zu. Importaufträge zeigen Format, Ressourcentyp, Zeilenzahl, Status und Fehler. Korrigieren Sie Mapping
            oder Quelldaten und starten Sie fehlerhafte Jobs kontrolliert neu.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: ERP und Datenaustausch – Screenshot-Platzhalter
      section_3:
        title: Carrier und Druck
        paragraphs:
          paragraph_1: Carrier-Verbindungen erzeugen Labels und Statusabfragen. Drucker besitzen Warteschlange, Format und Verbindung. Prüfen Sie Druckvorschau, Zielgerät und Wiederholungsstatus,
            bevor Sie einen Auftrag erneut senden.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: 'Platzhalter: Integrationsverbindung und Test'
      section_4:
        title: Scanner, Waagen und Volumenmessung
        paragraphs:
          paragraph_1: Registrieren Sie Geräte mit eindeutigem Code und Typ. Scans und Messungen verwenden eine Nachrichten-ID zur idempotenten Verarbeitung. Ordnen Sie das Gerät dem
            richtigen Standort zu und prüfen Sie Einheit, Messbereich und Zeitstempel.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Scanner, Waagen und Volumenmessung – Screenshot-Platzhalter
      section_5:
        title: WCS und Lagerautomation
        paragraphs:
          paragraph_1: Automationsbefehle besitzen Zielsystem, Befehlstyp, Nutzdaten und Status. Überwachen Sie Annahme, Ausführung und technische Fehler. Ein manueller Retry darf nur
            bei einem idempotenten oder eindeutig abgesicherten Befehl erfolgen.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: WCS und Lagerautomation – Screenshot-Platzhalter
    guidance:
      prerequisites:
      - Erreichbarer Endpunkt, abgestimmtes Protokoll, Mandantenzuordnung und Secret als Umgebungsvariable.
      permissions:
      - Passende integration.erp_connection, carrier_connection, device, measurement, printer/print_job und wcs Rechte für read/write/execute.
      fields:
      - 'Verbindung: name, endpoint_url, credential_env, active, connect/read_timeout_ms. Gerät: code, device_type, protocol, framing, scan_suffix, site_id. Mapping: system_type, message_type,
        source_field, target_field, transformation. Nachricht: message_id, payload, reference.'
      statuses:
      - Verbindungen/Geräte active/inactive. Jobs und Befehle pending → processing/sent → acknowledged/completed oder failed.
      errors:
      - DNS/Timeout, 401/403, ungültiges Zertifikat, Mappingfehler, unbekanntes Gerät oder doppelte message_id wird protokolliert und nicht als Erfolg behandelt.
  platform_and_extensions:
    title: Plattformfunktionen und erweiterte Module
    summary: Shopfloor, KPI, Partnerportal, Events, VAS sowie regelbasierte Erweiterungen.
    sections:
      section_1:
        title: Shopfloor und KPI
        paragraphs:
          paragraph_1: Shopfloor-Aufgaben bündeln operative Arbeit nach Priorität, Bereich und Status. KPI-Definitionen legen Metrik, Aggregation, Zielwert und Zeitraum fest. Prüfen
            Sie Filter und Datenzeitraum, bevor Sie Abweichungen bewerten.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Shopfloor und KPI – Screenshot-Platzhalter
      section_2:
        title: Partnerportal und Eventcenter
        paragraphs:
          paragraph_1: Partnerkonten erhalten explizite Rechte für freigegebene Daten. Das Eventcenter zeigt fachliche Ereignisse und Bearbeitungsstatus. Quittieren Sie nur Ereignisse,
            deren Ursache verstanden oder behoben wurde.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Partnerportal und Eventcenter – Screenshot-Platzhalter
      section_3:
        title: Lagergeld und Dienstleistungen
        paragraphs:
          paragraph_1: Lagergeldregeln verwenden Zeitraum, Bestand, Tarif und Abrechnungsgrundlage. VAS-Aufträge beschreiben Leistung, Menge, Status und Nachweis. Kontrollieren Sie Tarifgültigkeit
            und Bezugsdaten vor der Abrechnung.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: 'Platzhalter: Plattform-Kontrollzentrum'
      section_4:
        title: Erweiterte Konfigurationen
        paragraphs:
          paragraph_1: Erweiterungsmodule decken Ressourcen wie Compliance-, Qualitäts-, Produktions-, Dock- und Yard-Konfigurationen ab. Legen Sie Regeln in der Konfigurationsansicht
            an und führen Sie operative Vorgänge in der getrennten Prozessansicht aus. Statuswechsel, Freigaben und externe Nachweise werden auditiert.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Erweiterte Konfigurationen – Screenshot-Platzhalter
    guidance:
      prerequisites:
      - Aktivierte Plattformfunktion und gültige Partner-, Tarif-, Regel- oder Workflowkonfiguration.
      permissions:
      - platform.read/write/execute und platform.extension.read/write/execute. Partnerkonten besitzen zusätzlich eigene freigegebene Scopes.
      fields:
      - 'Task/KPI: title, task_type, priority, metric, aggregation, target_value. Partner: business_partner_id, user_id, permissions. Abrechnung/VAS: service_id, quantity, unit_price,
        free_days. Erweiterung: resource_type, configuration_json, workflow, decision, evidence.'
      statuses:
      - Aufgaben und Workitems folgen definierten Übergängen; Abrechnungen, Compliance- und Qualitätsentscheidungen werden auditiert.
      errors:
      - Fehlende Regel, ungültiger Übergang, abgelaufener Tarif, unbekannter Partner oder unvollständiger Nachweis verhindert Ausführung beziehungsweise Freigabe.
  api_and_automation:
    title: API, Outbox, Transportadapter und Automatisierung
    summary: OpenAPI, API-Schlüssel, zuverlässige Nachrichten, Protokolle und Betriebsüberwachung.
    sections:
      section_1:
        title: API verwenden
        paragraphs:
          paragraph_1: Öffnen Sie die API-Dokumentation über den separaten Sidebar-Link. Wählen Sie Ressource und Operation, prüfen Sie erforderliche Berechtigung, Header und Schema.
            API-Schlüssel werden im Header übertragen und niemals in URL, Log oder Screenshot veröffentlicht.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: API verwenden – Screenshot-Platzhalter
      section_2:
        title: Outbox überwachen
        paragraphs:
          paragraph_1: Die Outbox entkoppelt fachliche Transaktionen von der externen Zustellung. Filtern Sie nach Status, Ziel und Zeitraum. Prüfen Sie Payload und letzten Fehler. Wiederholen
            Sie nur nach Beseitigung der Ursache; manuelle Quittierung benötigt eine fachliche Begründung.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: 'Platzhalter: Outbox und Transportstatus'
      section_3:
        title: Transportadapter
        paragraphs:
          paragraph_1: HTTP-, Datei-, TCP- und serielle Adapter benötigen Endpunkt, Zeitlimit, Zeichensatz beziehungsweise Framing und Secret-Referenz. Testen Sie Erreichbarkeit und
            Antwortformat. Protokollieren Sie keine Zugangsdaten oder personenbezogenen Nutzdaten unnötig.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Transportadapter – Screenshot-Platzhalter
      section_4:
        title: Worker und Scheduler
        paragraphs:
          paragraph_1: Asynchrone Nachrichten benötigen laufende Messenger-Worker. Zeitgesteuerte Aufgaben starten fällige Jobs wie Inventur, Nachschub oder Statusabgleich. Überwachen
            Sie Queue-Länge, Fehlerschlange, Laufzeit und letzten erfolgreichen Durchlauf.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Worker und Scheduler – Screenshot-Platzhalter
    guidance:
      prerequisites:
      - Aktiver API-Client oder Adapter, laufende Messenger-Worker, gültige Secrets und erreichbares Zielsystem.
      permissions:
      - Explizite API-Client-Scopes sowie integration.outbox.read/retry/acknowledge, integration.automation.* und integration.transport.*.
      fields:
      - 'API: X-API-Key, Content-Type, Idempotency-Key, Request-ID und JSON-Body. Outbox: aggregate_type/id, message_type, destination, payload, status. Transport: adapter_type, destination,
        protocol, framing, credential_env, timeouts.'
      statuses:
      - Outbox pending → processing → published oder failed. Transport delivery queued → sent/acknowledged oder failed. Wiederholungen erhöhen Versuchszähler.
      errors:
      - 401/403 Authentifizierung, 409 Konflikt, 422 Validierung, Timeout oder negative Zielquittung. Retry nur nach Prüfung, ob der Empfänger bereits verarbeitet hat.
  troubleshooting:
    title: Fehlerbehebung und Support
    summary: Typische Bedienfehler eingrenzen, sichere Wiederholung und verwertbare Supportdaten.
    sections:
      section_1:
        title: Datensatz oder Menü fehlt
        paragraphs:
          paragraph_1: Prüfen Sie Mandant, Standort, Rolle, aktive Filter und Status. Setzen Sie Suche und Pagination zurück. Ein fehlender Menüpunkt weist meist auf eine nicht erteilte
            Leseberechtigung hin.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Datensatz oder Menü fehlt – Screenshot-Platzhalter
      section_2:
        title: Aktion ist nicht möglich
        paragraphs:
          paragraph_1: Lesen Sie die Validierungsmeldung und prüfen Sie Pflichtfelder, Belegstatus, offene Vorgängeraktionen, Bestandsverfügbarkeit und konkurrierende Bearbeitung. Wiederholen
            Sie eine schreibende Aktion nicht unkontrolliert.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Aktion ist nicht möglich – Screenshot-Platzhalter
      section_3:
        title: Integration meldet einen Fehler
        paragraphs:
          paragraph_1: Prüfen Sie Verbindungstest, Secret-Referenz, Zielsystem, Outboxstatus und Fehlermeldung. Entscheiden Sie, ob der externe Auftrag bereits verarbeitet wurde, bevor
            Sie einen Retry auslösen.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: 'Platzhalter: Fehlermeldung und Auditprotokoll'
      section_4:
        title: Supportfall vorbereiten
        paragraphs:
          paragraph_1: Übermitteln Sie Zeitpunkt mit Zeitzone, Mandant, Standort, Route, Belegreferenz, erwartetes und tatsächliches Verhalten sowie Korrelations- oder Nachrichten-ID.
            Entfernen Sie Passwörter, API-Schlüssel und unnötige personenbezogene Daten aus Screenshots und Logs.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Supportfall vorbereiten – Screenshot-Platzhalter
      section_5:
        title: Audit und Wiederherstellung
        paragraphs:
          paragraph_1: Nutzen Sie Bewegungshistorie, Auditereignisse und Outbox, um den Ablauf zu rekonstruieren. Korrigieren Sie fachliche Daten über vorgesehene Gegenbuchungs-, Freigabe-
            oder Stornoprozesse statt durch direkte Datenbankänderungen.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Audit und Wiederherstellung – Screenshot-Platzhalter
    guidance:
      prerequisites:
      - Zeitpunkt mit Zeitzone, Mandant, Standort, Benutzeraktion, Route, Beleg- und Korrelationsreferenz.
      permissions:
      - Leserechte des Fachbereichs sowie bei Integrationsfehlern integration.outbox.read; Retry und Quittierung benötigen eigene Rechte.
      fields:
      - 'Supportfall: expected/actual behavior, route, aggregate_id, message_id, external_event_id, status und error_message. Keine Passwörter oder API-Schlüssel erfassen.'
      statuses:
      - Fehler bleibt fachlich offen, bis Datenzustand und externe Verarbeitung geklärt sind. Retry, Quittierung, Storno und Gegenbuchung sind getrennte Maßnahmen.
      errors:
      - Filter/Berechtigung/Belegstatus prüfen, dann Audit und Ledger, danach Outbox/Worker und zuletzt externes Ziel. Keine direkte Datenbankkorrektur durchführen.
