chapter:
  getting_started:
    title: Einstieg und Arbeitsumgebung
    summary: Anmeldung, Mandant, Standort, Sprache, Dashboard und sicherer Arbeitsbeginn.
    sections:
      section_1:
        title: Anmelden und Kontext prüfen
        paragraphs:
          paragraph_1: Öffnen Sie die WebWMS-Anmeldeseite und melden Sie sich mit E-Mail-Adresse und Passwort oder über den eingerichteten OpenID-Connect-Anbieter an. Prüfen Sie nach
            der Anmeldung den aktiven Mandanten und Standort. Daten, Rollen und Vorgänge werden immer in diesem Kontext verarbeitet.
        steps:
          step_1: Melden Sie sich an.
          step_2: Prüfen Sie Benutzer, Mandant und Standort in der Kopfleiste.
          step_3: Öffnen Sie das Dashboard und kontrollieren Sie offene Aufgaben und Warnungen.
          step_4: Wechseln Sie Sprache oder Darstellung über die Benutzeroberfläche.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: 'Platzhalter: Anmeldung und Dashboard'
      section_2:
        title: Dashboard und Kennzahlen
        paragraphs:
          paragraph_1: Das Dashboard bündelt Bestände, Wareneingänge, Ausgänge, Transportaufträge und Auslastung. Karten führen in die zugehörige Übersicht. Kennzahlen sind mandantenbezogen;
            fehlende Werte bedeuten nicht automatisch einen technischen Fehler, sondern können auf Filter, Berechtigungen oder noch nicht vorhandene Bewegungen zurückgehen.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Dashboard und Kennzahlen – Screenshot-Platzhalter
      section_3:
        title: Sicher beenden
        paragraphs:
          paragraph_1: Schließen Sie sensible Dialoge, speichern oder verwerfen Sie Änderungen bewusst und melden Sie sich über das Benutzermenü ab. Verwenden Sie bei gemeinsam genutzten
            Geräten keine dauerhaft gespeicherten Zugangsdaten.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Sicher beenden – Screenshot-Platzhalter
    views:
      workspace_login:
        template: security/workspace_login.html.twig
        title: Anmeldung am WebWMS-Arbeitsbereich
        purpose: Die Seite eröffnet eine Sitzung per Passwort oder über einen für den Mandanten konfigurierten OpenID-Connect-Anbieter.
        navigation: Öffentliche Startseite → Anmelden
        permissions:
        - Keine Vorab-Berechtigung; Benutzerkonto und Mandant müssen aktiv sein.
        overview:
        - Der Passwortbereich ermittelt den Mandanten über das Benutzerkonto und prüft E-Mail-Adresse und Passwort.
        - Der SSO-Bereich ermittelt den Mandanten über den eindeutigen Provider-Code und leitet zum Identitätsanbieter weiter.
        fields:
          email:
            label: E-Mail-Adresse
            required: true
            format: Vollständige E-Mail-Adresse des aktiven Benutzerkontos
            example: lagerleitung@example.org
            help: Die Adresse muss genau einem aktiven Benutzerkonto zugeordnet sein; der Mandant wird automatisch aus diesem Konto übernommen.
            effect: Bestimmt Benutzer, Rollen und protokollierte Identität der Sitzung.
            errors: Unbekannte, unbestätigte oder inaktive Konten werden abgewiesen.
          password:
            label: Passwort
            required: true
            format: Persönliches Kennwort; Groß- und Kleinschreibung beachten
            example: '************'
            help: Geben Sie das Kennwort verdeckt ein und teilen Sie es niemals mit anderen Personen.
            effect: Bei erfolgreicher Prüfung wird die authentifizierte Sitzung erzeugt.
            errors: Bei falscher Eingabe bleibt die Anmeldung ohne Offenlegung von Kontodetails gesperrt.
          provider:
            label: Provider-Code
            required: true
            format: Exakter Code des eingerichteten OIDC-Providers
            example: corporate_sso
            help: Nur für Single Sign-on erforderlich; der Code wird von der Administration vorgegeben.
            effect: Wählt Discovery-Endpunkt, Client und Anmelderichtlinie für die Weiterleitung aus.
            errors: Unbekannte oder deaktivierte Provider sowie unsichere Discovery-Daten werden abgewiesen.
        actions:
          password_login:
            label: Anmelden
            description: Ermittelt den Mandanten aus dem Benutzerkonto und prüft E-Mail-Adresse, Passwort und Kontostatus.
            result: Bei Erfolg öffnet sich der Arbeitsbereich; bei Fehlern bleiben Eingaben außer dem Passwort erhalten.
          sso_login:
            label: Mit SSO anmelden
            description: Startet den OIDC-Ablauf mit State, Nonce und PKCE.
            result: Nach erfolgreicher Anmeldung beim Provider erfolgt die sichere Rückleitung in den Mandanten.
        image:
          src: /assets/images/handbook/security/workspace-login.svg
          alt: Anmeldung am WebWMS-Arbeitsbereich mit Passwort- und SSO-Bereich
      documentation_overview:
        template: documentation/index.html.twig
        title: Handbuchübersicht und Suche
        purpose: Die Startseite erschließt alle Handbuchkapitel und durchsucht Bedienhinweise, Felder, Aktionen und Fehlertexte.
        navigation: Sidebar → Benutzerhandbuch
        permissions: ["documentation.handbook.read"]
        overview: ["Die Suche liefert Kapitel mit passender Fundstelle; ohne Suchbegriff erscheinen alle Kapitel nach Fachbereich gruppiert.", "Ein Treffer öffnet direkt den passenden Abschnitt. Keine Treffer verändern keine Daten; Suchbegriff zurücksetzen und Synonyme versuchen."]
        actions:
          search: {label: "Handbuch durchsuchen", description: "Durchsucht zweisprachig alle strukturierten Handbuchinhalte.", result: "Zeigt passende Kapitel und Fundstellen oder einen leeren Zustand."}
          open: {label: "Kapitel öffnen", description: "Öffnet die vollständige Kapitelansicht.", result: "Inhaltsverzeichnis und Direktanker werden angezeigt."}
        image: {src: "/assets/images/handbook/documentation/handbook-overview.svg", alt: "Handbuchübersicht mit Suche und Kapiteln"}
      documentation_chapter:
        template: documentation/show.html.twig
        title: Handbuchkapitel lesen
        purpose: Die Kapitelansicht erklärt einen Fachbereich mit Abschnitten, dokumentierten Views, Feldern, Aktionen und Fehlerhilfen.
        navigation: Benutzerhandbuch → Kapitel auswählen
        permissions: ["documentation.handbook.read"]
        overview: ["Das lokale Inhaltsverzeichnis springt zu Abschnitten und Views; Vorher-/Weiter-Navigation folgt der fachlichen Reihenfolge.", "Direktlinks behalten den Kapitel- und View-Anker. Ein unbekanntes Kapitel erzeugt eine Nicht-gefunden-Seite."]
        actions:
          navigate: {label: "Abschnitt öffnen", description: "Springt innerhalb des Kapitels zur gewählten Anleitung.", result: "Der Zielabschnitt wird fokussiert, ohne Daten zu ändern."}
        image: {src: "/assets/images/handbook/documentation/handbook-chapter.svg", alt: "Handbuchkapitel mit Inhaltsverzeichnis und View-Dokumentation"}
    guidance:
      prerequisites:
      - Aktives Benutzerkonto und unterstützter Browser. Für SSO muss ein eindeutig benannter aktiver OIDC-Provider mit HTTPS-Issuer, Client-ID und Secret-Referenz konfiguriert sein.
      permissions:
      - Die Login-Routen sind öffentlich. Nach erfolgreicher Anmeldung werden ausschließlich Menüs angezeigt, für deren Fachberechtigung der Benutzer freigeschaltet ist.
      fields:
      - 'Passwortlogin: E-Mail und Passwort. SSO: Provider-Code. Der Mandant wird jeweils automatisch ermittelt. Arbeitskontext: Mandant, Standort, Sprache und Darstellung.'
      statuses:
      - Nur aktive Benutzer und Provider dürfen eine Sitzung eröffnen. Logout beendet die Sitzung; ein abgelaufenes State-, Nonce- oder PKCE-Prüfergebnis wird abgewiesen.
      errors:
      - Unbekannte oder mehrdeutige E-Mail, inaktives Konto, falsches Passwort, unbekannter oder mehrdeutiger Provider-Code oder abweichende OIDC-Signatur verhindert die Anmeldung. Systemzeit und Provider-Discovery mitprüfen.
  navigation_and_lists:
    title: Navigation, Übersichten, Suche und Bearbeitung
    summary: Sidebar, Tabellen, Filter, Pagination, Detailseiten und wiederkehrende Bedienmuster.
    sections:
      section_1:
        title: Sidebar und Untermenüs
        paragraphs:
          paragraph_1: Die Sidebar ist nach Plattform, Lager, Wareneingang, Warenausgang, Integration und Administration gegliedert. Sichtbar sind nur Bereiche, für die der Benutzer
            mindestens eine Leseberechtigung besitzt. Der aktive Bereich bleibt aufgeklappt und die aktuelle Seite wird hervorgehoben.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Sidebar und Untermenüs – Screenshot-Platzhalter
      section_2:
        title: Übersichtsseiten bedienen
        paragraphs:
          paragraph_1: Übersichten trennen Lesen und Anlegen. Verwenden Sie die globale Suche für Belegnummern, Artikel, Partner oder Status. Fachliche Filter begrenzen die Treffer;
            die Seitengröße steuert die Pagination. Setzen Sie Filter zurück, bevor Sie einen vermeintlich fehlenden Datensatz melden.
        steps:
          step_1: Suchbegriff eingeben.
          step_2: Status- oder Fachfilter wählen.
          step_3: Seitengröße festlegen und durch Ergebnisse navigieren.
          step_4: Über die Aktion in der Tabellenzeile Details oder Bearbeitung öffnen.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: 'Platzhalter: Tabellenfilter und Zeilenaktionen'
      section_3:
        title: Anlegen, Bearbeiten und Löschen
        paragraphs:
          paragraph_1: Neue Datensätze werden auf einer eigenen Formularseite angelegt. Pflichtfelder sind gekennzeichnet. Bearbeitungen erfolgen über die Zeilenaktion und werden erst
            mit Speichern wirksam. Fachlich verwendete Belege werden in der Regel storniert, deaktiviert oder durch einen Statuswechsel abgeschlossen statt physisch gelöscht.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Anlegen, Bearbeiten und Löschen – Screenshot-Platzhalter
      section_4:
        title: Meldungen und Validierung
        paragraphs:
          paragraph_1: Erfolgs- und Fehlermeldungen erscheinen nach einer Aktion oberhalb des Inhalts. Korrigieren Sie markierte Felder. Bei Konflikten durch parallele Bearbeitung laden
            Sie den aktuellen Stand neu und prüfen die Änderung erneut.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Meldungen und Validierung – Screenshot-Platzhalter
    guidance:
      prerequisites:
      - Angemeldete Sitzung und Leserecht des jeweiligen Fachbereichs.
      permissions:
      - Leserechte zeigen Übersicht und Details; Schreibrechte zeigen Anlegen/Bearbeiten; Execute-, Review- und Approve-Rechte steuern fachliche Aktionen.
      fields:
      - Listen verwenden q, Status, Fachfilter, page und limit. Formulare markieren Pflichtfelder; Zeilenaktionen öffnen Detail-, Bearbeitungs-, Storno- oder Statusseiten.
      statuses:
      - Suche, Filter und Pagination verändern keine Daten. Speichern und Statusaktionen werden erst nach erfolgreicher Validierung wirksam.
      errors:
      - Bei leeren Ergebnissen Filter, Mandant, Standort und Seite zurücksetzen. Bei konkurrierender Änderung aktuellen Datensatz neu laden.
  users_roles_and_security:
    title: Benutzer, Rollen, Rechte und Single Sign-on
    summary: Benutzerkonten, Berechtigungen, API-Clients und OpenID Connect sicher konfigurieren.
    sections:
      section_1:
        title: Benutzer verwalten
        paragraphs:
          paragraph_1: Unter Administration → Benutzer sehen berechtigte Administratoren alle Konten des Mandanten. Beim Anlegen werden E-Mail-Adresse, Anzeigename, Status und Rollen
            vergeben. Deaktivieren Sie ausgeschiedene Benutzer; bestehende Auditnachweise bleiben erhalten.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Benutzer verwalten – Screenshot-Platzhalter
      section_2:
        title: Rollen und Berechtigungen
        paragraphs:
          paragraph_1: 'Rollen bündeln fein granulare Rechte wie Lesen, Schreiben, Ausführen, Freigeben oder Konfigurieren. Vergeben Sie das Minimalprinzip: operative Benutzer erhalten
            nur die für ihre Aufgabe benötigten Rechte. Änderungen an Rollen werden auditiert. Das Recht documentation.handbook.read steuert den Zugriff auf dieses Handbuch.'
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: 'Platzhalter: Rollen- und Rechteverwaltung'
      section_3:
        title: API-Clients
        paragraphs:
          paragraph_1: API-Clients besitzen einen Namen, einen aktiven Status und explizite Berechtigungen. Das erzeugte Secret wird nur sicher übergeben und als Umgebungsgeheimnis verwaltet.
            Rotieren oder deaktivieren Sie kompromittierte Zugangsdaten und prüfen Sie die letzte Nutzung.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: API-Clients – Screenshot-Platzhalter
      section_4:
        title: OpenID Connect
        paragraphs:
          paragraph_1: Konfigurieren Sie je Mandant Provider-Code, Anzeigename, HTTPS-Issuer, Client-ID und Referenz auf das Client-Secret. Der Login verwendet Discovery, State, Nonce
            und PKCE. Die E-Mail muss vom Provider bestätigt sein. Beim ersten Login wird die externe Identität einem aktiven Benutzer desselben Mandanten zugeordnet.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: OpenID Connect – Screenshot-Platzhalter
      section_5:
        title: Prüfung
        paragraphs:
          paragraph_1: Testen Sie neue Rollen mit einem separaten Benutzer. Prüfen Sie sowohl erlaubte als auch bewusst nicht erlaubte Aktionen und dokumentieren Sie den zuständigen
            Rolleninhaber.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Prüfung – Screenshot-Platzhalter
    views:
      administration_overview:
        template: administration/index.html.twig
        title: Administrationsübersicht
        purpose: Die Startseite bündelt Benutzer, Rollen und technische API-Zugänge des aktiven Mandanten.
        navigation: Administration
        permissions: ["Mindestens eines der Leserechte administration.user.read, administration.role.read oder administration.api_client.read."]
        overview:
        - Jede sichtbare Kachel zeigt die Anzahl der Datensätze und öffnet die zugehörige Übersicht. Kacheln ohne Leserecht werden vollständig ausgeblendet.
        actions:
          open_area: {label: "\"\\\"Bereich öffnen\\\"\"", description: "\"\\\"Öffnet Benutzer, Rollen oder API-Clients abhängig von der gewählten Kachel.\\\"\"", result: "\"\\\"Die fachliche Übersicht wird ohne Datenänderung geladen.\\\"\""}
        image: {src: "/assets/images/handbook/administration/overview.svg", alt: "Administrationsübersicht mit Kacheln für Benutzer, Rollen und API-Clients"}
      users_overview:
        template: administration/users.html.twig
        title: Benutzerübersicht
        purpose: Die Tabelle zeigt alle Konten des Mandanten mit Rollen und aktuellem Aktivstatus.
        navigation: Administration → Benutzer
        permissions: ["administration.user.read; Schreibrecht ist für Anlegen und Bearbeiten erforderlich."]
        overview:
        - Spalten zeigen Anzeigename, E-Mail-Adresse, Rollen und Status. Ein Gedankenstrich bedeutet, dass keine Rolle zugeordnet ist.
        - Bei leerem Bestand erscheint ein erklärender Leerzustand. Die Zeilenaktion öffnet die separate Bearbeitungsseite.
        actions:
          create: {label: "\"\\\"Benutzer hinzufügen\\\"\"", description: "\"\\\"Öffnet das Formular für ein neues Benutzerkonto.\\\"\"", result: "\"\\\"Daten werden erst beim Speichern des Formulars verändert.\\\"\""}
          edit: {label: "\"\\\"Bearbeiten\\\"\"", description: "\"\\\"Öffnet Rollen und Aktivstatus des gewählten Kontos.\\\"\"", result: "\"\\\"Die Benutzer-ID und Auditzuordnung bleiben erhalten.\\\"\""}
        image: {src: "/assets/images/handbook/administration/users-overview.svg", alt: "Benutzerübersicht mit Rollen, Status und Bearbeiten-Aktion"}
      user_create:
        template: administration/user_new.html.twig
        title: Benutzer anlegen
        purpose: Das Formular erstellt ein Konto im aktiven Mandanten und weist die anfänglichen Rollen zu.
        navigation: Administration → Benutzer → Benutzer hinzufügen
        permissions: ["administration.user.write; zuweisbare Rollen müssen im Mandanten vorhanden sein."]
        overview: ["Mehrere Rollen werden mit Strg beziehungsweise Cmd ausgewählt. Vergeben Sie ausschließlich die für die Aufgabe benötigten Rechte."]
        fields:
          display_name: {label: "\"\\\"Anzeigename\\\"\"", required: true, format: "\"\\\"Klarname oder eindeutiger betrieblicher Name\\\"\"", example: "\"\\\"Erika Muster\\\"\"", help: "\"\\\"Erscheint in Listen und Auditprotokollen.\\\"\"", effect: "\"\\\"Wird als sichtbare Identität gespeichert.\\\"\"", errors: "\"\\\"Leere Namen sind ungültig.\\\"\""}
          email: {label: "\"\\\"E-Mail-Adresse\\\"\"", required: true, format: "\"\\\"Gültige und im Mandanten eindeutige E-Mail-Adresse\\\"\"", example: "\"\\\"erika.muster@example.org\\\"\"", help: "\"\\\"Dient als Anmeldekennung und SSO-Zuordnung.\\\"\"", effect: "\"\\\"Identifiziert das Konto dauerhaft.\\\"\"", errors: "\"\\\"Ungültige oder bereits verwendete Adressen werden abgewiesen.\\\"\""}
          password: {label: "\"\\\"Initiales Passwort\\\"\"", required: true, format: "\"\\\"Mindestens 12 Zeichen\\\"\"", example: "\"\\\"'************'\\\"\"", help: "\"\\\"Sicher und getrennt übermitteln; niemals ein Standardpasswort verwenden.\\\"\"", effect: "\"\\\"Wird nur gehasht gespeichert und ermöglicht die erste Anmeldung.\\\"\"", errors: "\"\\\"Zu kurze Kennwörter verhindern das Anlegen.\\\"\""}
          role_ids: {label: "\"\\\"Rollen\\\"\"", required: false, format: "\"\\\"Mehrfachauswahl aus Mandantenrollen\\\"\"", example: "\"\\\"ROLE_WAREHOUSE_OPERATOR\\\"\"", help: "\"\\\"Rollen nach dem Minimalprinzip auswählen.\\\"\"", effect: "\"\\\"Die vereinigten Rollenrechte gelten bei der nächsten Berechtigungsprüfung.\\\"\"", errors: "\"\\\"Unbekannte oder mandantenfremde Rollen werden abgewiesen.\\\"\""}
        actions:
          save: {label: "\"\\\"Benutzer hinzufügen\\\"\"", description: "\"\\\"Prüft Identität, Passwort und Rollen und legt das Konto an.\\\"\"", result: "\"\\\"Bei Erfolg öffnet sich die Benutzerübersicht mit Bestätigung.\\\"\""}
        image: {src: "/assets/images/handbook/administration/user-create.svg", alt: "Formular zum Anlegen eines Benutzers"}
      user_edit:
        template: administration/user_edit.html.twig
        title: Benutzer bearbeiten
        purpose: Die Seite ändert Rollenzuordnungen und Aktivstatus eines bestehenden Kontos.
        navigation: Administration → Benutzer → Bearbeiten
        permissions: ["administration.user.write; der Benutzer muss zum aktiven Mandanten gehören."]
        overview: ["Name und E-Mail identifizieren das gewählte Konto und sind hier nicht änderbar. Deaktivieren beendet die weitere Nutzung, ohne Auditdaten zu löschen."]
        fields:
          role_ids: {label: "\"\\\"Rollen\\\"\"", required: false, format: "\"\\\"Mehrfachauswahl aus Mandantenrollen\\\"\"", example: "\"\\\"ROLE_WAREHOUSE_MANAGER\\\"\"", help: "\"\\\"Entfernen Sie keine für den Betrieb oder die letzte Administration erforderliche Rolle.\\\"\"", effect: "\"\\\"Ersetzt die bisherigen Rollenzuordnungen vollständig.\\\"\"", errors: "\"\\\"Unbekannte Rollen und unzulässiger Entzug des letzten Verwaltungsrechts werden abgewiesen.\\\"\""}
          active: {label: "\"\\\"Benutzer aktiv\\\"\"", required: false, format: "\"\\\"Checkbox; aktiviert oder deaktiviert\\\"\"", example: "\"\\\"aktiviert\\\"\"", help: "\"\\\"Nur aktive Benutzer können neue Sitzungen eröffnen.\\\"\"", effect: "\"\\\"Deaktivieren sperrt künftige Anmeldungen; Historie und Audit bleiben erhalten.\\\"\"", errors: "\"\\\"Das eigene letzte Administrationskonto darf nicht unbrauchbar gemacht werden.\\\"\""}
        actions:
          save: {label: "\"\\\"Änderungen speichern\\\"\"", description: "\"\\\"Validiert Rollen und Status und speichert sie atomar.\\\"\"", result: "\"\\\"Bei Erfolg öffnet sich die aktualisierte Übersicht.\\\"\""}
        image: {src: "/assets/images/handbook/administration/user-edit.svg", alt: "Benutzer bearbeiten mit Rollen und Aktivstatus"}
      roles_overview:
        template: administration/roles.html.twig
        title: Rollenübersicht
        purpose: Die Tabelle zeigt Rollen, Anzahl zugeordneter Benutzer und Umfang der Berechtigungen.
        navigation: Administration → Rollen
        permissions: ["administration.role.read; administration.role.write für Anlegen und Bearbeiten."]
        overview: ["Spalten zeigen stabilen Code, Namen, Benutzeranzahl und Anzahl der Rechte. Der Code bleibt die technische Referenz., Die Bearbeiten-Aktion öffnet Name und Berechtigungen; bei leerem Bestand erscheint ein Leerzustand."]
        actions:
          create: {label: "\"\\\"Rolle erstellen\\\"\"", description: "\"\\\"Öffnet ein separates Rollenformular.\\\"\"", result: "\"\\\"Die Rolle ist erst nach erfolgreichem Speichern verfügbar.\\\"\""}
          edit: {label: "\"\\\"Bearbeiten\\\"\"", description: "\"\\\"Öffnet die gewählte Rolle und alle angebotenen Rechte.\\\"\"", result: "\"\\\"Bestehende Benutzer erhalten die geänderten Rechte bei der nächsten Prüfung.\\\"\""}
        image: {src: "/assets/images/handbook/administration/roles-overview.svg", alt: "Rollenübersicht mit Benutzer- und Berechtigungsanzahl"}
      role_create:
        template: administration/role_new.html.twig
        title: Rolle anlegen
        purpose: Das Formular erstellt eine wiederverwendbare Rolle mit stabiler Kennung und ausgewählten Berechtigungen.
        navigation: Administration → Rollen → Rolle erstellen
        permissions: ["administration.role.write"]
        overview: ["Rechte werden als Mehrfachauswahl angeboten. Fassen Sie nur Berechtigungen zusammen, die zu einem klaren Aufgabenprofil gehören."]
        fields:
          code: {label: "\"\\\"Code\\\"\"", required: true, format: "\"\\\"Großbuchstaben und Unterstriche mit Präfix ROLE_\\\"\"", example: "\"\\\"ROLE_INBOUND_OPERATOR\\\"\"", help: "\"\\\"Stabiler technischer Schlüssel; nach Vergabe nicht für einen anderen Zweck wiederverwenden.\\\"\"", effect: "\"\\\"Referenziert die Rolle in Zuordnungen und Prüfungen.\\\"\"", errors: "\"\\\"Ungültige oder doppelte Codes werden abgewiesen.\\\"\""}
          name: {label: "\"\\\"Name\\\"\"", required: true, format: "\"\\\"Verständliche Aufgabenbezeichnung\\\"\"", example: "\"\\\"Wareneingang operativ\\\"\"", help: "\"\\\"Erklärt Administratoren den fachlichen Zweck.\\\"\"", effect: "\"\\\"Wird in Auswahllisten angezeigt.\\\"\"", errors: "\"\\\"Ein leerer Name ist ungültig.\\\"\""}
          permissions: {label: "\"\\\"Berechtigungen\\\"\"", required: false, format: "\"\\\"Mehrfachauswahl bekannter Berechtigungscodes\\\"\"", example: "\"\\\"inbound.receipt.read\\\"\"", help: "\"\\\"Lesen, Schreiben, Ausführen und Freigeben bewusst getrennt vergeben.\\\"\"", effect: "\"\\\"Bestimmt die erlaubten Aktionen aller zugeordneten Benutzer.\\\"\"", errors: "\"\\\"Unbekannte Berechtigungscodes werden nicht gespeichert.\\\"\""}
        actions:
          save: {label: "\"\\\"Rolle erstellen\\\"\"", description: "\"\\\"Prüft Code, Namen und Rechte und legt die Rolle an.\\\"\"", result: "\"\\\"Bei Erfolg kann die Rolle Benutzern zugewiesen werden.\\\"\""}
        image: {src: "/assets/images/handbook/administration/role-create.svg", alt: "Formular zum Erstellen einer Rolle"}
      role_edit:
        template: administration/role_edit.html.twig
        title: Rolle bearbeiten
        purpose: Die Seite ändert Anzeigename und Rechte einer bestehenden Rolle; der Code bleibt stabil.
        navigation: Administration → Rollen → Bearbeiten
        permissions: ["administration.role.write"]
        overview: ["Prüfen Sie vor dem Entzug eines Rechts die Anzahl betroffener Benutzer und testen Sie kritische Rollen mit einem separaten Konto."]
        fields:
          name: {label: "\"\\\"Name\\\"\"", required: true, format: "\"\\\"Verständliche Aufgabenbezeichnung\\\"\"", example: "\"\\\"Wareneingang Leitung\\\"\"", help: "\"\\\"Beschreibt das aktuelle Aufgabenprofil der Rolle.\\\"\"", effect: "\"\\\"Ändert die Anzeige in Benutzer- und Rollenlisten.\\\"\"", errors: "\"\\\"Ein leerer Name verhindert das Speichern.\\\"\""}
          permissions: {label: "\"\\\"Berechtigungen\\\"\"", required: false, format: "\"\\\"Mehrfachauswahl aller bekannten Rechte\\\"\"", example: "\"\\\"inbound.receipt.approve\\\"\"", help: "\"\\\"Nicht markierte Rechte werden beim Speichern aus der Rolle entfernt.\\\"\"", effect: "\"\\\"Wirkt auf alle zugeordneten Benutzer bei der nächsten Berechtigungsprüfung.\\\"\"", errors: "\"\\\"Der Schutz vor Verlust des letzten Verwaltungszugangs kann die Änderung ablehnen.\\\"\""}
        actions:
          save: {label: "\"\\\"Änderungen speichern\\\"\"", description: "\"\\\"Ersetzt Namen und Berechtigungsmenge atomar.\\\"\"", result: "\"\\\"Die Änderung wird auditiert und sofort für neue Prüfungen verwendet.\\\"\""}
        image: {src: "/assets/images/handbook/administration/role-edit.svg", alt: "Rolle bearbeiten mit vollständiger Berechtigungsauswahl"}
      api_clients_overview:
        template: administration/api_clients.html.twig
        title: API-Client-Übersicht
        purpose: Die Tabelle überwacht technische Zugänge, ausführende Benutzer, Nutzung und Aktivstatus.
        navigation: Administration → API-Clients
        permissions: ["administration.api_client.read; Schreibrecht für Erstellen und Bearbeiten."]
        overview: ["Spalten zeigen Name, Client-ID, ausführenden Benutzer, letzte Nutzung und Status. Niemals bedeutet, dass noch kein erfolgreicher Aufruf registriert wurde., Deaktivierte Clients bleiben zur Nachvollziehbarkeit sichtbar, können sich aber nicht mehr authentifizieren."]
        actions:
          create: {label: "\"\\\"API-Client erstellen\\\"\"", description: "\"\\\"Öffnet die sichere Erzeugung eines technischen Zugangs.\\\"\"", result: "\"\\\"Client-ID und Secret entstehen erst nach dem Speichern.\\\"\""}
          edit: {label: "\"\\\"Bearbeiten\\\"\"", description: "\"\\\"Öffnet den Aktivstatus des ausgewählten Clients.\\\"\"", result: "\"\\\"Der bestehende Zugang kann gesperrt oder wieder freigegeben werden.\\\"\""}
        image: {src: "/assets/images/handbook/administration/api-clients-overview.svg", alt: "API-Client-Übersicht mit letzter Nutzung und Status"}
      api_client_create:
        template: administration/api_client_new.html.twig
        title: API-Client anlegen
        purpose: Das Formular erzeugt einen technischen Zugang mit ausführendem Benutzer und expliziten Rechten.
        navigation: Administration → API-Clients → API-Client erstellen
        permissions: ["administration.api_client.write; der ausführende Benutzer muss aktiv sein."]
        overview: ["Effektiv gilt nur die Schnittmenge aus Client-Rechten und Rechten des ausführenden Benutzers. Verwenden Sie ein dediziertes Dienstkonto."]
        fields:
          name: {label: "\"\\\"Name\\\"\"", required: true, format: "\"\\\"Eindeutiger System- und Zweckname\\\"\"", example: "\"\\\"ERP Produktion\\\"\"", help: "\"\\\"Ermöglicht die eindeutige Zuordnung in Audit und Nutzung.\\\"\"", effect: "\"\\\"Wird in Übersicht und Protokollen angezeigt.\\\"\"", errors: "\"\\\"Leere Namen sind ungültig.\\\"\""}
          acting_user_id: {label: "\"\\\"Ausführender Benutzer\\\"\"", required: true, format: "\"\\\"Einzelauswahl eines aktiven Mandantenkontos\\\"\"", example: "\"\\\"svc.erp@example.org\\\"\"", help: "\"\\\"Kein persönliches Administratorkonto verwenden.\\\"\"", effect: "\"\\\"Fachaktionen werden unter dieser Identität autorisiert und auditiert.\\\"\"", errors: "\"\\\"Inaktive oder mandantenfremde Benutzer werden abgewiesen.\\\"\""}
          permissions: {label: "\"\\\"Berechtigungen\\\"\"", required: false, format: "\"\\\"Mehrfachauswahl angebotener API-Rechte\\\"\"", example: "\"\\\"inventory.stock.read\\\"\"", help: "\"\\\"Nur tatsächlich benötigte Endpunkte freigeben.\\\"\"", effect: "\"\\\"Begrenzt den Zugang zusätzlich zu den Benutzerrechten.\\\"\"", errors: "\"\\\"Unbekannte Rechte werden nicht gespeichert; fehlende Rechte führen zu Zugriff verweigert.\\\"\""}
        actions:
          generate: {label: "\"\\\"Zugang erzeugen\\\"\"", description: "\"\\\"Erstellt Client-ID und Secret einmalig.\\\"\"", result: "\"\\\"Das Secret erscheint genau einmal auf der Credential-Seite und muss sofort sicher gespeichert werden.\\\"\""}
        image: {src: "/assets/images/handbook/administration/api-client-create.svg", alt: "API-Client anlegen mit Benutzer und Berechtigungen"}
      api_client_edit:
        template: administration/api_client_edit.html.twig
        title: API-Client bearbeiten
        purpose: Die Seite zeigt den unveränderlichen ausführenden Benutzer und steuert den Aktivstatus des Zugangs.
        navigation: Administration → API-Clients → Bearbeiten
        permissions: ["administration.api_client.write"]
        overview: ["Der ausführende Benutzer wird nur lesbar angezeigt. Für einen Identitätswechsel ist ein neuer Client mit neuem Secret anzulegen."]
        fields:
          active: {label: "\"\\\"API-Client aktiv\\\"\"", required: false, format: "\"\\\"Checkbox; aktiviert oder deaktiviert\\\"\"", example: "\"\\\"deaktiviert\\\"\"", help: "\"\\\"Bei Verdacht auf Kompromittierung sofort deaktivieren.\\\"\"", effect: "\"\\\"Deaktivieren sperrt weitere Authentifizierungen, ohne Audit- und Nutzungsdaten zu löschen.\\\"\"", errors: "\"\\\"Bereits laufende Requests können beendet werden; künftige Anmeldungen werden abgewiesen.\\\"\""}
        actions:
          save: {label: "\"\\\"Änderungen speichern\\\"\"", description: "\"\\\"Speichert den Aktivstatus nach CSRF- und Berechtigungsprüfung.\\\"\"", result: "\"\\\"Die Übersicht zeigt den neuen Status.\\\"\""}
        image: {src: "/assets/images/handbook/administration/api-client-edit.svg", alt: "API-Client bearbeiten und Aktivstatus ändern"}
      api_client_credential:
        template: administration/api_client_credential.html.twig
        title: API-Zugangsdaten sichern
        purpose: Die Sicherheitsseite zeigt das neu erzeugte Credential genau einmal zur sicheren Übernahme.
        navigation: Administration → API-Clients → API-Client erstellen → Zugang erzeugen
        permissions: ["administration.api_client.write; nur unmittelbar nach erfolgreicher Erzeugung erreichbar."]
        overview: ["Das schreibgeschützte Feld enthält das vollständige Credential. Speichern Sie es direkt in einem Secret-Store und niemals in Quellcode, Ticket oder Chat., Nach Verlassen der Seite kann das Secret nicht wiederhergestellt werden; erzeugen Sie bei Verlust einen neuen Zugang."]
        actions:
          copy: {label: "\"\\\"Kopieren\\\"\"", description: "\"\\\"Kopiert das Credential über die Browser-Zwischenablage.\\\"\"", result: "\"\\\"Der Inhalt bleibt nur lokal in der Zwischenablage und muss anschließend sicher eingefügt und aus der Zwischenablage entfernt werden.\\\"\""}
          back: {label: "\"\\\"Zur Administration\\\"\"", description: "\"\\\"Verlässt die Einmalanzeige endgültig.\\\"\"", result: "\"\\\"Das Credential kann danach nicht erneut angezeigt werden.\\\"\""}
        image: {src: "/assets/images/handbook/administration/api-client-credential.svg", alt: "Einmalige Anzeige eines neu erzeugten API-Credentials"}
    guidance:
      prerequisites:
      - Administrationszugriff und abgestimmtes Aufgabenprofil nach Minimalprinzip.
      permissions:
      - administration.user.read/write, administration.role.read/write, administration.api_client.read/write sowie documentation.handbook.read.
      fields:
      - 'Benutzer: email, display_name, active, role_ids. Rolle: code im Format ROLE_NAME, name, permissions. API-Client: name, permissions, active. OIDC: code, issuer_url, client_id,
        client_secret_env.'
      statuses:
      - Benutzer, API-Clients und Provider sind aktiv oder inaktiv. Rollenänderungen werden auditiert; das eigene letzte Verwaltungsrecht darf nicht entfernt werden.
      errors:
      - Doppelte E-Mail, ungültiger Rollencode, unbekannte Berechtigung, HTTP-Issuer oder Klartext-Secret wird abgewiesen. Das erzeugte API-Secret wird nur einmal angezeigt.
  system_configuration:
    title: Mandanten-, Standort- und Systemkonfiguration
    summary: Grunddaten, Nummernkreise, Strategien, Druck, Status und betriebliche Schwellwerte.
    sections:
      section_1:
        title: Mandanten und Standorte
        paragraphs:
          paragraph_1: Mandanten trennen Daten und Berechtigungen. Standorte bilden organisatorische Lagerorte ab. Pflegen Sie eindeutige Codes, sprechende Namen, Zeitzone, Adresse und
            aktiven Status. Deaktivieren Sie einen Standort erst, wenn keine offenen Prozesse mehr darauf verweisen.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Mandanten und Standorte – Screenshot-Platzhalter
      section_2:
        title: Nummernkreise und Stammdaten
        paragraphs:
          paragraph_1: Nummernkreise definieren Präfix, nächsten Wert und Format für Belege. Ändern Sie produktiv verwendete Nummernkreise nur kontrolliert. Artikel, Geschäftspartner,
            Ladehilfsmittel und Sonderbestandsarten müssen eindeutig und vollständig gepflegt sein.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Nummernkreise und Stammdaten – Screenshot-Platzhalter
      section_3:
        title: Lagerstrategien
        paragraphs:
          paragraph_1: Einlagerungs-, Entnahme-, FEFO-/FIFO-/LIFO- und Nachschubregeln besitzen Prioritäten, Gültigkeitsbedingungen, Quell- und Zielbereiche sowie Schwellwerte. Spezifische
            Regeln werden vor allgemeinen Regeln ausgewertet. Simulieren oder prüfen Sie die Treffermenge vor der Aktivierung.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: 'Platzhalter: Konfigurationsformular'
      section_4:
        title: Drucker, Geräte und Statuswerte
        paragraphs:
          paragraph_1: Drucker und Erfassungsgeräte benötigen eindeutigen Code, Verbindung, Format beziehungsweise Gerätetyp und aktiven Status. Verbindungsgeheimnisse werden als Umgebungsreferenz,
            niemals als Klartext, gespeichert. Testen Sie eine Konfiguration vor der operativen Freigabe.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Drucker, Geräte und Statuswerte – Screenshot-Platzhalter
      section_5:
        title: Änderungen kontrollieren
        paragraphs:
          paragraph_1: Dokumentieren Sie Grund und Zeitpunkt größerer Änderungen. Prüfen Sie danach Auditprotokoll, betroffene Prozesse und mindestens einen positiven sowie einen negativen
            Anwendungsfall.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Änderungen kontrollieren – Screenshot-Platzhalter
    views:
      administration_workspace:
        template: administration/workspace.html.twig
        title: Mandanten- und Systemkonfiguration
        purpose: Die Seite verwaltet Geschäftspartner, Datenräume, OIDC, Nummernkreise, Prozessschalter, Geräteprofile und das technische Betriebsprofil des aktiven Mandanten.
        navigation: Administration → Konfiguration
        permissions:
        - administration.configuration.read zeigt Konfiguration und Änderungsprotokoll; administration.configuration.write erlaubt Änderungen; administration.number_range.use erlaubt Testnummern.
        overview:
        - Jeder Kartenbereich besitzt ein eigenes Formular. Speichern wirkt nur auf diesen Bereich; bereits vorhandene Einträge erscheinen direkt darunter.
        - Lager und Standorte werden nur angezeigt und über die verlinkte Lagertopologie gepflegt. Das Änderungsprotokoll nennt Zeitpunkt, Bereich, Ereignis und Benutzer.
        fields:
          code:
            label: Code
            required: true
            format: Eindeutiger technischer Schlüssel ohne Leerzeichen
            example: CUSTOMER_DE
            help: Nach produktiver Nutzung nicht für einen anderen Zweck wiederverwenden.
            effect: Identifiziert den Datensatz in Prozessen, Schnittstellen und Auditdaten.
            errors: Leere, ungültige oder im jeweiligen Bereich doppelte Codes werden abgewiesen.
            usages: [Geschäftspartner, Datenraum, Identitätsanbieter, Nummernkreis und Geräteprofil]
          name: {label: "\"Name oder Beschreibung\"", required: true, format: "\"Verständliche fachliche Bezeichnung\"", example: "\"Hauptkunde Deutschland\"", help: "\"Beschreibt den Datensatz für Benutzer und Administratoren.\"", effect: "\"Erscheint in Listen und Auswahlen.\"", errors: "\"Ein leerer Name verhindert das Speichern.\"", usages: ["\"Geschäftspartner, Datenraum, Identitätsanbieter, Nummernkreis, Prozess und Geräteprofil\""]}
          partner_type: {label: "\"Geschäftspartnertyp\"", required: true, format: "\"customer; supplier; carrier oder owner\"", example: "\"customer\"", help: "\"Kunde steht für Empfänger; Lieferant für Beschaffung; Frachtführer für Versand; Eigentümer für Sonderbestand.\"", effect: "\"Steuert die fachlich zulässige Verwendung des Partners.\"", errors: "\"Nicht angebotene Werte werden abgewiesen.\""}
          active: {label: "\"Geschäftspartner aktiv\"", required: true, format: "\"Versteckter Standardwert 1 bei Neuanlage\"", example: "\"'1'\"", help: "\"Neue Partner werden in dieser Maske immer aktiv angelegt.\"", effect: "\"Der Partner kann sofort in neuen Vorgängen verwendet werden.\"", errors: "\"Eine spätere Deaktivierung darf offene Abhängigkeiten nicht verletzen.\""}
          business_partner_id: {label: "\"Zugeordneter Geschäftspartner\"", required: false, format: "\"Auswahl eines vorhandenen Partners oder leer\"", example: "\"CUSTOMER_DE\"", help: "\"Verknüpft den Datenraum optional mit einem Partner.\"", effect: "\"Begrenzt beziehungsweise kennzeichnet den organisatorischen Datenkontext.\"", errors: "\"Unbekannte oder mandantenfremde IDs werden abgewiesen.\""}
          protocol: {label: "\"Identitätsprotokoll\"", required: true, format: "\"Auswahl; aktuell oidc\"", example: "\"oidc\"", help: "\"Bestimmt das unterstützte Single-Sign-on-Verfahren.\"", effect: "\"Aktiviert Discovery, State, Nonce und PKCE für den Provider.\"", errors: "\"Nicht unterstützte Protokolle werden nicht gespeichert.\""}
          issuer_url: {label: "\"Issuer-URL\"", required: true, format: "\"Absolute HTTPS-URL des OIDC-Issuers\"", example: "\"'https://login.example.org/realms/webwms'\"", help: "\"Muss exakt dem Issuer in Discovery und Token entsprechen.\"", effect: "\"Liefert Autorisierungs-, Token- und Schlüsselendpunkte.\"", errors: "\"HTTP, ungültige URLs oder abweichende Discovery-Issuer werden abgewiesen.\""}
          client_id: {label: "\"OIDC Client-ID\"", required: true, format: "\"Beim Provider registrierte öffentliche Kennung\"", example: "\"webwms-production\"", help: "\"Keine Secret-Werte in dieses Feld eintragen.\"", effect: "\"Identifiziert WebWMS beim Identitätsanbieter.\"", errors: "\"Eine falsche Client-ID führt beim Provider zum Anmeldefehler.\""}
          client_secret_env: {label: "\"Umgebungsvariable für Client-Secret\"", required: true, format: "\"Name einer Server-Umgebungsvariable\"", example: "\"WEBWMS_OIDC_CLIENT_SECRET\"", help: "\"Nur die Referenz speichern; das Secret niemals im Formular eingeben.\"", effect: "\"WebWMS liest das Secret zur Laufzeit aus der Betriebsumgebung.\"", errors: "\"Fehlende oder nicht gesetzte Variablen verhindern den SSO-Callback.\""}
          scopes: {label: "\"OIDC Scopes\"", required: true, format: "\"Leerzeichengetrennte Scope-Namen\"", example: "\"openid profile email\"", help: "\"openid ist verpflichtend; email wird für die Benutzerzuordnung benötigt.\"", effect: "\"Bestimmt die vom Provider angeforderten Claims.\"", errors: "\"Fehlende openid- oder email-Claims verhindern eine sichere Zuordnung.\""}
          enabled: {label: "\"Aktiviert\"", required: true, format: "\"Checkbox beziehungsweise versteckter Standardwert 1\"", example: "\"'1'\"", help: "\"Aktiviert den jeweils neu angelegten Provider, Nummernkreis, Prozess oder das Geräteprofil.\"", effect: "\"Nur aktivierte Konfigurationen werden operativ ausgewertet.\"", errors: "\"Deaktivierte Konfigurationen stehen neuen Vorgängen nicht zur Verfügung.\"", usages: ["\"Identitätsanbieter, Nummernkreis, Prozessschalter und Geräteprofil\""]}
          object_type: {label: "\"Objektart\"", required: true, format: "\"Stabiler fachlicher Belegtyp\"", example: "\"outbound_order\"", help: "\"Legt fest, für welche Entität der Nummernkreis verwendet wird.\"", effect: "\"Verknüpft die nächste Nummer eindeutig mit einem Belegtyp.\"", errors: "\"Doppelte aktive Zuordnungen können zu uneindeutigen Nummern führen und werden abgewiesen.\""}
          prefix: {label: "\"Präfix\"", required: false, format: "\"Kurzer statischer Text vor der laufenden Nummer\"", example: "\"OUT-\"", help: "\"Verwenden Sie nur Zeichen, die Zielsysteme und Etiketten unterstützen.\"", effect: "\"Wird jeder erzeugten Nummer vorangestellt.\"", errors: "\"Zu lange oder unzulässige Zeichenfolgen werden abgewiesen.\""}
          padding: {label: "\"Stellenzahl\"", required: true, format: "\"Ganzzahl von 1 bis 18\"", example: "\"'8'\"", help: "\"Füllt den laufenden Wert links mit Nullen auf.\"", effect: "\"Aus Wert 42 und Stellenzahl 8 wird 00000042.\"", errors: "\"Werte außerhalb 1 bis 18 verhindern das Speichern.\""}
          next_value: {label: "\"Nächster Wert\"", required: true, format: "\"Positive Ganzzahl\"", example: "\"'10001'\"", help: "\"Bei produktiven Nummernkreisen nur nach Abstimmung erhöhen; niemals zurücksetzen.\"", effect: "\"Die nächste Vergabe verwendet diesen Wert und erhöht ihn atomar.\"", errors: "\"Null, negative Werte oder Rücksprünge mit Kollisionsrisiko werden abgewiesen.\""}
          gs1_company_prefix: {label: GS1-Unternehmenspräfix, required: false, format: Von GS1 vergebene Ziffernfolge, example: '426012345', help: Nur für GS1-konforme Identifikatoren pflegen., effect: Wird bei unterstützten SSCC- oder GS1-Nummern berücksichtigt., errors: Nicht numerische oder fachlich unpassende Werte führen zu ungültigen Kennzeichen.}
          suffix: {label: "\"Suffix\"", required: false, format: "\"In dieser Maske leerer versteckter Wert\"", example: "\"''\"", help: "\"Die Neuanlage verwendet kein Suffix.\"", effect: "\"Hinter der laufenden Nummer wird kein Text ergänzt.\"", errors: "\"Suffixe sind über diese vereinfachte Maske nicht konfigurierbar.\""}
          maximum_value: {label: "\"Maximalwert\"", required: false, format: "\"In dieser Maske leerer versteckter Wert\"", example: "\"''\"", help: "\"Es wird bei der Neuanlage keine zusätzliche Obergrenze gesetzt.\"", effect: "\"Die technische Zahlenkapazität bleibt die Grenze.\"", errors: "\"Überlauf oder erschöpfter Zahlenraum verhindert weitere Vergaben.\""}
          process_key: {label: "\"Prozessschlüssel\"", required: true, format: "\"Stabiler Schlüssel in Kleinbuchstaben und Unterstrichen\"", example: "\"inbound_quality\"", help: "\"Muss dem von der Anwendung ausgewerteten Prozess entsprechen.\"", effect: "\"Wählt den aktivierbaren Prozess und seine Konfiguration.\"", errors: "\"Unbekannte oder doppelte Schlüssel werden abgewiesen.\""}
          configuration: {label: "\"Prozesskonfiguration\"", required: false, format: "\"Valides JSON-Objekt\"", example: "\"'{\\\"require_photo\\\":true,\\\"max_deviation_percent\\\":5}'\"", help: "\"Erlaubt prozessabhängige Parameter; unbekannte Eigenschaften vermeiden und keine Secrets eintragen.\"", effect: "\"Wird bei der Prozessausführung versioniert ausgewertet.\"", errors: "\"Ungültiges JSON, falsche Datentypen oder nicht unterstützte Eigenschaften verhindern das Speichern.\""}
          device_type: {label: "\"Gerätetyp\"", required: true, format: "\"desktop; tablet oder scanner\"", example: "\"scanner\"", help: "\"Wählen Sie scanner für MDE-Geräte mit Hardware-Scanereignissen.\"", effect: "\"Steuert Darstellung und gerätespezifische Eingabelogik.\"", errors: "\"Nicht angebotene Typen werden abgewiesen.\""}
          start_route: {label: "\"Startroute\"", required: true, format: "\"Interner absoluter Pfad beginnend mit /\"", example: "\"/v3/inbound/receipts\"", help: "\"Muss auf eine für das Geräteprofil berechtigte WebWMS-Seite zeigen.\"", effect: "\"Öffnet diese Ansicht nach Anmeldung beziehungsweise Profilstart.\"", errors: "\"Externe URLs, unbekannte oder nicht erlaubte Routen werden abgewiesen oder führen zu Zugriff verweigert.\""}
          scan_suffix: {label: "\"Scan-Abschlusszeichen\"", required: false, format: "\"Tastenname des Scanner-Suffixes\"", example: "\"Enter\"", help: "\"Muss zur Gerätekonfiguration passen; häufig Enter oder Tab.\"", effect: "\"Löst nach einem Hardware-Scan die Verarbeitung der Eingabe aus.\"", errors: "\"Ein abweichendes Suffix lässt Scans wie unvollständige Tastatureingaben erscheinen.\""}
          fullscreen: {label: "\"Vollbildmodus\"", required: true, format: "\"Versteckter Standardwert 1\"", example: "\"'1'\"", help: "\"Neue Geräteprofile starten in der reduzierten Vollbilddarstellung.\"", effect: "\"Blendet für operative Geräte nicht benötigte Navigationselemente aus.\"", errors: "\"Der Wert ist in dieser Maske nicht änderbar.\""}
          deployment_mode: {label: "\"Betriebsmodus\"", required: true, format: "\"saas; on_premises oder hybrid\"", example: "\"on_premises\"", help: "\"Beschreibt die technische Bereitstellungsform, nicht den fachlichen Mandanten.\"", effect: "\"Steuert betriebliche Hinweise und verfügbare Integrationswege.\"", errors: "\"Ein falscher Modus kann zu ungeeigneten Betriebsannahmen führen.\""}
          public_url: {label: "\"Öffentliche URL\"", required: true, format: "\"Absolute HTTPS-Basis-URL ohne internen Hostnamen\"", example: "\"'https://wms.example.org'\"", help: "\"Muss von Browsern und angebundenen Systemen erreichbar sein.\"", effect: "\"Basis für Rückleitungen, Links und externe Callbacks.\"", errors: "\"Ungültige oder nicht erreichbare URLs brechen SSO und Integrationscallbacks.\""}
          storage_driver: {label: "\"Speicher-Treiber\"", required: true, format: "\"local; s3 oder azure\"", example: "\"s3\"", help: "\"Muss mit der bereitgestellten Serverkonfiguration und den Credentials übereinstimmen.\"", effect: "\"Bestimmt den Ablageort für Dokumente und Medien.\"", errors: "\"Fehlende Bucket-, Container- oder Dateisystemrechte verursachen Speicherfehler.\""}
          queue_transport: {label: "\"Queue-Transport\"", required: true, format: "\"sync; doctrine oder rabbitmq\"", example: "\"rabbitmq\"", help: "\"sync nur für einfache Entwicklung; produktiv einen überwachten asynchronen Transport verwenden.\"", effect: "\"Bestimmt, ob Hintergrundaufgaben direkt oder über eine Warteschlange laufen.\"", errors: "\"Fehlende Worker oder Verbindungsdaten lassen Nachrichten unbearbeitet.\""}
          release_channel: {label: "\"Release-Kanal\"", required: true, format: "\"stable oder preview\"", example: "\"stable\"", help: "\"Stable für Produktivbetrieb; Preview nur für kontrollierte Vorabtests verwenden.\"", effect: "\"Legt den vorgesehenen Aktualisierungskanal fest.\"", errors: "\"Preview kann noch nicht freigegebene Änderungen enthalten.\""}
        actions:
          create_resource: {label: "\"Konfiguration anlegen\"", description: "\"Validiert und speichert ausschließlich den jeweiligen Kartenbereich.\"", result: "\"Der neue Eintrag erscheint in der zugehörigen Liste und wird auditiert.\""}
          next_number: {label: "\"Testnummer\"", description: "\"Vergibt tatsächlich die nächste Nummer des gewählten Nummernkreises.\"", result: "\"next_value wird dauerhaft und atomar erhöht; die Aktion ist nicht nur eine Vorschau.\""}
          save_deployment: {label: "\"Betriebsprofil speichern\"", description: "\"Speichert Modus, URL, Speicher, Queue und Release-Kanal gemeinsam.\"", result: "\"Neue Hintergrund- und Integrationsvorgänge verwenden die aktualisierte Konfiguration.\""}
          open_topology: {label: "\"Lagertopologie öffnen\"", description: "\"Wechselt zur separaten Pflege von Standort, Lager, Bereichen und Plätzen.\"", result: "\"Auf dieser Workspace-Seite werden keine Topologiedaten geändert.\""}
        image:
          src: /assets/images/handbook/administration/system-configuration.svg
          alt: Systemkonfiguration mit Partnern, OIDC, Nummernkreisen, Prozessen, Geräten und Betriebsprofil
    guidance:
      prerequisites:
      - administration.configuration.read/write und abgestimmte Mandanten-, Standort- und Betriebsvorgaben.
      permissions:
      - administration.configuration.read/write und administration.number_range.use.
      fields:
      - 'Workspace: code, name, address, timezone, active. Nummernkreis: prefix, suffix, next_value, padding, gs1_company_prefix. Prozess: process_key, configuration_json, version, enabled.
        Deployment: deployment_mode, release_channel, public_url, storage_driver, queue_transport.'
      statuses:
      - Deaktivierte Standorte und Prozesse nehmen keine neuen Vorgänge an. Testnummern erhöhen next_value dauerhaft und atomar.
      errors:
      - Nicht eindeutige Codes, ungültige Zeitzonen/URLs, fehlerhaftes JSON oder Deaktivierung mit offenen Abhängigkeiten verhindern die Änderung.
  warehouse_and_stock:
    title: Lagertopologie, Bestand und Rückverfolgung
    summary: Lagerstruktur, Belegung, Bestandsdimensionen, Bewegungen, Sperren und Strategien.
    sections:
      section_1:
        title: Lagertopologie konfigurieren
        paragraphs:
          paragraph_1: Die Hierarchie besteht aus Standort, Lager, Bereich und Lagerplatz. Legen Sie über den separaten Menüpunkt neue Elemente an und bearbeiten Sie bestehende Elemente
            aus der Tabellenzeile. Codes müssen innerhalb ihres Kontexts eindeutig sein. Kapazität, Priorität, Bereichstyp und Status beeinflussen Einlagerung und Wegeoptimierung.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: 'Platzhalter: Lagertopologie'
      section_2:
        title: Bestände lesen und bewegen
        paragraphs:
          paragraph_1: Echtzeitbestand zeigt Artikel, Lagerplatz, Menge, Status, Charge, Seriennummer, Mindesthaltbarkeitsdatum und Sonderbestand. Öffnen Sie die Bewegungshistorie für
            den revisionssicheren Ursprung einer Menge. Umlagerungen prüfen Quellbestand, Zieldimension und Berechtigung atomar.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Bestände lesen und bewegen – Screenshot-Platzhalter
      section_3:
        title: Chargen, Seriennummern und MHD
        paragraphs:
          paragraph_1: Chargen fassen gleichartige Mengen zusammen. Seriennummern identifizieren Einzelstücke und dürfen nicht mehrfach aktiv geführt werden. FEFO priorisiert das früheste
            verwendbare MHD; gesperrte oder abgelaufene Bestände werden nicht regulär allokiert.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Chargen, Seriennummern und MHD – Screenshot-Platzhalter
      section_4:
        title: Sperren und Sonderbestand
        paragraphs:
          paragraph_1: Wählen Sie Sperrgrund, Menge und betroffene Bestandsdimension. Prüf- und Freigabeschritte werden getrennt protokolliert. Sonderbestandskennzeichen dokumentieren
            Eigentum oder Verwendungszweck und bleiben bei Bewegungen erhalten.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Sperren und Sonderbestand – Screenshot-Platzhalter
      section_5:
        title: Grafische Belegung und Rückverfolgung
        paragraphs:
          paragraph_1: Die Lagebelegung visualisiert freie, belegte, gesperrte und überlastete Plätze. Die Rückverfolgung verbindet Zugang, Bewegung, Allokation, Pick, Packstück und
            Versand. Grenzen Sie über Artikel, Charge, Seriennummer oder Zeitraum ein.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Grafische Belegung und Rückverfolgung – Screenshot-Platzhalter
    views:
      warehouse_overview:
        template: warehouse/overview.html.twig
        title: Lagerübersicht und Kapazität
        purpose: Das Lagerdashboard verdichtet Bestand, Lagerplätze und Kapazitätsauslastung je Lager und Bereich.
        navigation: Lager & Bestand → Lagerübersicht
        permissions: ["inventory.overview.read"]
        overview:
        - Lagerkarten zeigen Typ, belegte und gesamte Plätze, Bestandsmenge, freie Kapazität und prozentuale Auslastung. Eine Kapazität von null wird als unbegrenzt dargestellt.
        - Die Bereichstabelle schlüsselt dieselben Kennzahlen nach Lagerbereich auf und macht Engpässe oder noch nicht konfigurierte Strukturen sichtbar.
        actions: {}
        image: {src: "/assets/images/handbook/warehouse/overview.svg", alt: "Lagerübersicht mit Kapazität, Bestand und Bereichsauslastung"}
      stock_overview:
        template: warehouse/stock.html.twig
        title: Echtzeitbestand
        purpose: Die Bestandsansicht zeigt die aktuelle, mandantensichere Projektion aller Bestandsdimensionen und verfügbaren Mengen.
        navigation: Lager & Bestand → Bestand
        permissions: ["inventory.stock.read"]
        overview:
        - Jede Zeile enthält SKU, Lagerplatz und Topologie, Bestandsstatus, Sonderbestand und Eigentümer, Charge, Seriennummer, MHD, Gesamt- und verfügbare Menge sowie letzte Aktualisierung.
        - Die verfügbare Menge kann durch Reservierungen, Sperren oder Qualitätsstatus unter der physischen Gesamtmenge liegen. Maximal 200 Zeilen werden geladen.
        fields:
          warehouse: {label: "Lagerfilter", required: false, format: "Auswahl eines aktiven Lagers oder alle Lager", example: "WH-HAMBURG", help: "Wählen Sie ein Lager, um die Bestandsprojektion räumlich einzugrenzen.", effect: "Lädt ausschließlich Bestände des gewählten Lagers; leer zeigt alle Lager des Mandanten.", errors: "Eine unbekannte oder mandantenfremde ID liefert keine verwertbare Auswahl."}
        actions:
          filter: {label: "Filtern", description: "Lädt die Bestandsprojektion für das ausgewählte Lager neu.", result: "Die Auswahl bleibt im Filter erhalten; Bestände werden nicht verändert."}
        image: {src: "/assets/images/handbook/warehouse/stock.svg", alt: "Echtzeitbestand mit Topologie, Status, Bestandsdimensionen und Verfügbarkeit"}
      warehouse_occupancy:
        template: warehouse/occupancy.html.twig
        title: Grafische Lagerplatzbelegung
        purpose: Die grafische Belegung visualisiert Lagerplätze nach Bereich, Auslastung und kritischem Bestandszustand.
        navigation: Lager & Bestand → Belegung
        permissions: ["inventory.overview.read"]
        overview:
        - Farbcodes unterscheiden leer, belegt, Qualitätsbestand sowie gesperrt oder voll. Jede Karte zeigt Platztyp, Gang, Ebene, Fach, Menge, Kapazität und Artikelanzahl.
        - Der Fortschrittsbalken berechnet die mengenbezogene Auslastung. Ein Klick öffnet den Echtzeitbestand des zugehörigen Lagers.
        fields:
          warehouse: {label: "Lager", required: true, format: "Auswahl eines vorhandenen Lagers", example: "WH-HAMBURG", help: "Wählen Sie das Lager, dessen vollständige Platzstruktur visualisiert werden soll.", effect: "Gruppiert alle Plätze des Lagers nach Bereich und berechnet Zustand und Auslastung.", errors: "Ohne vorhandenes Lager beziehungsweise ohne Plätze bleibt die Ansicht leer."}
        actions:
          display: {label: "Anzeigen", description: "Lädt alle Lagerplätze und Bestandskennzahlen des gewählten Lagers.", result: "Die farbcodierte Belegung wird ohne Bestandsänderung neu aufgebaut."}
          open_stock: {label: "Lagerplatz öffnen", description: "Wechselt von einer Platzkarte in den Echtzeitbestand des Lagers.", result: "Der Bestand wird nur gelesen."}
        image: {src: "/assets/images/handbook/warehouse/occupancy.svg", alt: "Grafische Lagerplatzbelegung mit Zustandsfarben und Kapazitätsbalken"}
      stock_movements:
        template: warehouse/movements.html.twig
        title: Bewegungshistorie
        purpose: Das unveränderliche Bestandsledger zeigt jede Mengenänderung mit Artikel, Lagerplatz, Dimension, Grund, Benutzer und resultierendem Bestand.
        navigation: Lager & Bestand → Bewegungen
        permissions: ["inventory.stock.movement.read"]
        overview:
        - Positive und negative Deltas werden mit dem danach gültigen Bestand angezeigt. Charge, Seriennummer und Status bleiben Teil der gebuchten Dimension.
        - Die Ansicht liefert höchstens 500 Treffer; kombinieren Sie Artikel, Lagerplatz und Bewegungsart für eine gezielte Auditprüfung.
        fields:
          product: {label: "Artikel", required: false, format: "Auswahl einer SKU oder alle Artikel", example: "SKU-4711", help: "Für die vollständige Historie eines Artikels unabhängig vom Platz auswählen.", effect: "Beschränkt das Ledger auf den gewählten Artikel.", errors: "Unbekannte IDs liefern keine Treffer."}
          location: {label: "Lagerplatz", required: false, format: "Auswahl eines vorhandenen Lagerplatzes", example: "WH1-PICK-01", help: "Verwenden Sie den Filter zur Prüfung aller Zu- und Abgänge eines Platzes.", effect: "Beschränkt Bewegungen auf den gewählten Platz.", errors: "Ein mandantenfremder Platz liefert keine Daten."}
          movement_type: {label: "Bewegungsart", required: false, format: "Exakter technischer Bewegungscode", example: "inbound_receipt", help: "Geben Sie den im Ledger verwendeten Code ein, beispielsweise inbound_receipt, transfer_out oder pick.", effect: "Zeigt nur Buchungen dieser Bewegungsart.", errors: "Freitext ohne exakte Übereinstimmung führt zu einer leeren Trefferliste."}
        actions:
          filter: {label: "Filtern", description: "Wendet die kombinierten Kriterien auf das unveränderliche Ledger an.", result: "Es werden nur passende Bewegungen gelesen; keine Buchung wird verändert."}
        image: {src: "/assets/images/handbook/warehouse/movements.svg", alt: "Bewegungshistorie mit Bestandsdelta, Grund, Benutzer und resultierender Menge"}
      stock_traceability:
        template: warehouse/traceability.html.twig
        title: Chargen-, Seriennummern- und MHD-Rückverfolgung
        purpose: Die Rückverfolgung identifiziert kritische MHD-Bestände und verfolgt Chargen oder Seriennummern durch sämtliche Ledgerbewegungen.
        navigation: Lager & Bestand → Rückverfolgung
        permissions: ["inventory.traceability.read"]
        overview:
        - Die MHD-Tabelle kennzeichnet abgelaufene und zeitkritische Chargen anhand der verbleibenden Tage; Seriennummern werden mit aktuellem Platz, Status und Aktualisierung gezeigt.
        - Ein Klick auf Charge oder Seriennummer setzt Dimension und Wert in der URL und öffnet darunter die chronologische Historie mit Mengenänderung und resultierendem Bestand.
        actions:
          trace_batch: {label: "Charge verfolgen", description: "Öffnet alle Ledgerereignisse zur ausgewählten Chargennummer.", result: "Zugänge, Bewegungen und Abgänge werden chronologisch angezeigt."}
          trace_serial: {label: "Seriennummer verfolgen", description: "Öffnet die stückgenaue Historie der ausgewählten Seriennummer.", result: "Aktueller und historischer Ort, Status und Buchungsgrund werden sichtbar."}
        image: {src: "/assets/images/handbook/warehouse/traceability.svg", alt: "Rückverfolgung mit MHD-Risiken, Chargen, Seriennummern und Bewegungshistorie"}
      special_stock_overview:
        template: warehouse/special_stock.html.twig
        title: Sonderbestand und Kennzeichen
        purpose: Die Übersicht verwaltet Sonderbestandskennzeichen und zeigt ihre Zuordnung zu konkreten Bestandsdimensionen und Eigentümern.
        navigation: Lager & Bestand → Sonderbestand
        permissions: ["inventory.special_stock.read; inventory.special_stock.write für Kennzeichen und Klassifizierung."]
        overview:
        - Kennzeichen besitzen Code, Name, Klassifizierungsart, Allokierbarkeit und Aktivstatus. Nur aktive Typen sollten für neue Klassifizierungen verwendet werden.
        - Die Bestandstabelle zeigt Dimension, Menge, Kennzeichen und Eigentümer. Klassifizieren öffnet ein separates Formular für genau den gewählten Bestandsschlüssel.
        actions:
          create_type: {label: "Kennzeichen anlegen", description: "Öffnet das gemeinsame Konfigurationsformular für einen neuen Sonderbestandstyp.", result: "Die Anlage erfolgt erst nach dem Speichern."}
          edit_type: {label: "Kennzeichen bearbeiten", description: "Öffnet Code, Name, Art, Allokierbarkeit und Aktivstatus des Typs.", result: "Bestehende Klassifizierungen bleiben referenziert."}
          classify: {label: "Bestand klassifizieren", description: "Öffnet den ausgewählten Artikel-, Platz- und Bestandsschlüssel zur Zuordnung.", result: "Die konkrete Dimension kann neu klassifiziert werden."}
        image: {src: "/assets/images/handbook/warehouse/special-stock.svg", alt: "Sonderbestandskennzeichen und klassifizierte Bestandsdimensionen"}
      special_stock_classify:
        template: warehouse/special_stock_classify.html.twig
        title: Bestand klassifizieren
        purpose: Das Formular ordnet einer unverwechselbaren Bestandsdimension ein Sonderbestandskennzeichen, optional einen Eigentümer und einen Auditgrund zu.
        navigation: Lager & Bestand → Sonderbestand → Klassifizieren
        permissions: ["inventory.special_stock.write"]
        overview:
        - Artikel, Lagerplatz und Bestandsschlüssel werden aus der gewählten Tabellenzeile übernommen und dürfen nicht frei geändert werden.
        fields:
          product_id: {label: "Artikel-ID", required: true, format: "Versteckte UUID des ausgewählten Artikels", example: "018f2f5a-73ad-7c42-9d84-2dcb65bcb410", help: "Wird automatisch aus der Bestandszeile übernommen.", effect: "Bindet die Klassifizierung an den Artikel.", errors: "Manipulierte oder unbekannte IDs werden abgewiesen."}
          location_id: {label: "Lagerplatz-ID", required: true, format: "Versteckte UUID des ausgewählten Lagerplatzes", example: "018f2f5a-73ad-7c42-9d84-2dcb65bcb411", help: "Wird automatisch aus der Bestandszeile übernommen.", effect: "Bindet die Klassifizierung an den Lagerplatz.", errors: "Ein unbekannter oder mandantenfremder Platz wird abgewiesen."}
          stock_key: {label: "Bestandsschlüssel", required: true, format: "Versteckter Schlüssel der vollständigen Bestandsdimension", example: "available|LOT-42||2027-12-31", help: "Nicht manuell verändern; er enthält Status und optionale Charge, Seriennummer und MHD.", effect: "Stellt sicher, dass genau die angezeigte Dimension klassifiziert wird.", errors: "Ein zwischenzeitlich nicht mehr vorhandener Schlüssel führt zu einem Konflikt."}
          special_stock_type_id: {label: "Sonderbestandskennzeichen", required: true, format: "Auswahl eines konfigurierten Typs", example: "CUSTOMER_OWNED", help: "Prüfen Sie Klassifizierungsart und Allokierbarkeit vor der Auswahl.", effect: "Bestimmt Kennzeichnung und Verfügbarkeit für Folgeprozesse.", errors: "Unbekannte oder inaktive Typen dürfen nicht neu zugeordnet werden."}
          owner_reference: {label: "Eigentümer", required: false, format: "Kunden-, Lieferanten- oder Partnerreferenz", example: "CUSTOMER-DE-1000", help: "Bei eigentumsbezogenen Kennzeichen den tatsächlichen Fremdeigentümer eindeutig erfassen.", effect: "Wird an der Bestandsdimension und in Folgebewegungen geführt.", errors: "Fehlende Eigentümerreferenz macht eigentumsbezogene Bestände fachlich unvollständig."}
          reason: {label: "Grund", required: true, format: "Nachvollziehbarer Audittext", example: "Kundenbeistellung laut Auftrag SO-0815", help: "Auslöser und Belegbezug konkret dokumentieren.", effect: "Wird mit der Umklassifizierung revisionssicher protokolliert.", errors: "Ein leerer Grund verhindert das Speichern."}
        actions:
          save: {label: "Klassifizierung speichern", description: "Validiert Dimension, Kennzeichen, Eigentümer und Grund und klassifiziert atomar.", result: "Die Sonderbestandsübersicht zeigt die neue Zuordnung."}
          cancel: {label: "Abbrechen", description: "Verwirft die nicht gespeicherte Änderung.", result: "Die Bestandsklassifizierung bleibt unverändert."}
        image: {src: "/assets/images/handbook/warehouse/special-stock-classify.svg", alt: "Formular zur Sonderbestandsklassifizierung mit Kennzeichen, Eigentümer und Grund"}
      selection_rules:
        template: warehouse/selection_rules.html.twig
        title: Entnahmeregeln und Ausführungsprotokoll
        purpose: Die Übersicht priorisiert FIFO-, LIFO- und FEFO-Regeln und dokumentiert jede automatische Bestandsauswahl.
        navigation: Lager & Bestand → Entnahmeregeln
        permissions: ["inventory.selection_rule.read; inventory.selection_rule.write für Anlage und Bearbeitung."]
        overview:
        - Regeln zeigen Priorität, Strategie, optionales Lager und optionalen Artikel sowie Aktivstatus. Spezifische Regeln können globale Regeln über die Priorität übersteuern.
        - Das Ausführungsprotokoll nennt Regel, Strategie, Artikel, Reservierung, angeforderte und allokierte Menge, Kandidatenanzahl und ausführenden Benutzer.
        actions:
          create: {label: "Regel anlegen", description: "Öffnet das Konfigurationsformular für Strategie, Priorität und Geltungsbereich.", result: "Die Regel wird erst nach erfolgreichem Speichern aktiv."}
          edit: {label: "Bearbeiten", description: "Öffnet die ausgewählte Regel mit ihrem aktuellen Geltungsbereich.", result: "Änderungen wirken auf nachfolgende automatische Auswahlen."}
        image: {src: "/assets/images/handbook/warehouse/selection-rules.svg", alt: "Entnahmeregeln mit Priorität, Strategie, Geltungsbereich und Ausführungsprotokoll"}
      inventory_configuration:
        template: warehouse/configuration_form.html.twig
        title: Lagerbezogene Regeln und Kennzeichen konfigurieren
        purpose: Das gemeinsame Formular erstellt und bearbeitet Entnahmeregeln, Sonderbestandskennzeichen und Sperrgründe abhängig vom aufrufenden Bereich.
        navigation: Lager & Bestand → Entnahmeregeln, Sonderbestand oder Bestandssperren → Anlegen/Bearbeiten
        permissions: ["inventory.selection_rule.write, inventory.special_stock.write oder inventory.stock_block.write abhängig vom Konfigurationstyp."]
        overview:
        - Angezeigt werden ausschließlich die zum gewählten Typ gehörenden Felder. Code und Name werden von allen drei Konfigurationen geteilt.
        fields:
          code: {label: "Code", required: true, format: "Im jeweiligen Konfigurationsbereich eindeutiger Code", example: "FEFO-WH1", help: "Stabile, sprechende Codes verwenden und nach Anlage möglichst nicht fachlich umdeuten.", effect: "Identifiziert Regel, Sonderbestandstyp oder Sperrgrund.", errors: "Leere oder doppelte Codes werden abgewiesen.", usages: ["Entnahmeregel, Sonderbestandskennzeichen und Sperrgrund"]}
          name: {label: "Name", required: true, format: "Verständliche Bezeichnung", example: "FEFO Zentrallager", help: "Zweck und Geltungsbereich für Bediener verständlich benennen.", effect: "Erscheint in Übersichten und Auswahllisten.", errors: "Ein leerer Name verhindert das Speichern.", usages: ["Entnahmeregel, Sonderbestandskennzeichen und Sperrgrund"]}
          strategy: {label: "Strategie", required: true, format: "fifo, lifo oder fefo", example: "fefo", help: "FIFO nimmt ältesten Zugang, LIFO den neuesten und FEFO das früheste verwendbare MHD.", effect: "Bestimmt die Sortierung geeigneter Bestandskandidaten.", errors: "FEFO benötigt bei relevanten Artikeln gepflegte MHD-Daten."}
          priority: {label: "Priorität", required: true, format: "Positive Ganzzahl", example: "100", help: "Mit einem abgestimmten Schema spezifische vor allgemeinen Regeln anordnen.", effect: "Bestimmt die Reihenfolge passender aktiver Entnahmeregeln.", errors: "Null, negative oder widersprüchliche Prioritäten werden abgewiesen beziehungsweise liefern unerwartete Auswahl."}
          warehouse_id: {label: "Lager", required: false, format: "Auswahl eines Lagers oder alle Lager", example: "WH1", help: "Leer lassen, wenn die Regel mandantenweit gelten soll.", effect: "Beschränkt die Entnahmeregel räumlich.", errors: "Unbekannte oder mandantenfremde Lager werden abgewiesen."}
          product_id: {label: "Artikel", required: false, format: "Auswahl eines Artikels oder alle Artikel", example: "SKU-4711", help: "Nur setzen, wenn die Strategie artikelspezifisch abweicht.", effect: "Beschränkt die Entnahmeregel auf diesen Artikel.", errors: "Unbekannte oder mandantenfremde Artikel werden abgewiesen."}
          enabled: {label: "Regel aktiv", required: false, format: "Checkbox", example: "aktiviert", help: "Deaktivieren, wenn die Regel vorübergehend nicht ausgewertet werden soll.", effect: "Nur aktive Regeln nehmen an automatischer Auswahl teil.", errors: "Ohne passende aktive Regel ist keine regelbasierte Allokation möglich."}
          classification_kind: {label: "Klassifizierungsart", required: true, format: "owner, status oder special", example: "owner", help: "Eigentum für Fremdbestand, Status für fachliche Qualität und Sonderart für weitere Zwecke wählen.", effect: "Beschreibt die Bedeutung des Sonderbestandskennzeichens.", errors: "Nicht unterstützte Werte werden abgewiesen."}
          allocatable: {label: "Allokierbar", required: false, format: "Checkbox", example: "deaktiviert", help: "Nur aktivieren, wenn dieser Sonderbestand regulär Kundenaufträgen zugeteilt werden darf.", effect: "Steuert die Berücksichtigung in Reservierung und Allokation.", errors: "Falsche Aktivierung kann Fremd- oder Prüfbestand zur Entnahme freigeben."}
          active: {label: "Aktiv", required: false, format: "Checkbox", example: "aktiviert", help: "Bei Bearbeitung deaktivieren, wenn Kennzeichen oder Sperrgrund nicht mehr neu verwendet werden soll.", effect: "Deaktivierte Einträge bleiben historisch erhalten, stehen aber nicht für neue Vorgänge bereit.", errors: "Bestehende Referenzen werden nicht gelöscht.", usages: ["Sonderbestandskennzeichen bei Bearbeitung und Sperrgrund"]}
          description: {label: "Beschreibung", required: false, format: "Mehrzeiliger Freitext", example: "Beschädigung bis zur QS-Entscheidung", help: "Anwendungsfall und erforderliche Folgehandlung des Sperrgrunds erläutern.", effect: "Unterstützt Benutzer bei der korrekten Grundauswahl.", errors: "Eine unklare Beschreibung kann zu falschen Sperrgründen führen."}
        actions:
          save: {label: "Speichern", description: "Validiert ausschließlich die Felder des aktuellen Konfigurationstyps und legt den Eintrag an beziehungsweise aktualisiert ihn.", result: "Die zugehörige Übersicht öffnet sich mit dem gespeicherten Eintrag."}
          cancel: {label: "Abbrechen", description: "Kehrt ohne Speicherung zur fachlichen Übersicht zurück.", result: "Vorherige Werte bleiben unverändert."}
        image: {src: "/assets/images/handbook/warehouse/configuration-form.svg", alt: "Gemeinsames Konfigurationsformular für Entnahmeregel, Sonderbestand und Sperrgrund"}
      topology_overview:
        template: warehouse/topology.html.twig
        title: Lagertopologie
        purpose: Die Übersicht bildet Standorte, Lager, Bereiche, Gänge und Lagerplätze als getrennte, hierarchisch verknüpfte Tabellen ab.
        navigation: Lager & Bestand → Lagertopologie
        permissions: ["inventory.topology.read; inventory.topology.write für Anlage und Bearbeitung."]
        overview:
        - Die fünf Register zeigen Anzahl und Kerndaten jeder Hierarchieebene. Lagerplätze lösen ihre Eltern lesbar als Standort, Lager, Bereich und Gang auf.
        - Kapazität null wird als unbegrenzt angezeigt. Jede Tabellenzeile besitzt bei Schreibrecht eine separate Bearbeiten-Seite; neue Elemente werden nach Ressourcentyp angelegt.
        actions:
          create: {label: "Topologieelement anlegen", description: "Öffnet das typabhängige Formular für Standort, Lager, Bereich, Gang oder Lagerplatz.", result: "Die Übersicht bleibt bis zum Speichern unverändert."}
          edit: {label: "Bearbeiten", description: "Öffnet das ausgewählte Element mit seinen typabhängigen Feldern.", result: "Identität und Hierarchiezuordnung bleiben kontrolliert erhalten."}
        image: {src: "/assets/images/handbook/warehouse/topology-overview.svg", alt: "Lagertopologie mit Standorten, Lagern, Bereichen, Gängen und Lagerplätzen"}
      topology_form:
        template: warehouse/topology_form.html.twig
        title: Topologieelement anlegen oder bearbeiten
        purpose: Das gemeinsame Formular pflegt jede Ebene der Lagerhierarchie mit den jeweils erforderlichen Eltern, Typen und Kapazitätsmerkmalen.
        navigation: Lager & Bestand → Lagertopologie → Anlegen/Bearbeiten
        permissions: ["inventory.topology.write"]
        overview:
        - Angezeigt werden nur die Felder des gewählten Ressourcentyps. Beim Bearbeiten können zusätzlich Standortstatus sowie Einlagerungspriorität und -freigabe eines Platzes geändert werden.
        fields:
          site_id: {label: "Standort", required: true, format: "Auswahl eines vorhandenen Standorts", example: "SITE-HH", help: "Ordnen Sie jedes Lager dem physischen Standort zu.", effect: "Verankert das Lager als zweite Hierarchieebene.", errors: "Unbekannte oder mandantenfremde Standorte werden abgewiesen."}
          warehouse_id: {label: "Lager", required: true, format: "Auswahl eines vorhandenen Lagers", example: "WH-HH-01", help: "Für Bereich und Lagerplatz das tatsächlich zuständige Lager auswählen.", effect: "Begrenzt Bereich beziehungsweise Platz auf dieses Lager.", errors: "Inkonsistente Elternzuordnungen verhindern das Speichern.", usages: ["Lagerbereich und Lagerplatz"]}
          area_id: {label: "Lagerbereich", required: true, format: "Auswahl eines vorhandenen Bereichs", example: "PICK-A", help: "Für Gang oder Platz den fachlich richtigen Bereich auswählen.", effect: "Ordnet Gang beziehungsweise Platz dem Bereich zu.", errors: "Ein Bereich außerhalb des gewählten Lagers ist ungültig.", usages: ["Lagergang und Lagerplatz"]}
          aisle_id: {label: "Lagergang", required: true, format: "Auswahl eines vorhandenen Gangs", example: "A-01", help: "Der Gang muss zum gewählten Bereich und Lager gehören.", effect: "Vervollständigt die Elternkette des Lagerplatzes.", errors: "Ein inkonsistenter Gang wird abgewiesen."}
          code: {label: "Code", required: true, format: "Im jeweiligen Elternkontext eindeutiger Code", example: "BIN-A-01-02-03", help: "Kurze, scanbare und dauerhaft stabile Codes verwenden.", effect: "Identifiziert das Element in Auswahl, Scan und Prozesssteuerung.", errors: "Leere oder im Kontext doppelte Codes werden abgewiesen.", usages: ["Standort, Lager, Bereich, Gang und Lagerplatz"]}
          name: {label: "Name", required: true, format: "Verständliche Bezeichnung", example: "Kommissionierung Nord", help: "Den betrieblichen Zweck für Disponenten und Bediener benennen.", effect: "Erscheint in Übersichten und Auswahlfeldern.", errors: "Ein leerer Name verhindert die Anlage.", usages: ["Standort, Lager, Bereich und Gang"]}
          timezone: {label: "Zeitzone", required: true, format: "Gültige IANA-Zeitzone", example: "Europe/Berlin", help: "Die lokale Zeitzone des physischen Standorts angeben.", effect: "Steuert lokale Zeitdarstellung und zeitabhängige Prozesse.", errors: "Ungültige Zeitzonen werden abgewiesen."}
          status: {label: "Standortstatus", required: false, format: "active oder inactive", example: "active", help: "Nur bei Bearbeitung deaktivieren, wenn der Standort keine neuen Vorgänge annehmen soll.", effect: "Steuert die operative Nutzbarkeit des Standorts.", errors: "Offene Abhängigkeiten können eine Deaktivierung verhindern."}
          warehouse_type: {label: "Lagertyp", required: true, format: "standard, high_bay, block oder automated", example: "high_bay", help: "Den baulichen und operativen Lagertyp auswählen.", effect: "Klassifiziert das Lager für Planung und Auswertung.", errors: "Nicht angebotene Typen werden abgewiesen."}
          area_type: {label: "Bereichstyp", required: true, format: "storage, receiving, shipping, quality oder blocked", example: "quality", help: "Der Typ muss der tatsächlichen Prozessfunktion entsprechen.", effect: "Steuert fachliche Eignung für Zugang, Lagerung, Versand oder Sperrung.", errors: "Falsche Typisierung kann Einlagerung und Routing verhindern."}
          level_code: {label: "Ebene", required: true, format: "Kurzer Ebenencode", example: "02", help: "Physische Regalebene konsistent und scanbar bezeichnen.", effect: "Wird mit Fach und Platzcode in Anzeige und Wegeplanung verwendet.", errors: "Ein leerer Ebenencode verhindert die Platzanlage."}
          bin_code: {label: "Fach", required: true, format: "Kurzer Fachcode", example: "03", help: "Die physische Fachposition innerhalb von Gang und Ebene angeben.", effect: "Ergänzt die genaue Lagerplatzposition.", errors: "Ein leerer oder doppelt kombinierter Fachcode ist ungültig."}
          location_type: {label: "Lagerplatztyp", required: true, format: "storage, receiving, shipping, quality oder blocked", example: "storage", help: "Nur einen Typ wählen, der der physischen Nutzung entspricht.", effect: "Begrenzt zulässige Lager- und Prozessoperationen.", errors: "Unpassende Typen können Bestandsbewegungen blockieren."}
          capacity_quantity: {label: "Kapazität", required: false, format: "Ganzzahl ab 0; 0 bedeutet unbegrenzt", example: "100", help: "Kapazität in der betrieblich verwendeten Mengeneinheit pflegen.", effect: "Steuert Auslastungsanzeige und Kapazitätsprüfung.", errors: "Negative Werte sind ungültig."}
          putaway_priority: {label: "Einlagerungspriorität", required: false, format: "Ganzzahl ab 0", example: "100", help: "Nur beim Bearbeiten eines Platzes; mit dem betrieblichen Prioritätsschema abstimmen.", effect: "Beeinflusst die Reihenfolge geeigneter Einlagerungsziele.", errors: "Widersprüchliche Prioritäten liefern unerwartete Zielreihenfolgen."}
          putaway_enabled: {label: "Einlagerung erlaubt", required: false, format: "Checkbox", example: "aktiviert", help: "Deaktivieren, wenn der Platz vorübergehend kein Einlagerungsziel sein darf.", effect: "Entfernt den Platz aus der automatischen Einlagerungsauswahl.", errors: "Bestehender Bestand bleibt erhalten und muss separat behandelt werden."}
        actions:
          save: {label: "Speichern", description: "Validiert Ressourcentyp, Elternkette und typabhängige Werte und legt an beziehungsweise aktualisiert.", result: "Das Element erscheint aktualisiert in seinem Topologieregister."}
          cancel: {label: "Abbrechen", description: "Kehrt ohne Speicherung zur Topologie zurück.", result: "Vorhandene Werte bleiben unverändert."}
        image: {src: "/assets/images/handbook/warehouse/topology-form.svg", alt: "Formular für Hierarchie, Typ, Kapazität und Einlagerungssteuerung"}
      stock_blocks_overview:
        template: warehouse/stock_blocks.html.twig
        title: Bestandssperren
        purpose: Die Übersicht startet Sperren aus verfügbaren Bestandsdimensionen und verfolgt den getrennten Prüf- und Freigabeworkflow.
        navigation: Lager & Bestand → Bestandssperren
        permissions: ["inventory.stock_block.read; inventory.stock_block.write zum Sperren."]
        overview:
        - Sperrbar sind positive, noch nicht gesperrte Bestände. Ohne aktiven Sperrgrund wird keine Sperraktion angeboten.
        - Die Sperrliste zeigt Status open, reviewed oder released, Artikel, Platz, Menge, Grund, Notiz und ursprüngliche Dimension.
        actions:
          block: {label: "Sperren", description: "Öffnet den ausgewählten Bestand mit unveränderlichen Dimensionsdaten.", result: "Die Sperre entsteht erst nach Begründung und Speicherung."}
          open: {label: "Bearbeiten", description: "Öffnet Status, Grund, Auditprotokoll und die nächste zulässige Workflowaktion.", result: "Das Öffnen verändert keinen Status."}
        image: {src: "/assets/images/handbook/warehouse/stock-blocks.svg", alt: "Bestandssperren mit verfügbaren Beständen und Prüfworkflow"}
      stock_block_reasons:
        template: warehouse/stock_block_reasons.html.twig
        title: Sperrgründe
        purpose: Die Übersicht verwaltet Codes, Namen, Beschreibungen und Aktivstatus der Gründe, die neue Bestandssperren rechtfertigen.
        navigation: Lager & Bestand → Sperrgründe
        permissions: ["inventory.stock_block.read; inventory.stock_block.write für Anlage und Bearbeitung."]
        overview:
        - Nur aktive Gründe stehen beim Anlegen einer Sperre zur Auswahl. Deaktivierung erhält historische Referenzen.
        actions:
          create: {label: "Sperrgrund anlegen", description: "Öffnet das gemeinsame Lager-Konfigurationsformular.", result: "Der Grund wird erst nach Speicherung verfügbar."}
          edit: {label: "Bearbeiten", description: "Öffnet Bezeichnung, Beschreibung und Aktivstatus.", result: "Bestehende Sperren bleiben mit dem Grund verknüpft."}
        image: {src: "/assets/images/handbook/warehouse/stock-block-reasons.svg", alt: "Sperrgrundübersicht mit Code, Beschreibung und Aktivstatus"}
      stock_block_create:
        template: warehouse/stock_block_new.html.twig
        title: Bestand sperren
        purpose: Das Formular sperrt eine Teil- oder Gesamtmenge der exakt ausgewählten Bestandsdimension mit aktivem Grund und Auditnotiz.
        navigation: Lager & Bestand → Bestandssperren → Sperren
        permissions: ["inventory.stock_block.write"]
        overview:
        - Artikel, Lagerplatz, Status, Charge, Seriennummer und MHD werden aus der Bestandszeile übernommen. Seriennummernbestand ist auf Menge eins begrenzt.
        fields:
          product_id: {label: "Artikel-ID", required: true, format: "Versteckte UUID", example: "018f2f5a-73ad-7c42-9d84-2dcb65bcb410", help: "Automatisch aus der ausgewählten Bestandszeile übernommen.", effect: "Bindet die Sperre an den Artikel.", errors: "Manipulierte oder unbekannte IDs werden abgewiesen."}
          location_id: {label: "Lagerplatz-ID", required: true, format: "Versteckte UUID", example: "018f2f5a-73ad-7c42-9d84-2dcb65bcb411", help: "Nicht verändern; sie bezeichnet den Quellbestand.", effect: "Bindet die Sperre an den Platz.", errors: "Mandantenfremde oder unbekannte Plätze werden abgewiesen."}
          stock_status: {label: "Ursprünglicher Bestandsstatus", required: true, format: "Versteckter Statuscode", example: "available", help: "Wird zur späteren kontrollierten Freigabe aufbewahrt.", effect: "Definiert die Statusdimension der gesperrten Menge.", errors: "Bereits gesperrter oder geänderter Bestand verursacht einen Konflikt."}
          batch_number: {label: "Charge", required: false, format: "Versteckte exakte Charge", example: "LOT-20261005", help: "Wird bei chargengeführtem Bestand automatisch übernommen.", effect: "Beschränkt die Sperre auf diese Charge.", errors: "Eine nicht mehr vorhandene Charge kann nicht gesperrt werden."}
          serial_number: {label: "Seriennummer", required: false, format: "Versteckte eindeutige Seriennummer", example: "SN-0001842", help: "Bei Serienbestand wird genau diese Einheit gesperrt.", effect: "Begrenzt die Sperrmenge auf eins.", errors: "Bereits bewegte oder gesperrte Seriennummern werden abgewiesen."}
          expires_at: {label: "MHD", required: false, format: "Verstecktes ISO-Datum", example: "2028-10-31", help: "Bleibt Bestandteil der eindeutigen Bestandsdimension.", effect: "Sichert die MHD-genaue Sperre.", errors: "Zwischenzeitlich geänderte Dimensionen führen zu einem Konflikt."}
          reason_id: {label: "Sperrgrund", required: true, format: "Auswahl eines aktiven Grunds", example: "DAMAGE", help: "Den tatsächlich zutreffenden, intern definierten Grund wählen.", effect: "Steuert Audit und spätere Prüfung.", errors: "Inaktive oder unbekannte Gründe werden abgewiesen."}
          quantity: {label: "Sperrmenge", required: true, format: "Positive Ganzzahl bis zum vorhandenen Bestand; bei Seriennummer eins", example: "5", help: "Nur die tatsächlich betroffene Menge sperren.", effect: "Entzieht diese Menge der regulären Verfügbarkeit.", errors: "Null, Übermenge oder Serienmenge größer eins ist ungültig."}
          note: {label: "Begründung", required: true, format: "Nachvollziehbarer Freitext", example: "Außenverpackung bei Kontrolle beschädigt", help: "Befund, Quelle und gegebenenfalls Belegreferenz konkret nennen.", effect: "Eröffnet das unveränderliche Sperrprotokoll.", errors: "Eine leere Notiz verhindert die Sperre."}
        actions:
          block: {label: "Bestand sperren", description: "Validiert Dimension, verfügbare Menge, Grund und Notiz und startet den Workflow.", result: "Die Sperre erhält den Status open und die Menge ist nicht regulär verfügbar."}
          cancel: {label: "Abbrechen", description: "Verwirft die Eingabe.", result: "Der Bestand bleibt verfügbar."}
        image: {src: "/assets/images/handbook/warehouse/stock-block-create.svg", alt: "Formular zum Sperren einer konkreten Bestandsdimension"}
      stock_block_detail:
        template: warehouse/stock_block_show.html.twig
        title: Bestandssperre prüfen und freigeben
        purpose: Die Detailansicht trennt unabhängige Prüfung und Freigabe und zeigt sämtliche Sperrereignisse revisionssicher.
        navigation: Lager & Bestand → Bestandssperren → Bearbeiten
        permissions: ["inventory.stock_block.read; inventory.stock_block.review zur Prüfung; inventory.stock_block.release zur Freigabe."]
        overview:
        - Im Status open ist nur die Prüfung möglich; im Status reviewed nur die Freigabe. Nach released ist keine weitere Aktion verfügbar.
        fields:
          note: {label: "Prüf- oder Freigabenotiz", required: true, format: "Nachvollziehbarer Befund oder Entscheidungsvermerk", example: "Ware geprüft, Verpackung ersetzt, Freigabe zulässig", help: "Ergebnis, Entscheidung und gegebenenfalls Maßnahmen vollständig festhalten.", effect: "Wird als neues Ereignis mit Benutzer und Zeitpunkt protokolliert.", errors: "Leere Notizen oder Aktionen im falschen Status werden abgewiesen.", usages: ["Prüfung einer offenen und Freigabe einer geprüften Sperre"]}
        actions:
          review: {label: "Sperre prüfen", description: "Dokumentiert das Prüfergebnis einer offenen Sperre.", result: "Der Status wechselt von open zu reviewed."}
          release: {label: "Bestand freigeben", description: "Bestätigt die Freigabe einer geprüften Sperre.", result: "Der Status wechselt zu released und die Menge wird gemäß Ursprungsdimension wieder verfügbar."}
        image: {src: "/assets/images/handbook/warehouse/stock-block-detail.svg", alt: "Bestandssperre mit Prüfaktion, Freigabe und Ereignisprotokoll"}
      inventory_control:
        template: warehouse/inventory_count/control.html.twig
        title: Inventur- und Materialleitstelle
        purpose: Die Leitstelle bündelt Gefahrstoffe und Lagerrestriktionen, Stücklisten und Materialbedarf, Ladehilfsmittelkonten sowie Stichtags- und permanente Inventur.
        navigation: Lager & Bestand → Inventurleitstelle
        permissions: ["inventory.control.read; inventory.hazard.write; inventory.bom.write/execute; inventory.load_carrier.write; inventory.count.write/execute/approve abhängig von der Aktion."]
        overview:
        - Gefahrstoffklassen werden Artikeln über UN-Nummer und Verpackungsgruppe zugeordnet; Bereichsregeln erlauben oder begrenzen Mengen nach Lagerplatzpräfix.
        - Stücklisten enthalten Komponenten als JSON. Materialbedarfe multiplizieren Komponenten mit Produktionsmenge. Ladehilfsmittelbuchungen verändern Partnerkonten nachvollziehbar.
        - Inventuren folgen open → counted → approved. Zählmengen werden je Position gespeichert, anschließend eingereicht und erst durch separate Freigabe als Differenz gebucht.
        fields:
          code: {label: "Code", required: true, format: "Im jeweiligen Bereich eindeutiger Code", example: "INV-2026-01", help: "Für Gefahrstoffklasse, Stückliste, Inventur oder Plan eine stabile Konvention verwenden.", effect: "Identifiziert das erzeugte Fachobjekt.", errors: "Leere oder doppelte Codes werden abgewiesen.", usages: ["Gefahrstoffklasse, Stückliste, Stichtagsinventur und permanenter Inventurplan"]}
          name: {label: "Name", required: true, format: "Verständliche Bezeichnung", example: "Entzündbare flüssige Stoffe", help: "Gefahrstoffklasse für Bediener eindeutig beschreiben.", effect: "Erscheint in Klassifizierungsauswahlen.", errors: "Ein leerer Name verhindert die Anlage."}
          un_class: {label: "UN-Klasse", required: true, format: "Gültige Gefahrgutklasse", example: "3", help: "Klasse gemäß Gefahrgutdokumentation erfassen.", effect: "Klassifiziert die regulatorische Gefahr.", errors: "Eine leere oder fachlich falsche Klasse macht Regeln unwirksam."}
          product_id: {label: "Artikel", required: true, format: "Auswahl eines vorhandenen Artikels", example: "SKU-CHEM-01", help: "Bei Gefahrstoff oder Stückliste den richtigen Artikel wählen.", effect: "Bindet Klassifizierung beziehungsweise Stückliste an den Artikel.", errors: "Unbekannte Artikel werden abgewiesen.", usages: ["Gefahrstoffklassifizierung und Stücklistenkopf"]}
          hazard_class_id: {label: "Gefahrstoffklasse", required: true, format: "Auswahl einer konfigurierten Klasse", example: "HAZ-3", help: "Muss zur Sicherheitsdokumentation des Artikels beziehungsweise zur Bereichsregel passen.", effect: "Verknüpft Artikel oder Lagerrestriktion mit der Klasse.", errors: "Unbekannte Klassen werden abgewiesen.", usages: ["Artikelklassifizierung und Lagerbereichsregel"]}
          un_number: {label: "UN-Nummer", required: true, format: "Vierstellige UN-Nummer", example: "UN 1993", help: "Exakt aus Sicherheitsdatenblatt übernehmen.", effect: "Identifiziert den Gefahrstoff für Transport und Lagerung.", errors: "Fehlende oder falsche Nummern gefährden Compliance."}
          packing_group: {label: "Verpackungsgruppe", required: false, format: "I, II oder III", example: "II", help: "Sofern vorgeschrieben aus dem Sicherheitsdatenblatt übernehmen.", effect: "Ergänzt die Gefahreneinstufung.", errors: "Unpassende Gruppen können falsche Verpackungsregeln auslösen."}
          description: {label: "Beschreibung", required: true, format: "Fachlicher Klartext", example: "Entzündbare Flüssigkeit, fern von Zündquellen lagern", help: "Gefahr und wesentliche Handhabung verständlich dokumentieren.", effect: "Erscheint in der Gefahrstoffübersicht.", errors: "Leertext verhindert die Klassifizierung."}
          location_prefix: {label: "Lagerplatzpräfix", required: false, format: "Anfang eines Lagerplatzcodes", example: "HAZ-A-", help: "Bei Bereichsregel erforderlich; bei Inventur optional zur räumlichen Eingrenzung.", effect: "Beschränkt Restriktion, Inventur oder Plan auf passende Plätze.", errors: "Ein unpassendes Präfix trifft keine Plätze.", usages: ["Gefahrstoff-Lagerregel, Stichtagsinventur und permanenter Inventurplan"]}
          max_quantity: {label: "Maximalmenge", required: false, format: "Ganzzahl ab 0", example: "500", help: "Leer lassen, wenn nur Erlaubnis beziehungsweise Verbot relevant ist.", effect: "Begrenzt die Gefahrstoffmenge im passenden Platzbereich.", errors: "Negative Werte sind ungültig."}
          allowed: {label: "Einlagerung erlaubt", required: false, format: "Checkbox", example: "aktiviert", help: "Deaktivieren, um die Klasse im Platzbereich vollständig zu verbieten.", effect: "Steuert die Einlagerungsprüfung für Gefahrstoffe.", errors: "Eine falsche Freigabe kann Sicherheitsvorgaben verletzen."}
          version: {label: "Stücklistenversion", required: true, format: "Versionskennung", example: "1", help: "Bei fachlicher Änderung eine nachvollziehbare neue Version verwenden.", effect: "Identifiziert den Komponentenstand.", errors: "Leere oder doppelte Versionen werden abgewiesen."}
          items: {label: "Komponenten", required: true, format: "JSON-Array mit productId und ganzzahliger quantity", example: "[{'productId':'UUID','quantity':2}]", help: "Jede Komponente mit gültiger Artikel-UUID und positiver Einsatzmenge angeben.", effect: "Definiert den Materialbedarf pro Produktionseinheit.", errors: "Ungültiges JSON, fehlende Felder oder nicht ganzzahlige Mengen werden abgewiesen."}
          bom_id: {label: "Stückliste", required: true, format: "Auswahl einer vorhandenen Version", example: "BOM-4711 / 1", help: "Die für den Produktionsauftrag gültige Version wählen.", effect: "Dient als Basis der Bedarfsermittlung.", errors: "Unbekannte Stücklisten werden abgewiesen."}
          reference: {label: "Referenz", required: true, format: "Eindeutige Produktions- oder Buchungsreferenz", example: "PROD-2026-0815", help: "Externen Auftrag oder internen Beleg nachvollziehbar referenzieren.", effect: "Verknüpft Materialbedarf oder Ladehilfsmittelbuchung mit dem Auslöser.", errors: "Eine leere Referenz verhindert die Buchung.", usages: ["Materialbedarf und Ladehilfsmittelbuchung"]}
          production_quantity: {label: "Produktionsmenge", required: true, format: "Positive Ganzzahl", example: "25", help: "Geplante Anzahl herzustellender Einheiten erfassen.", effect: "Multipliziert jede Stücklistenkomponente zum Gesamtbedarf.", errors: "Null oder negative Mengen sind ungültig."}
          partner_code: {label: "Partner", required: true, format: "Eindeutiger Kunden-, Lieferanten- oder Carrier-Code", example: "SUPPLIER-1000", help: "Den Kontoinhaber der Ladehilfsmittelbewegung angeben.", effect: "Bucht die Menge auf dessen Saldo.", errors: "Ein leerer Partnercode verhindert die Buchung."}
          carrier_type: {label: "Ladehilfsmitteltyp", required: true, format: "Betrieblicher Typcode", example: "EURO_PALLET", help: "Palette, KLT oder Gitterbox eindeutig unterscheiden.", effect: "Führt einen separaten Saldo je Partner und Typ.", errors: "Inkonsistente Typcodes zersplittern Konten."}
          quantity: {label: "Menge", required: true, format: "Ganzzahl mit Vorzeichen gemäß Buchungsrichtung", example: "10", help: "Zugang positiv und Rückgabe gemäß betrieblicher Konvention erfassen; bei Inventur die physisch gezählte Menge.", effect: "Ändert Ladehilfsmittelsaldo oder Zählposition.", errors: "Nicht numerische Werte werden abgewiesen.", usages: ["Ladehilfsmittelbuchung und Inventurzählung"]}
          note: {label: "Notiz", required: false, format: "Freitext", example: "Tausch bei Anlieferung PO-4711", help: "Abweichungen oder Buchungskontext ergänzen.", effect: "Unterstützt die spätere Kontenklärung.", errors: "Die Notiz ersetzt keine eindeutige Referenz."}
          warehouse_id: {label: "Lager", required: true, format: "Auswahl eines vorhandenen Lagers", example: "WH1", help: "Das physisch zu zählende Lager wählen.", effect: "Begrenzt Inventur beziehungsweise Plan auf dieses Lager.", errors: "Unbekannte Lager werden abgewiesen.", usages: ["Stichtagsinventur und permanenter Inventurplan"]}
          interval_days: {label: "Intervall in Tagen", required: true, format: "Positive Ganzzahl", example: "30", help: "Zählfrequenz passend zu ABC-Klasse und betrieblicher Vorgabe wählen.", effect: "Berechnet wiederkehrende Fälligkeiten des Plans.", errors: "Null oder negative Intervalle sind ungültig."}
          next_due_at: {label: "Nächste Fälligkeit", required: true, format: "Lokales Datum und Uhrzeit", example: "2026-11-01 06:00", help: "Ersten geplanten Zählzeitpunkt festlegen.", effect: "Bestimmt, wann die nächste zyklische Inventur gestartet werden kann.", errors: "Ungültige Zeitwerte werden abgewiesen."}
        actions:
          create_hazard_class: {label: "Gefahrstoffklasse anlegen", description: "Speichert Code, Name und UN-Klasse.", result: "Die Klasse steht für Artikel und Bereichsregeln bereit."}
          classify_material: {label: "Artikel klassifizieren", description: "Ordnet Gefahrstoffklasse, UN-Nummer, Verpackungsgruppe und Beschreibung zu.", result: "Der Artikel erscheint in der Gefahrstoffliste."}
          save_restriction: {label: "Bereichsregel speichern", description: "Definiert Erlaubnis und optionale Höchstmenge je Klasse und Platzpräfix.", result: "Einlagerungen werden gegen die Regel geprüft."}
          create_bom: {label: "Stückliste speichern", description: "Validiert Kopf und Komponenten-JSON und legt die Version an.", result: "Die Stückliste steht für Bedarfsermittlungen bereit."}
          plan_requirement: {label: "Bedarf erzeugen", description: "Multipliziert Komponenten mit der Produktionsmenge.", result: "Ein nachvollziehbarer Materialbedarf wird angelegt."}
          book_carrier: {label: "Ladehilfsmittel buchen", description: "Bucht Menge und Referenz auf Partner und Typ.", result: "Der Kontosaldo wird aktualisiert."}
          create_count: {label: "Stichtagsinventur eröffnen", description: "Erzeugt Zählpositionen für Lager und optionales Platzpräfix.", result: "Die Inventur startet im Status open."}
          create_cycle_plan: {label: "Permanenten Plan speichern", description: "Speichert Bereich, Intervall und nächste Fälligkeit.", result: "Der Plan kann bei Fälligkeit eine zyklische Inventur erzeugen."}
          record_count: {label: "Zählmenge speichern", description: "Speichert die physisch ermittelte Menge einer offenen Position.", result: "Differenzen werden sichtbar, aber noch nicht gebucht."}
          submit_count: {label: "Inventur einreichen", description: "Schließt die Erfassung aller Positionen zur Prüfung ab.", result: "Der Status wechselt von open zu counted."}
          approve_count: {label: "Freigeben und buchen", description: "Genehmigt die ermittelten Differenzen getrennt von der Zählung.", result: "Differenzbewegungen werden atomar gebucht und die Inventur abgeschlossen."}
        image: {src: "/assets/images/handbook/warehouse/inventory-control.svg", alt: "Inventurleitstelle mit Gefahrstoffen, Stücklisten, Ladehilfsmitteln und Zählworkflow"}
    guidance:
      prerequisites:
      - Standort, Lager, Bereich, Gang, Platz und Artikel sind aktiv und mandantenzugehörig.
      permissions:
      - inventory.topology.read/write, inventory.overview.read, inventory.stock.read/transfer, inventory.stock.movement.read, inventory.traceability.read, Rechte für special_stock, selection_rule
        und stock_block.
      fields:
      - 'Topologie: site_id, warehouse_id, area_id, aisle_id, code, type, capacity_quantity, priority, active. Bestand: product_id, location_id, quantity, status, batch_number, serial_number,
        expires_at, owner_reference. Sperre/Strategie: reason_id, selection_type, selection_value, sequence_number.'
      statuses:
      - Bestand kann available, blocked oder fachlich klassifiziert sein. Sperren wechseln open → reviewed → released; jede Bewegung bleibt im Ledger.
      errors:
      - Negative Bestände, doppelte Seriennummern, unzulässige Statuswechsel, volle Zielplätze oder nicht passende Gefahrstoff-/Lagerregeln werden abgewiesen.
  inventory_counting:
    title: Inventur und Bestandskontrolle
    summary: Stichtag, permanente Inventur, Nulldurchgang, Zählung und Differenzfreigabe.
    sections:
      section_1:
        title: Inventur vorbereiten
        paragraphs:
          paragraph_1: Wählen Sie Inventurart, Standort, Lagerbereich und Stichtag. Das System verhindert parallele offene Inventuren desselben Bereichs. Der erzeugte Sollbestand ist
            ein unveränderlicher Snapshot; Bewegungen nach dem Start werden separat nachvollzogen.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Inventur vorbereiten – Screenshot-Platzhalter
      section_2:
        title: Zählen und einreichen
        paragraphs:
          paragraph_1: Erfassen Sie Zählmenge und bei Bedarf Charge, Seriennummer oder Bemerkung. Blindzählung blendet den Sollwert aus. Reichen Sie erst ein, wenn alle Positionen bearbeitet
            sind. Nulldurchgangsinventuren entstehen ereignisbezogen, permanente Inventuren anhand fälliger Pläne.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: 'Platzhalter: Inventurbeleg und Zählung'
      section_3:
        title: Differenzen freigeben
        paragraphs:
          paragraph_1: Abweichungen benötigen eine berechtigte zweite Person. Prüfen Sie Soll, Ist, Bewegungen und Begründung. Freigabe bucht die Korrektur ins Ledger; Ablehnung oder
            Nachzählung verändert den Arbeitsstatus, ohne die ursprüngliche Zählung zu löschen.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Differenzen freigeben – Screenshot-Platzhalter
      section_4:
        title: Abschluss
        paragraphs:
          paragraph_1: Schließen Sie die Inventur erst nach Bearbeitung aller Differenzen. Kontrollieren Sie Abschlussstatus, Korrekturbuchungen und Auditprotokoll.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Abschluss – Screenshot-Platzhalter
    guidance:
      prerequisites:
      - Eindeutig abgegrenzter Lagerbereich; parallele offene Inventuren desselben Bereichs sind nicht zulässig.
      permissions:
      - inventory.control.read, inventory.count.write/execute/approve, inventory.hazard.write, inventory.bom.write/execute und inventory.load_carrier.write.
      fields:
      - 'Plan: scope, schedule_type, interval_days, next_due_at. Zählung: location_id, product_id, batch, serial, actual_quantity, note. Freigabe: decision, reason. Gefahrstoff/Stückliste/LHM:
        Codes, Mengen, Restriktionen und Komponenten.'
      statuses:
      - Inventur open → counted → completed. Differenzen benötigen eine zweite berechtigte Person; Freigabe erzeugt eine Ledgerkorrektur.
      errors:
      - Doppelter offener Beleg, fehlende Zählposition, negative Menge, Selbstfreigabe oder Abschluss mit offenen Differenzen wird verhindert.
  inbound:
    title: Wareneingang und Einlagerung
    summary: Bestellungen, Avis, geplante und ungeplante Zugänge, QS, Abweichungen und Putaway.
    sections:
      section_1:
        title: Geplanten Wareneingang bearbeiten
        paragraphs:
          paragraph_1: Suchen Sie Bestellung oder Avis, öffnen Sie den Beleg und prüfen Sie Lieferant, Artikel, erwartete Menge und Termin. Erfassen Sie die tatsächlich eingetroffene
            Menge sowie Charge, Seriennummer, MHD und Ladehilfsmittel. Teilmengen bleiben offen, sofern der Beleg dies zulässt.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Geplanten Wareneingang bearbeiten – Screenshot-Platzhalter
      section_2:
        title: Ungeplanten Zugang erfassen
        paragraphs:
          paragraph_1: Wählen Sie Mandant, Standort, Lieferant beziehungsweise Herkunft, Artikel und Menge. Begründen Sie den ungeplanten Zugang. Dubletten werden über externe Referenzen
            und Idempotenzschlüssel verhindert.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: 'Platzhalter: Wareneingangsprüfung'
      section_3:
        title: Qualitätsprüfung und Abweichungen
        paragraphs:
          paragraph_1: Arbeiten Sie die konfigurierte Checkliste ab. Mengen-, Identitäts- oder Qualitätsabweichungen erzeugen einen kontrollierten Fall. Gesperrte Ware bleibt unverfügbar,
            bis eine berechtigte Person freigibt oder ablehnt. Entscheidungen benötigen einen Grund und werden auditiert.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Qualitätsprüfung und Abweichungen – Screenshot-Platzhalter
      section_4:
        title: Einlagerung
        paragraphs:
          paragraph_1: Lassen Sie anhand der aktiven Strategie einen Zielplatz vorschlagen oder wählen Sie bei entsprechender Berechtigung einen zulässigen Platz. Prüfen Sie Kapazität,
            Gefahrstoffregeln, Artikelverträglichkeit und Status. Bestätigen Sie Quell- und Zielscan; danach wird der Bestand atomar umgebucht.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Einlagerung – Screenshot-Platzhalter
    views:
      unplanned_receipts_overview:
        template: inbound/index.html.twig
        title: Ungeplante Wareneingänge
        purpose: Die Übersicht zeigt bereits erfasste ungeplante Zugänge und führt zur Erfassung, Detailansicht oder geplanten Annahme.
        navigation: Wareneingang → Ungeplante Wareneingänge
        permissions: ["inbound.receipt.read; inbound.receipt.write für die Neuanlage; inbound.planned.read für den Wechsel zu geplanten Eingängen."]
        overview:
        - Spalten zeigen Wareneingangsnummer, Lieferant, Lieferschein, Positionsanzahl, Gesamtmenge und Status. Öffnen führt zur unveränderlichen Detail- und Buchungsansicht.
        - Ein leerer Zustand bedeutet, dass im aktiven Mandanten noch kein ungeplanter Eingang erfasst wurde; Filter oder Pagination besitzt diese Tabelle nicht.
        actions:
          create: {label: "Ungeplanten Eingang erfassen", description: "Öffnet das separate Annahmeformular.", result: "Die Übersicht wird erst nach erfolgreichem Speichern ergänzt."}
          open: {label: "Öffnen", description: "Zeigt Kopf, Positionen, Bestandsdimensionen und Buchungsstatus des gewählten Eingangs.", result: "Die Navigation verändert keine Daten."}
          planned: {label: "Geplante Eingänge", description: "Wechselt zur Avis- und Bestellannahme.", result: "Offene geplante Positionen werden angezeigt."}
        image: {src: "/assets/images/handbook/inbound/unplanned-overview.svg", alt: "Übersicht ungeplanter Wareneingänge mit Status und Öffnen-Aktion"}
      unplanned_receipt_create:
        template: inbound/new.html.twig
        title: Ungeplanten Wareneingang erfassen
        purpose: Das Formular nimmt Ware ohne vorherige Bestellung oder Avis direkt an einem Empfangsplatz an.
        navigation: Wareneingang → Ungeplante Wareneingänge → Ungeplanten Eingang erfassen
        permissions: ["inbound.receipt.write; Artikel und Empfangsplatz müssen im aktiven Mandanten vorhanden sein."]
        overview: ["Prüfen Sie vor der Annahme Lieferant, Artikel, Menge, Bestandsstatus und gegebenenfalls Charge oder Seriennummer. Speichern erzeugt zunächst einen kontrollierten Wareneingang, noch keine endgültige Bestandsbuchung."]
        fields:
          code: {label: "Wareneingangsnummer", required: true, format: "Im Mandanten eindeutiger Belegcode", example: "UE-2026-0042", help: "Verwenden Sie eine nachvollziehbare externe oder interne Referenz.", effect: "Identifiziert den Eingang und verhindert unbeabsichtigte Dubletten.", errors: "Leere oder bereits verwendete Codes werden abgewiesen."}
          supplier_code: {label: "Lieferantencode", required: true, format: "Stabiler Großbuchstaben-/Zifferncode", example: "SUP-1000", help: "Identifiziert den Absender auch ohne angelegten Bestellbezug.", effect: "Wird am Wareneingang und in Auswertungen gespeichert.", errors: "Leere Codes verhindern die Annahme."}
          supplier_name: {label: "Lieferantenname", required: true, format: "Vollständige verständliche Bezeichnung", example: "Muster Liefertechnik GmbH", help: "Ergänzt den Code für Benutzer und Nachweise.", effect: "Erscheint in Übersicht und Detailansicht.", errors: "Ein leerer Name ist ungültig."}
          delivery_note: {label: "Lieferschein", required: false, format: "Exakte Lieferantenreferenz", example: "LS-84711", help: "Erleichtert Rückfragen und Dublettenprüfung.", effect: "Wird als zusätzliche externe Referenz gespeichert.", errors: "Unklare oder wiederverwendete Referenzen müssen vor der Buchung geprüft werden."}
          product_id: {label: "Artikel", required: true, format: "Auswahl eines vorhandenen Artikels", example: "SKU-4711", help: "Prüfen Sie SKU und Beschreibung gegen die gelieferte Ware.", effect: "Bestimmt den später erzeugten Bestand.", errors: "Unbekannte oder mandantenfremde Artikel werden abgewiesen."}
          location_id: {label: "Empfangslagerplatz", required: true, format: "Auswahl eines zulässigen Lagerplatzes", example: "WH1-RECEIVING", help: "Verwenden Sie einen freigegebenen Empfangs- oder Prüfplatz.", effect: "Die spätere Buchung legt den Bestand zunächst auf diesem Platz an.", errors: "Unbekannte, gesperrte oder unzulässige Plätze verhindern die Annahme."}
          quantity: {label: "Menge", required: true, format: "Positive Ganzzahl in der Artikelbasiseinheit", example: "'20'", help: "Zählen oder messen Sie die tatsächlich angenommene Menge.", effect: "Wird als Zugangsmenge für die spätere Bestandsbuchung verwendet.", errors: "Null, negative oder nicht numerische Mengen sind ungültig."}
          stock_status: {label: "Bestandsstatus", required: true, format: "available; quality_inspection oder blocked", example: "quality_inspection", help: "Verfügbar ist sofort nutzbar; Qualitätsprüfung bleibt kontrolliert; Gesperrt verhindert operative Verwendung.", effect: "Bestimmt die Verfügbarkeit des gebuchten Bestands.", errors: "Nicht angebotene Statuswerte werden abgewiesen."}
          batch_number: {label: "Charge", required: false, format: "Exakte Chargenkennung des Herstellers", example: "LOT-20261002", help: "Bei chargengeführten Artikeln verpflichtend und vom Etikett zu übernehmen.", effect: "Erzeugt die Bestandsdimension Charge und ermöglicht Rückverfolgung.", errors: "Fehlende oder ungültige Charge verhindert die Buchung eines chargenpflichtigen Artikels."}
          serial_number: {label: "Seriennummer", required: false, format: "Global eindeutige Seriennummer", example: "SN-0001842", help: "Bei seriennummerngeführten Artikeln pro Eingang genau eine Einheit referenzieren.", effect: "Identifiziert den konkreten Bestand dauerhaft.", errors: "Doppelte oder bereits vorhandene Seriennummern werden abgewiesen."}
        actions:
          accept: {label: "Annehmen", description: "Validiert Referenzen, Artikel, Platz, Menge und Bestandsdimensionen und erstellt den Eingang.", result: "Die Detailansicht kann anschließend die kontrollierte Bestandsbuchung ausführen."}
          cancel: {label: "Abbrechen", description: "Verwirft nicht gespeicherte Eingaben und kehrt zur Übersicht zurück.", result: "Es wird kein Wareneingang erzeugt."}
        image: {src: "/assets/images/handbook/inbound/unplanned-create.svg", alt: "Formular zur Erfassung eines ungeplanten Wareneingangs"}
      unplanned_receipt_detail:
        template: inbound/show.html.twig
        title: Ungeplanten Wareneingang prüfen und buchen
        purpose: Die Detailansicht kontrolliert Lieferant, Lieferschein, Positionen, Lagerplätze, Mengen und Bestandsdimensionen vor der Buchung.
        navigation: Wareneingang → Ungeplante Wareneingänge → Öffnen
        permissions: ["inbound.receipt.read; inbound.receipt.book für die Bestandsbuchung."]
        overview:
        - Kopfdaten zeigen Lieferant, Lieferschein, Status und Annahmezeitpunkt. Positionen zeigen Artikel, Empfangsplatz, Menge, Status, Charge und Seriennummer.
        - Die Buchungsaktion erscheint nur im Status accepted. Nach erfolgreicher Buchung ist sie nicht erneut verfügbar und der Status verhindert Doppelbuchungen.
        actions:
          book: {label: "In Bestand buchen", description: "Prüft Berechtigung und aktuellen Belegstatus und erzeugt die Bestandszugänge atomar.", result: "Bei Erfolg wechseln Beleg und Positionen in den gebuchten Zustand; ein Fehler erzeugt keine Teilbuchung."}
          back: {label: "Wareneingang", description: "Kehrt ohne Änderung zur Übersicht zurück.", result: "Der aktuelle Belegstatus bleibt erhalten."}
        image: {src: "/assets/images/handbook/inbound/unplanned-detail.svg", alt: "Detailansicht eines ungeplanten Wareneingangs mit Bestandsbuchung"}
      planned_receipts:
        template: inbound/planned.html.twig
        title: Geplante Wareneingänge annehmen und einlagern
        purpose: Die Arbeitsliste führt avisierte Positionen durch Annahme, Qualitätsprüfung, Abweichungsentscheidung und Einlagerung.
        navigation: Wareneingang → Geplante Wareneingänge
        permissions: ["inbound.planned.read sowie receive, inspect, resolve und putaway für die jeweiligen Statusaktionen."]
        overview:
        - Spalten zeigen Avis und Bestellung, Artikel, avisierte oder angenommene Menge, Prozessstatus, Zielplatz und die aktuell zulässige Aktion.
        - Die Statusanzeige unterscheidet avisiert, QS offen, QS abgeschlossen, offene Abweichung, abgelehnt, offene Einlagerung und eingelagert. Pro Zeile wird immer nur der nächste zulässige Schritt angeboten.
        fields:
          actual_quantity: {label: "Tatsächliche Menge", required: true, format: "Positive Ganzzahl", example: "'18'", help: "Erfassen Sie die gezählte Annahmemenge statt ungeprüft die Avismenge zu übernehmen.", effect: "Abweichungen zur erwarteten Menge eröffnen einen Abweichungsfall.", errors: "Null oder negative Werte werden abgewiesen; Übermengen benötigen einen nachvollziehbaren Grund."}
          discrepancy_reason: {label: "Abweichungsgrund", required: false, format: "Kurze fachliche Begründung", example: "Zwei Kartons fehlen", help: "Bei Mengenabweichung konkret und prüfbar ausfüllen.", effect: "Wird am Abweichungsfall und im Audit gespeichert.", errors: "Eine Abweichung ohne ausreichenden Grund kann nicht kontrolliert entschieden werden."}
          location_id: {label: "Empfangs- oder Prüfplatz", required: true, format: "Auswahl eines zulässigen Lagerplatzes", example: "WH1-QA-01", help: "Platz, auf dem die geprüfte Ware bis zur Einlagerung geführt wird.", effect: "Wird Quellplatz des Bestands und späteren Einlagerungsauftrags.", errors: "Unbekannte oder gesperrte Plätze verhindern den QS-Abschluss."}
          decision: {label: "QS-Entscheidung", required: true, format: "accept oder block", example: "accept", help: "Freigeben ist bei offener Abweichung nicht verfügbar; Sperren hält Ware unverfügbar.", effect: "Setzt Qualitäts- und Bestandsstatus und steuert den Folgeschritt.", errors: "Unzulässige Freigabe bei offener Abweichung wird abgewiesen."}
          packaging_passed: {label: "Verpackung unbeschädigt", required: false, format: "Checkbox", example: "aktiviert", help: "Nur aktivieren, wenn Verpackung und Manipulationsschutz geprüft wurden.", effect: "Wird als QS-Prüfergebnis dokumentiert.", errors: "Nicht bestandene Prüfung sollte mit QS-Notiz und Sperrentscheidung erfasst werden."}
          quantity_passed: {label: "Menge vollständig", required: false, format: "Checkbox", example: "deaktiviert", help: "Mit Zählung und Avismenge abgleichen.", effect: "Dokumentiert die Vollständigkeitsprüfung unabhängig von der erfassten Istmenge.", errors: "Widersprüche zwischen Checkbox und Istmenge müssen vor Abschluss geklärt werden."}
          packaging_note: {label: "QS-Notiz", required: false, format: "Sachliche Beschreibung der Prüfung", example: "Außenkarton eingedrückt; Innenverpackung intakt", help: "Schäden, Fotos und Entscheidung nachvollziehbar beschreiben.", effect: "Wird im Qualitätsnachweis gespeichert.", errors: "Unklare Notizen erschweren spätere Abweichungsentscheidungen."}
          batch_number: {label: "Charge", required: false, format: "Exakte Herstellercharge", example: "LOT-20261002", help: "Bei chargengeführten Artikeln vom Produktetikett übernehmen.", effect: "Wird bei Freigabe als Bestandsdimension gespeichert.", errors: "Fehlende oder ungültige Charge verhindert den Abschluss bei chargenpflichtigen Artikeln."}
          serial_number: {label: "Seriennummer", required: false, format: "Eindeutige Seriennummer", example: "SN-0001842", help: "Bei Serienpflicht exakt scannen oder eingeben.", effect: "Ordnet den späteren Bestand der konkreten Einheit zu.", errors: "Doppelte oder unbekannte Seriennummern werden abgewiesen."}
          expires_at: {label: "Mindesthaltbarkeitsdatum", required: false, format: "Datum im Format JJJJ-MM-TT", example: "'2028-10-31'", help: "Vom Produkt übernehmen und bei FEFO-relevanten Artikeln zwingend pflegen.", effect: "Steuert Haltbarkeitsprüfung und FEFO-Entnahme.", errors: "Abgelaufene oder unplausible Daten können Freigabe und Einlagerung blockieren."}
          action: {label: "Abweichungsentscheidung", required: true, format: "release oder reject", example: "release", help: "Freigeben erlaubt Einlagerung; Ablehnen hält beziehungsweise setzt Bestand gesperrt.", effect: "Schließt den offenen Abweichungsfall auditiert ab.", errors: "Bereits entschiedene Fälle können nicht erneut abgeschlossen werden."}
          resolution_note: {label: "Entscheidungsgrund", required: true, format: "Konkrete und prüfbare Begründung", example: "Fehlmenge mit Lieferant bestätigt; Teilmenge freigegeben", help: "Grundlage, Abstimmung und Folgemaßnahme dokumentieren.", effect: "Wird unveränderlich mit der Abweichungsentscheidung auditiert.", errors: "Eine leere Begründung verhindert das Speichern."}
        actions:
          receive: {label: "Annehmen", description: "Übernimmt die Istmenge und eröffnet bei Abweichung einen kontrollierten Fall.", result: "Die Position wechselt zur Qualitätsprüfung."}
          inspect: {label: "QS abschließen", description: "Speichert Platz, Entscheidung, Prüfpunkte und Bestandsdimensionen.", result: "Ware wird freigegeben oder gesperrt; offene Abweichungen bleiben entscheidungspflichtig."}
          resolve: {label: "Entscheidung speichern", description: "Gibt die Abweichung begründet frei oder lehnt sie ab.", result: "Freigegebene Ware kann eingelagert werden; abgelehnte bleibt gesperrt."}
          plan_putaway: {label: "Einlagerung planen", description: "Ermittelt anhand der aktiven Strategie einen zulässigen Zielplatz und erstellt einen Auftrag.", result: "Der Status wechselt zu offene Einlagerung."}
          confirm_putaway: {label: "Einlagerung bestätigen", description: "Quittiert den offenen Einlagerungsauftrag und bucht den Bestand atomar auf das Ziel.", result: "Der Status wechselt zu eingelagert; Wiederholung ist ausgeschlossen."}
        image: {src: "/assets/images/handbook/inbound/planned-receipts.svg", alt: "Arbeitsliste geplanter Wareneingänge mit QS, Abweichung und Einlagerung"}
      inbound_control:
        template: inbound/control.html.twig
        title: Wareneingangs-Steuerungszentrale
        purpose: Die Register bündeln Bestellung und Avis, Qualitätsnachweise, Etiketten, Cross-Docking, Produktionszugänge und Retouren.
        navigation: Wareneingang → Steuerungszentrale
        permissions:
        - Die jeweils eingeblendeten Formulare benötigen die passenden inbound.control-, planned-, production-, return-, attachment-, label- oder Cross-Dock-Rechte; operative Annahme öffnet die separate Arbeitsliste.
        overview:
        - Bestellungen zeigen Lieferant, Positionen, erhaltene und bestellte Menge sowie Status. Avispositionen dürfen nur gegen eine offene Bestellposition angelegt werden.
        - Qualitätsregister zeigen aktive Checklisten und herunterladbare Prozessnachweise. Logistik zeigt Cross-Dock-Bereitstellungen und Produktionszugänge; Retouren zeigen Referenz, Artikel, Menge, Grund, Status und nächste Aktion.
        fields:
          code: {label: "Beleg- oder Konfigurationscode", required: true, format: "Im jeweiligen Bereich eindeutiger Schlüssel", example: "PO-2026-10042", help: "Dient je Formular als Bestell-, Avis-, Checklisten- oder Retourennummer.", effect: "Identifiziert den Datensatz dauerhaft und in Auditnachweisen.", errors: "Leere oder doppelte Codes werden abgewiesen.", usages: ["Bestellung, Avis, QS-Checkliste und Retoure"]}
          supplier_reference: {label: "Lieferantenreferenz", required: true, format: "Eindeutiger Lieferantencode oder externe Referenz", example: "SUP-1000", help: "Ordnet die Bestellung dem vereinbarten Lieferanten zu.", effect: "Erscheint in Bestellübersicht und Folgebelegen.", errors: "Eine leere Referenz verhindert die Bestellanlage."}
          product_id: {label: "Artikel", required: true, format: "Auswahl eines vorhandenen Artikels", example: "SKU-4711", help: "Bei Bestellung, Produktion und Retoure SKU und Beschreibung prüfen.", effect: "Bestimmt die betroffene Bestellposition oder Bestandsbewegung.", errors: "Unbekannte oder mandantenfremde Artikel werden abgewiesen.", usages: ["Bestellung, Produktionszugang und Retoure"]}
          quantity: {label: "Menge", required: true, format: "Positive Ganzzahl in der Artikelbasiseinheit", example: "'20'", help: "Je Vorgang bestellte, avisierte, bereitgestellte, produzierte oder retournierte Menge eintragen.", effect: "Steuert offenen Bestellfortschritt und spätere Bestandsbewegung.", errors: "Null, negative oder den offenen Bedarf überschreitende Mengen werden abgewiesen.", usages: ["Bestellung, Avis, Cross-Docking, Produktionszugang und Retoure"]}
          delivery_note: {label: "Lieferschein", required: true, format: "Exakte externe Lieferreferenz", example: "LS-84711", help: "Vom Lieferpapier übernehmen und vor Dubletten prüfen.", effect: "Verknüpft das Avis mit der physischen Lieferung.", errors: "Eine leere oder unzulässig doppelte Referenz verhindert die Übernahme."}
          purchase_order_item_id: {label: "Offene Bestellposition", required: true, format: "Auswahl einer noch nicht vollständig avisierten Position", example: "PO-2026-10042 / SKU-4711", help: "Die Auswahl zeigt Bestellung, Artikel und noch offene Menge.", effect: "Bindet das Avis an Artikel und Mengenfortschritt der Position.", errors: "Geschlossene, unbekannte oder vollständig avisierte Positionen werden abgewiesen."}
          purchase_order_id: {label: "Bestell-ID", required: true, format: "Automatisch gesetzte versteckte UUID der gewählten Position", example: "018f2f5a-73ad-7c42-9d84-2dcb65bcb410", help: "Wird beim Wechsel der Bestellposition automatisch aktualisiert und nicht manuell gepflegt.", effect: "Sichert die konsistente Zuordnung von Avis und Bestellkopf.", errors: "Ein fehlender oder nicht zur Position passender Wert verhindert die Übernahme."}
          expected_at: {label: "Erwarteter Zeitpunkt", required: true, format: "Lokales Datum und Uhrzeit", example: "'2026-10-05T08:30'", help: "Geplanten Lieferzeitpunkt aus Avis oder Lieferantenbestätigung verwenden.", effect: "Steuert Arbeitsliste und operative Planung.", errors: "Ungültige Datumswerte werden abgewiesen."}
          name: {label: "Checklistenname", required: true, format: "Verständliche Bezeichnung des Prüfzwecks", example: "Standardprüfung Verpackung", help: "Muss Prüfern den Geltungsbereich eindeutig erklären.", effect: "Erscheint in der Liste aktiver Checklisten.", errors: "Ein leerer Name verhindert die Aktivierung."}
          questions: {label: "Prüffragen", required: true, format: "Eine konkrete Frage pro Zeile", example: "'Ist die Verpackung unbeschädigt?\\nStimmt die gelieferte Menge?'", help: "Fragen so formulieren, dass sie eindeutig beantwortbar und nachweisbar sind.", effect: "Jede Zeile wird zu einem QS-Prüfpunkt.", errors: "Leere oder nur aus Leerzeilen bestehende Checklisten werden abgewiesen."}
          aggregate_type: {label: "Vorgangstyp", required: true, format: "inbound_receipt; unplanned_receipt; return_receipt oder production_receipt", example: "inbound_receipt", help: "Wählt den Typ des referenzierten Vorgangs für Anhang oder Etikett.", effect: "Steuert Auflösung, Berechtigung und Ablage des Nachweises beziehungsweise Druckauftrags.", errors: "Nicht angebotene Typen werden abgewiesen.", usages: ["Anhang und Etikett"]}
          aggregate_id: {label: "Vorgangs-ID", required: true, format: "UUID des konkreten Wareneingangs-, Retouren- oder Produktionsvorgangs", example: "018f2f5a-73ad-7c42-9d84-2dcb65bcb410", help: "Aus Detailansicht oder technischer Referenz exakt übernehmen.", effect: "Verknüpft Anhang oder Etikett unveränderlich mit dem Vorgang.", errors: "Unbekannte oder typfremde IDs werden abgewiesen.", usages: ["Anhang und Etikett"]}
          category: {label: "Anhangskategorie", required: true, format: "photo; delivery_note; quality oder other", example: "quality", help: "Nach tatsächlichem Inhalt auswählen, damit Nachweise auffindbar bleiben.", effect: "Gruppiert Datei und steuert spätere Anzeige.", errors: "Nicht angebotene Kategorien werden abgewiesen."}
          file: {label: "Datei", required: true, format: "Bild, PDF, TXT oder CSV innerhalb der Servergrößenbegrenzung", example: "qs-protokoll-10042.pdf", help: "Nur benötigte, schadsoftwaregeprüfte und datenschutzkonforme Nachweise hochladen.", effect: "Wird sicher gespeichert und mit Name, Größe, Kategorie und Vorgang protokolliert.", errors: "Leere, zu große oder nicht erlaubte Dateitypen werden abgewiesen."}
          label_type: {label: "Etikettentyp", required: true, format: "receipt; product oder handling_unit", example: "handling_unit", help: "Wareneingang für Beleg, Artikel für Ware, Ladeeinheit für Palette oder Behälter wählen.", effect: "Bestimmt Vorlage und Dateninhalt des Druckauftrags.", errors: "Nicht unterstützte Typen verhindern die Auftragserzeugung."}
          copies: {label: "Kopien", required: true, format: "Ganzzahl von 1 bis 100", example: "'2'", help: "Nur die betrieblich benötigte Anzahl erzeugen.", effect: "Der Druckauftrag fordert diese Zahl identischer Etiketten an.", errors: "Werte außerhalb 1 bis 100 werden abgewiesen."}
          receipt_id: {label: "Geprüfter Wareneingang", required: true, format: "Auswahl eines Eingangs im Status inspected", example: "ASN-2026-0042 / SKU-4711", help: "Nur bereits qualitätsgeprüfte Ware kann direkt bereitgestellt werden.", effect: "Liefert Artikel und verfügbare Menge für Cross-Docking.", errors: "Ungeprüfte, gesperrte oder bereits verbrauchte Mengen werden abgewiesen."}
          outbound_item_id: {label: "Warenausgangsbedarf", required: true, format: "Auswahl einer offenen Ausgangsposition desselben Artikels", example: "SO-2026-0815 / SKU-4711", help: "Artikel und offene Bedarfsmenge mit dem Eingang abgleichen.", effect: "Reserviert die Cross-Dock-Menge unmittelbar für diese Ausgangsposition.", errors: "Artikelkonflikt, geschlossene Position oder Übermenge verhindert die Bereitstellung."}
          production_order: {label: "Produktionsauftrag", required: true, format: "Eindeutige externe oder interne Auftragsreferenz", example: "PROD-2026-771", help: "Aus der Fertigungsrückmeldung exakt übernehmen.", effect: "Begründet und referenziert den Produktionszugang.", errors: "Leere oder unzulässig doppelte Referenzen werden abgewiesen."}
          location_id: {label: "Lagerplatz", required: true, format: "Auswahl eines zulässigen Platzes", example: "WH1-PRODUCTION-IN", help: "Bei Produktion Zugangsort, bei Retoure Prüf- oder Einlagerungsplatz wählen.", effect: "Bestimmt den Platz der Bestandsbuchung oder Retourenentscheidung.", errors: "Unbekannte, gesperrte oder lagerfremde Plätze werden abgewiesen.", usages: ["Produktionszugang und Retourenprüfung"]}
          batch_number: {label: "Charge", required: false, format: "Exakte Hersteller- oder Produktionscharge", example: "LOT-20261002", help: "Bei chargengeführten Produktionsartikeln verpflichtend übernehmen.", effect: "Erzeugt die Chargendimension des Produktionsbestands.", errors: "Fehlende oder doppelte Charge kann die Buchung verhindern."}
          order_reference: {label: "Auftragsreferenz", required: true, format: "Ursprüngliche Kundenauftrags- oder Sendungsnummer", example: "SO-2026-0815", help: "Ermöglicht Rückverfolgung zur ursprünglichen Auslieferung.", effect: "Verknüpft die Retoure fachlich mit dem Ausgangsvorgang.", errors: "Eine leere Referenz verhindert die Retourenankündigung."}
          reason: {label: "Retourengrund", required: true, format: "Konkrete kurze Beschreibung", example: "Transportschaden am Außenkarton", help: "Tatsächlichen Rücksendegrund statt allgemeiner Sammelbegriffe erfassen.", effect: "Wird in Retourenübersicht, Entscheidung und Auswertung gespeichert.", errors: "Ein leerer Grund verhindert die Anlage."}
          decision: {label: "Retourenentscheidung", required: true, format: "restock oder quarantine", example: "quarantine", help: "Wiedereinlagern nur bei geprüfter verkaufsfähiger Ware; andernfalls sperren.", effect: "Setzt Bestandsstatus und entscheidet über operative Verfügbarkeit.", errors: "Ungeprüfte oder widersprüchliche Entscheidungen werden abgewiesen."}
          note: {label: "Prüfnotiz", required: true, format: "Nachvollziehbare Zustands- und Entscheidungsbeschreibung", example: "Verpackung beschädigt; Artikel unversehrt; zur Klärung gesperrt", help: "Zustand, Nachweis und Folgemaßnahme dokumentieren.", effect: "Wird auditiert mit der Retourenprüfung gespeichert.", errors: "Eine leere Notiz verhindert den Abschluss."}
        actions:
          purchase_order: {label: "Bestellung anlegen", description: "Erstellt Bestellkopf und erste Artikelposition.", result: "Die offene Position steht für Avismengen bereit."}
          delivery: {label: "Avis übernehmen", description: "Verknüpft Lieferschein, Menge und Erwartungszeit mit der gewählten Bestellposition.", result: "Die Position erscheint in der geplanten operativen Annahme."}
          checklist: {label: "Checkliste aktivieren", description: "Erzeugt aus jeder Textzeile einen aktiven Prüfpunkt.", result: "Neue QS-Prüfungen können die Checkliste verwenden."}
          attachment: {label: "Sicher speichern", description: "Prüft Datei, Kategorie und Vorgangsbezug und legt den Nachweis ab.", result: "Die Datei erscheint im Prozessnachweis und kann berechtigt heruntergeladen werden."}
          label: {label: "Druckauftrag erstellen", description: "Erzeugt die gewünschte Anzahl Etiketten für Vorgang und Typ.", result: "Der Auftrag wird an die konfigurierte Druckroute übergeben."}
          cross_dock: {label: "Direkt bereitstellen", description: "Ordnet geprüfte Eingangsmenge einem offenen Ausgangsbedarf zu.", result: "Eine Cross-Dock-Bereitstellung entsteht ohne reguläre Einlagerung."}
          production: {label: "Fertigmeldung buchen", description: "Erzeugt Produktionszugang für Auftrag, Artikel, Platz, Menge und Charge.", result: "Bestand und Produktionsnachweis werden atomar angelegt."}
          return_create: {label: "Retoure ankündigen", description: "Erfasst Referenz, Artikel, Menge und Rücksendegrund.", result: "Die Retoure erscheint zur physischen Annahme."}
          return_receive: {label: "Eingang bearbeiten", description: "Bestätigt die physische Ankunft der angekündigten Position.", result: "Ein prüfpflichtiger Retoureneingang entsteht; Wiederholung ist ausgeschlossen."}
          return_inspect: {label: "Retoure prüfen", description: "Speichert Platz, Wiedereinlagerung oder Sperre und begründende Notiz.", result: "Bestand wird entsprechend der Entscheidung erzeugt und der Vorgang abgeschlossen."}
        image: {src: "/assets/images/handbook/inbound/control-center.svg", alt: "Wareneingangs-Steuerungszentrale mit Dokumenten, Qualität, Logistik und Retouren"}
    guidance:
      prerequisites:
      - Aktiver Lieferant, Artikel, Standort, Empfangsbereich und bei geplantem Zugang Bestellung beziehungsweise Avis.
      permissions:
      - inbound.planned.read/receive/inspect/resolve/putaway sowie inbound.receipt.read/write/book.
      fields:
      - 'Bestellung/Avis: order_number, supplier_reference, expected_at, product_id, quantity. Empfang: delivery_note, actual_quantity, batch, serial_number, expires_at, load_unit. QS:
        questions, accepted, discrepancy_reason, resolution_note. Einlagerung: source_location_id, target_location_id.'
      statuses:
      - planned → partially_received/received → inspected → released/blocked → putaway → completed. Ungeplante Zugänge bleiben bis Buchung kontrolliert.
      errors:
      - Überavisierung, Übermenge, doppelte externe Referenz, fehlgeschlagene QS, gesperrte Ware oder ungültiger Zielplatz blockiert den Folgeschritt.
  fulfillment_and_outbound:
    title: Auftrag, Allokation, Kommissionierung, Packen und Versand
    summary: Der vollständige Ausgangsprozess vom Kundenauftrag bis zur Verladung und Retoure.
    sections:
      section_1:
        title: Auftrag anlegen und freigeben
        paragraphs:
          paragraph_1: Erfassen oder importieren Sie Empfänger, Liefertermin, Positionen, Mengen und Versandvorgaben. Die Freigabe prüft Stammdaten und verfügbaren Bestand. Allokationen
            reservieren konkrete Bestandsdimensionen nach der aktiven Entnahmestrategie.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Auftrag anlegen und freigeben – Screenshot-Platzhalter
      section_2:
        title: Kommissionieren
        paragraphs:
          paragraph_1: Erstellen oder bündeln Sie Picklisten, weisen Sie sie einem Benutzer zu und optimieren Sie bei Bedarf die Route. Scannen Sie Lagerplatz, Artikel, Charge oder Seriennummer
            und bestätigen Sie die Menge. Fehlmengen werden als Ausnahme erfasst und nicht stillschweigend übersprungen.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: 'Platzhalter: Mobile Kommissionierung'
      section_3:
        title: Packen und Versand
        paragraphs:
          paragraph_1: Öffnen Sie den Packauftrag, wählen Sie Packmittel und ordnen Sie Positionen einem Packstück zu. Gewicht und Abmessungen können manuell oder über ein Messgerät
            erfasst werden. Erzeugen Sie nach erfolgreicher Carrier-Anfrage das Versandlabel. Fehlerhafte Anfragen bleiben wiederholbar und nachvollziehbar.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Packen und Versand – Screenshot-Platzhalter
      section_4:
        title: Verladen und zustellen
        paragraphs:
          paragraph_1: Fassen Sie Sendungen in einem Manifest zusammen, bestätigen Sie Verladung per Scan und schließen Sie das Manifest ab. Zustellstatus und ERP-Rückmeldungen werden
            über die Integration verarbeitet. Storno ist nur in zulässigen Zuständen möglich.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Verladen und zustellen – Screenshot-Platzhalter
      section_5:
        title: Retouren
        paragraphs:
          paragraph_1: Identifizieren Sie ursprüngliche Sendung und Artikel, erfassen Sie Grund und Zustand und entscheiden Sie zwischen Wiedereinlagerung, Sperre, Nacharbeit oder Ausschuss.
            Jede Entscheidung erzeugt die passende Bestandsbewegung und einen Auditnachweis.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Retouren – Screenshot-Platzhalter
    views:
      internal_transport:
        template: fulfillment/transport/index.html.twig
        title: Interner Transport und Nachschub
        purpose: Die Leitstelle erstellt, disponiert und quittiert Transport- und Nachschubaufträge und pflegt Ressourcen, Regeln, Stationen sowie Routenzüge.
        navigation: Fulfillment → Interner Transport
        permissions:
        - fulfillment.transport.read für die Leitstelle; write für Aufträge und Routenzugauslösung; assign und execute für Statusaktionen; configure für Stammdaten; fulfillment.replenishment.write/execute für Nachschub.
        overview:
        - Die Transporttabelle zeigt Auftragscode und Priorität, Typ, Quelle und Ziel, Artikel beziehungsweise Ladehilfsmittel, Menge, Ressource und Status.
        - Statusaktionen folgen open → assigned → started → completed. Nur die jeweils zulässige Aktion wird angezeigt; die Abschlussquittierung kann Bestand buchen.
        - Nachschubaufträge zeigen Regel, Artikel, Route, Menge und Status. Leere Tabellen melden ausdrücklich, dass keine Aufträge vorhanden sind.
        fields:
          code: {label: "Code", required: true, format: "Eindeutiger technischer Schlüssel", example: "TR-2026-0042", help: "Verwenden Sie nachvollziehbare und im jeweiligen Bereich eindeutige Codes.", effect: "Identifiziert Auftrag, Ressource, Regel, Station, Routenzug oder Nachschubregel.", errors: "Leere oder doppelte Codes werden abgewiesen.", usages: ["Transportauftrag, Ressource, Transportregel, Station, Routenzug und Nachschubregel"]}
          transport_type: {label: "Transportart", required: true, format: "relocation; replenishment; prepositioning; material_flow oder milk_run", example: "replenishment", help: "Umlagerung bewegt Bestand; Nachschub füllt Zielbestand; Vorholung stellt bereit; Materialfluss folgt einer Regel; Routenzug bündelt Stopps.", effect: "Bestimmt fachliche Verarbeitung und Auswertung des Transports.", errors: "Nicht unterstützte Werte werden abgewiesen.", usages: ["Transportauftrag und Transportregel"]}
          source_location_id: {label: "Quelllagerplatz", required: true, format: "Auswahl eines Lagerplatzes im Mandanten", example: "WH1-RESERVE-01", help: "Platz, von dem Bestand oder Ladehilfsmittel abgeholt wird.", effect: "Wird beim Abschluss als Abgangsort verwendet.", errors: "Quelle und Ziel müssen existieren; Bestand und Status müssen zur Buchung passen."}
          target_location_id: {label: "Ziellagerplatz", required: true, format: "Auswahl eines Lagerplatzes im Mandanten", example: "WH1-PICK-01", help: "Ziel des Transport- oder Nachschubvorgangs.", effect: "Wird beim Abschluss als Zugangsort verwendet.", errors: "Unbekannte, gesperrte oder identische Quell-/Zielplätze werden abgewiesen.", usages: ["Transportauftrag und Nachschubregel"]}
          priority: {label: "Priorität", required: true, format: "Positive Ganzzahl; Transportauftrag 1 bis 999", example: "'50'", help: "Kleinere oder größere Werte werden entsprechend der implementierten Leitstellenreihenfolge ausgewertet; verwenden Sie ein abgestimmtes Schema.", effect: "Beeinflusst die Reihenfolge offener Aufträge und Regeln.", errors: "Nicht numerische oder unzulässige Werte verhindern das Speichern.", usages: ["Transportauftrag, Transportregel und Nachschubregel"]}
          product_id: {label: "Artikel", required: false, format: "Auswahl eines Artikels oder leer beim reinen Ladehilfsmitteltransport", example: "SKU-4711", help: "Für bestandswirksame Transporte und Nachschub erforderlich.", effect: "Bestimmt, welcher Artikel gebucht oder nachgefüllt wird.", errors: "Unbekannte Artikel oder fehlender Artikel bei mengenbezogener Buchung werden abgewiesen.", usages: ["Transportauftrag und Nachschubregel"]}
          quantity: {label: "Menge", required: false, format: "Positive Ganzzahl in der Basiseinheit des Artikels", example: "'20'", help: "Nur gemeinsam mit einem Artikel angeben.", effect: "Diese Menge wird bei erfolgreichem Abschluss bewegt.", errors: "Null, negative Werte oder unzureichender Quellbestand verhindern die Buchung."}
          stock_status: {label: "Bestandsstatus", required: false, format: "Bekannter Statuscode", example: "available", help: "Legt die zu bewegende Bestandsqualität fest; standardmäßig verfügbar.", effect: "Die Auswahl grenzt den Quellbestand für die Buchung ein.", errors: "Unbekannte Statuscodes oder nicht passender Bestand verhindern den Abschluss."}
          batch_number: {label: "Charge", required: false, format: "Exakte Chargenkennung", example: "LOT-20261002", help: "Bei chargengeführten Artikeln zur eindeutigen Bestandsauswahl verwenden.", effect: "Beschränkt die Buchung auf diese Charge.", errors: "Fehlende oder nicht vorhandene Chargen verhindern die Buchung."}
          serial_number: {label: "Seriennummer", required: false, format: "Exakte eindeutige Seriennummer", example: "SN-0001842", help: "Bei seriennummerngeführten Artikeln genau ein vorhandenes Stück referenzieren.", effect: "Bewegt die konkret identifizierte Einheit.", errors: "Unbekannte, doppelte oder am Quellplatz fehlende Seriennummern werden abgewiesen."}
          forklift_id: {label: "Ressource zuweisen", required: true, format: "Auswahl einer verfügbaren Ressource", example: "FL-01", help: "Es werden nur aktuell verfügbare Stapler, FTS oder Routenzüge angeboten.", effect: "Setzt den offenen Auftrag auf assigned und bindet die Ressource.", errors: "Bereits belegte, inaktive oder mandantenfremde Ressourcen können nicht zugewiesen werden."}
          name: {label: "Name", required: true, format: "Verständliche Bezeichnung", example: "Routenzug Montage Nord", help: "Beschreibt den Zweck für Disponenten und Fahrer.", effect: "Erscheint in Konfigurations- und Auswahlansichten.", errors: "Ein leerer Name verhindert das Anlegen.", usages: ["Ressource, Transportregel, Station und Routenzug"]}
          warehouse_id: {label: "Lager", required: true, format: "Auswahl eines vorhandenen Lagers", example: "WH1", help: "Ordnet Konfiguration und Ausführung einem Lager zu.", effect: "Begrenzt Ressourcen, Stationen, Touren und Nachschub auf dieses Lager.", errors: "Unbekannte oder mandantenfremde Lager werden abgewiesen.", usages: ["Ressource, Station, Routenzug und Nachschubregel"]}
          resource_type: {label: "Ressourcentyp", required: true, format: "forklift; tugger_train oder agv", example: "agv", help: "Stapler werden manuell, Routenzüge stopporientiert und FTS automatisiert eingesetzt.", effect: "Filtert geeignete Ressourcen für Auftrag und Regel.", errors: "Nicht angebotene Typen werden abgewiesen.", usages: ["Ressource und Transportregel"]}
          trigger_type: {label: "Auslöser", required: true, format: "manual; replenishment; prepositioning oder material_flow", example: "material_flow", help: "Bestimmt, welches Ereignis die Regel verwendet.", effect: "Steuert die automatische oder manuelle Auftragserzeugung.", errors: "Ein nicht unterstützter Auslöser bleibt wirkungslos und wird abgewiesen."}
          source_prefix: {label: "Quellpräfix", required: true, format: "Anfang des Lagerplatzcodes", example: "RES-", help: "Grenzt regelbasierte Quellen über ihre Codes ein.", effect: "Die Regel berücksichtigt nur passende Quellplätze.", errors: "Zu allgemeine Präfixe können unerwünscht viele Plätze treffen."}
          target_prefix: {label: "Zielpräfix", required: true, format: "Anfang des Lagerplatzcodes", example: "PICK-", help: "Grenzt regelbasierte Ziele über ihre Codes ein.", effect: "Die Regel erzeugt Transporte nur zu passenden Zielen.", errors: "Ohne passende Zielplätze kann kein Auftrag erzeugt werden."}
          location_id: {label: "Stationslagerplatz", required: true, format: "Auswahl eines Lagerplatzes", example: "STATION-01", help: "Physischer Übergabe- oder Pufferplatz der Station.", effect: "Verknüpft Materialfluss und Routenzugstopp mit dem Lagerplatz.", errors: "Unbekannte oder lagerfremde Plätze werden abgewiesen."}
          sequence_number: {label: "Reihenfolge", required: true, format: "Positive Ganzzahl", example: "'10'", help: "Kleinere Werte liegen früher in Stations- beziehungsweise Tourreihenfolge.", effect: "Sortiert Stationen und Stopps deterministisch.", errors: "Ungültige oder kollidierende Reihenfolgen müssen vor der Tourauslösung korrigiert werden.", usages: ["Station und Routenzugstopp"]}
          station_type: {label: "Stationstyp", required: true, format: "Versteckter Standardwert buffer", example: "buffer", help: "Neue Stationen werden in dieser Maske als Pufferstation angelegt.", effect: "Kennzeichnet die Station als temporären Übergabepunkt.", errors: "Andere Stationstypen sind hier nicht konfigurierbar."}
          schedule_type: {label: "Tourplanung", required: true, format: "fixed oder dynamic", example: "fixed", help: "Fest plant wiederkehrende Intervalle; dynamisch erlaubt bedarfsorientierte Auslösung.", effect: "Bestimmt die Planungslogik des Routenzugs.", errors: "Nicht angebotene Werte werden abgewiesen."}
          interval_minutes: {label: "Intervall in Minuten", required: true, format: "Positive Ganzzahl ab 1", example: "'60'", help: "Zeitabstand geplanter Routenzugfahrten bei fester Planung.", effect: "Definiert die vorgesehene Wiederholungsfrequenz.", errors: "Null oder negative Intervalle werden abgewiesen."}
          station_id: {label: "Station", required: true, format: "Auswahl einer vorhandenen Station", example: "ST-01", help: "Fügt die Station als neuen Stopp zum Routenzug hinzu.", effect: "Die Station wird in der angegebenen Reihenfolge angefahren.", errors: "Unbekannte oder lagerfremde Stationen werden abgewiesen."}
          dwell_minutes: {label: "Aufenthaltszeit in Minuten", required: true, format: "Ganzzahl ab 0", example: "'5'", help: "Geplante Zeit für Übergabe, Be- oder Entladung am Stopp.", effect: "Fließt in die zeitliche Tourplanung ein.", errors: "Negative Werte sind ungültig."}
          source_location_prefix: {label: "Nachschub-Quellpräfix", required: true, format: "Anfang des Lagerplatzcodes", example: "RESERVE-", help: "Bestimmt den Quellbereich, aus dem Nachschub entnommen werden darf.", effect: "Die Nachschubermittlung sucht Bestand nur auf passenden Plätzen.", errors: "Fehlt passender verfügbarer Bestand, kann kein Nachschubauftrag erzeugt werden."}
          minimum_quantity: {label: "Mindestbestand", required: true, format: "Ganzzahl ab 0", example: "'10'", help: "Unterhalb dieses Zielplatzbestands entsteht Nachschubbedarf.", effect: "Dient als Auslöseschwelle der Regel.", errors: "Negative Werte sind ungültig; ein Wert über der Zielmenge ist fachlich widersprüchlich."}
          target_quantity: {label: "Zielbestand", required: true, format: "Positive Ganzzahl", example: "'50'", help: "Bestand, auf den der Zielplatz aufgefüllt werden soll.", effect: "Aus Zielbestand minus aktuellem Bestand ergibt sich die Nachschubmenge.", errors: "Muss größer als Mindestbestand und Null sein."}
        actions:
          create_order: {label: "Transportauftrag erstellen", description: "Validiert Route, Bestandsdimensionen und Priorität und erzeugt einen offenen Auftrag.", result: "Der Auftrag erscheint in der Leitstelle und kann zugewiesen werden."}
          assign: {label: "Zuweisen", description: "Bindet eine verfügbare Ressource an einen offenen Auftrag.", result: "Der Status wechselt idempotent von open zu assigned."}
          start: {label: "Starten", description: "Bestätigt die Übernahme eines zugewiesenen Auftrags.", result: "Der Status wechselt zu started; ein erneuter Start ist nicht zulässig."}
          complete: {label: "Quittieren", description: "Schließt den gestarteten Auftrag ab und führt gegebenenfalls die Bestandsbuchung aus.", result: "Der Status wechselt zu completed; Buchungsfehler lassen den Auftrag unvollständig."}
          create_configuration: {label: "Ressource oder Regel anlegen", description: "Speichert Ressource, Transportregel, Station oder Routenzug nach Bereichsvalidierung.", result: "Die Konfiguration steht nach erfolgreicher Anlage für neue Aufträge bereit."}
          add_stop: {label: "Stopp hinzufügen", description: "Fügt Station, Reihenfolge und Aufenthaltszeit zu einer Routenzugtour hinzu.", result: "Ab mindestens zwei Stopps kann die Tour ausgelöst werden."}
          dispatch_milk_run: {label: "Tour auslösen", description: "Erzeugt Transportaufträge für die konfigurierte Stoppreihenfolge.", result: "Die Anzahl erzeugter Aufträge wird bestätigt; wiederholte Auslösung erzeugt einen neuen Lauf."}
          create_replenishment_policy: {label: "Nachschubregel anlegen", description: "Speichert Artikel, Ziel, Quellpräfix und Mengenschwellen.", result: "Die Regel erscheint als manuell auslösbare Nachschubkonfiguration."}
          trigger_replenishment: {label: "Nachschub auslösen", description: "Ermittelt Bedarf und verfügbaren Quellbestand anhand der Regel.", result: "Bei Bedarf entsteht ein offener Nachschubauftrag; ohne Bestand wird ein Fehler gemeldet."}
          complete_replenishment: {label: "Nachschub quittieren", description: "Bestätigt den offenen Nachschub und bucht die ermittelte Menge.", result: "Der Auftrag wird abgeschlossen und Zielbestand aktualisiert; Wiederholung ist ausgeschlossen."}
        image:
          src: /assets/images/handbook/fulfillment/internal-transport.svg
          alt: Interne Transportleitstelle mit Aufträgen, Ressourcen, Routenzügen und Nachschub
      outbound_orders:
        template: outbound/order/orders.html.twig
        title: Warenausgangsaufträge
        purpose: Die Übersicht zeigt Kundenaufträge mit Referenz und Status und führt zur Neuanlage oder Bearbeitung des Prozessstands.
        navigation: Warenausgang → Aufträge
        permissions: ["outbound.order.read; outbound.order.write für die Neuanlage."]
        overview:
        - Die Tabelle zeigt Auftragsnummer, Kundenreferenz und aktuellen Status. Öffnen führt zur Freigabe, Reservierung, Allokation und Übergabe an die Kommissionierung.
        - Der Leerzustand bedeutet, dass im aktiven Mandanten kein Auftrag vorhanden ist; die Ansicht besitzt derzeit keine Suche, Filter oder Pagination.
        actions:
          create: {label: "Auftrag anlegen", description: "Öffnet ein separates Formular für Referenz, Artikel und Menge.", result: "Der Auftrag erscheint nach erfolgreichem Speichern im Status created beziehungsweise imported."}
          open: {label: "Öffnen", description: "Öffnet Positionen, Reservierungen und die nächsten zulässigen Prozessaktionen.", result: "Die Navigation selbst verändert keine Daten."}
        image: {src: "/assets/images/handbook/outbound/orders-overview.svg", alt: "Übersicht der Warenausgangsaufträge mit Status und Öffnen-Aktion"}
      outbound_order_create:
        template: outbound/order/order_new.html.twig
        title: Warenausgangsauftrag anlegen
        purpose: Das Formular erstellt einen Kundenauftrag mit einer ersten Artikelposition als Grundlage für Reservierung und Kommissionierung.
        navigation: Warenausgang → Aufträge → Auftrag anlegen
        permissions: ["outbound.order.write; der Artikel muss im aktiven Mandanten vorhanden sein."]
        overview: ["Prüfen Sie externe Referenzen und Menge vor dem Speichern. Weitere Prozessschritte erfolgen erst nach der separaten Freigabe des Auftrags."]
        fields:
          order_number: {label: "Auftragsnummer", required: true, format: "Im Mandanten eindeutiger Belegcode", example: "SO-2026-0815", help: "Externe ERP-Nummer oder kontrollierte interne Nummer verwenden.", effect: "Identifiziert den Auftrag in allen Folgeprozessen.", errors: "Leere oder bereits verwendete Nummern werden abgewiesen."}
          customer_reference: {label: "Kundenreferenz", required: true, format: "Eindeutige Kunden- oder Empfängerreferenz", example: "CUSTOMER-DE-1000", help: "Muss die fachliche Zuordnung für Versand und Rückfragen erlauben.", effect: "Erscheint in Übersicht und Auftragsdetail.", errors: "Eine leere Referenz verhindert die Anlage."}
          product_id: {label: "Artikel", required: true, format: "Auswahl eines vorhandenen Artikels", example: "SKU-4711", help: "SKU und Beschreibung gegen den Kundenbedarf prüfen.", effect: "Erzeugt die erste Auftragsposition und spätere Bestandsreservierung.", errors: "Unbekannte oder mandantenfremde Artikel werden abgewiesen."}
          quantity: {label: "Menge", required: true, format: "Positive Ganzzahl in der Artikelbasiseinheit", example: "'10'", help: "Tatsächlich angeforderte Menge erfassen.", effect: "Bestimmt Reservierungs-, Allokations- und Pickbedarf.", errors: "Null, negative oder nicht numerische Werte sind ungültig."}
        actions:
          save: {label: "Auftrag anlegen", description: "Validiert Referenzen, Artikel und Menge und erzeugt Auftrag und Position atomar.", result: "Das Auftragsdetail öffnet sich für Prüfung und Freigabe."}
          cancel: {label: "Abbrechen", description: "Verwirft nicht gespeicherte Eingaben.", result: "Es wird kein Auftrag erzeugt."}
        image: {src: "/assets/images/handbook/outbound/order-create.svg", alt: "Formular zum Anlegen eines Warenausgangsauftrags"}
      outbound_order_detail:
        template: outbound/order/order.html.twig
        title: Auftrag freigeben, reservieren und allokieren
        purpose: Die Detailansicht führt einen Auftrag von der Freigabe über automatische oder manuelle Bestandsallokation bis zur Pickliste.
        navigation: Warenausgang → Aufträge → Öffnen
        permissions: ["outbound.order.read/release; inventory.allocation.write; inventory.selection.execute; fulfillment.pick.write abhängig von der Aktion."]
        overview:
        - Jede Position zeigt angeforderte, reservierte, allokierte und erfüllte Menge sowie verfügbare Bestandsdimensionen. Der Auftragsstatus begrenzt die angebotenen Aktionen.
        - Freigabe reserviert Bedarf. Vollständig allokierte freigegebene Aufträge können genau eine Pickliste erzeugen; vorhandene Picklisten werden direkt verlinkt.
        fields:
          rule_id: {label: "Entnahmeregel", required: true, format: "Auswahl einer aktiven auf Artikel und Lager passenden Regel", example: "FIFO-WH1", help: "Strategie, Lagerbezug und Priorität vor Ausführung prüfen.", effect: "Allokiert die gesamte Restmenge automatisch nach der gewählten Regel.", errors: "Keine passende Regel oder unzureichender Bestand verhindert die vollständige Allokation."}
          location_id: {label: "Lagerplatz-ID", required: true, format: "Versteckte UUID des angezeigten Bestands", example: "018f2f5a-73ad-7c42-9d84-2dcb65bcb410", help: "Wird aus der gewählten Bestandszeile übernommen und darf nicht manipuliert werden.", effect: "Bindet manuelle Allokation an den konkreten Platz.", errors: "Unbekannte oder mandantenfremde Plätze werden abgewiesen."}
          stock_status: {label: "Bestandsstatus", required: true, format: "Versteckter Status der Bestandszeile", example: "available", help: "Muss zum tatsächlich verfügbaren Bestand passen.", effect: "Reserviert nur Bestand dieser Qualitätsstufe.", errors: "Gesperrter oder abweichender Status verhindert die Allokation."}
          batch_number: {label: "Charge", required: false, format: "Versteckte exakte Charge der Bestandszeile", example: "LOT-20261002", help: "Hält die manuelle Auswahl chargengenau.", effect: "Allokiert Bestand ausschließlich aus dieser Charge.", errors: "Nicht mehr verfügbare Chargen führen zu einem Konflikt."}
          serial_number: {label: "Seriennummer", required: false, format: "Versteckte eindeutige Seriennummer", example: "SN-0001842", help: "Serienbestand wird stückgenau mit Menge eins allokiert.", effect: "Reserviert die konkrete Einheit.", errors: "Bereits reservierte oder bewegte Seriennummern werden abgewiesen."}
          expires_at: {label: "Haltbarkeitsdatum", required: false, format: "Verstecktes Datum der Bestandsdimension", example: "'2028-10-31'", help: "Sichert die angezeigte FEFO-relevante Bestandsauswahl.", effect: "Gehört zur eindeutigen Allokationsdimension.", errors: "Zwischenzeitlich geänderter Bestand erzeugt einen Konflikt."}
          quantity: {label: "Allokationsmenge", required: true, format: "Ganzzahl von 1 bis zur kleineren Rest- oder verfügbaren Menge", example: "'5'", help: "Bei Seriennummern ist nur Menge eins zulässig.", effect: "Erhöht die allokierte Menge der Reservierung atomar.", errors: "Übermenge, Fehlbestand oder parallele Allokation verhindert die Buchung."}
          code: {label: "Picklistencode", required: true, format: "Eindeutiger Code; vorbelegt mit PICK-Auftragsnummer", example: "PICK-SO-2026-0815", help: "Vor Erzeugung auf Eindeutigkeit und betriebliche Nummernkonvention prüfen.", effect: "Identifiziert die neue Pickliste im gesamten Fulfillment.", errors: "Leere oder doppelte Codes werden abgewiesen."}
        actions:
          release: {label: "Auftrag freigeben und reservieren", description: "Prüft Stammdaten und legt Bedarfsreservierungen für alle Positionen an.", result: "Der Auftrag wechselt zu released; bei einem Fehler entstehen keine Teilreservierungen."}
          auto_allocate: {label: "Restmenge automatisch allokieren", description: "Wendet die ausgewählte Entnahmeregel auf die offene Menge an.", result: "Geeignete Bestandsdimensionen werden atomar gebunden; Fehlbestand bleibt sichtbar."}
          allocate: {label: "Allokieren", description: "Bindet die eingegebene Menge der angezeigten Bestandsdimension manuell.", result: "Reserviert, allokiert und verfügbar werden sofort neu berechnet."}
          create_pick_list: {label: "Pickliste erzeugen", description: "Übergibt einen vollständig allokierten freigegebenen Auftrag an die Kommissionierung.", result: "Genau eine offene Pickliste entsteht und wird anschließend verlinkt."}
        image: {src: "/assets/images/handbook/outbound/order-detail.svg", alt: "Auftragsdetail mit Freigabe, automatischer und manueller Allokation"}
      picking_overview:
        template: outbound/picking/index.html.twig
        title: Picklistenübersicht
        purpose: Die Übersicht bündelt alle Picklisten mit Auftragsbezug, Bearbeitungsstand, Fortschritt und aktueller Zuordnung.
        navigation: Warenausgang → Kommissionierung
        permissions: ["fulfillment.pick.read"]
        overview:
        - Jede Karte zeigt Picklistencode, Status, Auftragsnummer, erledigte und gesamte Aufgaben sowie den zugewiesenen Mitarbeiter.
        - Nicht zugewiesene Listen bleiben als offen erkennbar. Die Ansicht besitzt derzeit keine Suche, Filter oder Pagination.
        actions:
          open: {label: "Öffnen", description: "Öffnet die operative Pickliste mit Route, Scanfeldern und Fehlmengenaktion.", result: "Die Navigation verändert weder Status noch Zuordnung."}
        image: {src: "/assets/images/handbook/outbound/picking-overview.svg", alt: "Picklistenübersicht mit Status, Fortschritt und Mitarbeiterzuordnung"}
      picking_control:
        template: outbound/picking/control.html.twig
        title: Picking-Leitstelle und Wellenplanung
        purpose: Die Leitstelle plant Pickwellen, bündelt Picklisten nach Strategie und überwacht Fortschritt, Fehlmengen und zweistufige Konsolidierung.
        navigation: Warenausgang → Picking-Leitstelle
        permissions: ["fulfillment.pick.control zum Lesen; fulfillment.pick.wave.write zum Planen, Freigeben und Konsolidieren."]
        overview:
        - Wellenkarten zeigen Strategie, Auftrags- und Picklistenanzahl, Status sowie den erreichten Fortschritt. Die Live-Leitstelle ergänzt Mitarbeiter, Behälter und Fehlmengen.
        - Eine geplante Welle muss freigegeben werden, bevor sie operativ bearbeitet wird. Zweistufige Wellen verlangen nach vollständigem Pick zusätzlich die Konsolidierung.
        fields:
          code: {label: "Wellencode", required: true, format: "Im Mandanten eindeutiger Code", example: "WAVE-2026-0042", help: "Verwenden Sie einen nachvollziehbaren Code gemäß betrieblicher Nummernkonvention.", effect: "Identifiziert die Welle in Leitstelle und Folgeaktionen.", errors: "Leere oder bereits verwendete Codes werden abgewiesen."}
          name: {label: "Wellenname", required: true, format: "Verständliche Kurzbezeichnung", example: "Spätabholung Carrier Nord", help: "Beschreiben Sie Zweck, Schicht oder Abholfenster der Bündelung.", effect: "Erleichtert Disposition und operative Zuordnung.", errors: "Ein leerer Name verhindert die Anlage."}
          strategy: {label: "Strategie", required: true, format: "single_order, multi_order oder two_stage", example: "multi_order", help: "Einzelauftrag hält Aufträge getrennt; Multi-Order bündelt mehrere Aufträge; zweistufig trennt Sammelpick und Konsolidierung.", effect: "Bestimmt Ablauf, Behälternutzung und notwendige Folgeaktionen.", errors: "Eine ungeeignete Strategie kann operativ nicht ohne neue Planung gewechselt werden."}
          selection_type: {label: "Auswahlart", required: true, format: "manual, time, tour, carrier oder priority", example: "carrier", help: "Wählen Sie, nach welchem Kriterium Picklisten fachlich gebündelt werden.", effect: "Legt die Bedeutung des optionalen Filterwerts fest.", errors: "Ein nicht unterstütztes Kriterium wird abgewiesen."}
          selection_value: {label: "Filterwert", required: false, format: "Wert passend zur Auswahlart", example: "DHL", help: "Bei manueller Auswahl leer lassen; sonst beispielsweise Zeitfenster, Tour, Carrier oder Priorität eintragen.", effect: "Dokumentiert und begrenzt die fachliche Auswahl der Welle.", errors: "Ein zur Auswahlart unpassender Wert liefert keine sinnvolle Bündelung."}
          priority: {label: "Priorität", required: true, format: "Ganzzahl von 1 bis 999", example: "50", help: "Verwenden Sie das abgestimmte Prioritätsschema der Leitstelle.", effect: "Beeinflusst die Bearbeitungsreihenfolge der Welle.", errors: "Werte außerhalb des Bereichs oder nicht numerische Eingaben sind ungültig."}
          planned_start_at: {label: "Geplanter Start", required: false, format: "Lokales Datum und Uhrzeit", example: "2026-10-03 14:30", help: "Nur setzen, wenn die Welle an ein konkretes Bearbeitungsfenster gebunden ist.", effect: "Macht die geplante operative Freigabe zeitlich nachvollziehbar.", errors: "Ungültige Datumswerte können nicht verarbeitet werden."}
          pick_list_ids: {label: "Picklisten", required: true, format: "Mehrfachauswahl verfügbarer Picklisten", example: "PICK-SO-0815 und PICK-SO-0816", help: "Wählen Sie alle fachlich zusammengehörigen Listen; mit Strg beziehungsweise Cmd sind mehrere Einträge auswählbar.", effect: "Ordnet die ausgewählten Listen genau dieser Welle zu.", errors: "Ohne Auswahl oder bei zwischenzeitlich gebundenen Listen wird keine Welle angelegt."}
        actions:
          create_wave: {label: "Welle planen", description: "Validiert Kopfdaten und Picklistenauswahl und erzeugt eine geplante Welle.", result: "Die Welle erscheint mit ihren Listen in Leitstelle und Fortschrittsanzeige."}
          release_wave: {label: "Welle freigeben", description: "Gibt eine geplante Welle für die operative Bearbeitung frei.", result: "Der Status wechselt zu released; eine Wiederholung ist nicht erforderlich."}
          open_pick_list: {label: "Pickliste öffnen", description: "Wechselt aus der Live-Leitstelle in die operative Scanansicht.", result: "Die Navigation verändert den Prozessstatus nicht."}
          consolidate: {label: "Konsolidieren", description: "Bestätigt die Zusammenführung einer vollständig gepickten Liste in einer zweistufigen Welle.", result: "Der Konsolidierungsstatus wird fortgeschrieben und die Liste für den Folgeprozess bereitgestellt."}
        image: {src: "/assets/images/handbook/outbound/picking-control.svg", alt: "Picking-Leitstelle mit Wellenplanung, Fortschritt und Konsolidierung"}
      picking_detail:
        template: outbound/picking/show.html.twig
        title: Pickliste scannen und abschließen
        purpose: Die operative Ansicht führt den Kommissionierer in optimierter Reihenfolge durch Lagerplatz-, Artikel-, Chargen-, Seriennummern- und Mengenscans bis zur Packübergabe.
        navigation: Warenausgang → Kommissionierung → Pickliste öffnen
        permissions: ["fulfillment.pick.read; fulfillment.pick.assign für Selbstzuordnung; fulfillment.pick.optimize für Routensortierung; fulfillment.pick.execute für Scans und Fehlmengen; fulfillment.pack.write für die Packübergabe."]
        overview:
        - Jede Aufgabe zeigt Sequenz, Lagerplatz, SKU, Sollmenge und Status. Scanfelder erscheinen nur dem zugewiesenen Mitarbeiter bei offener Aufgabe.
        - Lagerplatz und Artikel werden immer validiert; Charge und Seriennummer nur bei entsprechend geführtem Bestand. Nach vollständigem Pick kann genau ein Packauftrag angelegt werden.
        fields:
          location: {label: "Lagerplatzscan", required: true, format: "Exakter Code des angezeigten Lagerplatzes", example: "WH1-PICK-01-02", help: "Scannen Sie zuerst den physischen Platz und vergleichen Sie Anzeige und Beschriftung.", effect: "Bestätigt, dass die Entnahme an der vorgesehenen Quelle erfolgt.", errors: "Ein abweichender Lagerplatz blockiert die Quittierung."}
          product: {label: "Artikelscan", required: true, format: "Exakte SKU oder zulässiger Artikelbarcode", example: "SKU-4711", help: "Scannen Sie den entnommenen Artikel, nicht die Fachbeschriftung.", effect: "Verhindert die Entnahme eines falschen Artikels.", errors: "Eine nicht zur Aufgabe passende SKU wird abgewiesen."}
          batch: {label: "Chargenscan", required: false, format: "Exakte erwartete Charge", example: "LOT-20261002", help: "Das Feld erscheint bei chargengeführter Aufgabe und muss vom Produkt gescannt werden.", effect: "Bindet die Entnahme an die allokierte Charge.", errors: "Fehlende oder abweichende Chargen verhindern die Buchung."}
          serial: {label: "Seriennummernscan", required: false, format: "Exakte eindeutige Seriennummer", example: "SN-0001842", help: "Das Feld erscheint bei seriennummerngeführtem Bestand; scannen Sie jede Einheit eindeutig.", effect: "Quittiert die konkret allokierte Einheit.", errors: "Falsche, bereits verwendete oder doppelte Seriennummern werden abgewiesen."}
          quantity: {label: "Pickmenge", required: true, format: "Positive Ganzzahl bis zur offenen Sollmenge", example: "5", help: "Übernehmen Sie die Sollmenge nur, wenn sie vollständig physisch vorhanden ist; Seriennummern werden stückweise gebucht.", effect: "Bucht die bestätigte Menge aus der Aufgabe und aktualisiert den Fortschritt.", errors: "Null, Übermenge oder eine mit Serienführung unvereinbare Menge ist ungültig."}
          note: {label: "Fehlmengennotiz", required: true, format: "Automatisch gesetzter Hinweis", example: "Fehlbestand per MDE", help: "Die Ansicht setzt beim Melden einer Fehlmenge einen festen Herkunftshinweis.", effect: "Dokumentiert den Grundpfad der abweichenden Quittierung.", errors: "Die Notiz darf nicht als reguläre Pickbestätigung verwendet werden."}
          code: {label: "Packauftragscode", required: true, format: "Eindeutiger Code; vorbelegt mit PACK-Picklistencode", example: "PACK-PICK-SO-2026-0815", help: "Prüfen Sie den vorgeschlagenen Code gegen die betriebliche Nummernkonvention.", effect: "Erzeugt und identifiziert den Packauftrag für diese Pickliste.", errors: "Leere oder doppelte Codes verhindern die Übergabe."}
        actions:
          assign: {label: "Mir zuweisen und starten", description: "Bindet die offene Pickliste an den angemeldeten Mitarbeiter und startet die Bearbeitung.", result: "Scanfelder werden für die eigenen offenen Aufgaben verfügbar."}
          optimize: {label: "Route optimieren", description: "Sortiert offene Aufgaben anhand der Lagerstruktur neu.", result: "Sequenznummern bilden die optimierte Laufreihenfolge ab."}
          scan: {label: "Scannen und entnehmen", description: "Validiert Platz, Artikel, optionale Bestandsmerkmale und Menge und bucht die Entnahme.", result: "Die Aufgabe wird fortgeschrieben oder abgeschlossen; der Fortschritt aktualisiert sich."}
          shortage: {label: "Fehlbestand melden", description: "Quittiert eine offene Aufgabe über den Abweichungspfad mit fester MDE-Notiz.", result: "Die Fehlmenge ist für Leitstelle und weitere Disposition sichtbar."}
          create_packing: {label: "Packauftrag erstellen", description: "Übergibt eine vollständig abgeschlossene Pickliste mit eindeutigem Code an den Packprozess.", result: "Der Packauftrag wird angelegt und anschließend direkt verlinkt."}
        image: {src: "/assets/images/handbook/outbound/picking-detail.svg", alt: "Operative Pickliste mit Scanvalidierung, Fehlmenge und Packübergabe"}
      packing_overview:
        template: outbound/packing/index.html.twig
        title: Packauftragsübersicht
        purpose: Die Packstation zeigt alle aus abgeschlossenen Picklisten erzeugten Packaufträge mit Status, Auftragsbezug, Packstückanzahl und Gesamtgewicht.
        navigation: Warenausgang → Packen
        permissions: ["fulfillment.pack.read"]
        overview:
        - Jede Karte zeigt Packauftragscode, Status, Kundenauftrag, Anzahl der bereits versiegelten Packstücke und deren summiertes Gewicht.
        - Ein leerer Zustand bedeutet, dass noch keine freigegebene und vollständig gepickte Liste an die Packstation übergeben wurde. Suche, Filter und Pagination sind derzeit nicht vorhanden.
        actions:
          open: {label: "Packauftrag öffnen", description: "Öffnet Packstücke, noch nicht verpackte Pickpositionen, Messfunktion und Versandübergabe.", result: "Das Öffnen verändert weder Status noch Packinhalt."}
        image: {src: "/assets/images/handbook/outbound/packing-overview.svg", alt: "Packauftragsübersicht mit Status, Packstückanzahl und Gesamtgewicht"}
      packing_detail:
        template: outbound/packing/show.html.twig
        title: Packstücke bilden und Packauftrag abschließen
        purpose: Die Packansicht ordnet gepickte Positionen eindeutigen Packstücken zu, erfasst das Istgewicht, unterstützt nachträgliche Messungen und übergibt den abgeschlossenen Auftrag an den Versand.
        navigation: Warenausgang → Packen → Packauftrag öffnen
        permissions: ["fulfillment.pack.read; fulfillment.pack.write zum Versiegeln; fulfillment.pack.execute zum Abschluss; integration.measurement.capture zum Messen; fulfillment.ship.write zur Versandübergabe."]
        overview:
        - Die Packstücktabelle zeigt Nummer, Gewicht, optionale Abmessungen, Status und Anzahl enthaltener Pickpositionen. Messen ergänzt beziehungsweise korrigiert Gewicht und Abmessungen über den Messprozess.
        - Solange Positionen offen sind, werden sie einem neuen Packstück zugeordnet. Erst wenn alle Positionen verpackt und mindestens ein Packstück vorhanden sind, kann der Packauftrag abgeschlossen werden.
        - Nach dem Abschluss erzeugen Sendungsnummer, Carrier und Service genau eine vorbereitete Sendung; eine bereits vorhandene Sendung wird direkt verlinkt.
        fields:
          package_number: {label: "Packstücknummer", required: true, format: "Im Packauftrag eindeutiger Code", example: "PKG-PACK-PICK-SO-0815-1", help: "Prüfen Sie den vorbelegten Code gegen das physische Packstücketikett und die Nummernkonvention.", effect: "Identifiziert das versiegelte Packstück in Messung, Druck und Versand.", errors: "Leere oder doppelte Packstücknummern werden abgewiesen."}
          weight_grams: {label: "Gewicht in Gramm", required: true, format: "Positive Ganzzahl innerhalb des konfigurierten Packstücklimits", example: "3150", help: "Wiegen Sie das vollständig gepackte Packstück einschließlich Verpackungsmaterial und erfassen Sie Gramm ohne Dezimalstellen.", effect: "Fließt in Gesamtgewicht, Carrierprüfung und Gewichtsrestriktionen ein.", errors: "Null, negative, nicht numerische oder über dem aktiven Packstücklimit liegende Werte verhindern das Versiegeln."}
          pick_task_id: {label: "Pickpositionen", required: true, format: "Mehrfachauswahl noch nicht verpackter Pickaufgaben", example: "SKU-4711 Menge 2 und SKU-815 Menge 1", help: "Entfernen Sie die Markierung für Positionen, die physisch nicht in diesem Packstück liegen. Mindestens eine Position muss ausgewählt bleiben.", effect: "Ordnet jede gewählte Pickposition genau diesem Packstück zu und entfernt sie aus der offenen Packmenge.", errors: "Keine Auswahl, unbekannte oder bereits verpackte Positionen verhindern das Versiegeln."}
          shipment_number: {label: "Sendungsnummer", required: true, format: "Im Mandanten eindeutiger Sendungscode", example: "SHIP-PACK-PICK-SO-0815", help: "Verwenden Sie die vorbelegte Nummer oder die abgestimmte interne beziehungsweise ERP-Nummer.", effect: "Identifiziert die vorbereitete Sendung in Versand, Tracking und Verladung.", errors: "Leere oder bereits verwendete Nummern verhindern die Anlage."}
          carrier: {label: "Carrier", required: true, format: "Carrier-Code passend zu einer aktiven Verbindung", example: "DHL", help: "Erfassen Sie den exakten Code der konfigurierten Carrier-Anbindung; DEMO ist nur für Testabläufe vorgesehen.", effect: "Bestimmt, welche Anbindung später Label und Tracking erzeugt.", errors: "Ein unbekannter Code erlaubt gegebenenfalls nur die manuelle Labelerfassung."}
          service: {label: "Versandservice", required: true, format: "Beim Carrier verfügbarer Servicecode", example: "STANDARD", help: "Wählen Sie den mit Auftrag und Carrier abgestimmten Service, beispielsweise STANDARD oder EXPRESS.", effect: "Wird an die Labelerzeugung und Versandabwicklung übergeben.", errors: "Leere oder beim Carrier unzulässige Services führen spätestens bei der Labelanforderung zu einem Fehler."}
        actions:
          measure: {label: "Messen", description: "Öffnet die Messwerterfassung für das vorhandene Packstück.", result: "Gewicht und Abmessungen werden nach erfolgreicher Erfassung am Packstück angezeigt."}
          seal_package: {label: "Packstück versiegeln", description: "Validiert Nummer, Gewicht und ausgewählte Pickpositionen und bildet daraus ein unverwechselbares Packstück.", result: "Das Packstück erscheint in der Tabelle; enthaltene Positionen sind nicht mehr offen."}
          complete: {label: "Packauftrag abschließen", description: "Schließt den Auftrag, sobald alle Pickpositionen verpackt und Packstücke vorhanden sind.", result: "Der Packauftrag wechselt zu completed und wird für die Versandvorbereitung freigegeben."}
          create_shipment: {label: "Sendung erstellen", description: "Erzeugt aus abgeschlossenem Packauftrag, Sendungsnummer, Carrier und Service eine vorbereitete Sendung.", result: "Die Versanddetailansicht öffnet sich für Label, Druck und Übergabe."}
          open_shipment: {label: "Sendung öffnen", description: "Öffnet die bereits mit dem Packauftrag verbundene Sendung.", result: "Die Navigation erzeugt keine weitere Sendung."}
        image: {src: "/assets/images/handbook/outbound/packing-detail.svg", alt: "Packauftrag mit Packstückbildung, Gewicht, Messung und Versandübergabe"}
      shipping_overview:
        template: outbound/shipping/index.html.twig
        title: Sendungsübersicht
        purpose: Die Übersicht verfolgt vorbereitete, etikettierte und übergebene Sendungen mit Carrier, Service und Trackingnummer.
        navigation: Warenausgang → Versand
        permissions: ["fulfillment.ship.read"]
        overview:
        - Jede Zeile zeigt Sendungsnummer, Carrier, Service, Status und vorhandene Trackingnummer. Öffnen führt zu Labelerzeugung, Druck und Carrierübergabe.
        - Der Leerzustand bedeutet, dass noch kein abgeschlossener Packauftrag an den Versand übergeben wurde; Suche, Filter und Pagination sind derzeit nicht vorhanden.
        actions:
          open: {label: "Öffnen", description: "Öffnet die ausgewählte Sendung mit den jeweils zulässigen Versandaktionen.", result: "Die Navigation verändert den Sendungsstatus nicht."}
        image: {src: "/assets/images/handbook/outbound/shipping-overview.svg", alt: "Sendungsübersicht mit Carrier, Service, Status und Trackingnummer"}
      shipping_detail:
        template: outbound/shipping/show.html.twig
        title: Versandlabel, Druck und Carrierübergabe
        purpose: Die Versanddetailansicht erzeugt oder registriert ein Label, druckt es über einen aktiven Drucker und bestätigt anschließend die physische Übergabe.
        navigation: Warenausgang → Versand → Sendung öffnen
        permissions: ["fulfillment.ship.read; integration.carrier.execute für Carrier-Label; fulfillment.ship.label für manuelle Labels; integration.print_job.write für Druck; fulfillment.ship.dispatch für Übergabe."]
        overview:
        - Im Status prepared kann bei aktiver Carrier-Verbindung automatisch ein Label angefordert oder Tracking und Labelreferenz manuell registriert werden.
        - Im Status labelled stehen Labeldruck und Carrierübergabe bereit. Vorhandene Druckaufträge, Trackingnummer und Labelreferenz bleiben sichtbar.
        fields:
          tracking_number: {label: "Trackingnummer", required: true, format: "Eindeutige vom Carrier vergebene Sendungsverfolgungsnummer", example: "00340434161094000000", help: "Bei manueller Registrierung exakt aus dem Carrierportal übernehmen.", effect: "Ermöglicht Sendungsverfolgung und setzt die Sendung zusammen mit der Labelreferenz auf labelled.", errors: "Leere oder widersprüchliche Nummern verhindern die Registrierung."}
          label_reference: {label: "Labelreferenz", required: true, format: "Sicher erreichbare Dokumentreferenz oder interner Pfad", example: "carrier-labels/SHIP-0815.zpl", help: "Referenzieren Sie das tatsächlich zur Trackingnummer gehörende Label.", effect: "Dient als Quelle für den späteren Druckauftrag.", errors: "Eine fehlende Referenz verhindert Labelregistrierung und Druck."}
          printer_id: {label: "Drucker", required: true, format: "Auswahl eines aktiven konfigurierten Druckers", example: "ZEBRA-PACK-01", help: "Wählen Sie den Drucker an der tatsächlichen Versand- oder Packstation.", effect: "Stellt einen ZPL-Carrier-Labelauftrag mit einer Kopie in die Druckwarteschlange.", errors: "Inaktive, unbekannte oder nicht erreichbare Drucker führen zu einem fehlgeschlagenen Druckauftrag."}
          handover_reference: {label: "Übergabereferenz", required: true, format: "Quittungs-, Scan- oder Abholreferenz des Carriers", example: "DHL-PICKUP-20261003-42", help: "Erst nach physischer Übergabe beziehungsweise bestätigtem Abholscan erfassen.", effect: "Markiert die Sendung als versandt und dokumentiert den Übergabenachweis.", errors: "Eine leere Referenz oder eine nicht etikettierte Sendung kann nicht übergeben werden."}
        actions:
          request_carrier_label: {label: "Label beim Carrier anfordern", description: "Ruft über die aktive Carrier-Verbindung Label und Trackingnummer idempotent ab.", result: "Die Daten werden registriert und die Sendung wechselt zu labelled."}
          register_label: {label: "Label übernehmen", description: "Registriert eine extern erzeugte Trackingnummer und Labelreferenz manuell.", result: "Die Sendung ist für Druck und Übergabe etikettiert."}
          print_label: {label: "Druckauftrag anlegen", description: "Übergibt das registrierte Label im ZPL-Format an den ausgewählten Drucker.", result: "Ein nachvollziehbarer Druckauftrag erscheint für die Sendung."}
          dispatch: {label: "Als versandt markieren", description: "Bestätigt die physische Carrierübergabe mit Referenz.", result: "Die Sendung wechselt in den Versandstatus dispatched."}
        image: {src: "/assets/images/handbook/outbound/shipping-detail.svg", alt: "Versanddetail mit Labelregistrierung, Druckerauswahl und Übergabebestätigung"}
      loading_overview:
        template: outbound/loading/index.html.twig
        title: Verladeübersicht
        purpose: Die Übersicht bündelt Lademanifeste nach Route und Fahrzeug und zeigt den aktuellen Ladefortschritt.
        navigation: Warenausgang → Verladung
        permissions: ["fulfillment.loading.read; fulfillment.loading.write für die Neuanlage."]
        overview:
        - Jede Zeile zeigt Manifestcode, Tour, Fahrzeug, Status und das Verhältnis geladener zu geplanter Sendungen.
        - Öffnen führt zur Scanbestätigung der einzelnen Sendungen; neue Manifeste können nur mit Schreibrecht angelegt werden.
        actions:
          create: {label: "Lademanifest erstellen", description: "Öffnet die Auswahl etikettierter und noch nicht zugeordneter Sendungen.", result: "Daten werden erst beim Speichern des Folgeformulars geändert."}
          open: {label: "Öffnen", description: "Öffnet die Ladeliste und deren Fortschritt.", result: "Das Öffnen verändert keinen Ladestatus."}
        image: {src: "/assets/images/handbook/outbound/loading-overview.svg", alt: "Verladeübersicht mit Route, Fahrzeug, Status und Fortschritt"}
      loading_create:
        template: outbound/loading/new.html.twig
        title: Lademanifest anlegen
        purpose: Das Formular ordnet eine oder mehrere etikettierte, noch unverplante Sendungen einer Route und einem Fahrzeug zu.
        navigation: Warenausgang → Verladung → Lademanifest erstellen
        permissions: ["fulfillment.loading.write"]
        overview:
        - Es werden ausschließlich für die Verladung verfügbare Sendungen angeboten. Ohne mindestens eine Auswahl bleibt die Anlage gesperrt.
        fields:
          code: {label: "Manifestnummer", required: true, format: "Im Mandanten eindeutiger Manifestcode", example: "LOAD-2026-0042", help: "Verwenden Sie die abgestimmte Nummernkonvention für Tour oder Abholung.", effect: "Identifiziert Manifest und Ladeliste.", errors: "Leere oder doppelte Codes verhindern die Anlage."}
          tour_reference: {label: "Route", required: true, format: "Eindeutige Tour- oder Routenreferenz", example: "TOUR-NORD-03", help: "Muss zur geplanten Zustellfolge beziehungsweise Abholung passen.", effect: "Bündelt die Sendungen unter der vorgesehenen Route.", errors: "Eine leere Route verhindert das Speichern."}
          vehicle_reference: {label: "Fahrzeug", required: true, format: "Kennzeichen oder betriebliche Fahrzeugkennung", example: "HH-WMS-42", help: "Prüfen Sie Fahrzeug, Kapazität und tatsächliche Bereitstellung vor der Zuordnung.", effect: "Dokumentiert, auf welches Fahrzeug die Sendungen geladen werden.", errors: "Eine leere Fahrzeugreferenz verhindert die Anlage."}
          shipment_id: {label: "Sendungen", required: true, format: "Mehrfachauswahl etikettierter, unverplanter Sendungen", example: "SHIP-0815 und SHIP-0816", help: "Markieren Sie nur physisch für diese Route bereitgestellte Sendungen.", effect: "Bindet jede Auswahl an das neue Manifest und entfernt sie aus der freien Verladeauswahl.", errors: "Ohne Auswahl oder bei zwischenzeitlich gebundener Sendung wird kein Manifest angelegt."}
        actions:
          save: {label: "Manifest erstellen", description: "Validiert Kopfdaten und Sendungsauswahl und legt die offene Ladeliste an.", result: "Das Manifestdetail öffnet sich zur scanbasierten Verladung."}
          cancel: {label: "Abbrechen", description: "Verwirft die noch nicht gespeicherte Zusammenstellung.", result: "Sendungen bleiben frei verfügbar."}
        image: {src: "/assets/images/handbook/outbound/loading-create.svg", alt: "Formular für Manifestnummer, Route, Fahrzeug und Sendungsauswahl"}
      loading_detail:
        template: outbound/loading/show.html.twig
        title: Sendungen verladen und Manifest abschließen
        purpose: Die Ladeliste bestätigt jede geplante Sendung einzeln und erlaubt den Abschluss erst nach vollständiger Verladung.
        navigation: Warenausgang → Verladung → Manifest öffnen
        permissions: ["fulfillment.loading.read; fulfillment.loading.execute für Ladebestätigung und Abschluss."]
        overview:
        - Die Tabelle zeigt Sendungsnummer, Carrier, Service, Trackingnummer, Status und gegebenenfalls Ladezeitpunkt. Der Zähler vergleicht geladene und geplante Sendungen.
        - Nur pending-Sendungen eines offenen oder laufenden Manifests können bestätigt werden. Der Abschluss erscheint erst, wenn jede Sendung loaded ist.
        actions:
          confirm_loading: {label: "Verladung bestätigen", description: "Bestätigt die physische Sendung auf dem vorgesehenen Fahrzeug.", result: "Die Sendung wechselt zu loaded und erhält einen Ladezeitpunkt."}
          complete: {label: "Verladung abschließen", description: "Schließt das vollständig geladene Manifest gegen weitere Änderungen.", result: "Das Manifest wechselt in den abgeschlossenen Status."}
        image: {src: "/assets/images/handbook/outbound/loading-detail.svg", alt: "Lademanifest mit Sendungsstatus, Ladefortschritt und Abschlussaktion"}
      outbound_control:
        template: outbound/order/control.html.twig
        title: Outbound-Leitstelle
        purpose: Die Leitstelle vereint Bedarfs- und Engpasssicht, Auftragsstorno, Ausgangs-QS, Versandregeln, Tracking, Touren, Gewichtsgrenzen und unveränderliche Versanddokumente.
        navigation: Warenausgang → Leitstelle
        permissions: ["outbound.order.read; outbound.order.write für Storno; fulfillment.pack.execute für QS; fulfillment.ship.write für Regeln, Tracking und Dokumente; fulfillment.loading.write für Touren und Gewichtsgrenzen."]
        overview:
        - Bedarfsvorschau und Auftragsprüfung zeigen Nachfrage, Bestand, Fehlmenge und offene Aufträge. Storno ist nur im Status imported mit Begründung möglich.
        - Die Ausgangs-QS entscheidet anhand Vollständigkeit, Zustand und Kundenvorgaben über Freigabe oder Sperre der Pickliste.
        - Versand und Tracking konfigurieren Gewichtsbereiche je Carrier-Service und erfassen Ereignisse mit Ort und Zeitpunkt. Touren bündeln Stopps unter Fahrzeug- und Gewichtsgrenzen.
        - Versanddokumente werden einem vorhandenen Aggregat zugeordnet, HTML-sicher erzeugt, mit Prüfsumme archiviert und anschließend schreibgeschützt bereitgestellt.
        fields:
          reason: {label: "Stornogrund", required: true, format: "Nachvollziehbarer fachlicher Freitext", example: "Kundenstorno vor Freigabe", help: "Beschreiben Sie den Auslöser so, dass Audit und Kundenservice ihn nachvollziehen können.", effect: "Wird mit dem stornierten importierten Auftrag auditiert.", errors: "Leertext oder ein bereits weiterverarbeiteter Auftrag kann nicht storniert werden."}
          pick_list_id: {label: "Geprüfte Pickliste", required: true, format: "Auswahl einer abgeschlossenen QS-Kandidatenliste", example: "PICK-SO-0815", help: "Vergleichen Sie die physische Ware mit Auftrag und Pickliste vor der Entscheidung.", effect: "Bindet alle Prüfergebnisse an genau diese Pickliste.", errors: "Unbekannte, unvollständige oder bereits entschiedene Picklisten werden abgewiesen."}
          completeness_passed: {label: "Vollständigkeit bestätigt", required: false, format: "Checkbox", example: "aktiviert", help: "Nur markieren, wenn alle Sollpositionen und Mengen vorhanden sind.", effect: "Fließt in Freigabe oder Sperrentscheidung ein.", errors: "Nicht bestätigte Vollständigkeit führt zur Sperre."}
          condition_passed: {label: "Zustand einwandfrei", required: false, format: "Checkbox", example: "aktiviert", help: "Ware und Verpackung auf Schäden und Qualitätsabweichungen prüfen.", effect: "Dokumentiert die Zustandsprüfung.", errors: "Eine negative Prüfung verhindert die Packfreigabe."}
          customer_check_passed: {label: "Kundenvorgaben erfüllt", required: false, format: "Checkbox", example: "aktiviert", help: "Kennzeichnung, Dokumente und kundenspezifische Packvorgaben prüfen.", effect: "Dokumentiert die Erfüllung kundenspezifischer Anforderungen.", errors: "Nicht erfüllte Vorgaben führen zur Sperre."}
          note: {label: "Prüf- oder Sperrnotiz", required: false, format: "Freitext", example: "Umkarton beschädigt, Ware unversehrt", help: "Abweichungen und erforderliche Folgearbeiten konkret festhalten.", effect: "Erscheint in der QS-Historie und erklärt die Entscheidung.", errors: "Unklare Notizen erschweren die Nachbearbeitung."}
          code: {label: "Regel- oder Tourcode", required: true, format: "Im jeweiligen Bereich eindeutiger Code", example: "DHL-STD-31500", help: "Für Versandregel beziehungsweise Tour eine stabile Nummernkonvention verwenden.", effect: "Identifiziert die neue Versandregel oder Tour.", errors: "Leere oder doppelte Codes werden abgewiesen.", usages: ["Versandregel und Tour"]}
          name: {label: "Regelname", required: true, format: "Verständliche Bezeichnung", example: "DHL Standard bis 31,5 kg", help: "Carrier, Service und Gewichtsbereich verständlich zusammenfassen.", effect: "Erscheint in der Liste aktiver Versandmethoden.", errors: "Ein leerer Name verhindert die Regelanlage."}
          carrier: {label: "Carrier", required: true, format: "Exakter Carrier-Code", example: "DHL", help: "Muss zu Versandregel beziehungsweise Tour und vorhandener Anbindung passen.", effect: "Ordnet Regel oder Tour dem Versanddienstleister zu.", errors: "Leere oder unbekannte Codes verhindern spätere automatische Verarbeitung.", usages: ["Versandregel und Tour"]}
          service: {label: "Service", required: true, format: "Carrier-Servicecode", example: "STANDARD", help: "Den beim Carrier gültigen Service erfassen.", effect: "Die Versandregel wählt diesen Service im Gewichtsbereich.", errors: "Nicht unterstützte Services scheitern bei der Labelanforderung."}
          min_weight_grams: {label: "Mindestgewicht", required: true, format: "Ganzzahl ab 0 in Gramm", example: "0", help: "Untere inklusive Grenze der Versandregel setzen.", effect: "Grenzt die Regel nach unten ab.", errors: "Negative Werte oder Überschneidungen sind fachlich ungültig."}
          max_weight_grams: {label: "Maximalgewicht", required: true, format: "Positive Ganzzahl in Gramm", example: "31500", help: "Muss über dem Mindestgewicht liegen und zur Carrier-, Fahrzeug- oder Tourgrenze passen.", effect: "Begrenzt Versandregel, Tour oder Gewichtsrestriktion.", errors: "Null, negative oder widersprüchliche Grenzen werden abgewiesen.", usages: ["Versandregel, Tour und Gewichtsrestriktion"]}
          priority: {label: "Priorität", required: true, format: "Ganzzahl", example: "100", help: "Verwenden Sie ein konsistentes Schema zur Reihenfolge passender Versandregeln.", effect: "Entscheidet bei mehreren Treffern über die Regelauswahl.", errors: "Ungeeignete Prioritäten können eine falsche Regel bevorzugen."}
          shipment_id: {label: "Sendung", required: false, format: "Auswahl einer vorhandenen Sendung", example: "SHIP-0815", help: "Beim Tracking erforderlich; beim Tourstopp optional, wenn ein Stopp ohne Sendung geplant wird.", effect: "Bindet Ereignis oder Tourstopp an die Sendung.", errors: "Unbekannte oder mandantenfremde Sendungen werden abgewiesen.", usages: ["Trackingereignis und optionaler Tourstopp"]}
          status: {label: "Trackingstatus", required: true, format: "Externer oder interner Statuscode", example: "in_transit", help: "Den Status aus der Carrier-Rückmeldung unverändert und eindeutig erfassen.", effect: "Erweitert die chronologische Trackinghistorie.", errors: "Ein leerer Status verhindert die Erfassung."}
          location: {label: "Trackingort", required: false, format: "Ort oder Umschlagpunkt", example: "Hamburg Paketzentrum", help: "Nur erfassen, wenn das Ereignis einem belastbaren Ort zugeordnet ist.", effect: "Ergänzt den Status um räumlichen Kontext.", errors: "Freitext wird nicht als Stammdatenort validiert."}
          occurred_at: {label: "Ereigniszeitpunkt", required: true, format: "Lokales Datum und Uhrzeit", example: "2026-10-03 18:45", help: "Den tatsächlichen Carrierzeitpunkt und nicht die Erfassungszeit verwenden.", effect: "Sortiert die Trackinghistorie chronologisch.", errors: "Leere oder ungültige Datumswerte werden abgewiesen."}
          description: {label: "Ereignisbeschreibung", required: true, format: "Kurzer verständlicher Text", example: "Im Start-Paketzentrum bearbeitet", help: "Status für Service und Empfänger verständlich erläutern.", effect: "Ergänzt den technischen Trackingstatus.", errors: "Eine leere Beschreibung verhindert das Speichern."}
          vehicle_reference: {label: "Fahrzeug", required: true, format: "Kennzeichen oder Fahrzeugkennung", example: "HH-WMS-42", help: "Nur ein tatsächlich verfügbares Fahrzeug mit ausreichender Kapazität einplanen.", effect: "Ordnet die Tour dem Fahrzeug zu.", errors: "Eine leere Referenz verhindert die Touranlage."}
          departure_at: {label: "Geplante Abfahrt", required: true, format: "Lokales Datum und Uhrzeit", example: "2026-10-04 06:00", help: "Mit Cut-off, Fahrer und Rampenplanung abstimmen.", effect: "Definiert den geplanten Tourstart.", errors: "Ungültige Zeitwerte werden abgewiesen."}
          destination_name: {label: "Empfänger oder Stoppname", required: true, format: "Verständliche Bezeichnung", example: "Kunde Nord GmbH", help: "Den ersten Tourstopp eindeutig benennen.", effect: "Erzeugt den initialen Tourstopp.", errors: "Ein leerer Name verhindert die Touranlage."}
          destination_address: {label: "Zieladresse", required: true, format: "Vollständige zustellfähige Adresse", example: "Musterstraße 1, 20095 Hamburg", help: "Straße, Hausnummer, Postleitzahl und Ort vollständig erfassen.", effect: "Definiert das physische Ziel des Tourstopps.", errors: "Leere oder unvollständige Adressen gefährden die Zustellung."}
          scope: {label: "Geltungsbereich", required: true, format: "package, carrier, vehicle oder tour", example: "vehicle", help: "Wählen Sie die Ebene, auf der die Gewichtsgrenze geprüft werden soll.", effect: "Steuert, welche Objekte die aktive Grenze verwenden.", errors: "Andere Werte werden abgewiesen."}
          reference_code: {label: "Optionale Referenz", required: false, format: "Carrier-, Fahrzeug- oder Tourcode", example: "HH-WMS-42", help: "Leer lassen für eine globale Grenze des Bereichs; setzen für ein konkretes Objekt.", effect: "Beschränkt die Gewichtsgrenze auf die Referenz.", errors: "Eine nicht passende Referenz lässt die Regel wirkungslos."}
          document_type: {label: "Dokumenttyp", required: true, format: "delivery_note, packing_list, loading_list oder cmr", example: "cmr", help: "Den zum Prozess und Empfänger passenden Dokumenttyp wählen.", effect: "Klassifiziert das unveränderliche Versanddokument.", errors: "Nicht angebotene Typen werden abgewiesen."}
          aggregate_type: {label: "Bezugsart", required: true, format: "shipment, loading_manifest oder tour", example: "shipment", help: "Bestimmt, zu welchem Prozessobjekt das Dokument gehört.", effect: "Steuert Validierung und Archivzuordnung.", errors: "Nicht unterstützte Bezugsarten werden abgewiesen."}
          aggregate_id: {label: "Bezugs-ID", required: true, format: "UUID des vorhandenen Prozessobjekts", example: "018f2f5a-73ad-7c42-9d84-2dcb65bcb410", help: "ID passend zur gewählten Bezugsart aus dem System übernehmen.", effect: "Verknüpft das Dokument unveränderlich mit Sendung, Manifest oder Tour.", errors: "Unbekannte oder mandantenfremde IDs werden abgewiesen."}
          document_number: {label: "Dokumentnummer", required: true, format: "Eindeutige fachliche Nummer", example: "CMR-2026-0042", help: "Betriebliche oder gesetzliche Nummernkonvention einhalten.", effect: "Identifiziert das Dokument im Archiv.", errors: "Leere oder doppelte Nummern verhindern die Erzeugung."}
          title: {label: "Dokumenttitel", required: true, format: "Kurzer Klartext", example: "CMR-Frachtbrief Tour Nord", help: "Zweck und Bezug verständlich benennen; HTML wird sicher maskiert.", effect: "Wird als Titel und Überschrift des Dokuments gerendert.", errors: "Ein leerer Titel verhindert die Erzeugung."}
          body: {label: "Dokumentinhalt", required: true, format: "Mehrzeiliger Klartext", example: "Absender, Empfänger, Packstücke und Hinweise", help: "Alle erforderlichen Versandinformationen vollständig eingeben; Zeilenumbrüche bleiben erhalten.", effect: "Wird sicher in ein unveränderliches HTML-Dokument überführt und per Prüfsumme gesichert.", errors: "Leerer Inhalt verhindert die Erzeugung; nachträgliche Änderung erfordert ein neues Dokument."}
        actions:
          cancel_order: {label: "Auftrag stornieren", description: "Storniert einen noch importierten Auftrag mit Auditgrund.", result: "Der Auftrag wird aus der weiteren Bearbeitung genommen."}
          quality_check: {label: "QS abschließen", description: "Speichert drei Prüfkriterien und Notiz und entscheidet über Freigabe oder Sperre.", result: "Nur released-Picklisten dürfen anschließend gepackt werden."}
          create_shipping_rule: {label: "Versandregel aktivieren", description: "Speichert Carrier, Service, Gewichtsbereich und Priorität.", result: "Die Regel steht für künftige Versandentscheidungen bereit."}
          record_tracking: {label: "Trackingereignis speichern", description: "Erfasst Status, Ort, Zeitpunkt und Beschreibung manuell.", result: "Das Ereignis erscheint chronologisch und ist für Rückmeldungen verfügbar."}
          create_tour: {label: "Tour erstellen", description: "Plant Fahrzeug, Abfahrt, Gewichtslimit und ersten Stopp.", result: "Die Tour erscheint mit geplanter Last in der Leitstelle."}
          create_weight_constraint: {label: "Gewichtsgrenze aktivieren", description: "Speichert eine globale oder referenzbezogene aktive Obergrenze.", result: "Nachfolgende Pack-, Carrier-, Fahrzeug- oder Tourprüfungen berücksichtigen sie."}
          generate_document: {label: "Dokument erzeugen", description: "Validiert Bezug und Inhalt und archiviert eine sichere unveränderliche HTML-Fassung.", result: "Das Dokument erscheint mit Prüfsumme im Archiv und kann geöffnet werden."}
        image: {src: "/assets/images/handbook/outbound/outbound-control.svg", alt: "Outbound-Leitstelle mit Bedarf, QS, Versandregeln, Tracking, Touren und Dokumenten"}
    guidance:
      prerequisites:
      - Freigegebener Auftrag, verfügbarer Bestand, Packmittel, Carrier-Verbindung, Druckroute und Verladeplanung.
      permissions:
      - outbound.order.read/write/release; fulfillment.pick.read/write/assign/execute/control/optimize/wave.write; fulfillment.pack.*, fulfillment.ship.*, fulfillment.loading.* und fulfillment.transport.*.
      fields:
      - 'Auftrag: customer_reference, destination_name/address, planned_for, product_id, quantity. Pick: pick_list_id, assigned_to, scan_value, actual_quantity. Pack: packaging_note,
        weight_grams, length/width/height_mm. Versand: carrier, service, label_type, tracking_number. Verladung: shipment_ids, vehicle_reference, departure_at.'
      statuses:
      - Auftrag draft/released/allocated; Pick open/assigned/in_progress/completed; Pack open/completed; Sendung prepared/dispatched; Manifest open/completed.
      errors:
      - Fehlbestand, falscher Scan, überhöhte Pickmenge, unvollständiges Packstück, Carrierfehler, fehlendes Label oder bereits abgeschlossenes Manifest verhindert die Aktion.
  integrations_and_devices:
    title: ERP, Carrier, Drucker, Scanner, Messgeräte und WCS
    summary: Externe Verbindungen konfigurieren, testen, überwachen und sicher betreiben.
    sections:
      section_1:
        title: Verbindungen konfigurieren
        paragraphs:
          paragraph_1: Legen Sie pro Mandant Verbindungstyp, HTTPS-Endpunkt, Authentifizierungsreferenz, Zeitlimits, Wiederholungsregeln und aktiven Status fest. Secrets werden ausschließlich
            über Umgebungsreferenzen aufgelöst. Nutzen Sie die Testfunktion, bevor die Verbindung produktive Nachrichten erhält.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Verbindungen konfigurieren – Screenshot-Platzhalter
      section_2:
        title: ERP und Datenaustausch
        paragraphs:
          paragraph_1: Mappings ordnen Quell- und Zielfelder sowie Transformationen zu. Importaufträge zeigen Format, Ressourcentyp, Zeilenzahl, Status und Fehler. Korrigieren Sie Mapping
            oder Quelldaten und starten Sie fehlerhafte Jobs kontrolliert neu.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: ERP und Datenaustausch – Screenshot-Platzhalter
      section_3:
        title: Carrier und Druck
        paragraphs:
          paragraph_1: Carrier-Verbindungen erzeugen Labels und Statusabfragen. Drucker besitzen Warteschlange, Format und Verbindung. Prüfen Sie Druckvorschau, Zielgerät und Wiederholungsstatus,
            bevor Sie einen Auftrag erneut senden.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: 'Platzhalter: Integrationsverbindung und Test'
      section_4:
        title: Scanner, Waagen und Volumenmessung
        paragraphs:
          paragraph_1: Registrieren Sie Geräte mit eindeutigem Code und Typ. Scans und Messungen verwenden eine Nachrichten-ID zur idempotenten Verarbeitung. Ordnen Sie das Gerät dem
            richtigen Standort zu und prüfen Sie Einheit, Messbereich und Zeitstempel.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Scanner, Waagen und Volumenmessung – Screenshot-Platzhalter
      section_5:
        title: WCS und Lagerautomation
        paragraphs:
          paragraph_1: Automationsbefehle besitzen Zielsystem, Befehlstyp, Nutzdaten und Status. Überwachen Sie Annahme, Ausführung und technische Fehler. Ein manueller Retry darf nur
            bei einem idempotenten oder eindeutig abgesicherten Befehl erfolgen.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: WCS und Lagerautomation – Screenshot-Platzhalter
    views:
      erp_connections:
        template: integration/erp/index.html.twig
        title: ERP-Verbindungen
        purpose: Die Übersicht zeigt alle mandantenbezogenen ERP-Endpunkte für ausgehende Statusmeldungen.
        navigation: Integration → ERP-Verbindungen
        permissions: ["integration.erp_connection.read; integration.erp_connection.write für die Anlage."]
        overview:
        - Name, HTTPS-Endpunkt, Secret-Referenz, Aktivstatus und letzte Änderung machen Konfiguration und Betriebszustand vergleichbar. Die Tabelle besitzt aktuell keine Suche oder Pagination.
        - Ein leerer Zustand bedeutet, dass noch kein ERP angebunden ist. Öffnen führt zur Detail- und Statusansicht.
        actions:
          create: {label: "ERP-Verbindung anlegen", description: "Öffnet das separate Verbindungsformular.", result: "Bis zum Speichern wird keine Verbindung registriert."}
          open: {label: "Öffnen", description: "Zeigt Endpunkte, Secret-Referenz, Status und Auditdaten.", result: "Der Status bleibt unverändert."}
        image: {src: "/assets/images/handbook/integration/erp-connections.svg", alt: "ERP-Verbindungsübersicht mit Endpunkt und Aktivstatus"}
      erp_connection_create:
        template: integration/erp/new.html.twig
        title: ERP-Verbindung anlegen
        purpose: Das Formular registriert einen signierten HTTPS-Endpunkt für Statusereignisse des aktiven Mandanten.
        navigation: Integration → ERP-Verbindungen → ERP-Verbindung anlegen
        permissions: ["integration.erp_connection.write"]
        overview: ["Das Secret selbst bleibt in der Laufzeitumgebung. WebWMS speichert ausschließlich den Namen der Umgebungsvariable."]
        fields:
          name: {label: "Name", required: true, format: "Bis 100 Zeichen", example: "ACME ERP Produktion", help: "Umgebung und Zielsystem eindeutig benennen.", effect: "Erscheint in Übersicht und Auditkontext.", errors: "Ein leerer Name wird abgewiesen."}
          credential_env: {label: "Credential-Umgebungsvariable", required: true, format: "3–101 Zeichen; Großbuchstabe, danach A–Z, 0–9 oder Unterstrich", example: "ERP_ACME_SIGNING_KEY", help: "Nur den Variablennamen, niemals Schlüssel oder Passwort eintragen.", effect: "Zur Laufzeit wird daraus der Signaturschlüssel gelesen.", errors: "Fehlende Variable oder falsches Muster verhindert sichere Zustellung."}
          endpoint_url: {label: "HTTPS-Basis-URL", required: true, format: "Vollständige HTTPS-URL, maximal 500 Zeichen", example: "https://erp.example.com/integrations/webwms", help: "Erreichbaren Basisendpunkt ohne Secret oder Query-Token angeben.", effect: "Statusereignisse werden an den ergänzten Pfad /status-events gesendet.", errors: "HTTP, ungültige URL, DNS-, Zertifikats- oder Timeoutfehler verhindern die Zustellung."}
          active: {label: "Sofort aktivieren", required: false, format: "Checkbox; standardmäßig aktiv", example: "aktiviert", help: "Nur aktivieren, wenn Endpunkt und Secret produktionsbereit sind.", effect: "Aktive Verbindungen dürfen sofort Nachrichten erhalten.", errors: "Eine aktive Fehlkonfiguration erzeugt fehlgeschlagene Outbox-Zustellungen."}
        actions:
          save: {label: "ERP-Verbindung anlegen", description: "Validiert Bezeichnung, HTTPS-Endpunkt und Secret-Referenz.", result: "Die Detailansicht der neuen Verbindung wird geöffnet."}
          cancel: {label: "Abbrechen", description: "Kehrt zur Übersicht zurück.", result: "Es wird keine Verbindung angelegt."}
        image: {src: "/assets/images/handbook/integration/erp-connection-create.svg", alt: "Formular für ERP-Endpunkt und Secret-Referenz"}
      erp_connection_detail:
        template: integration/erp/show.html.twig
        title: ERP-Verbindung überwachen
        purpose: Die Detailansicht zeigt Basis- und Statusendpunkt, Credential-Referenz, Betriebsstatus und Auditdaten.
        navigation: Integration → ERP-Verbindungen → Öffnen
        permissions: ["integration.erp_connection.read; integration.erp_connection.write für Aktivieren oder Pausieren."]
        overview:
        - Angezeigt werden Ersteller, Erstellzeit und die letzte Statusänderung mit Benutzer. Zustellfehler sind über die verlinkte Integrations-Outbox nachvollziehbar.
        actions:
          toggle: {label: "Verbindung aktivieren oder pausieren", description: "Ändert nach CSRF-Prüfung den Betriebsstatus.", result: "Pausiert verhindert neue Nutzung; Aktivieren gibt sie wieder frei. Die Änderung wird auditiert."}
          outbox: {label: "Integrations-Outbox", description: "Öffnet ausgehende Statusmeldungen und Fehler.", result: "Die Verbindung selbst bleibt unverändert."}
        image: {src: "/assets/images/handbook/integration/erp-connection-detail.svg", alt: "ERP-Verbindungsdetail mit Statusendpunkt und Auditdaten"}
      carrier_connections:
        template: integration/carrier/index.html.twig
        title: Carrier-Verbindungen
        purpose: Die Übersicht verwaltet Anbindungen für Versandprodukte, Labels, Tracking und Manifestübergaben.
        navigation: Integration → Carrier-Verbindungen
        permissions: ["integration.carrier_connection.read; integration.carrier_connection.write für die Anlage."]
        overview:
        - Carrier-Code, Name, Endpunkt, Aktivstatus und Änderung werden tabellarisch angezeigt. Die Liste besitzt aktuell keine Suche oder Pagination.
        - Ohne Einträge ist noch kein Versanddienstleister angebunden. Öffnen führt zur Detailansicht.
        actions:
          create: {label: "Carrier-Verbindung anlegen", description: "Öffnet das separate Konfigurationsformular.", result: "Noch keine externe Kommunikation."}
          open: {label: "Öffnen", description: "Zeigt Verbindung, Audit, Statussteuerung und Produktabruf.", result: "Das Öffnen verändert keine Daten."}
        image: {src: "/assets/images/handbook/integration/carrier-connections.svg", alt: "Carrier-Verbindungen mit Code, Endpunkt und Status"}
      carrier_connection_create:
        template: integration/carrier/new.html.twig
        title: Carrier-Verbindung anlegen
        purpose: Das Formular registriert den HTTPS-Zugang eines Versanddienstleisters ohne Geheimnisse in der Datenbank zu speichern.
        navigation: Integration → Carrier-Verbindungen → Carrier-Verbindung anlegen
        permissions: ["integration.carrier_connection.write"]
        overview: ["Carrier-Code und Credential-Referenz müssen mit Gateway-Konfiguration und Laufzeitumgebung übereinstimmen."]
        fields:
          name: {label: "Name", required: true, format: "Bis 100 Zeichen", example: "DHL Produktion", help: "Carrier und Umgebung eindeutig benennen.", effect: "Wird in Auswahl und Audit angezeigt.", errors: "Ein leerer Name verhindert die Anlage."}
          carrier_code: {label: "Carrier-Code", required: true, format: "2–40 Zeichen; A–Z, 0–9, Unterstrich oder Bindestrich", example: "DHL", help: "Exakt den im Carrier-Gateway unterstützten Code verwenden.", effect: "Wählt den technischen Carrier-Adapter.", errors: "Unbekannte oder falsch geschriebene Codes verhindern Produkt- und Labelaufrufe."}
          endpoint_url: {label: "HTTPS-Basis-URL", required: true, format: "HTTPS-URL, maximal 500 Zeichen", example: "https://carrier.example.com/api", help: "Produktive beziehungsweise Test-URL bewusst unterscheiden.", effect: "Ziel für Carrier-Aufrufe.", errors: "HTTP, Zertifikats-, DNS- oder Timeoutfehler werden abgewiesen beziehungsweise protokolliert."}
          credential_env: {label: "Credential-Umgebungsvariable", required: true, format: "3–101 Zeichen; A–Z, 0–9 und Unterstrich", example: "DHL_API_TOKEN", help: "Nur den Namen der Secret-Variable speichern.", effect: "Der Adapter liest Zugangsdaten zur Laufzeit.", errors: "Klartext-Secrets, ungültige Namen oder fehlende Laufzeitwerte sind unzulässig."}
          active: {label: "Sofort aktivieren", required: false, format: "Checkbox; standardmäßig aktiv", example: "aktiviert", help: "Erst nach erfolgreicher Bereitstellung von URL und Credential aktivieren.", effect: "Erlaubt Versand- und Produktaufrufe.", errors: "Fehlkonfigurationen schlagen erst beim externen Aufruf fehl."}
        actions:
          save: {label: "Carrier-Verbindung anlegen", description: "Validiert alle Verbindungsangaben und registriert den Adapter.", result: "Die neue Detailansicht wird geöffnet."}
          cancel: {label: "Abbrechen", description: "Verwirft die Eingaben.", result: "Keine Verbindung wird angelegt."}
        image: {src: "/assets/images/handbook/integration/carrier-connection-create.svg", alt: "Carrier-Konfiguration mit Code, HTTPS-Endpunkt und Credential"}
      carrier_connection_detail:
        template: integration/carrier/show.html.twig
        title: Carrier-Verbindung überwachen
        purpose: Die Detailansicht zeigt Konfiguration, Status und Audit und bietet den Live-Abruf von Versandprodukten.
        navigation: Integration → Carrier-Verbindungen → Öffnen
        permissions: ["integration.carrier_connection.read; integration.carrier_connection.write für Statusänderung; integration.carrier.read für Produkte."]
        overview: ["Produktabruf ist ausschließlich bei aktiver Verbindung sichtbar. Credential-Inhalt wird nie angezeigt."]
        actions:
          products: {label: "Versandprodukte abrufen", description: "Fragt die aktuelle Produktliste live beim konfigurierten Carrier ab.", result: "Die Produktansicht zeigt die Antwort; ein Fehler verändert die Verbindung nicht."}
          toggle: {label: "Aktivieren oder pausieren", description: "Schaltet die operative Verwendung kontrolliert um.", result: "Status, Benutzer und Zeitpunkt werden gespeichert."}
        image: {src: "/assets/images/handbook/integration/carrier-connection-detail.svg", alt: "Carrier-Detail mit Status, Credential-Referenz und Produktabruf"}
      carrier_products:
        template: integration/carrier/products.html.twig
        title: Carrier-Versandprodukte
        purpose: Die Ansicht zeigt live vom aktiven Carrier gelieferte Produktcodes und Bezeichnungen.
        navigation: Integration → Carrier-Verbindungen → Öffnen → Versandprodukte abrufen
        permissions: ["integration.carrier.read; die Carrier-Verbindung muss aktiv sein."]
        overview:
        - Produktcodes werden für Versandservice und Labelerzeugung verwendet. Die Tabelle ist eine Live-Antwort und besitzt keine lokale Bearbeitung, Suche oder Pagination.
        - Eine leere Liste kann bedeuten, dass der Carrier keine Produkte liefert; Netzwerk-, Authentifizierungs- und Gatewayfehler werden als Abruffehler behandelt.
        image: {src: "/assets/images/handbook/integration/carrier-products.svg", alt: "Live-Liste der Carrier-Versandprodukte"}
      data_exchange_overview:
        template: integration/exchange/index.html.twig
        title: Datenaustausch
        purpose: Die Leitübersicht bündelt Import- und Exportjobs, Feldmappings, Commerce-Verbindungen und importierte Kanalaufträge.
        navigation: Integration → Datenaustausch
        permissions: ["integration.exchange.read; integration.exchange.write für Import, Export, Mapping und Commerce-Verbindung."]
        overview:
        - Jobs zeigen Richtung, Format, Ressource, Zeilenzahl, Status und Zeitpunkt; Mappings zeigen System, Nachricht und Feldzuordnung; Commerce-Kanäle zeigen Typ und Status; Aufträge zeigen externe ID, Verbindung, Status und Importzeit.
        - Jede Teiltabelle besitzt einen eigenen leeren Zustand, derzeit aber keine Suche, Sortierung oder Pagination.
        actions:
          mapping: {label: "Mapping anlegen", description: "Definiert eine Feldtransformation für System und Nachrichtentyp.", result: "Das Mapping erscheint nach dem Speichern in der Übersicht."}
          commerce: {label: "Commerce-Verbindung anlegen", description: "Registriert einen Shop- oder Marktplatzkanal.", result: "Der Kanal erscheint in der Verbindungsliste."}
          export: {label: "Export", description: "Öffnet Format-, Ressourcen- und Datenauswahl.", result: "Noch keine Datei wird erzeugt."}
          import: {label: "Import", description: "Öffnet den Dateiimport.", result: "Noch keine Daten werden verarbeitet."}
        image: {src: "/assets/images/handbook/integration/data-exchange-overview.svg", alt: "Datenaustausch mit Jobs, Mappings, Kanälen und Aufträgen"}
      data_exchange_import:
        template: integration/exchange/import.html.twig
        title: Daten importieren
        purpose: Das Formular importiert strukturierte Fachobjekte oder verarbeitet SAP-IDocs kontrolliert.
        navigation: Integration → Datenaustausch → Import
        permissions: ["integration.exchange.write"]
        overview: ["Quelldatei, Ressourcentyp und optionales Mapping vor dem Import in einer Testumgebung prüfen. IDoc verwendet einen eigenen Verarbeitungsweg."]
        fields:
          format: {label: "Format", required: true, format: "json, xml, csv, xlsx oder idoc", example: "csv", help: "Das tatsächliche Dateiformat auswählen; IDoc nur für SAP-Nachrichten.", effect: "Bestimmt Parser und Validierung.", errors: "Nicht unterstützte oder falsch deklarierte Inhalte schlagen fehl."}
          resource_type: {label: "Ressourcentyp", required: true, format: "Vom Importservice unterstützter Typcode", example: "product", help: "Muss Inhalt und Mapping entsprechen; bei IDoc wird das Feld technisch nicht ausgewertet.", effect: "Bestimmt das zu erzeugende Fachobjekt.", errors: "Unbekannte Typen werden abgewiesen."}
          mapping_system: {label: "Mappingsystem", required: false, format: "Kein Mapping, erp oder commerce", example: "erp", help: "Nur wählen, wenn passende Feldregeln für das Quellsystem gepflegt sind.", effect: "Transformiert Quellfelder vor fachlicher Validierung.", errors: "Fehlende oder unpassende Mappings verursachen Pflichtfeld- oder Typfehler."}
          file: {label: "Importdatei", required: true, format: "Datei im gewählten Format", example: "products-2026-10-05.csv", help: "Nur vertrauenswürdige, vollständig erzeugte Dateien hochladen und sensible Inhalte vermeiden.", effect: "Der Inhalt wird gelesen, validiert und als Importjob protokolliert.", errors: "Fehlende, unlesbare oder syntaktisch ungültige Dateien werden nicht verarbeitet."}
        actions:
          import: {label: "Importieren", description: "Liest Datei, wendet Mapping an und verarbeitet die Datensätze beziehungsweise das IDoc.", result: "Job, Zeilenzahl und Status werden in der Übersicht dokumentiert."}
        image: {src: "/assets/images/handbook/integration/data-exchange-import.svg", alt: "Importformular mit Format, Ressource, Mapping und Datei"}
      data_exchange_export:
        template: integration/exchange/export.html.twig
        title: Daten exportieren
        purpose: Das Formular erzeugt aus einer JSON-Liste eine herunterladbare JSON-, XML-, CSV- oder XLSX-Datei.
        navigation: Integration → Datenaustausch → Export
        permissions: ["integration.exchange.write"]
        overview: ["Die Eingabedaten müssen eine JSON-Liste von Objekten sein. Personenbezogene Daten und Secrets nur bei fachlicher und rechtlicher Notwendigkeit exportieren."]
        fields:
          format: {label: "Zielformat", required: true, format: "json, xml, csv oder xlsx", example: "xlsx", help: "Format passend zum Zielsystem wählen.", effect: "Bestimmt Serialisierung, MIME-Type und Dateiendung.", errors: "Nicht unterstützte Formate erzeugen keine verwertbare Datei."}
          resource_type: {label: "Ressourcentyp", required: true, format: "Fachlicher Typcode", example: "product", help: "Den Inhalt der Zeilen eindeutig benennen.", effect: "Wird im Exportjob protokolliert.", errors: "Ein leerer Typ verhindert den Export."}
          rows: {label: "Exportdaten", required: true, format: "Valides JSON-Array aus Objekten", example: "[{'sku':'A-1','name':'Artikel'}]", help: "Vollständige Liste ohne Kommentare, Secrets oder nachgestellte Kommata eingeben.", effect: "Jedes Listenelement wird eine Exportzeile.", errors: "Ungültiges JSON oder ein JSON-Objekt statt einer Liste wird abgewiesen."}
        actions:
          export: {label: "Exportieren", description: "Validiert die JSON-Liste, serialisiert sie und protokolliert den Job.", result: "Der Browser lädt webwms-export mit der gewählten Dateiendung herunter."}
        image: {src: "/assets/images/handbook/integration/data-exchange-export.svg", alt: "Exportformular mit Zielformat und JSON-Datenliste"}
      integration_mapping_create:
        template: integration/exchange/mapping-new.html.twig
        title: Integrationsmapping anlegen
        purpose: Das Formular ordnet ein Quellfeld einem Zielfeld zu und wendet genau eine definierte Transformation an.
        navigation: Integration → Datenaustausch → Mapping anlegen
        permissions: ["integration.exchange.write"]
        overview: ["Mappings gelten für die Kombination aus System- und Nachrichtentyp. Reihenfolge und Namenskonvention müssen mit dem sendenden System abgestimmt sein."]
        fields:
          system_type: {label: "Systemtyp", required: true, format: "erp, sap_idoc oder commerce", example: "erp", help: "Die Herkunft der Nachricht auswählen.", effect: "Begrenzt das Mapping auf dieses System.", errors: "Ein falscher Typ verhindert die erwartete Zuordnung."}
          message_type: {label: "Nachrichtentyp", required: true, format: "Abgestimmter stabiler Typcode", example: "product.master", help: "Exakt denselben Typ wie im Import verwenden.", effect: "Gruppiert die Regeln einer Nachricht.", errors: "Leere oder abweichende Typen greifen beim Import nicht."}
          source_field: {label: "Quellfeld", required: true, format: "Pfad oder Feldname der Quelle", example: "materialNumber", help: "Groß-/Kleinschreibung und Verschachtelung exakt übernehmen.", effect: "Liefert den zu transformierenden Wert.", errors: "Fehlende Quellfelder erzeugen keinen Zielwert."}
          target_field: {label: "Zielfeld", required: true, format: "Unterstützter WebWMS-Feldname", example: "sku", help: "Nur fachlich gültige Zielfelder verwenden.", effect: "Schreibt den transformierten Wert in das Zielobjekt.", errors: "Unbekannte Ziele schlagen in der fachlichen Validierung fehl."}
          transformation: {label: "Transformation", required: true, format: "copy, trim, uppercase, lowercase, integer oder decimal", example: "trim", help: "copy unverändert; trim entfernt Rand-Leerzeichen; upper/lower ändert Schreibweise; integer/decimal konvertiert Zahlen.", effect: "Verändert beziehungsweise typisiert den Quellwert.", errors: "Nicht konvertierbare Zahlen oder ungeeignete Transformationen verursachen Importfehler."}
        actions:
          save: {label: "Mapping speichern", description: "Speichert System, Nachricht, Feldpaar und Transformation.", result: "Die Regel erscheint in der Mappingübersicht und gilt für folgende Importe."}
        image: {src: "/assets/images/handbook/integration/mapping-create.svg", alt: "Mappingformular für System, Nachricht, Quell- und Zielfeld"}
      commerce_connection_create:
        template: integration/exchange/commerce-new.html.twig
        title: Commerce-Verbindung anlegen
        purpose: Das Formular registriert Shopware, Amazon, eBay oder einen generischen Commerce-Kanal für Auftragsimporte.
        navigation: Integration → Datenaustausch → Commerce-Verbindung
        permissions: ["integration.exchange.write"]
        overview: ["Das Secret verbleibt in der Laufzeitumgebung. Vor Aktivierung Endpunkt, Berechtigungen und externe Dublettenerkennung prüfen."]
        fields:
          name: {label: "Name", required: true, format: "Verständliche Kanalbezeichnung", example: "Shopware DE Produktion", help: "Plattform, Land und Umgebung unterscheiden.", effect: "Identifiziert die Verbindung und importierte Aufträge.", errors: "Ein leerer Name verhindert die Anlage."}
          channel_type: {label: "Kanaltyp", required: true, format: "shopware, amazon, ebay oder generic", example: "shopware", help: "Den zum externen API-Vertrag passenden Adapter wählen.", effect: "Bestimmt Kanalverhalten und Interpretation der Daten.", errors: "Ein falscher Adapter kann Daten nicht korrekt verarbeiten."}
          endpoint_url: {label: "HTTPS-Basis-URL", required: true, format: "Vollständige HTTPS-URL", example: "https://shop.example.com/api", help: "Produktive und Testsysteme klar trennen; keine Tokens in die URL schreiben.", effect: "Ziel für Commerce-Kommunikation.", errors: "HTTP oder ungültige URLs werden abgewiesen; Netzwerkfehler verhindern Importe."}
          credential_env: {label: "Credential-Umgebungsvariable", required: true, format: "3–101 Zeichen; A–Z, 0–9 und Unterstrich", example: "SHOPWARE_DE_API_TOKEN", help: "Nur die Referenz auf ein sicher bereitgestelltes Secret eintragen.", effect: "Authentifiziert Auftrags- und Statuskommunikation.", errors: "Fehlende Laufzeitvariable führt zu Authentifizierungsfehlern."}
          active: {label: "Sofort aktivieren", required: false, format: "Checkbox; standardmäßig aktiv", example: "deaktiviert bis zum Verbindungstest", help: "Erst nach erfolgreicher technischer und fachlicher Prüfung aktivieren.", effect: "Steuert, ob der Kanal operativ verwendet werden darf.", errors: "Aktive Fehlkonfigurationen erzeugen fehlerhafte Abrufe oder Zustellungen."}
        actions:
          save: {label: "Speichern", description: "Validiert Kanal, Endpunkt und Credential-Referenz und legt die Verbindung an.", result: "Der Kanal erscheint in der Datenaustauschübersicht."}
        image: {src: "/assets/images/handbook/integration/commerce-connection-create.svg", alt: "Commerce-Verbindungsformular mit Kanal, Endpunkt und Credential"}
      device_overview:
        template: integration/device/index.html.twig
        title: Scanner und mobile Terminals
        purpose: Die Übersicht verwaltet Erfassungsgeräte und zeigt die letzten 50 prozessbezogenen Scanereignisse.
        navigation: Integration → Scanner und mobile Terminals
        permissions: ["integration.device.read; integration.device.write für Geräte; integration.device.scan für Erfassungen."]
        overview:
        - Geräte zeigen Code, Name, Typ und Aktivstatus. Scanereignisse zeigen Gerät, Prozess, Referenz, Scantyp, Wert, accepted/rejected und Zeitpunkt.
        - Beide Tabellen besitzen leere Zustände, derzeit aber keine Suche oder Pagination. Öffnen führt zu Geräte- beziehungsweise Ereignisdetails.
        actions:
          create: {label: "Gerät anlegen", description: "Öffnet die Stammdaten eines Scanners oder Terminals.", result: "Noch kein Gerät wird registriert."}
          scan: {label: "Scan erfassen", description: "Öffnet den generischen Test- und Erfassungsdialog.", result: "Ein Ereignis entsteht erst nach dem Speichern."}
          open: {label: "Öffnen", description: "Öffnet Gerät oder Scanereignis.", result: "Keine Datenänderung."}
        image: {src: "/assets/images/handbook/integration/device-overview.svg", alt: "Geräteübersicht mit Scannern und Scanereignissen"}
      device_create:
        template: integration/device/new.html.twig
        title: Erfassungsgerät anlegen
        purpose: Das Formular registriert Barcode-Scanner, MDE oder mobilen Browser im aktiven Mandanten.
        navigation: Integration → Scanner und mobile Terminals → Gerät anlegen
        permissions: ["integration.device.write"]
        overview: ["Code und Typ dauerhaft stabil halten, da Scanereignisse das Gerät darüber fachlich identifizieren."]
        fields:
          code: {label: "Gerätecode", required: true, format: "2–40 Zeichen; A–Z, 0–9, Unterstrich oder Bindestrich", example: "MDE_01", help: "Scanbaren, standortbezogenen und eindeutigen Code verwenden.", effect: "Identifiziert das Gerät in Ereignissen und Auswahllisten.", errors: "Leere, doppelte oder formal ungültige Codes werden abgewiesen."}
          name: {label: "Name", required: true, format: "Bis 100 Zeichen", example: "MDE Warenausgang 1", help: "Einsatzort und Funktion benennen.", effect: "Erleichtert die Auswahl durch Bediener.", errors: "Ein leerer Name verhindert die Anlage."}
          device_type: {label: "Gerätetyp", required: true, format: "barcode_scanner, mde oder mobile_browser", example: "mde", help: "Barcode-Scanner für reine Erfassung, MDE für Prozessdialoge, Browser für mobile Weboberfläche wählen.", effect: "Klassifiziert das Gerät für Betrieb und Auswertung.", errors: "Nicht unterstützte Typen werden abgewiesen."}
          active: {label: "Sofort aktivieren", required: false, format: "Checkbox; standardmäßig aktiv", example: "aktiviert", help: "Nur betriebsbereite Geräte aktivieren.", effect: "Nur aktive Geräte stehen im Scandialog zur Auswahl.", errors: "Pausierte Geräte können keine neuen Scans erfassen."}
        actions:
          save: {label: "Gerät anlegen", description: "Validiert Stammdaten und registriert das Gerät.", result: "Die Gerätedetailansicht wird geöffnet."}
          cancel: {label: "Abbrechen", description: "Verwirft die Eingabe.", result: "Kein Gerät wird angelegt."}
        image: {src: "/assets/images/handbook/integration/device-create.svg", alt: "Formular zum Anlegen eines Erfassungsgeräts"}
      device_detail:
        template: integration/device/show.html.twig
        title: Erfassungsgerät und Scanverlauf
        purpose: Die Detailansicht zeigt Typ, Status, Auditdaten und sämtliche Ereignisse des ausgewählten Geräts.
        navigation: Integration → Scanner und mobile Terminals → Gerät öffnen
        permissions: ["integration.device.read; integration.device.write für Statusänderungen."]
        overview: ["Der Verlauf zeigt Prozess, Kontextreferenz, Scantyp, Wert, Status und Zeitpunkt; einzelne Ereignisse sind separat aufrufbar."]
        actions:
          toggle: {label: "Gerät aktivieren oder pausieren", description: "Schaltet die Auswahl für neue Scans um.", result: "Die Statusänderung wird mit Benutzer und Zeitpunkt auditiert; bestehende Ereignisse bleiben erhalten."}
          open_scan: {label: "Scan öffnen", description: "Zeigt den vollständigen Ereignisnachweis.", result: "Keine Datenänderung."}
        image: {src: "/assets/images/handbook/integration/device-detail.svg", alt: "Gerätedetail mit Status und Scanverlauf"}
      scan_capture:
        template: integration/device/scan.html.twig
        title: Scan erfassen
        purpose: Der generische Dialog prüft Geräte- und Prozessintegration mit einer idempotenten Anforderungs-ID.
        navigation: Integration → Scanner und mobile Terminals → Scan erfassen
        permissions: ["integration.device.scan; mindestens ein aktives Erfassungsgerät."]
        overview: ["accepted dokumentiert die fachliche Annahme, rejected einen kontrollierten Negativfall. Die Request-ID verhindert doppelte Verarbeitung derselben Anforderung."]
        fields:
          request_id: {label: "Request-ID", required: true, format: "Automatisch erzeugte UUID", example: "0199a1c0-7ab1-7f20-8f20-123456789abc", help: "Versteckten Wert nicht verändern oder wiederverwenden.", effect: "Macht die Erfassung idempotent.", errors: "Eine bereits verarbeitete ID erzeugt kein doppeltes Ereignis."}
          device_id: {label: "Gerät", required: true, format: "Auswahl eines aktiven Geräts", example: "MDE_01", help: "Das tatsächlich verwendete Terminal wählen.", effect: "Ordnet Scan und Audit dem Gerät zu.", errors: "Unbekannte oder pausierte Geräte werden abgewiesen."}
          process_type: {label: "Prozess", required: true, format: "inbound, picking, packing, shipping, loading oder inventory", example: "picking", help: "Den Prozess wählen, in dem der Scan fachlich geprüft wird.", effect: "Bestimmt Bedeutung und Auswertung der Referenz.", errors: "Ein falscher Prozess erzeugt einen unbrauchbaren Kontext."}
          scan_type: {label: "Scantyp", required: true, format: "location, product, batch, serial, shipment oder order", example: "location", help: "Typ passend zum gescannten Barcode wählen.", effect: "Beschreibt, was scan_value repräsentiert.", errors: "Unpassender Typ führt zur Ablehnung in der Prozessprüfung."}
          context_reference: {label: "Prozessreferenz", required: true, format: "Bis 100 Zeichen", example: "PICK-2026-0042", help: "Auftrag, Pick, Inventur oder Sendung eindeutig referenzieren.", effect: "Verknüpft das Ereignis mit dem Fachvorgang.", errors: "Leere oder unbekannte Referenzen verhindern sinnvolle Zuordnung."}
          scan_value: {label: "Scanwert", required: true, format: "Bis 255 Zeichen", example: "BIN-A-01-02", help: "Wert exakt vom Barcode übernehmen, nicht manuell normalisieren.", effect: "Ist der fachlich geprüfte Identifikator.", errors: "Leere oder nicht passende Werte werden als Fehler erfasst."}
          accepted: {label: "Scan akzeptiert", required: false, format: "Checkbox; standardmäßig aktiv", example: "aktiviert", help: "Nur aktiv lassen, wenn die Prozessprüfung erfolgreich war.", effect: "Setzt den Ereignisstatus accepted, sonst rejected.", errors: "Eine falsche Annahme verfälscht Prozessnachweise."}
          message: {label: "Prüfhinweis", required: false, format: "Bis 500 Zeichen", example: "Lagerplatz gehört nicht zur Pickroute", help: "Bei Ablehnung Ursache und erwartete Korrektur dokumentieren.", effect: "Wird im Ereignisdetail angezeigt.", errors: "Ohne Hinweis ist ein abgelehnter Scan schwer nachvollziehbar."}
        actions:
          save: {label: "Scan erfassen", description: "Speichert das Ereignis idempotent mit Gerät, Prozess und Ergebnis.", result: "Das Scanereignisdetail wird geöffnet."}
          cancel: {label: "Abbrechen", description: "Kehrt zur Übersicht zurück.", result: "Kein Ereignis wird gespeichert."}
        image: {src: "/assets/images/handbook/integration/scan-capture.svg", alt: "Scandialog mit Gerät, Prozess, Typ und Ergebnis"}
      scan_detail:
        template: integration/device/scan-show.html.twig
        title: Scanereignis
        purpose: Die Ansicht liefert den unveränderlichen Nachweis eines akzeptierten oder abgelehnten Scans.
        navigation: Integration → Scanner und mobile Terminals → Scan öffnen
        permissions: ["integration.device.read"]
        overview: ["Angezeigt werden Gerät, Prozess und Kontext, Typ, Wert, Request-ID, erfassender Benutzer, Zeitpunkt und optionaler Prüfhinweis."]
        image: {src: "/assets/images/handbook/integration/scan-detail.svg", alt: "Scanereignis mit Request-ID und Prüfstatus"}
      measurement_overview:
        template: integration/measurement/index.html.twig
        title: Waagen und Volumenmessung
        purpose: Die Übersicht verwaltet Messgeräte und zeigt die letzten 50 Gewichts- und Dimensionsmessungen.
        navigation: Integration → Waagen und Volumenmessung
        permissions: ["integration.measurement.read; integration.measurement.write für Geräte; integration.measurement.capture für Messungen."]
        overview:
        - Geräte zeigen Code, Name, Typ und Status. Messungen zeigen Ziel, Gramm, Abmessungen in Millimetern, accepted/rejected und Zeitpunkt.
        - Status kann direkt je Gerät umgeschaltet werden. Tabellen besitzen leere Zustände, derzeit aber keine Suche oder Pagination.
        actions:
          create: {label: "Messgerät hinzufügen", description: "Öffnet die Geräteanlage.", result: "Noch kein Gerät wird registriert."}
          capture: {label: "Messung erfassen", description: "Öffnet die Zuordnung zu Packstück oder Artikel.", result: "Noch keine Werte werden übernommen."}
          toggle: {label: "Aktivieren oder pausieren", description: "Steuert die Verfügbarkeit im Messdialog.", result: "Bestehende Messungen bleiben unverändert."}
          open: {label: "Messung öffnen", description: "Zeigt den vollständigen Messnachweis.", result: "Keine Datenänderung."}
        image: {src: "/assets/images/handbook/integration/measurement-overview.svg", alt: "Messgeräte und letzte Gewichts- und Volumenmessungen"}
      measurement_device_create:
        template: integration/measurement/device-new.html.twig
        title: Messgerät hinzufügen
        purpose: Das Formular registriert Waage, Volumenmessgerät oder Kombigerät.
        navigation: Integration → Waagen und Volumenmessung → Messgerät hinzufügen
        permissions: ["integration.measurement.write"]
        overview: ["Gerätetyp passend zu den tatsächlich gelieferten Messwerten wählen."]
        fields:
          code: {label: "Gerätecode", required: true, format: "2–40 Zeichen; A–Z, 0–9, Unterstrich oder Bindestrich", example: "SCALE_01", help: "Eindeutigen Code nach Arbeitsplatz oder Station verwenden.", effect: "Identifiziert das Gerät in Messungen.", errors: "Doppelte oder ungültige Codes werden abgewiesen."}
          name: {label: "Name", required: true, format: "Bis 100 Zeichen", example: "Packplatzwaage 1", help: "Einsatzort und Gerätefunktion benennen.", effect: "Erscheint in der Messgeräteauswahl.", errors: "Ein leerer Name verhindert die Anlage."}
          device_type: {label: "Gerätetyp", required: true, format: "scale, dimensioner oder combined", example: "combined", help: "scale liefert Gewicht, dimensioner Maße, combined beides.", effect: "Dokumentiert erwartete Messgrößen.", errors: "Unpassender Typ führt zu unvollständigen Messungen."}
          active: {label: "Sofort aktivieren", required: false, format: "Checkbox; standardmäßig aktiv", example: "aktiviert", help: "Nur kalibrierte und betriebsbereite Geräte aktivieren.", effect: "Nur aktive Geräte sind für neue Messungen auswählbar.", errors: "Pausierte Geräte können nicht verwendet werden."}
        actions:
          save: {label: "Messgerät hinzufügen", description: "Validiert Code, Name, Typ und Status.", result: "Das Gerät erscheint in der Übersicht."}
          cancel: {label: "Abbrechen", description: "Verwirft die Eingaben.", result: "Kein Gerät wird angelegt."}
        image: {src: "/assets/images/handbook/integration/measurement-device-create.svg", alt: "Formular zum Hinzufügen einer Waage oder Volumenmessung"}
      measurement_capture:
        template: integration/measurement/capture.html.twig
        title: Messung erfassen
        purpose: Der Dialog übernimmt Gewicht und Abmessungen idempotent auf ein Packstück oder einen Artikel.
        navigation: Integration → Waagen und Volumenmessung → Messung erfassen
        permissions: ["integration.measurement.capture; mindestens ein aktives Messgerät."]
        overview: ["Mindestens eine Messgröße erfassen. Bei accepted werden Werte direkt auf das gewählte Ziel angewendet; rejected dokumentiert die Prüfung ohne fachliche Übernahme."]
        fields:
          request_id: {label: "Request-ID", required: true, format: "Automatisch erzeugte UUID", example: "0199a1c0-7ab1-7f20-8f20-123456789abc", help: "Nicht verändern oder erneut für eine andere Messung verwenden.", effect: "Verhindert doppelte Verarbeitung.", errors: "Wiederholte IDs werden idempotent behandelt."}
          device_id: {label: "Messgerät", required: true, format: "Auswahl eines aktiven Geräts", example: "SCALE_01", help: "Das tatsächlich liefernde Gerät wählen.", effect: "Ordnet Messung und Audit dem Gerät zu.", errors: "Unbekannte oder pausierte Geräte werden abgewiesen."}
          target_type: {label: "Zieltyp", required: true, format: "package oder product", example: "package", help: "Packstück für Versandmaße, Artikel für Stammdatenmessung wählen.", effect: "Bestimmt, welches Fachobjekt aktualisiert wird.", errors: "Typ und Ziel-ID müssen zusammenpassen."}
          target_id: {label: "Ziel-ID", required: true, format: "UUID eines Packstücks oder Artikels", example: "018f2f5a-73ad-7c42-9d84-2dcb65bcb410", help: "Vorschlag aus der Liste auswählen und Zielbezeichnung prüfen.", effect: "Verknüpft beziehungsweise aktualisiert genau dieses Objekt.", errors: "Unbekannte oder mandantenfremde Ziele werden abgewiesen."}
          weight_grams: {label: "Gewicht", required: false, format: "Positive Ganzzahl in Gramm", example: "1250", help: "Bruttogewicht ohne Dezimaltrennzeichen erfassen.", effect: "Aktualisiert bei Annahme das Zielgewicht.", errors: "Null, negative oder nicht ganzzahlige Werte sind ungültig."}
          length_mm: {label: "Länge", required: false, format: "Positive Ganzzahl in Millimetern", example: "400", help: "Längste Seite konsistent messen.", effect: "Bildet mit Breite und Höhe das Volumenmaß.", errors: "Teilweise oder nicht positive Maße sind fachlich unvollständig."}
          width_mm: {label: "Breite", required: false, format: "Positive Ganzzahl in Millimetern", example: "300", help: "Zur Länge rechtwinklige Seite messen.", effect: "Aktualisiert die Zielbreite.", errors: "Null, negative oder nicht ganzzahlige Werte sind ungültig."}
          height_mm: {label: "Höhe", required: false, format: "Positive Ganzzahl in Millimetern", example: "250", help: "Senkrechte Ausdehnung einschließlich Verpackung messen.", effect: "Aktualisiert die Zielhöhe.", errors: "Null, negative oder nicht ganzzahlige Werte sind ungültig."}
          accepted: {label: "Messung akzeptiert", required: false, format: "Checkbox; standardmäßig aktiv", example: "aktiviert", help: "Nur bei plausiblen und freigegebenen Werten aktiv lassen.", effect: "Übernimmt Werte auf das Ziel; sonst Status rejected.", errors: "Falsch akzeptierte Werte beeinflussen Versand und Stammdaten."}
          message: {label: "Prüfhinweis", required: false, format: "Bis 500 Zeichen", example: "Waage nicht tariert, Messung verworfen", help: "Ablehnung oder Besonderheit nachvollziehbar begründen.", effect: "Wird im Messdetail gespeichert.", errors: "Fehlender Hinweis erschwert die Fehleranalyse."}
        actions:
          save: {label: "Messung erfassen", description: "Validiert Gerät, Ziel, positive Messwerte und Request-ID.", result: "Bei Annahme wird das Ziel aktualisiert und das Messdetail geöffnet."}
          cancel: {label: "Abbrechen", description: "Verwirft die Eingaben.", result: "Keine Messung oder Zieländerung."}
        image: {src: "/assets/images/handbook/integration/measurement-capture.svg", alt: "Messdialog für Gewicht und Abmessungen"}
      measurement_detail:
        template: integration/measurement/show.html.twig
        title: Messungsdetail
        purpose: Die Ansicht zeigt den unveränderlichen Messnachweis mit Ziel, Gramm, Abmessungen, Status und Request-ID.
        navigation: Integration → Waagen und Volumenmessung → Messung öffnen
        permissions: ["integration.measurement.read"]
        overview: ["Nicht erfasste Messgrößen erscheinen als Gedankenstrich. Der Prüfhinweis erklärt abgelehnte oder auffällige Messungen."]
        image: {src: "/assets/images/handbook/integration/measurement-detail.svg", alt: "Messungsdetail mit Gewicht, Abmessungen und Request-ID"}
      printing_overview:
        template: integration/printing/index.html.twig
        title: Druckwarteschlange
        purpose: Die Übersicht verwaltet Drucker und überwacht Label- und Dokumentaufträge.
        navigation: Integration → Druckwarteschlange
        permissions: ["integration.print_job.read; integration.printer.read/write für Drucker; integration.print_job.write für Aufträge."]
        overview:
        - Drucker zeigen Name, HTTPS-Endpunkt und Status. Jobs zeigen Dokumenttyp und Referenz, Drucker, ZPL/PDF, Kopien, Status, Versuche und Zeitpunkt.
        - Leere Zustände sind getrennt; Suche und Pagination sind derzeit nicht vorhanden. Drucker und Jobs besitzen eigene Details.
        actions:
          create_printer: {label: "Drucker anlegen", description: "Öffnet Endpunkt und Credential-Konfiguration.", result: "Noch kein Drucker wird registriert."}
          create_job: {label: "Druckauftrag anlegen", description: "Öffnet Dokument- und Druckerauswahl.", result: "Noch kein Auftrag wird eingereiht."}
          open: {label: "Öffnen", description: "Zeigt Drucker- oder Auftragsdetails.", result: "Keine Datenänderung."}
        image: {src: "/assets/images/handbook/integration/printing-overview.svg", alt: "Druckwarteschlange mit Druckern und Aufträgen"}
      printer_create:
        template: integration/printing/printer-new.html.twig
        title: Drucker anlegen
        purpose: Das Formular registriert einen HTTPS-Druckendpunkt und speichert nur die Referenz auf dessen Zugriffstoken.
        navigation: Integration → Druckwarteschlange → Drucker anlegen
        permissions: ["integration.printer.write"]
        overview: ["Das Zugriffstoken verbleibt in der Laufzeitumgebung und darf nicht in Name oder URL stehen."]
        fields:
          name: {label: "Name", required: true, format: "Bis 100 Zeichen", example: "Packplatz 1 ZPL", help: "Standort, Arbeitsplatz und Format kenntlich machen.", effect: "Erscheint in Druckerauswahl und Jobs.", errors: "Ein leerer Name verhindert die Anlage."}
          credential_env: {label: "Credential-Umgebungsvariable", required: true, format: "3–101 Zeichen; A–Z, 0–9 und Unterstrich", example: "PRINTER_PACK_1_TOKEN", help: "Nur den Namen der sicher bereitgestellten Secret-Variable eintragen.", effect: "Authentifiziert Aufrufe am Druckdienst.", errors: "Fehlende Variable führt zu Authentifizierungsfehlern."}
          endpoint_url: {label: "HTTPS-Endpunkt", required: true, format: "HTTPS-URL, maximal 500 Zeichen", example: "https://print.example.com/printers/pack-1", help: "Konkreten Drucker- oder Queue-Endpunkt verwenden.", effect: "Dorthin werden Druckdaten übertragen.", errors: "HTTP, Zertifikats-, DNS- oder Timeoutfehler verhindern den Druck."}
          active: {label: "Sofort aktivieren", required: false, format: "Checkbox; standardmäßig aktiv", example: "aktiviert", help: "Nur erreichbare und getestete Drucker aktivieren.", effect: "Nur aktive Drucker sind für neue Jobs auswählbar.", errors: "Pausierte Drucker nehmen keine neuen Aufträge an."}
        actions:
          save: {label: "Drucker anlegen", description: "Validiert Name, HTTPS-Endpunkt und Credential-Referenz.", result: "Das Druckerdetail wird geöffnet."}
          cancel: {label: "Abbrechen", description: "Verwirft die Eingabe.", result: "Kein Drucker wird angelegt."}
        image: {src: "/assets/images/handbook/integration/printer-create.svg", alt: "Druckerformular mit HTTPS-Endpunkt und Credential-Referenz"}
      printer_detail:
        template: integration/printing/printer-show.html.twig
        title: Drucker und Auftragsverlauf
        purpose: Die Detailansicht zeigt Endpunkt, Credential-Referenz, Audit, Status und zugehörige Druckaufträge.
        navigation: Integration → Druckwarteschlange → Drucker öffnen
        permissions: ["integration.printer.read; integration.printer.write für Statusänderung."]
        overview: ["Das Secret selbst wird nie angezeigt. Der Auftragsverlauf zeigt Referenz, Status und Versuchszahl und führt zum Jobdetail."]
        actions:
          toggle: {label: "Drucker aktivieren oder pausieren", description: "Steuert die Auswahl für neue Druckaufträge.", result: "Statusänderung wird auditiert; bestehende Jobs bleiben erhalten."}
          open_job: {label: "Druckauftrag öffnen", description: "Zeigt Status, Fehler und Ausführungsmöglichkeit.", result: "Keine unmittelbare Wiederholung."}
        image: {src: "/assets/images/handbook/integration/printer-detail.svg", alt: "Druckerdetail mit Verbindung und Auftragsverlauf"}
      print_job_create:
        template: integration/printing/job-new.html.twig
        title: Druckauftrag anlegen
        purpose: Das Formular reiht ein Label, Dokument oder Lademanifest idempotent auf einem aktiven Drucker ein.
        navigation: Integration → Druckwarteschlange → Druckauftrag anlegen
        permissions: ["integration.print_job.write; mindestens ein aktiver Drucker."]
        overview: ["ZPL für kompatible Etikettendrucker, PDF für Dokumentdruck wählen. Die Request-ID verhindert doppeltes Einreihen."]
        fields:
          request_id: {label: "Request-ID", required: true, format: "Automatisch erzeugte UUID", example: "0199a1c0-7ab1-7f20-8f20-123456789abc", help: "Versteckte ID nicht verändern oder für ein anderes Dokument wiederverwenden.", effect: "Macht die Auftragserstellung idempotent.", errors: "Wiederholte IDs erzeugen keinen zweiten Auftrag."}
          printer_id: {label: "Drucker", required: true, format: "Auswahl eines aktiven Druckers", example: "Packplatz 1 ZPL", help: "Drucker passend zu Arbeitsplatz und Format wählen.", effect: "Bestimmt den Zielendpunkt.", errors: "Unbekannte oder pausierte Drucker werden abgewiesen."}
          document_type: {label: "Dokumenttyp", required: true, format: "carrier_label, document oder loading_manifest", example: "carrier_label", help: "Carrier-Label für Versandetikett, document für allgemeine Belege, loading_manifest für Ladeliste.", effect: "Klassifiziert Inhalt und Nachweis.", errors: "Falscher Typ kann die Referenz nicht korrekt auflösen."}
          format: {label: "Format", required: true, format: "ZPL oder PDF", example: "ZPL", help: "Format muss vom Zieldrucker unterstützt werden.", effect: "Bestimmt die an den Druckdienst gesendeten Daten.", errors: "Inkompatibles Format führt zu einem fehlgeschlagenen Job."}
          document_reference: {label: "Dokumentreferenz", required: true, format: "Bis 500 Zeichen; eindeutige Fachreferenz", example: "SHIP-2026-0042/LABEL", help: "Vorhandenes Label oder Dokument exakt referenzieren, keine Geheimnisse eintragen.", effect: "Der Druckdienst löst darüber den Inhalt auf.", errors: "Leere oder unbekannte Referenzen können nicht gedruckt werden."}
          copies: {label: "Kopien", required: true, format: "Ganzzahl 1 bis 99; Standard 1", example: "2", help: "Nur betrieblich benötigte Anzahl wählen, um Dubletten zu vermeiden.", effect: "Bestimmt die Ausgabemenge.", errors: "Null, negative, nicht ganzzahlige oder mehr als 99 Kopien sind ungültig."}
        actions:
          save: {label: "Druckauftrag anlegen", description: "Validiert Drucker, Dokument, Format, Kopien und Request-ID.", result: "Der Auftrag wird als queued angelegt und im Detail geöffnet."}
          cancel: {label: "Abbrechen", description: "Verwirft die Eingaben.", result: "Kein Druckauftrag wird erzeugt."}
        image: {src: "/assets/images/handbook/integration/print-job-create.svg", alt: "Druckauftrag mit Drucker, Dokument, Format und Kopien"}
      print_job_detail:
        template: integration/printing/job-show.html.twig
        title: Druckauftrag ausführen und prüfen
        purpose: Das Detail zeigt Ziel, Dokument, Format, Kopien, Versuche, externe Referenz, Abschluss und letzten Fehler.
        navigation: Integration → Druckwarteschlange → Druckauftrag öffnen
        permissions: ["integration.print_job.read; integration.print_job.execute zum Ausführen oder Wiederholen."]
        overview: ["Nur queued oder failed können ausgeführt werden. Ein Reprint erhöht die Versuchszahl und kann physische Dubletten erzeugen; vorher Drucker und bisherigen Ausdruck prüfen."]
        actions:
          execute: {label: "Druckauftrag ausführen", description: "Überträgt einen wartenden Job an den Druckendpunkt.", result: "Erfolg speichert externe Referenz und Abschluss; Fehler speichert die Ursache und Status failed."}
          retry: {label: "Erneut drucken", description: "Wiederholt ausschließlich einen fehlgeschlagenen Job.", result: "Ein weiterer physischer Ausdruck ist möglich; Status und Versuchszahl werden aktualisiert."}
        image: {src: "/assets/images/handbook/integration/print-job-detail.svg", alt: "Druckauftrag mit Status, Versuchen und Fehleranzeige"}
      wcs_overview:
        template: integration/wcs/index.html.twig
        title: WCS, MFR und Fördertechnik
        purpose: Die Leitstelle überwacht Verbindungen, Transportbefehle und Maschinenrückmeldungen.
        navigation: Integration → WCS/MFR/Fördertechnik
        permissions: ["integration.wcs.read; integration.wcs.write für Verbindungen; integration.wcs.execute für Befehle und Status."]
        overview:
        - Verbindungen zeigen Code, Systemtyp, Endpunkt und Aktivstatus; Befehle zeigen Ladeeinheit, Route, Typ und Status; Maschinenmeldungen zeigen Maschine, Zustand, Text und Zeitpunkt.
        - Jede Tabelle besitzt einen leeren Zustand, jedoch keine Suche oder Pagination. Nur aktive Verbindungen stehen für neue Befehle und Meldungen bereit.
        actions:
          create_connection: {label: "Verbindung anlegen", description: "Konfiguriert WCS, Materialflussrechner oder Fördertechnik.", result: "Die Verbindung erscheint nach dem Speichern."}
          create_command: {label: "Befehl anlegen", description: "Reiht Transport, Route oder Storno ein.", result: "Ein neuer queued-Befehl entsteht."}
          capture_status: {label: "Status erfassen", description: "Übernimmt eine Maschinenrückmeldung idempotent.", result: "Die Rückmeldung erscheint in der Leitstelle."}
          toggle: {label: "Aktivieren oder pausieren", description: "Steuert die operative Nutzung der Verbindung.", result: "Vorhandene Befehle und Meldungen bleiben erhalten."}
        image: {src: "/assets/images/handbook/integration/wcs-overview.svg", alt: "WCS-Leitstelle mit Verbindungen, Befehlen und Maschinenstatus"}
      wcs_connection_create:
        template: integration/wcs/connection-new.html.twig
        title: WCS-Verbindung anlegen
        purpose: Das Formular registriert einen sicheren Endpunkt für WCS, MFR oder Förderanlage.
        navigation: Integration → WCS/MFR/Fördertechnik → Verbindung anlegen
        permissions: ["integration.wcs.write"]
        overview: ["Credential nur als Umgebungsreferenz speichern und Endpunkt vor Aktivierung technisch testen."]
        fields:
          code: {label: "Code", required: true, format: "Bis 40 Zeichen; stabiler Großbuchstabencode", example: "WCS_01", help: "Eindeutigen Anlagen- oder Systemcode verwenden.", effect: "Identifiziert die Verbindung in Befehlen und Meldungen.", errors: "Leere oder doppelte Codes werden abgewiesen."}
          name: {label: "Name", required: true, format: "Bis 100 Zeichen", example: "WCS Hochregallager", help: "Anlage und Umgebung verständlich benennen.", effect: "Erscheint in Auswahl und Übersicht.", errors: "Ein leerer Name verhindert die Anlage."}
          system_type: {label: "Systemtyp", required: true, format: "wcs, mfr oder conveyor", example: "mfr", help: "WCS für Lagersteuerung, MFR für Materialfluss, conveyor für Förderanlage wählen.", effect: "Klassifiziert den Integrationspartner.", errors: "Ein falscher Typ erschwert Routing und Auswertung."}
          endpoint_url: {label: "HTTPS-Endpunkt", required: true, format: "Vollständige HTTPS-URL", example: "https://wcs.internal.example/commands", help: "Produktiven Kommandoendpunkt ohne Secret angeben.", effect: "Ziel für Maschinenbefehle.", errors: "Ungültige oder nicht erreichbare URLs verhindern Zustellung."}
          credential_env: {label: "Credential-Umgebungsvariable", required: true, format: "Name einer sicher bereitgestellten Variable", example: "WCS_01_TOKEN", help: "Niemals das Credential selbst eingeben.", effect: "Authentifiziert die technische Kommunikation.", errors: "Fehlende Laufzeitvariable verursacht Authentifizierungsfehler."}
          active: {label: "Sofort aktivieren", required: false, format: "Checkbox; standardmäßig aktiv", example: "deaktiviert bis Verbindungstest", help: "Erst nach erfolgreichem Test aktivieren.", effect: "Nur aktive Verbindungen nehmen Befehle an.", errors: "Aktive Fehlkonfigurationen erzeugen Zustellfehler."}
        actions:
          save: {label: "Verbindung anlegen", description: "Validiert Identität, Systemtyp, Endpunkt und Credential-Referenz.", result: "Die Verbindung erscheint in der Leitstelle."}
          cancel: {label: "Abbrechen", description: "Verwirft die Eingaben.", result: "Keine Verbindung wird angelegt."}
        image: {src: "/assets/images/handbook/integration/wcs-connection-create.svg", alt: "WCS-Verbindungsformular mit Systemtyp und Endpunkt"}
      wcs_command_create:
        template: integration/wcs/command-new.html.twig
        title: Maschinenbefehl anlegen
        purpose: Das Formular reiht Transport-, Routing- oder Stornobefehle idempotent auf einer aktiven Verbindung ein.
        navigation: Integration → WCS/MFR/Fördertechnik → Befehl anlegen
        permissions: ["integration.wcs.execute; mindestens eine aktive Verbindung."]
        overview: ["Quelle, Ziel und Ladeeinheit gegen die Anlagenbezeichnungen prüfen. Die Request-ID verhindert doppelte Befehle."]
        fields:
          request_id: {label: "Request-ID", required: true, format: "Automatisch erzeugte UUID", example: "0199a1c0-7ab1-7f20-8f20-123456789abc", help: "Nicht verändern oder für einen anderen Befehl wiederverwenden.", effect: "Sichert idempotente Einreihung.", errors: "Wiederholte IDs erzeugen keinen Doppelauftrag."}
          connection_id: {label: "Verbindung", required: true, format: "Auswahl einer aktiven WCS-Verbindung", example: "WCS_01", help: "Zuständige Anlage auswählen.", effect: "Bestimmt Zielsystem und Credential.", errors: "Pausierte oder unbekannte Verbindungen werden abgewiesen."}
          command_type: {label: "Befehl", required: true, format: "transport, route oder cancel", example: "transport", help: "transport bewegt, route setzt den Weg, cancel storniert den Anlagenauftrag.", effect: "Bestimmt die Maschinenoperation.", errors: "Storno muss sich fachlich auf einen vorhandenen Auftrag beziehen."}
          source: {label: "Quelle", required: true, format: "Anlagenplatz, maximal 100 Zeichen", example: "INFEED-01", help: "Exakten WCS-Ortscode verwenden.", effect: "Definiert den Startpunkt.", errors: "Unbekannte Quellen werden vom Zielsystem abgelehnt."}
          destination: {label: "Ziel", required: true, format: "Anlagenplatz, maximal 100 Zeichen", example: "AISLE-04", help: "Exakten Zielcode der Anlage verwenden.", effect: "Definiert das Routenziel.", errors: "Unbekannte oder gesperrte Ziele führen zu failed."}
          load_unit: {label: "Ladeeinheit", required: true, format: "Eindeutige Kennung, maximal 100 Zeichen", example: "HU-0004711", help: "Barcode der tatsächlich bewegten Einheit verwenden.", effect: "Bindet Befehl und Rückmeldungen an die Ladeeinheit.", errors: "Leere oder bereits gebundene Kennungen erzeugen Konflikte."}
        actions:
          save: {label: "Befehl einreihen", description: "Validiert Verbindung, Route, Ladeeinheit und Request-ID.", result: "Der Befehl startet im Status queued."}
          cancel: {label: "Abbrechen", description: "Verwirft den Entwurf.", result: "Kein Maschinenbefehl entsteht."}
        image: {src: "/assets/images/handbook/integration/wcs-command-create.svg", alt: "WCS-Befehl mit Route und Ladeeinheit"}
      wcs_command_detail:
        template: integration/wcs/command-show.html.twig
        title: Maschinenbefehl und Statusfolge
        purpose: Das Detail zeigt Route, Ladeeinheit, Request-ID und kontrolliert den Zustandsübergang.
        navigation: Integration → WCS/MFR/Fördertechnik → Befehl öffnen
        permissions: ["integration.wcs.read; integration.wcs.execute für Statusänderung."]
        overview: ["Zulässige Folge: queued → dispatched → accepted → completed. failed oder cancelled beenden den Befehl; Endstatus sind nicht weiter änderbar."]
        fields:
          status: {label: "Neuer Status", required: true, format: "Abhängig vom Iststatus; dispatched, accepted, completed, failed oder cancelled", example: "accepted", help: "Nur die tatsächlich bestätigte Anlagenstufe wählen.", effect: "Fortschreibt den Befehlslebenszyklus.", errors: "Übersprungene oder nachträgliche Übergänge werden abgewiesen."}
          message: {label: "Meldung", required: false, format: "Bis 500 Zeichen", example: "Ladeeinheit am Ziel bestätigt", help: "Bei Fehler oder Storno Ursache und Anlagenmeldung erfassen.", effect: "Ergänzt den Auditnachweis.", errors: "Ohne Meldung sind Fehler schwer analysierbar."}
        actions:
          status: {label: "Status verarbeiten", description: "Validiert und protokolliert den nächsten Übergang.", result: "Status und Meldung werden aktualisiert; Endstatus schließen die Bearbeitung."}
        image: {src: "/assets/images/handbook/integration/wcs-command-detail.svg", alt: "WCS-Befehlsdetail mit Statusverarbeitung"}
      wcs_status_capture:
        template: integration/wcs/status-new.html.twig
        title: Maschinenstatus erfassen
        purpose: Das Formular übernimmt eine idempotente Zustandsmeldung einer Maschine und ordnet sie optional einem Befehl zu.
        navigation: Integration → WCS/MFR/Fördertechnik → Status erfassen
        permissions: ["integration.wcs.execute; mindestens eine aktive Verbindung."]
        overview: ["Die externe Event-ID wird automatisch erzeugt. Eine Befehlsreferenz nur setzen, wenn die Rückmeldung eindeutig dazugehört."]
        fields:
          external_event_id: {label: "Externe Event-ID", required: true, format: "Automatisch erzeugte UUID", example: "0199a1c0-7ab1-7f20-8f20-123456789abc", help: "Versteckten Idempotenzschlüssel nicht verändern.", effect: "Verhindert doppelte Maschinenmeldungen.", errors: "Eine bereits bekannte ID wird nicht doppelt verarbeitet."}
          connection_id: {label: "Verbindung", required: true, format: "Aktive WCS-Verbindung", example: "WCS_01", help: "Meldendes System auswählen.", effect: "Ordnet Maschine und Credential-Kontext zu.", errors: "Unbekannte oder pausierte Verbindung ist ungültig."}
          command_id: {label: "Transportbefehl", required: false, format: "Kein Bezug oder vorhandener Befehl", example: "HU-0004711: INFEED-01 → AISLE-04", help: "Nur bei direktem Befehlsbezug auswählen.", effect: "Verknüpft Anlagenzustand und Auftrag.", errors: "Mandanten- oder verbindungsfremde Befehle sind unzulässig."}
          machine_code: {label: "Maschinencode", required: true, format: "Bis 100 Zeichen", example: "CONVEYOR_04", help: "Exakte Anlagenkennung verwenden.", effect: "Identifiziert die meldende Komponente.", errors: "Leere Codes verhindern die Erfassung."}
          status: {label: "Status", required: true, format: "ready, busy, blocked, fault oder offline", example: "fault", help: "ready frei, busy belegt, blocked fachlich blockiert, fault Störung, offline nicht erreichbar.", effect: "Aktualisiert den sichtbaren Maschinenzustand.", errors: "Falscher Status kann Routingentscheidungen verfälschen."}
          message: {label: "Meldung", required: false, format: "Bis 500 Zeichen", example: "Lichtschranke LS-4 blockiert", help: "Bei blocked, fault oder offline technische Ursache angeben.", effect: "Unterstützt Diagnose und Entstörung.", errors: "Unklare Meldungen verlängern die Fehleranalyse."}
        actions:
          save: {label: "Status erfassen", description: "Speichert die Rückmeldung idempotent und optional befehlsbezogen.", result: "Der Maschinenstatus erscheint in der Leitstelle."}
          cancel: {label: "Abbrechen", description: "Verwirft die Meldung.", result: "Keine Statusänderung."}
        image: {src: "/assets/images/handbook/integration/wcs-status-capture.svg", alt: "Maschinenstatus mit Verbindung, Befehl und Fehlertext"}
    guidance:
      prerequisites:
      - Erreichbarer Endpunkt, abgestimmtes Protokoll, Mandantenzuordnung und Secret als Umgebungsvariable.
      permissions:
      - Passende integration.erp_connection, carrier_connection, device, measurement, printer/print_job und wcs Rechte für read/write/execute.
      fields:
      - 'Verbindung: name, endpoint_url, credential_env, active, connect/read_timeout_ms. Gerät: code, device_type, protocol, framing, scan_suffix, site_id. Mapping: system_type, message_type,
        source_field, target_field, transformation. Nachricht: message_id, payload, reference.'
      statuses:
      - Verbindungen/Geräte active/inactive. Jobs und Befehle pending → processing/sent → acknowledged/completed oder failed.
      errors:
      - DNS/Timeout, 401/403, ungültiges Zertifikat, Mappingfehler, unbekanntes Gerät oder doppelte message_id wird protokolliert und nicht als Erfolg behandelt.
  platform_and_extensions:
    title: Plattformfunktionen und erweiterte Module
    summary: Shopfloor, KPI, Partnerportal, Events, VAS sowie regelbasierte Erweiterungen.
    sections:
      section_1:
        title: Shopfloor und KPI
        paragraphs:
          paragraph_1: Shopfloor-Aufgaben bündeln operative Arbeit nach Priorität, Bereich und Status. KPI-Definitionen legen Metrik, Aggregation, Zielwert und Zeitraum fest. Prüfen
            Sie Filter und Datenzeitraum, bevor Sie Abweichungen bewerten.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Shopfloor und KPI – Screenshot-Platzhalter
      section_2:
        title: Partnerportal und Eventcenter
        paragraphs:
          paragraph_1: Partnerkonten erhalten explizite Rechte für freigegebene Daten. Das Eventcenter zeigt fachliche Ereignisse und Bearbeitungsstatus. Quittieren Sie nur Ereignisse,
            deren Ursache verstanden oder behoben wurde.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Partnerportal und Eventcenter – Screenshot-Platzhalter
      section_3:
        title: Lagergeld und Dienstleistungen
        paragraphs:
          paragraph_1: Lagergeldregeln verwenden Zeitraum, Bestand, Tarif und Abrechnungsgrundlage. VAS-Aufträge beschreiben Leistung, Menge, Status und Nachweis. Kontrollieren Sie Tarifgültigkeit
            und Bezugsdaten vor der Abrechnung.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: 'Platzhalter: Plattform-Kontrollzentrum'
      section_4:
        title: Erweiterte Konfigurationen
        paragraphs:
          paragraph_1: Erweiterungsmodule decken Ressourcen wie Compliance-, Qualitäts-, Produktions-, Dock- und Yard-Konfigurationen ab. Legen Sie Regeln in der Konfigurationsansicht
            an und führen Sie operative Vorgänge in der getrennten Prozessansicht aus. Statuswechsel, Freigaben und externe Nachweise werden auditiert.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Erweiterte Konfigurationen – Screenshot-Platzhalter
    views:
      platform_dashboard:
        template: platform/dashboard/index.html.twig
        title: Plattformdashboard
        purpose: Das Dashboard verdichtet Artikel, Lagerstruktur, Bestand sowie offene Outbound-, Pick-, Pack- und Versandvorgänge.
        navigation: Plattform → Dashboard
        permissions: ["platform.read"]
        overview: ["Kennzahlen zeigen den aktuellen Mandanten- und Standortkontext; Karten führen in die zugehörigen Arbeitslisten.", "Leere Werte bedeuten keine passenden Datensätze. Vor einer Eskalation Standort, Filter und Berechtigungen prüfen."]
        actions: {open_area: {label: "Bereich öffnen", description: "Öffnet die zur Kennzahl gehörende Übersicht.", result: "Die fachliche Liste wird ohne Datenänderung angezeigt."}}
        image: {src: "/assets/images/handbook/platform/dashboard.svg", alt: "Plattformdashboard mit Bestands- und Prozesskennzahlen"}
      platform_control_center:
        template: platform/index.html.twig
        title: Plattform-Kontrollzentrum
        purpose: Die Leitstelle verwaltet Shopfloor-Aufgaben, KPIs, Dashboards, Partnerzugänge, Automationsregeln, Lagergeld, Dienstleistungen, Medien und Druckrouten.
        navigation: Plattform → Kontrollzentrum
        permissions: ["platform.read; platform.write für Konfiguration; platform.execute für Übergänge, Tests und Abrechnung."]
        overview: ["Die Suche filtert bereichsübergreifend. Vierzehn getrennte Formulare lösen jeweils genau die beschriftete Aktion aus.", "Aufgaben folgen planned → released → in_progress → completed. Regeln und Stammdaten können deaktiviert werden, ohne Historie zu löschen."]
        fields:
          q: {label: "Suche", required: false, format: "Freitext", example: "TASK-4711", help: "Nach Code, Name oder Referenz suchen.", effect: "Begrenzt die angezeigten Plattformdaten.", errors: "Ein leerer Treffer verändert keine Daten."}
          code: {label: "Code", required: true, format: "Eindeutige stabile Kennung", example: "KPI_OPEN_TASKS", help: "Nach Anlage nicht fachlich umdeuten.", effect: "Identifiziert Aufgabe, KPI, Dashboard, Regel, Tarif, Dienstleistung oder Druckroute.", errors: "Leere oder doppelte Codes werden abgewiesen.", usages: ["Aufgabencode", "KPI-Code", "Dashboardcode", "Regelcode", "Lagergeldcode", "Dienstleistungscode", "Druckroutencode"]}
          title: {label: "Titel", required: true, format: "Bis 180 Zeichen", example: "Palette in Zone A umlagern", help: "Arbeitsauftrag eindeutig beschreiben.", effect: "Erscheint in der Shopfloor-Liste.", errors: "Ein leerer Titel verhindert die Anlage."}
          task_type: {label: "Aufgabentyp", required: true, format: "putaway, retrieval, transport oder inventory", example: "transport", help: "Den tatsächlichen Arbeitsablauf wählen.", effect: "Klassifiziert die Aufgabe.", errors: "Unbekannte Typen werden abgewiesen."}
          priority: {label: "Priorität", required: true, format: "Ganzzahl 1–999; Standard 50", example: "20", help: "Kleinere Werte zuerst bearbeiten.", effect: "Bestimmt die operative Reihenfolge.", errors: "Werte außerhalb des Bereichs sind ungültig."}
          reference_type: {label: "Referenztyp", required: false, format: "Fachlicher Aggregattyp", example: "shipment", help: "Nur zusammen mit einer Referenz-ID setzen.", effect: "Verknüpft die Aufgabe mit einem Vorgang.", errors: "Unbekannte Typen verhindern die Verknüpfung."}
          reference_id: {label: "Referenz-ID", required: false, format: "Vorhandene ID", example: "SHP-2026-00471", help: "ID des referenzierten Vorgangs verwenden.", effect: "Ermöglicht Navigation zum Ursprung.", errors: "Nicht vorhandene Referenzen bleiben unauflösbar."}
          planned_for: {label: "Geplant für", required: false, format: "Datum und Uhrzeit", example: "2026-10-05 14:30", help: "Lokale Standortzeit beachten.", effect: "Terminiert die Aufgabe.", errors: "Ungültige Datumswerte werden abgewiesen."}
          assigned_to: {label: "Zugewiesen an", required: false, format: "Benutzerkennung", example: "lager.team1", help: "Nur aktive berechtigte Benutzer zuweisen.", effect: "Ordnet Verantwortung zu.", errors: "Unbekannte Benutzer sind nicht auswählbar."}
          status: {label: "Folgestatus", required: true, format: "released, in_progress oder completed gemäß Iststatus", example: "released", help: "Nur den angebotenen nächsten Status auslösen.", effect: "Schreibt den Aufgabenstatus fort.", errors: "Übersprungene oder wiederholte Übergänge werden abgewiesen."}
          active: {label: "Aktiv", required: true, format: "Ja/Nein; bei Anlage aktiv", example: "Ja", help: "Nur einsatzbereite Konfigurationen aktivieren.", effect: "Steuert KPI, Partnerkonto, Regel, Tarif, Dienstleistung oder Druckroute.", errors: "Deaktivierte Einträge werden operativ nicht verwendet.", usages: ["KPI", "Partnerkonto", "Automationsregel", "Lagergeldregel", "Dienstleistung", "Druckroute"]}
          name: {label: "Name", required: true, format: "Sprechender Name", example: "Offene Shopfloor-Aufgaben", help: "Zweck und Geltung eindeutig benennen.", effect: "Wird in Auswahl und Übersicht angezeigt.", errors: "Ein leerer Name verhindert das Speichern.", usages: ["KPI", "Dashboard", "Automationsregel", "Lagergeldregel", "Dienstleistung", "Druckroute"]}
          metric: {label: "Metrik", required: true, format: "open_shopfloor_tasks, stock_quantity, open_outbound_orders, open_inbound_deliveries oder queued_print_jobs", example: "stock_quantity", help: "Passende Datenbasis wählen.", effect: "Bestimmt den Messwert.", errors: "Nicht unterstützte Metriken werden abgewiesen."}
          aggregation: {label: "Aggregation", required: true, format: "count, sum oder average", example: "sum", help: "count zählt, sum summiert, average mittelt.", effect: "Bestimmt die Berechnung.", errors: "Eine unpassende Aggregation kann irreführende Werte liefern."}
          target_value: {label: "Zielwert", required: false, format: "Dezimalzahl", example: "5000", help: "In der Einheit der Metrik erfassen.", effect: "Ermöglicht Soll-Ist-Vergleich.", errors: "Nicht numerische Werte sind ungültig."}
          layout_json: {label: "Dashboard-Layout", required: true, format: "Valides JSON-Objekt", example: '{"columns":4,"kpis":["stock_quantity"]}', help: "columns und KPI-Codes strukturiert angeben.", effect: "Bestimmt Anordnung und Inhalte.", errors: "Ungültiges JSON oder unbekannte KPI-Codes verhindern das Speichern."}
          business_partner_id: {label: "Geschäftspartner", required: true, format: "Vorhandener Partner", example: "BP-0042", help: "Kontoinhaber oder Rechnungspartner wählen.", effect: "Ordnet Zugang oder Abrechnung dem Partner zu.", errors: "Mandantenfremde Partner werden abgewiesen.", usages: ["Partnerkonto", "Lagergeldabrechnung", "Dienstleistungsabrechnung"]}
          user_id: {label: "Benutzer", required: true, format: "Aktiver Benutzer", example: "partner.mueller", help: "Dem Partner zugeordnetes Konto wählen.", effect: "Erteilt Portalzugriff.", errors: "Inaktive oder fremde Benutzer sind unzulässig."}
          permissions: {label: "Portalrechte", required: true, format: "Kommagetrennte erlaubte Scopes", example: "stock.read,orders.read", help: "Nur minimal benötigte Rechte vergeben.", effect: "Begrenzt sichtbare Partnerdaten.", errors: "Unbekannte Scopes werden nicht wirksam."}
          event_name: {label: "Ereignisname", required: true, format: "Registrierter Eventname", example: "shipment.dispatched", help: "Exakten technischen Namen verwenden.", effect: "Löst passende Regeln aus oder simuliert ein Ereignis.", errors: "Unbekannte Ereignisse erzeugen keine Aktionen.", usages: ["Automationsregel", "Testereignis"]}
          conditions_json: {label: "Bedingungen", required: true, format: "Valides JSON-Objekt", example: '{"carrier":"DHL","country":"DE"}', help: "Nur fachliche Eventeigenschaften vergleichen; keine Secrets.", effect: "Begrenzt die Regelausführung.", errors: "Ungültiges JSON verhindert das Speichern."}
          action_type: {label: "Aktionstyp", required: true, format: "print, notification oder follow_up_task", example: "notification", help: "Gewünschte Folgeaktion wählen.", effect: "Bestimmt den ausführenden Handler.", errors: "Unbekannte Aktionstypen werden abgewiesen."}
          action_config: {label: "Aktionskonfiguration", required: true, format: "Valides JSON-Objekt passend zum Aktionstyp", example: '{"channel":"warehouse-alerts","template":"shipment-delay"}', help: "IDs statt Geheimnisse speichern.", effect: "Parametrisiert die Folgeaktion.", errors: "Fehlende Pflichtattribute verhindern die Ausführung."}
          payload: {label: "Test-Payload", required: true, format: "Valides JSON-Objekt", example: '{"shipment_id":"SHP-2026-00471","carrier":"DHL"}', help: "Realistische, geheimnisfreie Testdaten verwenden.", effect: "Wird einmalig durch die Regeln ausgewertet.", errors: "Ungültiges JSON verhindert den Test."}
          price_per_unit_day: {label: "Preis je Einheit und Tag", required: true, format: "Positive Dezimalzahl", example: "0.35", help: "Netto-Tarif in der gewählten Währung angeben.", effect: "Berechnet Lagergeld.", errors: "Negative oder nicht numerische Werte sind ungültig."}
          free_days: {label: "Freie Tage", required: true, format: "Ganzzahl ab 0", example: "3", help: "Kostenfreie Lagerdauer festlegen.", effect: "Reduziert abrechenbare Tage.", errors: "Negative Werte sind ungültig."}
          currency: {label: "Währung", required: true, format: "ISO-4217-Code", example: "EUR", help: "Dreistelligen Großbuchstabencode verwenden.", effect: "Kennzeichnet Tarif und Betrag.", errors: "Ungültige Codes verhindern die Abrechnung.", usages: ["Lagergeldregel", "Dienstleistung"]}
          unit: {label: "Einheit", required: true, format: "Fachliche Abrechnungseinheit", example: "PAL", help: "Mit Vertrag und Mengenquelle abstimmen.", effect: "Bestimmt die Preisbasis.", errors: "Unbekannte Einheiten verfälschen die Abrechnung."}
          unit_price: {label: "Einzelpreis", required: true, format: "Positive Dezimalzahl", example: "4.90", help: "Netto-Preis je Einheit angeben.", effect: "Berechnet den Dienstleistungsbetrag.", errors: "Negative oder nicht numerische Werte sind ungültig."}
          rule_id: {label: "Lagergeldregel", required: true, format: "Aktive Regel", example: "STORAGE_STD", help: "Zum Partnervertrag passende Regel wählen.", effect: "Übernimmt Preis, Freitage und Währung.", errors: "Inaktive Regeln können nicht abgerechnet werden."}
          quantity: {label: "Menge", required: true, format: "Positive Dezimalzahl", example: "12", help: "In der Tarif- oder Dienstleistungseinheit erfassen.", effect: "Fließt in den Rechnungsbetrag ein.", errors: "Null, negative oder nicht numerische Werte werden abgewiesen.", usages: ["Lagergeldabrechnung", "Dienstleistungsabrechnung"]}
          days: {label: "Tage", required: true, format: "Ganzzahl ab 0", example: "10", help: "Gesamte Lagerdauer einschließlich Freitage angeben.", effect: "Bestimmt abrechenbare Lagerdauer.", errors: "Negative Werte sind ungültig."}
          reference: {label: "Abrechnungsreferenz", required: false, format: "Externe oder interne Belegnummer", example: "INV-BATCH-2026-10", help: "Nachvollziehbaren Bezug angeben.", effect: "Erscheint im Abrechnungsnachweis.", errors: "Unklare Referenzen erschweren die Abstimmung.", usages: ["Lagergeldabrechnung", "Dienstleistungsabrechnung"]}
          service_id: {label: "Dienstleistung", required: true, format: "Aktive Dienstleistung", example: "REPACK", help: "Erbrachte Leistung auswählen.", effect: "Übernimmt Einheit und Preis.", errors: "Inaktive Leistungen sind nicht abrechenbar."}
          aggregate_type: {label: "Objekttyp", required: true, format: "Unterstützter Aggregattyp", example: "shipment", help: "Zielobjekt des Mediums wählen.", effect: "Ordnet die Datei fachlich zu.", errors: "Unbekannte Typen werden abgewiesen."}
          aggregate_id: {label: "Objekt-ID", required: true, format: "Vorhandene ID", example: "SHP-2026-00471", help: "Passend zum Objekttyp eingeben.", effect: "Verknüpft Datei und Vorgang.", errors: "Nicht vorhandene IDs verhindern die Zuordnung."}
          file: {label: "Datei", required: true, format: "Zugelassener Dateityp und Größenlimit", example: "proof-of-delivery.pdf", help: "Keine Geheimnisse oder unnötigen Personendaten hochladen.", effect: "Speichert das Medium am Vorgang.", errors: "Unzulässiger Typ, Größe oder Uploadfehler verhindert das Speichern."}
          document_type: {label: "Dokumenttyp", required: true, format: "Unterstützter Druckdokumenttyp", example: "shipping_label", help: "Dokument der passenden Route zuordnen.", effect: "Wählt die Druckroute.", errors: "Unbekannte Typen werden nicht geroutet."}
          printer_id: {label: "Drucker", required: true, format: "Aktiver Drucker", example: "PRINTER_PACK_01", help: "Erreichbaren Drucker auswählen.", effect: "Bestimmt das Ausgabeziel.", errors: "Inaktive Drucker verhindern die Ausgabe."}
          site_id: {label: "Standort", required: false, format: "Vorhandener Standort", example: "BERLIN", help: "Leer lassen für standortübergreifende Route.", effect: "Begrenzt die Routengültigkeit.", errors: "Fremde Standorte werden abgewiesen."}
          workstation: {label: "Arbeitsplatz", required: false, format: "Stabile Arbeitsplatzkennung", example: "PACK-03", help: "Nur setzen, wenn die Route arbeitsplatzgebunden ist.", effect: "Verfeinert die Routenauswahl.", errors: "Abweichende Schreibweise verhindert einen Treffer."}
          process_key: {label: "Prozessschlüssel", required: false, format: "Technischer Prozessname", example: "outbound.pack", help: "Mit dem auslösenden Prozess abstimmen.", effect: "Verfeinert die Routenauswahl.", errors: "Unbekannte Schlüssel führen zur Standardroute."}
        actions:
          create: {label: "Anlegen", description: "Validiert und speichert das jeweilige Plattformobjekt.", result: "Der Eintrag erscheint in seiner Übersicht."}
          transition: {label: "Aufgabe fortschreiben", description: "Führt ausschließlich den zulässigen Folgestatus aus.", result: "Status und Auditspur werden aktualisiert."}
          test_event: {label: "Ereignis testen", description: "Wertet aktive Regeln einmal mit der Payload aus.", result: "Ausgelöste Aktionen und Fehler werden angezeigt."}
          bill: {label: "Leistung abrechnen", description: "Berechnet Betrag aus Tarif, Menge und Dauer.", result: "Ein nachvollziehbarer Abrechnungsdatensatz entsteht."}
          upload: {label: "Medium hochladen", description: "Prüft und ordnet die Datei einem Fachobjekt zu.", result: "Das Medium ist am Vorgang verfügbar."}
        image: {src: "/assets/images/handbook/platform/control-center.svg", alt: "Plattform-Kontrollzentrum mit Konfigurations- und Prozessformularen"}
      partner_portal:
        template: platform/portal.html.twig
        title: Partnerportal
        purpose: Das Portal zeigt einem Partner ausschließlich freigegebene Bestände, Vorgänge und Medien.
        navigation: Plattform → Partnerportal
        permissions: ["Aktives Partnerkonto und explizite Portal-Scopes."]
        overview: ["Alle Inhalte sind auf den zugeordneten Geschäftspartner begrenzt; fehlende Scopes blenden Bereiche aus.", "Links öffnen nur freigegebene Details. Bei fehlenden Daten Partnerzuordnung, Aktivstatus und Rechte prüfen."]
        actions: {open: {label: "Freigegebenen Vorgang öffnen", description: "Öffnet Bestand, Beleg oder Medium im Partnerkontext.", result: "Es werden keine fremden Mandanten- oder Partnerdaten angezeigt."}}
        image: {src: "/assets/images/handbook/platform/partner-portal.svg", alt: "Partnerportal mit freigegebenen Beständen und Vorgängen"}
      extensions_overview:
        template: platform/extensions/index.html.twig
        title: Erweiterungsmodule
        purpose: Die Übersicht bündelt verfügbare Fachmodule und führt zu Konfigurationen und Workflows.
        navigation: Plattform → Erweiterungen
        permissions: ["platform.extension.read"]
        overview: ["Modulkarten erläutern den Fachzweck und zeigen verfügbare Ressourcen. Nicht aktivierte Module bleiben ohne operative Daten."]
        actions: {open: {label: "Modul öffnen", description: "Öffnet Konfigurationen oder Workflows des Moduls.", result: "Die gewählte Ressourcenübersicht erscheint."}}
        image: {src: "/assets/images/handbook/platform/extensions-overview.svg", alt: "Übersicht der Erweiterungsmodule"}
      extension_configurations:
        template: platform/extensions/configuration_index.html.twig
        title: Erweiterungskonfigurationen
        purpose: Die Liste zeigt versionierbare Konfigurationen eines Erweiterungsmoduls mit Code, Name und Aktivstatus.
        navigation: Plattform → Erweiterungen → Modul → Konfigurationen
        permissions: ["platform.extension.read; platform.extension.write für Anlage und Bearbeitung."]
        overview: ["Die Tabelle zeigt alle Konfigurationen des gewählten Ressourcentyps. Ein leerer Zustand weist auf eine noch fehlende Einrichtung hin."]
        actions: {create: {label: "Konfiguration anlegen", description: "Öffnet ein leeres Konfigurationsformular.", result: "Noch keine Datenänderung."}, edit: {label: "Bearbeiten", description: "Öffnet die gewählte Version zur Pflege.", result: "Änderungen werden erst nach Speichern wirksam."}}
        image: {src: "/assets/images/handbook/platform/extension-configurations.svg", alt: "Liste der Erweiterungskonfigurationen"}
      extension_configuration_form:
        template: platform/extensions/configuration_form.html.twig
        title: Erweiterungskonfiguration bearbeiten
        purpose: Das Formular legt eine fachliche, versionierbare JSON-Konfiguration an oder ändert sie.
        navigation: Plattform → Erweiterungen → Modul → Konfigurationen → Anlegen/Bearbeiten
        permissions: ["platform.extension.write"]
        overview: ["Das Schema hängt vom Modul ab. Vor Aktivierung Pflichtattribute und referenzierte Stammdaten anhand der Modulbeschreibung prüfen."]
        fields:
          code: {label: "Code", required: true, format: "Bis 80 Zeichen; eindeutig im Ressourcentyp", example: "DEFAULT_RULE", help: "Stabile Kennung vergeben.", effect: "Identifiziert die Konfiguration und ihre Versionen.", errors: "Doppelte oder leere Codes werden abgewiesen."}
          name: {label: "Name", required: true, format: "Bis 160 Zeichen", example: "Standardregel Deutschland", help: "Geltung verständlich benennen.", effect: "Erscheint in Übersicht und Auswahl.", errors: "Ein leerer Name ist ungültig."}
          configuration_json: {label: "Konfiguration", required: true, format: "Valides JSON-Objekt nach Modulschema", example: '{"country":"DE","threshold":10,"approvalRequired":true}', help: "Nur dokumentierte Eigenschaften und IDs, niemals Klartext-Secrets, verwenden.", effect: "Steuert das Verhalten des Erweiterungsmoduls versionierbar.", errors: "Ungültiges JSON, falsche Typen oder fehlende Pflichtattribute verhindern das Speichern."}
          active: {label: "Aktiv", required: false, format: "Ja/Nein", example: "Ja", help: "Erst nach fachlicher Prüfung aktivieren.", effect: "Nur aktive Konfigurationen werden operativ ausgewertet.", errors: "Deaktivierung beendet keine bereits gestarteten Workitems."}
        actions: {save: {label: "Speichern", description: "Validiert Stammdaten und JSON und erzeugt eine neue Version.", result: "Die Konfiguration ist entsprechend dem Aktivstatus verfügbar."}, cancel: {label: "Zur Übersicht", description: "Verwirft nicht gespeicherte Änderungen.", result: "Die Liste erscheint unverändert."}}
        image: {src: "/assets/images/handbook/platform/extension-configuration-form.svg", alt: "Formular einer Erweiterungskonfiguration mit JSON und Aktivstatus"}
      extension_workflows:
        template: platform/extensions/workflow_index.html.twig
        title: Erweiterungsworkflows
        purpose: Die Liste zeigt Workitems eines Erweiterungsmoduls mit Referenz, Status und letzter Änderung.
        navigation: Plattform → Erweiterungen → Modul → Workflows
        permissions: ["platform.extension.read; platform.extension.execute für neue Workitems."]
        overview: ["Status und Referenz grenzen den operativen Bearbeitungsstand ein. Leere Listen bedeuten, dass für das Modul noch kein Workitem angelegt wurde."]
        actions: {create: {label: "Workitem anlegen", description: "Öffnet das Erfassungsformular.", result: "Noch keine Datenänderung."}, open: {label: "Workitem öffnen", description: "Zeigt Payload, Auditspur und mögliche Übergänge.", result: "Die Detailseite erscheint."}}
        image: {src: "/assets/images/handbook/platform/extension-workflows.svg", alt: "Liste der Erweiterungsworkflows und Status"}
      extension_work_item_form:
        template: platform/extensions/work_item_form.html.twig
        title: Erweiterungsworkitem anlegen
        purpose: Das Formular startet einen fachlichen Workflow mit Referenz und modulspezifischer Payload.
        navigation: Plattform → Erweiterungen → Modul → Workflows → Anlegen
        permissions: ["platform.extension.execute"]
        overview: ["Referenz und Payload müssen gemeinsam einen nachvollziehbaren Fachvorgang beschreiben; IDs müssen im aktuellen Mandanten existieren."]
        fields:
          reference: {label: "Referenz", required: true, format: "Eindeutige Fachreferenz bis 160 Zeichen", example: "QC-INB-2026-00471", help: "Beleg- oder Vorgangsnummer verwenden.", effect: "Verknüpft Workflow und Ursprung.", errors: "Leere oder bereits verwendete Referenzen können abgewiesen werden."}
          payload_json: {label: "Payload", required: true, format: "Valides JSON-Objekt nach Workflow-Schema", example: '{"receiptId":"REC-00471","inspectionLevel":"full","evidenceRequired":true}', help: "Vollständige, geheimnisfreie Fachdaten und gültige IDs verwenden.", effect: "Initialisiert Schritte, Regeln und Entscheidungen.", errors: "Ungültiges JSON oder fehlende Schemafelder verhindert den Start."}
        actions: {save: {label: "Workitem anlegen", description: "Validiert Referenz und Payload und startet den Initialstatus.", result: "Das Workitem erscheint in der Workflowliste."}, cancel: {label: "Abbrechen", description: "Verwirft die Eingabe.", result: "Kein Workflow wird gestartet."}}
        image: {src: "/assets/images/handbook/platform/extension-work-item-form.svg", alt: "Formular zum Start eines Erweiterungsworkflows"}
      extension_work_item_detail:
        template: platform/extensions/work_item_show.html.twig
        title: Erweiterungsworkitem bearbeiten
        purpose: Die Detailseite zeigt Payload und Historie und bietet ausschließlich zulässige Statusübergänge an.
        navigation: Plattform → Erweiterungen → Modul → Workflows → Workitem
        permissions: ["platform.extension.read; platform.extension.execute für Übergänge."]
        overview: ["Status, Referenz, Payload und Auditspur erklären den Bearbeitungsstand. Übergänge sind modul- und statusabhängig."]
        fields:
          status: {label: "Folgestatus", required: true, format: "Einer der angezeigten zulässigen Übergänge", example: "approved", help: "Vor Ausführung Nachweise und Konsequenz prüfen.", effect: "Schreibt Status und Auditspur fort und kann Folgeaktionen auslösen.", errors: "Veraltete, wiederholte oder unzulässige Übergänge werden abgewiesen."}
        actions: {transition: {label: "Status ausführen", description: "Validiert und protokolliert den gewählten Übergang einmalig.", result: "Workitem und mögliche Folgeaktionen werden aktualisiert."}, back: {label: "Zurück zur Liste", description: "Öffnet die Workflowübersicht.", result: "Keine Datenänderung."}}
        image: {src: "/assets/images/handbook/platform/extension-work-item-detail.svg", alt: "Detail eines Erweiterungsworkitems mit Statusübergängen"}
    guidance:
      prerequisites:
      - Aktivierte Plattformfunktion und gültige Partner-, Tarif-, Regel- oder Workflowkonfiguration.
      permissions:
      - platform.read/write/execute und platform.extension.read/write/execute. Partnerkonten besitzen zusätzlich eigene freigegebene Scopes.
      fields:
      - 'Task/KPI: title, task_type, priority, metric, aggregation, target_value. Partner: business_partner_id, user_id, permissions. Abrechnung/VAS: service_id, quantity, unit_price,
        free_days. Erweiterung: resource_type, configuration_json, workflow, decision, evidence.'
      statuses:
      - Aufgaben und Workitems folgen definierten Übergängen; Abrechnungen, Compliance- und Qualitätsentscheidungen werden auditiert.
      errors:
      - Fehlende Regel, ungültiger Übergang, abgelaufener Tarif, unbekannter Partner oder unvollständiger Nachweis verhindert Ausführung beziehungsweise Freigabe.
  api_and_automation:
    title: API, Outbox, Transportadapter und Automatisierung
    summary: OpenAPI, API-Schlüssel, zuverlässige Nachrichten, Protokolle und Betriebsüberwachung.
    sections:
      section_1:
        title: API verwenden
        paragraphs:
          paragraph_1: Öffnen Sie die API-Dokumentation über den separaten Sidebar-Link. Wählen Sie Ressource und Operation, prüfen Sie erforderliche Berechtigung, Header und Schema.
            API-Schlüssel werden im Header übertragen und niemals in URL, Log oder Screenshot veröffentlicht.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: API verwenden – Screenshot-Platzhalter
      section_2:
        title: Outbox überwachen
        paragraphs:
          paragraph_1: Die Outbox entkoppelt fachliche Transaktionen von der externen Zustellung. Filtern Sie nach Status, Ziel und Zeitraum. Prüfen Sie Payload und letzten Fehler. Wiederholen
            Sie nur nach Beseitigung der Ursache; manuelle Quittierung benötigt eine fachliche Begründung.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: 'Platzhalter: Outbox und Transportstatus'
      section_3:
        title: Transportadapter
        paragraphs:
          paragraph_1: HTTP-, Datei-, TCP- und serielle Adapter benötigen Endpunkt, Zeitlimit, Zeichensatz beziehungsweise Framing und Secret-Referenz. Testen Sie Erreichbarkeit und
            Antwortformat. Protokollieren Sie keine Zugangsdaten oder personenbezogenen Nutzdaten unnötig.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Transportadapter – Screenshot-Platzhalter
      section_4:
        title: Worker und Scheduler
        paragraphs:
          paragraph_1: Asynchrone Nachrichten benötigen laufende Messenger-Worker. Zeitgesteuerte Aufgaben starten fällige Jobs wie Inventur, Nachschub oder Statusabgleich. Überwachen
            Sie Queue-Länge, Fehlerschlange, Laufzeit und letzten erfolgreichen Durchlauf.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Worker und Scheduler – Screenshot-Platzhalter
    views:
      outbox_overview:
        template: integration/outbox/index.html.twig
        title: Outbox überwachen
        purpose: Die Übersicht zeigt zuverlässig zuzustellende Integrationsnachrichten und ihren technischen Bearbeitungsstatus.
        navigation: Integration → Outbox
        permissions: ["integration.outbox.read"]
        overview: ["Die Tabelle zeigt Ereignistyp, Aggregat, Ziel, Status, Versuche, nächsten Versuch und letzten Fehler. Der Statusfilter ist mit Cursor-Pagination zu 50 Einträgen kombinierbar.", "pending wartet, processing wird verarbeitet, published ist zugestellt, dead_letter benötigt Ursachenanalyse und acknowledged wurde fachlich quittiert. Ein leerer Zustand bedeutet keine passenden Nachrichten."]
        fields:
          status: {label: "Statusfilter", required: false, format: "pending, processing, published, dead_letter oder acknowledged", example: "dead_letter", help: "Für Störungsbearbeitung dead_letter wählen; leer zeigt alle Status.", effect: "Begrenzt die Liste ohne Nachrichten zu verändern.", errors: "Unbekannte Werte werden nicht als gültiger Filter übernommen."}
        actions: {filter: {label: "Filtern", description: "Wendet den Statusfilter an und startet am Listenanfang.", result: "Nur passende Nachrichten werden angezeigt."}, open: {label: "Nachricht öffnen", description: "Öffnet Payload, Metadaten und Fehlerdetails.", result: "Keine Statusänderung."}, paginate: {label: "Weiter/Zurück", description: "Navigiert cursorbasiert durch stabile Ergebnisseiten.", result: "Je Seite erscheinen bis zu 50 Nachrichten."}}
        image: {src: "/assets/images/handbook/integration/outbox-overview.svg", alt: "Outboxübersicht mit Statusfilter und Zustellfehlern"}
      outbox_detail:
        template: integration/outbox/show.html.twig
        title: Outbox-Nachricht prüfen
        purpose: Die Detailseite zeigt unveränderte Payload, Ziel, Versuche, Zeitpunkte und letzten Zustellfehler einer Nachricht.
        navigation: Integration → Outbox → Nachricht
        permissions: ["integration.outbox.read; integration.outbox.execute für Retry oder Quittierung."]
        overview: ["Payload und Metadaten dienen der Ursachenanalyse und dürfen keine Klartext-Secrets enthalten. Erst Zielsystem, Erreichbarkeit und Fehlerursache prüfen.", "Retry ist ausschließlich für dead_letter verfügbar und stellt die Nachricht erneut auf pending. Quittieren ist ausschließlich für pending erlaubt und beendet die automatische Zustellung."]
        actions:
          retry: {label: "Erneut versuchen", description: "Setzt eine dead-letter Nachricht nach behobener Ursache idempotent auf pending.", result: "Ein Worker kann die Zustellung erneut ausführen; der Versuch wird auditiert."}
          acknowledge: {label: "Quittieren", description: "Markiert eine noch ausstehende Nachricht bewusst als fachlich erledigt.", result: "Der Status wechselt zu acknowledged und es erfolgt keine automatische Zustellung mehr."}
          back: {label: "Zur Übersicht", description: "Kehrt zur Outboxliste zurück.", result: "Keine Datenänderung."}
        image: {src: "/assets/images/handbook/integration/outbox-detail.svg", alt: "Outboxdetail mit Payload, Fehler, Retry und Quittierung"}
      swagger_ui:
        template: documentation/swagger.html.twig
        title: OpenAPI-Dokumentation
        purpose: Swagger UI stellt den aktuellen HTTP-Vertrag interaktiv dar und erlaubt autorisierte Testaufrufe.
        navigation: Sidebar → API-Dokumentation
        permissions: ["Berechtigung zum Lesen der API-Dokumentation; für Testaufrufe zusätzlich API- und Fachberechtigungen."]
        overview: ["Operationen sind nach Ressourcen gruppiert. Schemas erklären Pfad-, Query- und Body-Parameter, Antworten und Fehlercodes; der Rohvertrag kann separat geöffnet werden.", "Authorize speichert Zugangsdaten nur für die UI-Sitzung. Produktive Änderungen über Try it out nur mit Testdaten und nach Prüfung von Mandant, Methode und Payload ausführen."]
        actions: {authorize: {label: "Authorize", description: "Hinterlegt den vorgesehenen API-Schlüssel oder Token für Testaufrufe.", result: "Freigegebene Operationen senden die Authentifizierung im Header."}, try: {label: "Try it out", description: "Sendet die ausgefüllte Anfrage an den dokumentierten Endpunkt.", result: "Statuscode, Header und Antwort werden angezeigt; schreibende Operationen können Daten ändern."}, raw: {label: "OpenAPI-Rohvertrag", description: "Öffnet die maschinenlesbare Spezifikation.", result: "Der aktuelle Vertrag kann geprüft oder in Werkzeuge importiert werden."}}
        image: {src: "/assets/images/handbook/documentation/swagger-ui.svg", alt: "Swagger UI mit OpenAPI-Operationen und Autorisierung"}
      automation_overview:
        template: integration/automation/index.html.twig
        title: Lagerlifte und Paternoster
        purpose: Die Übersicht verwaltet Automationsgeräte und verfolgt ihre Gerätebefehle.
        navigation: Integration → Lagerlifte und Paternoster
        permissions: ["integration.automation.read; integration.automation.write für Geräte; integration.automation.execute für Befehle."]
        overview:
        - Geräte zeigen Code, Typ, HTTPS-Endpunkt und Status. Befehle zeigen Gerät, Operation, Lagerplatz, Fachreferenz, Status und Zeitpunkt.
        - Pausierte Geräte sind für neue Befehle gesperrt. Tabellen besitzen leere Zustände, aber keine Suche oder Pagination.
        actions:
          create_device: {label: "Gerät anlegen", description: "Konfiguriert Lagerlift, Paternoster oder Logimat.", result: "Das Gerät erscheint nach dem Speichern."}
          create_command: {label: "Befehl anlegen", description: "Erstellt einen idempotenten Geräteauftrag.", result: "Der Auftrag startet queued."}
          toggle: {label: "Aktivieren oder pausieren", description: "Steuert die operative Befehlsauswahl.", result: "Vorhandene Befehle bleiben erhalten."}
          open: {label: "Befehl öffnen", description: "Zeigt Details und zulässiges Feedback.", result: "Keine Statusänderung."}
        image: {src: "/assets/images/handbook/integration/automation-overview.svg", alt: "Automationsgeräte und Gerätebefehle"}
      automation_device_create:
        template: integration/automation/device-new.html.twig
        title: Automationsgerät anlegen
        purpose: Das Formular registriert einen Lagerlift, Paternoster oder Logimat mit sicherer HTTPS-Anbindung.
        navigation: Integration → Lagerlifte und Paternoster → Gerät anlegen
        permissions: ["integration.automation.write"]
        overview: ["Secret ausschließlich über eine Umgebungsvariable referenzieren und den Endpunkt vor Aktivierung testen."]
        fields:
          code: {label: "Gerätecode", required: true, format: "2–40 Zeichen; A–Z, 0–9, Unterstrich oder Bindestrich", example: "LIFT_01", help: "Stabile Anlagenkennung verwenden.", effect: "Identifiziert das Gerät in Befehlen.", errors: "Doppelte oder ungültige Codes werden abgewiesen."}
          name: {label: "Name", required: true, format: "Bis 100 Zeichen", example: "Lagerlift Halle 1", help: "Anlage und Standort verständlich benennen.", effect: "Erscheint in der Befehlsauswahl.", errors: "Ein leerer Name verhindert die Anlage."}
          device_type: {label: "Gerätetyp", required: true, format: "storage_lift, paternoster oder logimat", example: "storage_lift", help: "Passenden technischen Gerätetyp auswählen.", effect: "Klassifiziert die Automation.", errors: "Falsche Typisierung kann Befehlsinterpretation verhindern."}
          endpoint_url: {label: "HTTPS-Endpunkt", required: true, format: "Vollständige HTTPS-URL", example: "https://lift.internal.example/commands", help: "Kommandoendpunkt ohne Secret angeben.", effect: "Ziel für Gerätebefehle.", errors: "Ungültige oder nicht erreichbare URL verursacht failed."}
          credential_env: {label: "Credential-Umgebungsvariable", required: true, format: "Name einer Laufzeitvariable", example: "LIFT_01_TOKEN", help: "Niemals Token oder Passwort selbst speichern.", effect: "Authentifiziert die Gerätekommunikation.", errors: "Fehlende Variable führt zu 401/403."}
          active: {label: "Sofort aktivieren", required: false, format: "Checkbox; standardmäßig aktiv", example: "deaktiviert bis Test", help: "Nur betriebsbereite Geräte aktivieren.", effect: "Nur aktive Geräte erhalten neue Befehle.", errors: "Aktive Fehlkonfigurationen erzeugen Zustellfehler."}
        actions:
          save: {label: "Gerät anlegen", description: "Validiert Identität, Typ, Endpunkt und Credential-Referenz.", result: "Das Gerät erscheint in der Übersicht."}
          cancel: {label: "Abbrechen", description: "Verwirft die Eingaben.", result: "Kein Gerät wird angelegt."}
        image: {src: "/assets/images/handbook/integration/automation-device-create.svg", alt: "Automationsgerät mit Typ, Endpunkt und Credential"}
      automation_command_create:
        template: integration/automation/command-new.html.twig
        title: Gerätebefehl anlegen
        purpose: Das Formular ordnet einem aktiven Automationsgerät einen Lagerplatz und Fachvorgang idempotent zu.
        navigation: Integration → Lagerlifte und Paternoster → Befehl anlegen
        permissions: ["integration.automation.execute; aktives Gerät und gültiger Lagerplatz."]
        overview: ["Gerät, Lagerplatz und Referenz müssen zum selben Prozess gehören. Die Request-ID verhindert Doppelbefehle."]
        fields:
          request_id: {label: "Request-ID", required: true, format: "Automatisch erzeugte UUID", example: "0199a1c0-7ab1-7f20-8f20-123456789abc", help: "Nicht ändern oder wiederverwenden.", effect: "Sichert idempotente Auftragserstellung.", errors: "Wiederholung erzeugt keinen zweiten Befehl."}
          device_id: {label: "Gerät", required: true, format: "Aktives Automationsgerät", example: "LIFT_01", help: "Physisch zuständiges Gerät wählen.", effect: "Bestimmt den Kommandoendpunkt.", errors: "Pausierte oder unbekannte Geräte werden abgewiesen."}
          command_type: {label: "Befehl", required: true, format: "present, store oder retrieve", example: "present", help: "present stellt bereit, store lagert ein, retrieve lagert aus.", effect: "Bestimmt die Geräteoperation.", errors: "Unpassender Befehl kollidiert mit dem Fachvorgang."}
          location_id: {label: "Lagerplatz", required: true, format: "Auswahl eines vorhandenen Platzes", example: "WH1-LIFT-01-042", help: "Den vom Gerät erreichbaren Platz wählen.", effect: "Definiert das Fach oder Tablar.", errors: "Unbekannte oder nicht erreichbare Plätze werden abgewiesen."}
          reference_type: {label: "Referenztyp", required: true, format: "pick_task, putaway_order, replenishment_order oder manual", example: "pick_task", help: "Fachlichen Auslöser korrekt klassifizieren.", effect: "Verknüpft den Auftrag mit dem Prozess.", errors: "Falscher Typ erschwert Rückmeldung und Audit."}
          reference_id: {label: "Referenz", required: true, format: "Eindeutige Fachreferenz bis 100 Zeichen", example: "PICK-2026-0042/10", help: "Konkreten Vorgang oder bei manual eine nachvollziehbare Kennung angeben.", effect: "Ermöglicht Rückverfolgung.", errors: "Leere oder unbekannte Referenzen werden abgewiesen."}
        actions:
          save: {label: "Befehl einreihen", description: "Validiert Gerät, Operation, Platz, Referenz und Idempotenz.", result: "Der Befehl startet queued."}
          cancel: {label: "Abbrechen", description: "Verwirft den Entwurf.", result: "Kein Gerätebefehl entsteht."}
        image: {src: "/assets/images/handbook/integration/automation-command-create.svg", alt: "Gerätebefehl mit Lagerplatz und Fachreferenz"}
      automation_command_detail:
        template: integration/automation/command-show.html.twig
        title: Gerätebefehl und Feedback
        purpose: Das Detail zeigt Platz, Referenz, Request-ID, Rückmeldung und kontrolliert den Status.
        navigation: Integration → Lagerlifte und Paternoster → Befehl öffnen
        permissions: ["integration.automation.read; integration.automation.execute für Feedback."]
        overview: ["Zulässiger Ablauf queued → dispatched → completed; failed beendet den Auftrag. Nur queued oder dispatched sind weiter bearbeitbar."]
        fields:
          status: {label: "Feedbackstatus", required: true, format: "dispatched, completed oder failed abhängig vom Iststatus", example: "completed", help: "Nur tatsächlich vom Gerät bestätigte Stufe wählen.", effect: "Fortschreibt oder beendet den Auftrag.", errors: "Ungültige Übergänge werden verhindert."}
          message: {label: "Gerätemeldung", required: false, format: "Bis 500 Zeichen", example: "Tablar 42 bereitgestellt", help: "Bei Fehler die technische Meldung vollständig erfassen.", effect: "Ergänzt den Auditnachweis.", errors: "Fehlender Fehlertext erschwert Entstörung."}
        actions:
          status: {label: "Feedback verarbeiten", description: "Validiert den Folgestatus und speichert die Gerätemeldung.", result: "Status und Änderungszeit werden fortgeschrieben."}
        image: {src: "/assets/images/handbook/integration/automation-command-detail.svg", alt: "Automationsbefehl mit Status und Gerätemeldung"}
      transport_overview:
        template: integration/transport/index.html.twig
        title: TCP/IP und Webservices
        purpose: Die Übersicht verwaltet Transportadapter, Protokolle, Framing, Timeouts und Zustellzugriff.
        navigation: Integration → TCP/IP und Webservices
        permissions: ["integration.transport.read; integration.transport.write für Anlage, Status und Zustellung."]
        overview:
        - Endpunkte zeigen Code, Adapter, Protokoll, Framing, Adresse, Connect-/Read-Timeout und Aktivstatus. Nur aktive Endpunkte bieten Zustellung an.
        - Die Tabelle besitzt einen leeren Zustand, aber keine Suche oder Pagination.
        actions:
          create: {label: "Endpunkt anlegen", description: "Konfiguriert TCP-Client oder HTTP-Webservice.", result: "Der Endpunkt erscheint nach dem Speichern."}
          deliver: {label: "Zustellen", description: "Öffnet eine idempotente Test- oder Fachnachricht.", result: "Noch keine Übertragung."}
          toggle: {label: "Aktivieren oder pausieren", description: "Steuert neue Zustellungen.", result: "Historische Zustellungen bleiben erhalten."}
        image: {src: "/assets/images/handbook/integration/transport-overview.svg", alt: "Transportadapter mit Protokoll, Adresse und Timeouts"}
      transport_endpoint_create:
        template: integration/transport/new.html.twig
        title: Transportendpunkt anlegen
        purpose: Das Formular konfiguriert TCP- oder HTTP-Kommunikation einschließlich Protokoll, Framing und Zeitgrenzen.
        navigation: Integration → TCP/IP und Webservices → Endpunkt anlegen
        permissions: ["integration.transport.write"]
        overview: ["Adapter, Protokoll und Framing müssen technisch zusammenpassen; Secret nur als Umgebungsreferenz hinterlegen."]
        fields:
          code: {label: "Code", required: true, format: "Bis 40 Zeichen", example: "PLC_PACK_01", help: "Stabile Zielkennung verwenden.", effect: "Identifiziert den Endpunkt und seine Zustellungen.", errors: "Leere oder doppelte Codes sind ungültig."}
          name: {label: "Name", required: true, format: "Bis 100 Zeichen", example: "SPS Packlinie 1", help: "Zielsystem und Umgebung benennen.", effect: "Erscheint in Übersicht und Zustelldialog.", errors: "Ein leerer Name verhindert die Anlage."}
          adapter_type: {label: "Adapter", required: true, format: "tcp_client oder http_webservice", example: "tcp_client", help: "TCP für Socket-Ziele, HTTP für Web-APIs wählen.", effect: "Bestimmt Transportimplementierung.", errors: "Adapter muss zu Adresse und Protokoll passen."}
          address: {label: "Adresse", required: true, format: "host:port oder HTTPS-URL", example: "plc.internal:9100", help: "Für TCP Host und Port, für HTTP vollständige URL angeben.", effect: "Definiert das Netzwerkziel.", errors: "DNS-, Port-, URL- oder Zertifikatsfehler verhindern Verbindung."}
          credential_env: {label: "Credential-Umgebungsvariable", required: true, format: "Name einer Laufzeitvariable", example: "PLC_PACK_01_TOKEN", help: "Nur Referenz, kein Klartext-Secret speichern.", effect: "Authentifiziert sofern das Ziel dies verlangt.", errors: "Fehlende Variable verursacht Authentifizierungsfehler."}
          protocol: {label: "Protokoll", required: true, format: "raw_tcp, rest_json oder soap_xml", example: "raw_tcp", help: "raw_tcp für Bytes, REST für JSON, SOAP für XML-Vertrag wählen.", effect: "Bestimmt Kodierung und Antwortverarbeitung.", errors: "Nicht zum Ziel passendes Protokoll führt zu negativer Antwort."}
          framing: {label: "Framing", required: true, format: "stx_etx, newline, none oder http", example: "stx_etx", help: "STX/ETX oder Zeilenende nur nach Schnittstellenvertrag; HTTP für Webservice.", effect: "Grenzt einzelne Nachrichten ab.", errors: "Falsches Framing verursacht unvollständige oder zusammengeklebte Nachrichten."}
          connect_timeout_ms: {label: "Connect-Timeout", required: true, format: "100–60000 Millisekunden; Standard 3000", example: "3000", help: "Kurz genug für Störungserkennung, lang genug für Netzwerkaufbau wählen.", effect: "Begrenzt den Verbindungsaufbau.", errors: "Werte außerhalb des Bereichs sind ungültig."}
          read_timeout_ms: {label: "Read-Timeout", required: true, format: "100–300000 Millisekunden; Standard 10000", example: "10000", help: "An maximale Antwortzeit des Ziels anpassen.", effect: "Begrenzt das Warten auf Antwort oder Quittung.", errors: "Zu kurz erzeugt Fehlversuche, zu lang blockiert Worker."}
          active: {label: "Sofort aktivieren", required: false, format: "Checkbox; standardmäßig aktiv", example: "deaktiviert bis Test", help: "Erst nach abgestimmtem Verbindungstest aktivieren.", effect: "Nur aktive Endpunkte erlauben Zustellung.", errors: "Aktive Fehlkonfigurationen erzeugen fehlgeschlagene Zustellungen."}
        actions:
          save: {label: "Endpunkt anlegen", description: "Validiert Adapter, Adresse, Protokoll, Framing, Timeouts und Credential.", result: "Der Endpunkt erscheint in der Übersicht."}
          cancel: {label: "Abbrechen", description: "Verwirft die Konfiguration.", result: "Kein Endpunkt wird angelegt."}
        image: {src: "/assets/images/handbook/integration/transport-endpoint-create.svg", alt: "Transportendpunkt mit Adapter, Protokoll und Timeouts"}
      transport_delivery:
        template: integration/transport/deliver.html.twig
        title: Nachricht zustellen
        purpose: Der Dialog sendet eine JSON-Nachricht idempotent über den gewählten aktiven Transportendpunkt.
        navigation: Integration → TCP/IP und Webservices → Zustellen
        permissions: ["integration.transport.write; Endpunkt muss aktiv sein."]
        overview: ["Vor produktiver Zustellung Payloadschema, Zielwirkung und Wiederholbarkeit prüfen. Keine Secrets oder unnötigen Personendaten übertragen."]
        fields:
          message_id: {label: "Message-ID", required: true, format: "Eindeutige UUID oder externe Nachrichtenkennung", example: "0199a1c0-7ab1-7f20-8f20-123456789abc", help: "Bei Retry exakt dieselbe ID verwenden, für neue Nachricht eine neue ID.", effect: "Ermöglicht Idempotenz beim Empfänger.", errors: "Neue ID bei Retry kann Doppelverarbeitung auslösen."}
          payload: {label: "Payload", required: true, format: "Valides JSON-Objekt gemäß Zielvertrag", example: "{'type':'connectivity-test'}", help: "Pflichtfelder und Datentypen des Zielsystems einhalten; keine Klartext-Secrets.", effect: "Wird entsprechend Adapter, Protokoll und Framing übertragen.", errors: "Ungültiges JSON, Schemafehler, Timeout oder negative Quittung führt zu failed."}
        actions:
          deliver: {label: "Zustellen", description: "Validiert JSON und sendet die Nachricht über den konfigurierten Adapter.", result: "Status und externe Antwort werden als Zustellnachweis gespeichert."}
          cancel: {label: "Abbrechen", description: "Kehrt ohne Übertragung zurück.", result: "Keine Nachricht wird gesendet."}
        image: {src: "/assets/images/handbook/integration/transport-delivery.svg", alt: "Nachrichtenzustellung mit Message-ID und JSON-Payload"}
    guidance:
      prerequisites:
      - Aktiver API-Client oder Adapter, laufende Messenger-Worker, gültige Secrets und erreichbares Zielsystem.
      permissions:
      - Explizite API-Client-Scopes sowie integration.outbox.read/retry/acknowledge, integration.automation.* und integration.transport.*.
      fields:
      - 'API: X-API-Key, Content-Type, Idempotency-Key, Request-ID und JSON-Body. Outbox: aggregate_type/id, message_type, destination, payload, status. Transport: adapter_type, destination,
        protocol, framing, credential_env, timeouts.'
      statuses:
      - Outbox pending → processing → published oder failed. Transport delivery queued → sent/acknowledged oder failed. Wiederholungen erhöhen Versuchszähler.
      errors:
      - 401/403 Authentifizierung, 409 Konflikt, 422 Validierung, Timeout oder negative Zielquittung. Retry nur nach Prüfung, ob der Empfänger bereits verarbeitet hat.
  troubleshooting:
    title: Fehlerbehebung und Support
    summary: Typische Bedienfehler eingrenzen, sichere Wiederholung und verwertbare Supportdaten.
    sections:
      section_1:
        title: Datensatz oder Menü fehlt
        paragraphs:
          paragraph_1: Prüfen Sie Mandant, Standort, Rolle, aktive Filter und Status. Setzen Sie Suche und Pagination zurück. Ein fehlender Menüpunkt weist meist auf eine nicht erteilte
            Leseberechtigung hin.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Datensatz oder Menü fehlt – Screenshot-Platzhalter
      section_2:
        title: Aktion ist nicht möglich
        paragraphs:
          paragraph_1: Lesen Sie die Validierungsmeldung und prüfen Sie Pflichtfelder, Belegstatus, offene Vorgängeraktionen, Bestandsverfügbarkeit und konkurrierende Bearbeitung. Wiederholen
            Sie eine schreibende Aktion nicht unkontrolliert.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Aktion ist nicht möglich – Screenshot-Platzhalter
      section_3:
        title: Integration meldet einen Fehler
        paragraphs:
          paragraph_1: Prüfen Sie Verbindungstest, Secret-Referenz, Zielsystem, Outboxstatus und Fehlermeldung. Entscheiden Sie, ob der externe Auftrag bereits verarbeitet wurde, bevor
            Sie einen Retry auslösen.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: 'Platzhalter: Fehlermeldung und Auditprotokoll'
      section_4:
        title: Supportfall vorbereiten
        paragraphs:
          paragraph_1: Übermitteln Sie Zeitpunkt mit Zeitzone, Mandant, Standort, Route, Belegreferenz, erwartetes und tatsächliches Verhalten sowie Korrelations- oder Nachrichten-ID.
            Entfernen Sie Passwörter, API-Schlüssel und unnötige personenbezogene Daten aus Screenshots und Logs.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Supportfall vorbereiten – Screenshot-Platzhalter
      section_5:
        title: Audit und Wiederherstellung
        paragraphs:
          paragraph_1: Nutzen Sie Bewegungshistorie, Auditereignisse und Outbox, um den Ablauf zu rekonstruieren. Korrigieren Sie fachliche Daten über vorgesehene Gegenbuchungs-, Freigabe-
            oder Stornoprozesse statt durch direkte Datenbankänderungen.
        image:
          src: /assets/images/handbook/placeholder.svg
          alt: Audit und Wiederherstellung – Screenshot-Platzhalter
    guidance:
      prerequisites:
      - Zeitpunkt mit Zeitzone, Mandant, Standort, Benutzeraktion, Route, Beleg- und Korrelationsreferenz.
      permissions:
      - Leserechte des Fachbereichs sowie bei Integrationsfehlern integration.outbox.read; Retry und Quittierung benötigen eigene Rechte.
      fields:
      - 'Supportfall: expected/actual behavior, route, aggregate_id, message_id, external_event_id, status und error_message. Keine Passwörter oder API-Schlüssel erfassen.'
      statuses:
      - Fehler bleibt fachlich offen, bis Datenzustand und externe Verarbeitung geklärt sind. Retry, Quittierung, Storno und Gegenbuchung sind getrennte Maßnahmen.
      errors:
      - Filter/Berechtigung/Belegstatus prüfen, dann Audit und Ledger, danach Outbox/Worker und zuletzt externes Ziel. Keine direkte Datenbankkorrektur durchführen.
