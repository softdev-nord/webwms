openapi: 3.1.0
info:
  title: WebWMS API v3
  version: 3.0.0
  description: Tenant-scoped API for master data, warehouse processes and integrations.
servers:
  - url: /api/v3
security:
  - ApiKey: []
paths:
  /products:
    get:
      summary: List products
      responses:
        '200': { $ref: '#/components/responses/Collection' }
    post:
      summary: Register a product
      responses:
        '201': { $ref: '#/components/responses/Item' }
  /warehouses:
    get:
      summary: List warehouses
      responses:
        '200': { $ref: '#/components/responses/Collection' }
  /stock:
    get:
      summary: Read tenant stock
      responses:
        '200': { $ref: '#/components/responses/Collection' }
  /stock-transfers:
    post:
      summary: Transfer or reclassify stock atomically
      responses:
        '201': { $ref: '#/components/responses/Item' }
  /stock-movements:
    get:
      summary: Read the immutable stock journal
      responses:
        '200': { $ref: '#/components/responses/Collection' }
  /orders:
    get:
      summary: List outbound orders
      responses:
        '200': { $ref: '#/components/responses/Collection' }
    post:
      summary: Import an outbound order
      responses:
        '201': { $ref: '#/components/responses/Item' }
  /integration/jobs:
    get:
      summary: List import and export jobs
      responses:
        '200': { $ref: '#/components/responses/Collection' }
  /integration/import:
    post:
      summary: Import JSON, XML, CSV, XLSX or SAP IDoc
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportRequest'
      responses:
        '201': { $ref: '#/components/responses/Item' }
        '422': { $ref: '#/components/responses/Problem' }
  /integration/export:
    post:
      summary: Export records as JSON, XML, CSV or XLSX
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportRequest'
      responses:
        '201': { $ref: '#/components/responses/Item' }
  /integration/mappings:
    get:
      summary: List ERP, SAP and commerce mappings
      responses:
        '200': { $ref: '#/components/responses/Collection' }
    post:
      summary: Create a field mapping
      responses:
        '201': { $ref: '#/components/responses/Item' }
  /integration/commerce-connections:
    get:
      summary: List shop and marketplace connections
      responses:
        '200': { $ref: '#/components/responses/Collection' }
    post:
      summary: Create a shop or marketplace connection
      responses:
        '201': { $ref: '#/components/responses/Item' }
  /integration/commerce-orders:
    post:
      summary: Import a channel order idempotently by connection and external order ID
      responses:
        '201': { $ref: '#/components/responses/Item' }
        '409': { $ref: '#/components/responses/Problem' }
  /carrier-connections:
    get:
      summary: List carrier connections
      responses:
        '200': { $ref: '#/components/responses/Collection' }
    post:
      summary: Create a carrier connection
      responses:
        '201': { $ref: '#/components/responses/Item' }
  /carriers/{carrierCode}/products:
    get:
      summary: Read live carrier products
      parameters:
        - { name: carrierCode, in: path, required: true, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/Collection' }
  /shipments/{shipmentId}/carrier-label:
    post:
      summary: Create an idempotent carrier label
      parameters:
        - { name: shipmentId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/Item' }
  /shipments/{shipmentId}/carrier-tracking:
    post:
      summary: Synchronize shipment tracking
      parameters:
        - { name: shipmentId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/Item' }
  /loading-manifests/{manifestId}/carrier-handover:
    post:
      summary: Hand a completed manifest to a carrier
      parameters:
        - { name: manifestId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/Item' }
  /devices:
    get:
      summary: List scanners and mobile data capture devices
      responses:
        '200': { $ref: '#/components/responses/Collection' }
    post:
      summary: Register a scanner or mobile device
      responses:
        '201': { $ref: '#/components/responses/Item' }
  /scan-events:
    get:
      summary: List process-related scan events
      responses:
        '200': { $ref: '#/components/responses/Collection' }
    post:
      summary: Capture an idempotent process scan
      responses:
        '201': { $ref: '#/components/responses/Item' }
  /printers:
    get:
      summary: List printers
      responses:
        '200': { $ref: '#/components/responses/Collection' }
    post:
      summary: Register a PDF or ZPL printer
      responses:
        '201': { $ref: '#/components/responses/Item' }
  /print-jobs:
    get:
      summary: List print jobs
      responses:
        '200': { $ref: '#/components/responses/Collection' }
    post:
      summary: Queue an idempotent print job
      responses:
        '201': { $ref: '#/components/responses/Item' }
  /print-jobs/{jobId}/execute:
    post:
      summary: Execute or retry a print job
      parameters:
        - { name: jobId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/Item' }
  /measurement-devices:
    get:
      summary: List scales and dimensioners
      responses:
        '200': { $ref: '#/components/responses/Collection' }
    post:
      summary: Register a measurement device
      responses:
        '201': { $ref: '#/components/responses/Item' }
  /measurements:
    get:
      summary: List measurement events
      responses:
        '200': { $ref: '#/components/responses/Collection' }
    post:
      summary: Push an idempotent package or product measurement
      responses:
        '201': { $ref: '#/components/responses/Item' }
  /automation-devices:
    get:
      summary: List storage lifts and paternosters
      responses:
        '200': { $ref: '#/components/responses/Collection' }
    post:
      summary: Register a storage automation device
      responses:
        '201': { $ref: '#/components/responses/Item' }
  /automation-commands:
    get:
      summary: Pull queued automation commands
      responses:
        '200': { $ref: '#/components/responses/Collection' }
    post:
      summary: Queue an idempotent automation command
      responses:
        '201': { $ref: '#/components/responses/Item' }
  /automation-commands/{commandId}/status:
    patch:
      summary: Report an automation command state
      parameters:
        - { name: commandId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/Item' }
  /wcs-connections:
    get:
      summary: List WCS, MFR and conveyor connections
      responses:
        '200': { $ref: '#/components/responses/Collection' }
    post:
      summary: Register a WCS, MFR or conveyor connection
      responses:
        '201': { $ref: '#/components/responses/Item' }
  /machine-commands:
    get:
      summary: List WCS machine commands
      responses:
        '200': { $ref: '#/components/responses/Collection' }
    post:
      summary: Queue a machine command transactionally through the integration outbox
      responses:
        '201': { $ref: '#/components/responses/Item' }
  /machine-commands/{commandId}/status:
    patch:
      summary: Report a machine command state
      parameters:
        - { name: commandId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/Item' }
  /machine-statuses:
    get:
      summary: List machine status events
      responses:
        '200': { $ref: '#/components/responses/Collection' }
    post:
      summary: Record an idempotent machine status event
      responses:
        '201': { $ref: '#/components/responses/Item' }
  /transport-endpoints:
    get:
      summary: List TCP/IP and webservice endpoints
      responses:
        '200': { $ref: '#/components/responses/Collection' }
    post:
      summary: Register a TCP/IP or webservice endpoint
      responses:
        '201': { $ref: '#/components/responses/Item' }
  /transport-endpoints/{endpointId}/deliveries:
    post:
      summary: Deliver a payload through an active tenant transport endpoint
      parameters:
        - { name: endpointId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payload]
              properties:
                messageId: { type: string, description: Stable idempotency key; generated when omitted. }
                payload: { type: object, additionalProperties: true }
      responses:
        '202': { $ref: '#/components/responses/Item' }
        '404': { $ref: '#/components/responses/Problem' }
  /outbox:
    get:
      summary: Monitor tenant-scoped integration messages by status
      responses:
        '200': { $ref: '#/components/responses/Collection' }
  /outbox/{messageId}/retry:
    post:
      summary: Retry a dead-letter integration message
      parameters:
        - { name: messageId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/Item' }
components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    ImportRequest:
      type: object
      required: [format, resourceType, content]
      properties:
        format: { type: string, enum: [json, xml, csv, xlsx, idoc] }
        resourceType: { type: string }
        sourceReference: { type: [string, 'null'] }
        content: { type: string, description: XLSX content is base64 encoded. }
    ExportRequest:
      type: object
      required: [format, resourceType, rows]
      properties:
        format: { type: string, enum: [json, xml, csv, xlsx] }
        resourceType: { type: string }
        rows:
          type: array
          items: { type: object, additionalProperties: true }
    Problem:
      type: object
      required: [type, title, status, detail]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
  responses:
    Collection:
      description: Tenant-scoped collection
      content:
        application/json:
          schema:
            type: object
            required: [data, meta]
            properties:
              data: { type: array, items: {} }
              meta: { type: object, additionalProperties: true }
    Item:
      description: Tenant-scoped resource
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { type: object, additionalProperties: true }
    Problem:
      description: RFC-7807-style error
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
