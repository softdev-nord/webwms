name: CI

on:
  push:
    branches:
      - 'feature/WEBWMS-3.0.0'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  symfony:
    name: Symfony (PHP ${{ matrix.php-versions }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        php-versions: ['8.4']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

#      - name: Setup SSH Keys and known_hosts
#        env:
#          SSH_AUTH_SOCK: /tmp/ssh_agent.sock
#        run: |
#          ssh-agent -a $SSH_AUTH_SOCK > /dev/null
#          ssh-add - <<< "${{ secrets.SSH_PRIVATE_KEY }}"

      # https://github.com/shivammathur/setup-php (community)
      - name: Setup PHP, extensions and composer with shivammathur/setup-php
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          extensions: amqp, ctype, curl, dom, filter, gd, iconv, intl, json, mbstring, pdo, simplexml, xml, zip
          coverage: pcov
          tools: composer:v2

      # Composer
      - name: Get composer cache directory
        id: composer-cache
        working-directory: .
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

        # https://help.github.com/en/actions/configuring-and-managing-workflows/caching-dependencies-to-speed-up-workflows
      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Setup Symfony
        run: cp .env.template .env

      - name: Install Composer dependencies
        working-directory: .
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ github.token }}"}}'
        run: composer install --no-interaction --no-progress --prefer-dist --optimize-autoloader

      - name: Validate Composer configuration and lock file
        run: composer validate --no-check-publish

      - name: Verify PHP platform requirements
        run: composer check-platform-reqs

      - name: Verify Symfony container
        run: php bin/console about --env=test

      - name: Check PSR12 code style (Easy Coding Standards)
        working-directory: .
        run: composer run ecs

      - name: Analyse PHP Code (PHPStan)
        working-directory: .
        run: composer run phpstan

      - name: Test WebWMS 3.0 domain foundation
        run: vendor/bin/phpunit tests/Unit/Shared tests/Unit/Administration tests/Unit/Security/V3 tests/Unit/Inventory tests/Unit/Integration
