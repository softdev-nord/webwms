#####################################################################
# SoftDev Nord Docker Web Development Stack (SDN-WebDevDock) 1.0.0
#
# Runs Apache, MailHog, MySQL, PHP, PhpMyAdmin and Redis
# SSL is preconfigured.
#
# APCu, ImageMagick, OPCache, Redis, and XDebug can be
# activated in the environment file.
#
# Run with
# docker-compose up -d
#
# (C)2022 SoftDev Nord Rene Irrgang
#####################################################################

version: '3'

networks:
  webwms-net:
    ipam:
      config:
        - subnet: 172.45.0.0/16
          gateway: 172.45.0.1

services:

  #######################################
  # WebServer
  #######################################

  webwms-webserver:
    build: 
      context: ./.docker/${PHPVERSION}
      args:
        - INSTALL_OPCACHE=${PHP_INSTALL_OPCACHE}
        - INSTALL_APCU=${PHP_INSTALL_APCU}
        - INSTALL_XDEBUG=${PHP_INSTALL_XDEBUG}
        - INSTALL_REDIS=${PHP_INSTALL_REDIS}
    container_name: ${COMPOSE_PROJECT_NAME}-${PHPVERSION}
    hostname: ${COMPOSE_PROJECT_NAME}-${PHPVERSION}
    user: ${USER_ID}:${GROUP_ID}
    ports:
      - "${HOST_MACHINE_UNSECURE_HOST_PORT}:80"
      - "${HOST_MACHINE_SECURE_HOST_PORT}:443"
    domainname: webwms.local
    links:
      - database
      - redis
      - phpmyadmin:pma.webwms.local
    volumes: 
      - ${DOCUMENT_ROOT}:/var/www/html
      - ${PHP_INI}:/usr/local/etc/php/php.ini
      - ${OPCACHE_INI}:/usr/local/etc/php/opcache.ini
      - ${XDEBUG_INI}:/usr/local/etc/php/xdebug.ini
      - ${VHOSTS_DIR}:/etc/apache2/sites-available
      - ${VHOSTS_DIR}:/etc/apache2/sites-enabled
      - ${APACHE_LOG_DIR}:/var/log/apache2
      - ${APACHE_CERTS_DIR-./config/certs}:/etc/apache2/ssl
      - ${BACKUP_CRONTAB}:/etc/cron.d/backup-db
      - ${BACKUP_FILE}:/var/backup/mysql/backup-database.sh
      - ${MYSQL_BACKUP_DIR}:/var/backup/mysql
      - /etc/localtime:/etc/localtime:ro
    environment:
      - APACHE_DOCUMENT_ROOT=${APACHE_DOCUMENT_ROOT}
      - PMA_PORT=${HOST_MACHINE_PMA_PORT}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    networks:
      webwms-net:
        ipv4_address: 172.45.0.2

  #######################################
  # Database
  #######################################

  database:
    build:
      context: ./.docker/${DATABASE}
    container_name: ${COMPOSE_PROJECT_NAME}-${DATABASE}
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    ports:
      - "${HOST_MACHINE_MYSQL_PORT}:3306"
    volumes:
      - ${MYSQL_ENTRYPOINT_INITDB}:/docker-entrypoint-initdb.d
      - ${MYSQL_DATA_DIR}:/var/lib/mysql
      - ${MYSQL_LOG_DIR}:/var/log/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    networks:
      webwms-net:
        ipv4_address: 172.45.0.3

  #######################################
  # phpMyAdmin latest
  #######################################

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: ${COMPOSE_PROJECT_NAME}-PMA
    links:
      - database
    environment:
      - PMA_HOST=database
      - PMA_PORT=3306
      - PMA_USER=root
      - PMA_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - UPLOAD_LIMIT=128M
    ports:
      - "${HOST_MACHINE_PMA_PORT}:8080"
    domainname: pma.webwms.local
    volumes: 
      - /sessions
      - ./.docker/config/php/php.ini:/usr/local/etc/php/conf.d/php-phpmyadmin.ini
    networks:
      webwms-net:
        ipv4_address: 172.45.0.4

  #######################################
  # Redis latest
  #######################################

  redis:
    build:
      context: ./.docker/Redis
    container_name: ${COMPOSE_PROJECT_NAME}-Redis
    ports:
      - "${HOST_MACHINE_REDIS_PORT}:6379"
    networks:
      webwms-net:
        ipv4_address: 172.45.0.5

  #######################################
  # MailHog latest
  #######################################

  mailhog:
    build:
      context: ./.docker/MailHog
    container_name: ${COMPOSE_PROJECT_NAME}-MailHog
    ports:
      - "${HOST_MACHINE_MAILHOG_HTTP_PORT}:8025"
      - "${HOST_MACHINE_MAILHOG_SMTP_PORT}:1025"
    networks:
      webwms-net:
        ipv4_address: 172.45.0.6
