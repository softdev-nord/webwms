# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices/configuration.html#application-related-configuration
parameters:
    locale: '%env(LOCALE)%'
    fromMail:  '%env(FROM_MAIL)%'
    fromName: '%env(FROM_NAME)%'
    returnPath: '%env(RETURN_PATH)%'
    mailHost:  '%env(MAIL_HOST)%'
    webHost: '%env(WEB_HOST)%'
    publicUploadDirectory: 'export'
    uploadDirectory: '%kernel.project_dir%/public/%publicUploadDirectory%'
    version: '3.3.0'
    mailCopy: '%env(default:default_mailcopy:MAIL_COPY)%'
    default_mailcopy: 'true'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        public: true         // <---- This is the new additional config.

        bind:
            $appName: '%env(APP_NAME)%'
            $appVersion: '%env(APP_VERSION)%'
            $appVersionNumber: '%env(APP_VERSION_NUMBER)%'
            $appCopyright: '%env(APP_COPYRIGHT)%'
            $appLizenz: '%env(APP_LIZENZ)%'

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    WebWMS\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'
            - '../src/Tests/'

    # controllers are imported separately to make sure services can be injected
    # as action arguments even if you don't extend any base controller class
    WebWMS\Controller\:
        resource: '../src/Controller/'
        tags: ['controller.service_arguments']

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    admin.customer:
        class: WebWMS\Admin\CustomerAdmin
        tags:
            - {
                name: sonata.admin,
                model_class: WebWMS\Entity\Customer,
                manager_type: orm,
                label: Kunden
            }

    admin.user:
        class: WebWMS\Admin\UserAdmin
        tags:
            - {
                name: sonata.admin,
                model_class: WebWMS\Entity\User,
                manager_type: orm,
                label: Benutzer
            }

    web_wms.menu_listener:
        class: WebWMS\EventListener\MenuBuilderListener
        tags:
            - {
                name: kernel.event_listener,
                event: sonata.admin.event.configure.menu.sidebar,
                method: addMenuItems
            }

    webwms.form.type.task:
        class: WebWMS\Form\EditArticleType
        public: true
        arguments: [ "@security.authorization_checker" ]
        tags:
            - { name: form.type }

    WebWMS\Bundles\DashboardBundle\Controller\DashboardController:
        public: true

    WebWMS\EventListener\ControllerListener:
        tags:
            - { name: kernel.event_listener, event: kernel.controller }

    WebWMS\Controller\StockTransactions:
        public: true
        autowire: true
        tags: ['controller.service_arguments']
        arguments:
            $requirements: "@WebWMS\\Controller\\Requirements"
            $bookingMethodService: "@WebWMS\\Service\\BookingMethod\\BookingMethodService"
            $bookingMethodConstants: "@WebWMS\\Service\\BookingMethod\\BookingMethodConstants"
            $stockLocationService: "@WebWMS\\Service\\Stock\\StockLocationService"
            $transportRequestService: "@WebWMS\\Service\\TransportRequestService"

    WebWMS\Service\MailService:
        arguments:
            - '%fromMail%'
            - '%fromName%'
            - '%returnPath%'
            - '%mailCopy%'

    WebWMS\Service\TemplatesService:
        arguments:
            - '%webHost%'

    WebWMS\Service\FileUploader:
        arguments:
            $publicDirectory: '%publicUploadDirectory%'
            $targetDirectory: '%uploadDirectory%'

    WebWMS\Service\ConfigurationService:
        arguments:
            $configurationDataHandler: '@WebWMS\Service\DataHandlers\Configuration\ConfigurationDataHandler'

    WebWMS\Twig\TwigGlobalSubscriber:
        tags:
            - { name: kernel.event_listener, event: kernel.request }