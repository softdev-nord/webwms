article:
    path: /artikel
    controller: WebWMS\Controller\Article::index

article_ajax:
    path: /article_ajax
    controller: WebWMS\Controller\Article::getAllArticles

supplier_oders:
    path: /bestellungen
    controller: WebWMS\Controller\SupplierOrder::index

customer_orders:
    path: /auftrag
    controller: WebWMS\Controller\CustomerOrder::index

supplier_oders_ajax:
    path: /supplier_orders_ajax
    controller: WebWMS\Controller\SupplierOrder::getAllOrders

supplier_oders_pos_ajax:
    path: /supplier_oders_pos_ajax
    controller: WebWMS\Controller\SupplierOrder::getAllOrderPos

customer_order_ajax:
    path: /customer_order_ajax
    controller: WebWMS\Controller\CustomerOrder::getAllCustomerOrders

customer_order_pos_ajax:
    path: /customer_order_pos_ajax
    controller: WebWMS\Controller\CustomerOrder::getAllCustomerOrdersPos

show_stock_location_details:
    path: /show_stock_location_details
    controller: WebWMS\Controller\Stock::getSockLocationDetailsById

stock_inventory_start:
    path: /inventur_starten
    controller: WebWMS\Bundles\StockInventoryBundle\Controller\DefaultController::index

admin_area:
    resource: "@SonataAdminBundle/Resources/config/routing/sonata_admin.xml"
    prefix: /einstellungen

_sonata_admin:
    resource: .
    type: sonata_admin
    prefix: /einstellungen

dashboard_bundle:
    # loads routes from the YAML or XML files found in some bundle directory
    resource: '@DashboardBundle/Resources/config'
    type:     directory