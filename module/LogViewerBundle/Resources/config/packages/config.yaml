config:
  card:
    - title:
        - Header
      input-field:
        - name: headerStyle
          options:
            option:
              - id: shopware
                name:
                  - Shopware
              - id: core
                name:
                  - Core
          defaultValue: shopware
          label:
            - Header Style
            - Header-Variante
        - name: alcoAccountWidget
          defaultValue: true
          label:
            - Enable Login Modal Form
            - Modales Anmeldeformular aktivieren
        - name: alcoCartLayout
          options:
            option:
              - id: default
                name:
                  - Shopware
              - id: core
                name:
                  - Core Theme
          defaultValue: core
          label:
            - Offcanvas Cart Style
    - title:
        - Navigation
      input-field:
        - name: dropdown
          options:
            option:
              - id: default
                name:
                  - Shopware
                  - Shopware
              - id: core
                name:
                  - Core
                  - Core
          defaultValue: core
          label:
            - Dropdown Style
        - name: headerStickyNav
          defaultValue: true
          label:
            - Enable sticky navigation
            - Sticky-Navigation aktivieren
    - title:
        - After logo text (HEADER)
      input-field:
        name: isAfterLogoShow
        defaultValue: true
        label:
          - Show block
          - Block anzeigen
      component:
        - name: afterLogoHead
          label:
            - Headline
            - Headline
          snippet: alco.header.afterlogo.head
        - name: afterLogoText
          label:
            - Text
            - Text
          snippet: alco.header.afterlogo.text
    - title:
        - Contact/Locations (HEADER)
        - Kontakt/Standorte
      input-field:
        name: contactHeader
        defaultValue: true
        label:
          - Show block
          - Block anzeigen
      component:
        name: buttonContactText
        label:
          - Button text
          - Schaltflächentext
        snippet: alco.topbar.contact.buttonContactText
    - title:
        - Advertising banner
        - Werbebanner
      input-field:
        name: announcementbanner
        defaultValue: true
        label:
          - Enable ad banner display
          - Werbebanner aktivieren
      component:
        name: announcementbannerText
        label:
          - Announcement Banner content
          - Inhalt des Ankündigungsbanners
        snippet: alco.announcementbanner.text
    - title:
        - Our advantages (HEADER)
        - Unsere Vorzüge (HEADER)
      input-field:
