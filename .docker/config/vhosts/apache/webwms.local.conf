<VirtualHost *:80>
    ServerAlias www.webwms.local

    ErrorLog ${APACHE_LOG_DIR}/webwms-error.log
    CustomLog ${APACHE_LOG_DIR}/webwms-access.log combined
    #LogLevel debug mod_rewrite.c:trace3
    LogLevel warn

    DocumentRoot /var/www/html/public
    <Directory /var/www/html/public>
        Options Indexes FollowSymLinks MultiViews
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>